<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>HALF-DOG</title>
<style>
:root{--paper:#f2ecdf;--ink:#171a1e;--muted:#6b6861}*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--paper);color:var(--ink);font:12px/1.25 ui-monospace,"IBM Plex Mono",Menlo,Consolas,monospace}
main{position:fixed;inset:0;padding:calc(11px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr;gap:8px}
header{display:flex;align-items:end;justify-content:space-between;gap:8px}h1{font-size:16px;letter-spacing:.28em}header span{font-size:8px;letter-spacing:.12em;color:var(--muted)}
.grid{min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border-left:1px solid var(--ink);border-top:1px solid var(--ink)}
.dog{position:relative;min-width:0;min-height:0;text-decoration:none;color:inherit;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:10px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;touch-action:manipulation}
.dog:active{background:#e7dfcf}.name{font-size:clamp(16px,4vw,26px);font-weight:800;letter-spacing:.15em}.idea{font-size:8px;color:var(--muted);max-width:19ch}
.mark{position:absolute;right:7%;top:50%;transform:translateY(-50%);width:min(23vw,120px);height:min(14vw,72px)}
.body{position:absolute;left:18%;top:28%;width:58%;height:40%;border-radius:50%;background:var(--coat);border:1px solid var(--ink)}
.head{position:absolute;right:2%;top:21%;width:34%;aspect-ratio:1;border-radius:50%;background:var(--coat);border:1px solid var(--ink)}
.muzzle{position:absolute;right:-10%;top:50%;width:30%;height:23%;border-radius:50%;background:var(--muzzle);border:1px solid var(--ink)}
.ear{position:absolute;right:21%;top:10%;width:15%;height:35%;border-radius:50%;background:var(--coat);border:1px solid var(--ink);transform:rotate(12deg)}
.leg{position:absolute;top:62%;width:8%;height:33%;background:var(--coat);border:1px solid var(--ink)}.l1{left:32%}.l2{left:61%}
.tail{position:absolute;left:2%;top:35%;width:27%;height:7%;border-top:5px solid var(--coat);transform:rotate(-24deg);transform-origin:right center}.eye{position:absolute;right:17%;top:37%;width:5px;height:5px;border-radius:50%;background:#171a1e}
.argos{--coat:#ab7b4b;--muzzle:#cab79d}.samr{--coat:#39352e;--muzzle:#524c42}.goodyear{--coat:#dec89c;--muzzle:#e8cfb1}.silas{--coat:#58676d;--muzzle:#93a3a4}
@media(max-width:560px){.dog{padding:8px}.name{font-size:18px}.idea{font-size:7px;max-width:14ch}.mark{right:4%;width:34vw;height:21vw}}
@media(max-height:520px){header span{display:none}main{padding-top:5px;gap:5px}.dog{padding:6px}.idea{display:none}}
