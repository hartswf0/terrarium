<script type="module">
import * as THREE from 'three';

/* ============================================================
   HOUSE DEPOT — nine houses, one kit of parts.

   These are built the way the HENRY HOUSE is built, not merely in its
   colours. The first pass of this file was massing — boxes with glass
   decals stuck on the outside — and it read as toys, because the things
   that make a building believable were missing:

     · OPENINGS ARE HOLES. A wall is assembled as piers between windows
       plus the strip below the sill and the strip above the head. Glass
       sits INSIDE the wall thickness, in a reveal, with a frame. Nothing
       is coplanar with anything, which is also why nothing flickers.
     · THE EAVE IS THE BUILDING. Their source says so outright. Every
       roof here carries a fascia, a gutter, a soffit and downspouts that
       reach the ground.
     · DECKS ARE BOARDS. Framing, then individual boards, then a cable
       guard on steel posts that stand on footings.
     · EVERYTHING LANDS. No floating porch posts, no hovering cisterns.
       If it is in the air, something carries it.
     · SURFACES HAVE GRAIN. Board siding, standing-seam ribs and board-
       formed concrete are drawn into textures and tiled at a fixed size
       in FEET, so a 40 ft wall has forty feet of boards on it.

   Units are FEET, and the house frame is the Henry frame: x along the
   bar, y across (north), z up — mbox maps that to three.js as (x, z, −y)
   so a part could be lifted between this file and the real model.
   ============================================================ */

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.42;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b333d);
scene.fog = new THREE.Fog(0x2b333d, 60, 150);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);

function buildEnvMap() {
  const es = new THREE.Scene();
  const sky = new THREE.Mesh(new THREE.SphereGeometry(50, 24, 12), new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: { top: { value: new THREE.Color(0x4a5a76) }, bot: { value: new THREE.Color(0x0a0c10) } },
    vertexShader: 'varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'varying vec3 vP; uniform vec3 top; uniform vec3 bot; void main(){float h=clamp(normalize(vP).y*0.5+0.5,0.,1.); gl_FragColor=vec4(mix(bot,top,h),1.);}'
  }));
  es.add(sky);
  const lm = new THREE.MeshBasicMaterial({ color: 0xfff4e0 });
  for (let i = -2; i <= 2; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 30), lm); s.position.set(i * 8, 22, 0); es.add(s); }
  const pm = new THREE.PMREMGenerator(renderer); const rt = pm.fromScene(es, 0.04); pm.dispose();
  return rt.texture;
}
const envMap = buildEnvMap(); scene.environment = envMap;

scene.add(new THREE.HemisphereLight(0xa8bcd6, 0x272d36, 0.95));
scene.add(new THREE.AmbientLight(0xffffff, 0.46));
const key = new THREE.DirectionalLight(0xfff2dd, 2.1);
key.position.set(13, 23, 15); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
{ const d = 26, c = key.shadow.camera; c.left = -d; c.right = d; c.top = d; c.bottom = -d; c.near = 1; c.far = 76;
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; }
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f8bd0, 0.5);
rim.position.set(-12, 9, -10); rim.intensity = 0.75; scene.add(rim);   // .position is read-only; set through it, never over it

/* ═══ KIT START ═══ everything between these markers is self-contained
   (given THREE + an optional envMap) and is what other pages import. */
/* ============================================================
   GRAIN — textures drawn once, tiled in feet
   ============================================================ */
function tex(draw, px) {
  const c = document.createElement('canvas'); c.width = c.height = px || 256;
  draw(c.getContext('2d'), c.width);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
/* horizontal board siding — a shadow line every board */
const TX_SIDING = tex((x, N) => {
  x.fillStyle = '#59665e'; x.fillRect(0, 0, N, N);
  for (let i = 0; i < 8; i++) {
    const y = i * N / 8;
    x.fillStyle = 'rgba(255,255,255,0.05)'; x.fillRect(0, y + 1, N, N / 8 - 3);
    x.fillStyle = 'rgba(0,0,0,0.55)'; x.fillRect(0, y + N / 8 - 2, N, 2);
  }
  for (let i = 0; i < 240; i++) {   // grain
    x.fillStyle = 'rgba(0,0,0,' + (0.03 + Math.random() * 0.05) + ')';
    x.fillRect(Math.random() * N, Math.random() * N, 18 + Math.random() * 40, 1);
  }
});
/* standing seam — a raised rib every panel */
const TX_SEAM = tex((x, N) => {
  x.fillStyle = '#8b949c'; x.fillRect(0, 0, N, N);
  for (let i = 0; i < 6; i++) {
    const u = i * N / 6;
    x.fillStyle = 'rgba(255,255,255,0.16)'; x.fillRect(u + 2, 0, 3, N);
    x.fillStyle = 'rgba(0,0,0,0.42)'; x.fillRect(u, 0, 2, N);
  }
});
/* board-formed concrete */
const TX_CONC = tex((x, N) => {
  x.fillStyle = '#8d887f'; x.fillRect(0, 0, N, N);
  for (let i = 0; i < 10; i++) {
    x.fillStyle = 'rgba(0,0,0,0.16)'; x.fillRect(0, i * N / 10, N, 1.5);
  }
  for (let i = 0; i < 700; i++) {
    x.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.09) + ')';
    x.fillRect(Math.random() * N, Math.random() * N, 2, 2);
  }
});
/* coursed stone */
const TX_STONE = tex((x, N) => {
  x.fillStyle = '#9a9186'; x.fillRect(0, 0, N, N);
  const rows = 7;
  for (let r = 0; r < rows; r++) {
    const h = N / rows, off = (r % 2) * 0.5;
    for (let c = 0; c < 4; c++) {
      const w = N / 4;
      x.fillStyle = 'rgba(0,0,0,' + (0.06 + Math.random() * 0.16) + ')';
      x.fillRect((c + off) * w + 1, r * h + 1, w - 2, h - 2);
    }
    x.fillStyle = 'rgba(0,0,0,0.4)'; x.fillRect(0, r * h, N, 1.5);
  }
});
/* deck boards */
const TX_DECK = tex((x, N) => {
  x.fillStyle = '#a58f6d'; x.fillRect(0, 0, N, N);
  for (let i = 0; i < 10; i++) {
    x.fillStyle = 'rgba(0,0,0,0.42)'; x.fillRect(i * N / 10, 0, 2, N);
    x.fillStyle = 'rgba(255,255,255,0.05)'; x.fillRect(i * N / 10 + 3, 0, N / 10 - 6, N);
  }
});

const std = (c, r, m, map) => new THREE.MeshStandardMaterial({
  color: c, roughness: r, metalness: m || 0, map: map || null, envMap, envMapIntensity: 0.5 });
const M = {
  siding:   std(0x69766c, 0.84, 0, TX_SIDING),
  roof:     std(0x6d757c, 0.62, 0.18, TX_SEAM),   // painted seam, not chrome
  masonry:  std(0x9a9186, 0.92, 0, TX_STONE),
  concrete: std(0x8d887f, 0.93, 0, TX_CONC),
  timber:   std(0xa58f6d, 0.86, 0, TX_DECK),
  steel:    std(0x1b1f24, 0.55, 0.45),
  fascia:   std(0x222a2c, 0.72),
  gutter:   std(0x1b2225, 0.6, 0.2),
  frame:    std(0x1a1f24, 0.45, 0.28),
  water:    new THREE.MeshPhysicalMaterial({ color: 0x2b4b52, roughness: 0.06, metalness: 0, envMap, envMapIntensity: 1.3 }),
  gravel:   std(0x2a2f36, 0.96),
};
M.white  = std(0xd8d4ca, 0.55);
M.linen  = std(0xb9b2a2, 0.9);
// vertex-built slabs/prisms wind both ways; double-side the structural mats
[M.siding, M.roof, M.timber, M.steel, M.fascia, M.concrete, M.masonry].forEach((m) => { m.side = THREE.DoubleSide; });
M.glass = (() => {
  const m = new THREE.MeshPhysicalMaterial({ color: 0x1d2a34, metalness: 0, roughness: 0.05,
    transparent: true, opacity: 0.46, envMap, envMapIntensity: 1.5, clearcoat: 1, clearcoatRoughness: 0.06,
    side: THREE.DoubleSide, depthWrite: false });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uRim = { value: new THREE.Color(0xbfd2e8) };
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform vec3 uRim;')
      .replace('#include <opaque_fragment>',
        'float fres=pow(1.0-clamp(dot(normalize(vViewPosition),normal),0.0,1.0),3.0);\n' +
        'outgoingLight+=uRim*fres*0.9; diffuseColor.a=clamp(diffuseColor.a+fres*0.5,0.0,0.95);\n' +
        '#include <opaque_fragment>');
  };
  return m;
})();

/* ============================================================
   PARTS — all in FEET.  x = along the bar · y = across · z = up
   ============================================================ */
/* tile a texture at a fixed size in feet no matter how big the box is */
function boxUV(geo, w, h, d, tile) {
  const uv = geo.attributes.uv;
  const S = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) {
    const su = S[f][0] / tile, sv = S[f][1] / tile;
    for (let i = 0; i < 4; i++) {
      const k = f * 4 + i;
      uv.setXY(k, uv.getX(k) * su, uv.getY(k) * sv);
    }
  }
  uv.needsUpdate = true;
}
function mbox(x0, x1, y0, y1, z0, z1, mat, tile) {
  const w = Math.abs(x1 - x0), h = Math.abs(z1 - z0), d = Math.abs(y1 - y0);
  const g = new THREE.BoxGeometry(w, h, d);
  if (tile) boxUV(g, w, h, d, tile);
  const m = new THREE.Mesh(g, mat);
  m.position.set((x0 + x1) / 2, (z0 + z1) / 2, -(y0 + y1) / 2);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
const SID = 3, CON = 5, STO = 4, DEK = 3.5, SEA = 3;   // texture tile sizes, feet

/* A WALL WITH HOLES IN IT.
   run = along x (dir 'x') or along y (dir 'y'); `band` is the wall's two
   faces in the other horizontal axis. Openings are cut properly: pier,
   under-sill, over-head. Glass is set INSIDE the band with a frame, so
   no two surfaces ever share a plane. */
function wall(g, dir, a0, a1, b0, b1, z0, z1, ops, mat) {
  mat = mat || M.siding;
  const put = (s, e, zz0, zz1, mm, tl) => {
    if (e - s < 0.05 || zz1 - zz0 < 0.05) return;
    g.add(dir === 'x' ? mbox(s, e, b0, b1, zz0, zz1, mm, tl) : mbox(b0, b1, s, e, zz0, zz1, mm, tl));
  };
  const hits = (ops || []).slice().sort((p, q) => p[0] - q[0]);
  let cur = a0;
  for (const o of hits) {
    const s = Math.max(a0, o[0]), e = Math.min(a1, o[1]), sill = o[2], head = o[3];
    put(cur, s, z0, z1, mat, SID);                      // pier between openings
    put(s, e, z0, Math.max(z0, sill), mat, SID);        // under the sill
    put(s, e, Math.min(z1, head), z1, mat, SID);        // over the head
    cur = e;
  }
  put(cur, a1, z0, z1, mat, SID);
  const t = b1 - b0;
  for (const o of hits) {
    const s = Math.max(a0, o[0]), e = Math.min(a1, o[1]), sill = o[2], head = o[3];
    if (head - sill < 0.4 || e - s < 0.4) continue;
    const gi0 = b0 + t * 0.34, gi1 = b1 - t * 0.34;     // glass, deep in the reveal
    if (o[4] === 'd') {
      // A DOOR YOU COULD WALK THROUGH: leaf hung in the reveal, a lit glazed
      // slot at head height, a stone threshold that oversails the wall, a
      // lever at 3 ft, and a step down to grade so the entry MEETS the ground.
      const leaf = dir === 'x' ? mbox(s + 0.3, e - 0.3, gi0, gi1, sill + 0.15, head - 0.2, M.timber, 2.2)
                               : mbox(gi0, gi1, s + 0.3, e - 0.3, sill + 0.15, head - 0.2, M.timber, 2.2);
      g.add(leaf);
      const lz0 = head - 2.6, lz1 = head - 0.9;
      g.add(dir === 'x' ? mbox(s + 0.85, e - 0.85, gi0 - 0.06, gi1 + 0.06, lz0, lz1, M.glass)
                        : mbox(gi0 - 0.06, gi1 + 0.06, s + 0.85, e - 0.85, lz0, lz1, M.glass));
      const hx = dir === 'x' ? [e - 1.15, e - 0.85] : null;
      if (dir === 'x') g.add(mbox(hx[0], hx[1], b0 - 0.18, b0 + 0.06, sill + 3.0, sill + 3.35, M.steel));
      else g.add(mbox(b0 - 0.18, b0 + 0.06, e - 1.15, e - 0.85, sill + 3.0, sill + 3.35, M.steel));
      // a FLUSH threshold. The old masonry sill + concrete grade-step assumed
      // the door met dirt — on a deck the blocks punched up through the boards.
      // Whatever the door lands on (deck, porch, slab, stair pad) is the step.
      if (dir === 'x') g.add(mbox(s - 0.25, e + 0.25, b0 - 0.35, b1 - t * 0.2, sill - 0.12, sill + 0.04, M.masonry, STO));
      else g.add(mbox(b0 - 0.35, b1 - t * 0.2, s - 0.25, e + 0.25, sill - 0.12, sill + 0.04, M.masonry, STO));
    } else {
      const gl = dir === 'x' ? mbox(s + 0.25, e - 0.25, gi0, gi1, sill + 0.25, head - 0.25, M.glass)
                             : mbox(gi0, gi1, s + 0.25, e - 0.25, sill + 0.25, head - 0.25, M.glass);
      gl.castShadow = false; g.add(gl);
      const sl = dir === 'x' ? mbox(s - 0.2, e + 0.2, b0 - 0.35, b1 - t * 0.2, sill - 0.22, sill + 0.06, M.fascia)
                             : mbox(b0 - 0.35, b1 - t * 0.2, s - 0.2, e + 0.2, sill - 0.22, sill + 0.06, M.fascia);
      g.add(sl);                                          // a sill that sheds water
      const hd = dir === 'x' ? mbox(s - 0.3, e + 0.3, b0 - 0.45, b1 - t * 0.2, head, head + 0.3, M.fascia)
                             : mbox(b0 - 0.45, b1 - t * 0.2, s - 0.3, e + 0.3, head, head + 0.3, M.fascia);
      g.add(hd);                                          // and a head flashing over it
    }
    const f = 0.25, fo0 = b0 + t * 0.14, fo1 = b1 - t * 0.14;   // frame, proud of the glass
    if (dir === 'x') {
      g.add(mbox(s, e, fo0, fo1, sill, sill + f, M.frame));
      g.add(mbox(s, e, fo0, fo1, head - f, head, M.frame));
      g.add(mbox(s, s + f, fo0, fo1, sill, head, M.frame));
      g.add(mbox(e - f, e, fo0, fo1, sill, head, M.frame));
      if (e - s > 7) g.add(mbox((s + e) / 2 - 0.12, (s + e) / 2 + 0.12, fo0, fo1, sill, head, M.frame));
    } else {
      g.add(mbox(fo0, fo1, s, e, sill, sill + f, M.frame));
      g.add(mbox(fo0, fo1, s, e, head - f, head, M.frame));
      g.add(mbox(fo0, fo1, s, s + f, sill, head, M.frame));
      g.add(mbox(fo0, fo1, e - f, e, sill, head, M.frame));
      if (e - s > 7) g.add(mbox(fo0, fo1, (s + e) / 2 - 0.12, (s + e) / 2 + 0.12, sill, head, M.frame));
    }
  }
}
/* the four walls of a box volume, openings keyed by face */
function room(g, x0, x1, y0, y1, z0, z1, ops) {
  const t = 0.7;
  ops = ops || {};
  const mark = g.children.length;   // everything added below is ENVELOPE, liftable
  wall(g, 'x', x0, x1, y0, y0 + t, z0, z1, ops.s, M.siding);
  wall(g, 'x', x0, x1, y1 - t, y1, z0, z1, ops.n, M.siding);
  wall(g, 'y', y0 + t, y1 - t, x0, x0 + t, z0, z1, ops.w, M.siding);
  wall(g, 'y', y0 + t, y1 - t, x1 - t, x1, z0, z1, ops.e, M.siding);
  for (const cx of [x0, x1 - 0.5]) for (const cy of [y0, y1 - 0.5]) {   // corner boards
    g.add(mbox(cx, cx + 0.5, cy, cy + 0.5, z0, z1, M.fascia));
  }
  for (let i = mark; i < g.children.length; i++) g.children[i].userData.wallPart = true;
}
/* ── VERTEX-BUILT ROOFS ────────────────────────────────────────────────────
   Every earlier roof was a rotated box, and across four rounds a sign kept
   flipping somewhere between the rotation, the wedge and the eave hardware.
   So roofs are no longer rotated into place at all: the four corners of each
   plane are COMPUTED, in feet, from the roof equation z(u), and the fascia,
   gutter, downspouts and wedge are computed from the SAME equation. A plane

  const t = 0.42, b0 = b - t / 2, b1 = b + t / 2;
  const put = (p, q) => {
    if (q - p < 0.05) return;
    g.add(dir === 'x' ? mbox(p, q, b0, b1, z0, z1, M.siding, SID) : mbox(b0, b1, p, q, z0, z1, M.siding, SID));
  };
  const hs = (gaps || []).slice().sort((u, v) => u[0] - v[0]);
  let cur = a0;
  for (const gp of hs) {
    put(cur, gp[0]);
    const head = z0 + (gp[2] || 6.9);
    if (head < z1) g.add(dir === 'x' ? mbox(gp[0], gp[1], b0, b1, head, z1, M.siding, SID)
                                     : mbox(b0, b1, gp[0], gp[1], head, z1, M.siding, SID));
    const c = 0.28;                                        // the casing
    if (dir === 'x') {
      g.add(mbox(gp[0] - c, gp[0], b0 - 0.08, b1 + 0.08, z0, head + c, M.fascia));
      g.add(mbox(gp[1], gp[1] + c, b0 - 0.08, b1 + 0.08, z0, head + c, M.fascia));
      g.add(mbox(gp[0] - c, gp[1] + c, b0 - 0.08, b1 + 0.08, head, head + c, M.fascia));
    } else {
      g.add(mbox(b0 - 0.08, b1 + 0.08, gp[0] - c, gp[0], z0, head + c, M.fascia));
      g.add(mbox(b0 - 0.08, b1 + 0.08, gp[1], gp[1] + c, z0, head + c, M.fascia));
      g.add(mbox(b0 - 0.08, b1 + 0.08, gp[0] - c, gp[1] + c, head, head + c, M.fascia));
    }
    cur = gp[1];
  }
  put(cur, a1);
}


/* ── ROOMS YOU CAN READ ───────────────────────────────────────────────────
   A plan is scannable when the rooms say what they are and hold what they
   hold. Labels are sprites (they face you, they never block the plan) and
   the fixtures are the honest minimum: a kitchen run with sink and range,
   a bath with shower, wc and basin, a bed that proves the room takes one. */
const ROOMTAGS = [], FIREPITS = [];
function roomLabel(g, text, x, y, z) {
  ROOMTAGS.push({ h: CUR, t: text, x, y });
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const cx = c.getContext('2d');
  cx.fillStyle = 'rgba(12,14,18,0.78)'; cx.fillRect(0, 0, 256, 64);
  cx.strokeStyle = '#e6b84d'; cx.lineWidth = 3; cx.strokeRect(2, 2, 252, 60);
  cx.fillStyle = '#f3f4f6'; cx.font = '700 26px system-ui'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText(text, 128, 34);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true, opacity: 0.85 }));
  sp.scale.set(5, 1.25, 1);
  sp.position.copy(W(x, y, z + 1.5));
  sp.userData.audit = false;
  g.add(sp);
}
function kitchen(g, x0, x1, yB, z0) {
  g.add(mbox(x0, x1, yB - 2.1, yB, z0, z0 + 3, M.timber, 2));                      // base cabinets
  g.add(mbox(x0 - 0.05, x1 + 0.05, yB - 2.2, yB, z0 + 3, z0 + 3.2, M.concrete, CON)); // counter
  g.add(mbox(x0, x1, yB - 1.1, yB, z0 + 4.6, z0 + 7.2, M.siding, SID));            // uppers
  g.add(mbox(x0 + 1, x0 + 3.4, yB - 2.0, yB - 0.2, z0 + 3.2, z0 + 3.32, M.steel)); // the sink
  g.add(mbox(x1 - 4, x1 - 1.6, yB - 2.0, yB - 0.2, z0 + 3.2, z0 + 3.4, M.steel));  // the range
}
function bathset(g, x, y, z0, opts) {
  opts = opts || {};
  if (opts.shower !== false) {
    g.add(mbox(x, x + 3, y, y + 3, z0, z0 + 0.35, M.concrete, CON));               // shower tray
    g.add(mbox(x + 2.9, x + 3.02, y, y + 3, z0 + 0.35, z0 + 6.4, M.glass));        // its screen
  }
  g.add(mbox(x + 3.6, x + 5, y + 0.2, y + 2.3, z0, z0 + 1.4, M.white));            // wc
  g.add(mbox(x + 5.4, x + 7.3, y, y + 1.8, z0 + 2.6, z0 + 2.95, M.white));         // basin counter
  g.add(mbox(x + 5.4, x + 7.3, y, y + 0.4, z0, z0 + 2.6, M.timber, 2));            // its cabinet
}
function bed(g, x, y, z0, w, l) {
  w = w || 5.4; l = l || 7;
  g.add(mbox(x, x + w, y, y + l, z0, z0 + 1.1, M.timber, 2));
  g.add(mbox(x + 0.15, x + w - 0.15, y + 0.15, y + l - 0.15, z0 + 1.1, z0 + 1.85, M.white));
  g.add(mbox(x + 0.5, x + w - 0.5, y + l - 1.6, y + l - 0.4, z0 + 1.85, z0 + 2.2, M.linen));
}
function sofa(g, x, y, z0, len) {
  len = len || 7;
  g.add(mbox(x, x + len, y, y + 2.8, z0, z0 + 1.35, M.linen));

function dine(g, x, y, z0) {
  g.add(mbox(x, x + 7, y, y + 3.2, z0 + 2.4, z0 + 2.65, M.timber, 2));
  g.add(mbox(x + 3.2, x + 3.8, y + 1.2, y + 2, z0, z0 + 2.4, M.steel));
  for (const cx of [x + 1, x + 3.2, x + 5.4]) for (const cy of [y - 1.6, y + 3.6]) {
    g.add(mbox(cx, cx + 1.5, cy, cy + 1.4, z0, z0 + 1.5, M.timber, 2));

/* ── THE CORE ──────────────────────────────────────────────────────────────
   A house is not rooms alone. It needs somewhere to put things, one wet wall
   the plumbing can share, and a place the panel and the equipment live. Drawn
   as a real closet with a door, a thickened plumbing wall, and a panel — so
   the plan can be checked for them instead of assuming them. */
function core(g, x0, x1, y0, y1, z0, z1, dir) {
  const t = 0.42;
  // the wet wall: thicker than a partition because the stacks run in it
  g.add(mbox(x0, x1, y1 - 0.85, y1, z0, z1, M.siding, SID));
  g.add(mbox(x0 + 0.3, x0 + 1.1, y1 - 0.95, y1 - 0.85, z0 + 3.6, z0 + 5.6, M.steel));   // the panel
  g.add(mbox(x1 - 2.6, x1 - 0.6, y1 - 1.9, y1 - 0.9, z0, z0 + 4.4, M.steel));           // the equipment
  // the closet, with a door you can open
  part(g, 'x', x0, x1, y0, z0, z1, [[x0 + 0.6, x0 + 3.4]]);
  part(g, 'y', y0, y1 - 0.85, dir === 'w' ? x0 : x1, z0, z1, []);
  for (let z = z0 + 3.2; z < z1 - 1.2; z += 1.4) {                                       // shelves
    g.add(mbox(x0 + 0.5, x1 - 0.5, y0 + 0.35, y1 - 1.1, z, z + 0.12, M.timber, 2));
  }
}
/* ── THE MUDROOM ──────────────────────────────────────────────────────────
   Wright's move: you do not walk straight into the room. You pass under a low
   ceiling, turn, and the space opens. A dropped soffit over the door, a bench
   to sit and take boots off, hooks above it, and a closet on the other hand. */
function mudroom(g, xa, xb, yFace, z0, headZ) {
  // INWARD. The first version ran this out through the wall onto the porch, so
  // the hooks hung in open air with nothing behind them — which is exactly what
  // the buildability check flagged. A mudroom is inside the door, not outside it.
  g.add(mbox(xa - 1.2, xb + 1.2, yFace, yFace + 5.2, headZ, headZ + 0.7, M.fascia));      // the dropped soffit
  g.add(mbox(xa - 1.0, xa + 2.4, yFace + 3.2, yFace + 4.6, z0 + 1.35, z0 + 1.75, M.timber, 2));  // bench
  for (const bx of [xa - 0.8, xa + 2.0]) g.add(mbox(bx, bx + 0.3, yFace + 3.4, yFace + 4.5, z0, z0 + 1.35, M.timber, 2));
  g.add(mbox(xa - 1.0, xa + 2.4, yFace + 4.6, yFace + 4.8, z0 + 4.6, z0 + 4.9, M.timber, 2));    // the hook rail
  for (let hx = xa - 0.6; hx < xa + 2.2; hx += 0.8) g.add(mbox(hx, hx + 0.14, yFace + 4.45, yFace + 4.6, z0 + 4.4, z0 + 4.65, M.steel));
  g.add(mbox(xa - 1.2, xa - 0.9, yFace, yFace + 5.2, z0, headZ, M.siding, SID));           // the wall you turn around
}

/* 1 · HEART HOUSE — the bar built AROUND the fire. The masonry mass is
   the structural and social centre; the roof falls away from it both
   ways, so the chimney is the high point of the whole house. */
function buildHeart() {
  const g = new THREE.Group();
  g.add(mbox(0, 64, 0, 26, -3, 10, M.concrete, CON));
  room(g, 0, 64, 0, 26, 10, 21, {
    s: [[4, 15, 13, 19], [16, 19.4, 10, 17.1, 'd'], [21, 28, 13, 19], [30.5, 34.5, 10, 17.6, 'd'], [38, 48, 13, 19], [51, 60, 13, 19]],
    n: [[8, 14, 14, 19], [50, 56, 14, 19]],
    w: [[8, 18, 13, 19]], e: [[8, 18, 13, 19]],
  });
  // the roof falls away from the flue ALONG the bar: high at x=32, low at
  // the ends. axis:'x' — and no overhang at the seam, where the flue rises.
  shed(g, 0, 32, 0, 26, 21, 27, 3, -3, { axis: 'x', ohHi: 0 });
  shed(g, 32, 64, 0, 26, 27, 21, 3, -3, { axis: 'x', ohLo: 0 });
  { const cap = mbox(31.55, 32.45, -3, 29, 26.8, 27.42, M.roof, SEA);   // the ridge cap owns the seam
    cap.userData.roofPart = true; g.add(cap); }
  flue(g, 32, 13, -4, 37, 5.6);
  deck(g, 14, 50, -12, 0, 9.6, -3, { gap: [30.1, 33.9] });   // the guard opens where the stair enters
  floorSlab(g, 0.7, 63.3, 0.7, 25.3, 10.2);
  part(g, 'y', 0.7, 25.3, 20, 10.2, 21, [[9, 12.4]]);        // primary suite off the west end
  part(g, 'y', 0.7, 25.3, 44, 10.2, 21, [[6, 9.4], [16, 19.4]]);
  part(g, 'x', 0.7, 20, 14, 10.2, 21, [[7, 10.4]]);          // the gallery in front of the hearth
  part(g, 'x', 44, 63.3, 14, 10.2, 21, [[52, 55.4]]);
  core(g, 46, 52, 17, 24.6, 10.2, 21, 'e');                  // closet + wet wall + panel
  mudroom(g, 30.6, 34, 0.7, 10.2, 17.1);                     // you turn before the room opens
  stairs(g, { x: 32, y: -12, zTop: 9.6, zBot: -3, grade: -3, heading: 'S' });
  kitchen(g, 53, 62, 24.55, 10.2);   // clear of the core closet
  dine(g, 50, 5.5, 10.2);
  sofa(g, 20, 7, 10.2, 8);           // out of the entry path — the door needs its walk
  bed(g, 3, 3.5, 10.2); bathset(g, 2, 16.2, 10.2);

  roomLabel(g, 'BATH', 9, 19, 10.2); roomLabel(g, 'ENTRY', 32.3, 4, 10.2);
  return g;
}

/* 6 · RAIN HOUSE — the roof is the argument. It runs far past the wall
   to make an outdoor room you can stand in during a downpour, and it
   drains to one visible point: a scupper into a cistern you can see. */
function buildRain() {
  const g = new THREE.Group();
  g.add(mbox(0, 44, 0, 22, -3, 8, M.concrete, CON));
  room(g, 0, 44, 0, 22, 8, 19, {
    s: [[3, 13, 11, 17.5], [13.2, 16.6, 8, 15, 'd'], [16, 25, 11, 17.5], [26, 29.4, 8, 15, 'd'], [31, 41, 11, 17.5]],
    n: [[8, 15, 11, 17.5], [29, 36, 11, 17.5]], w: [[7, 15, 10, 17.5]], e: [[7, 15, 10, 17.5]],
  });
  shed(g, 0, 44, -16, 22, 15, 24.5, 3, null, { wall: [0, 19] });   // 3:12; z(0)=19 = the wall head, z(-16)=15 over the porch
  deck(g, 0, 44, -15.5, 0, 7.7, -3, { gap: [13.05, 16.75] });   // guarded — and the opening is on the door's axis
  stairs(g, { x: 14.9, y: -15.5, zTop: 7.7, zBot: -3, grade: -3, heading: 'S' });   // you step off the porch where you stepped out the door
  for (const x of [2, 21.5, 41]) {                           // posts that actually carry the roof
    g.add(mbox(x - 0.42, x + 0.42, -15.6, -14.76, 7.7, 14.68, M.steel));   // to the roof underside: z(-15.2)=15.2 − 0.5 deck
    pier(g, x, -15.2, -3, 7.7, 1.5);
  }
  g.add(mbox(43.4, 45.2, -16.1, -14.3, 13.5, 14.3, M.gutter));   // the scupper, under the low eave
  // the cistern now stands UNDER the scupper and is plumbed to it — it used to

/* ============================================================
   THE CHECKER — a house that cannot be built should say so
   ------------------------------------------------------------
   Not a visual review. Every mesh is reduced to a world-space box, and the
   boxes are linked wherever they touch (within a 2-inch tolerance). Then we
   flood outward from everything resting on grade. Anything the flood never
   reaches is carrying its own weight in mid-air: floating, hanging off
   nothing, or an island of parts connected only to each other.

   That last case is why a simple "is something underneath me" test is not
   enough — a whole detached porch would pass it. Connectivity to the GROUND
   is the buildable condition, so that is what gets tested.
   ============================================================ */
const TOLB = 2 / 12;                    // two inches, in feet — scaled below
function auditHouse(h) {
  h.updateMatrixWorld(true);
  const items = [];
  h.traverse((o) => { if (o.isMesh && o.userData.audit !== false) items.push({ o, b: new THREE.Box3().setFromObject(o) }); });
  if (!items.length) return { bad: [], n: 0 };
  const tol = TOLB * (h.scale.x || 1);
  let grade = Infinity;
  items.forEach((it) => { grade = Math.min(grade, it.b.min.y); });
  const touch = (a, c) =>
    a.max.x >= c.min.x - tol && a.min.x <= c.max.x + tol &&
    a.max.y >= c.min.y - tol && a.min.y <= c.max.y + tol &&
    a.max.z >= c.min.z - tol && a.min.z <= c.max.z + tol;
  const seen = new Array(items.length).fill(false);
  const queue = [];
  items.forEach((it, i) => { if (it.b.min.y <= grade + tol * 3) { seen[i] = true; queue.push(i); } });
  while (queue.length) {
    const i = queue.pop();
    for (let j = 0; j < items.length; j++) {
      if (seen[j]) continue;
      if (touch(items[i].b, items[j].b)) { seen[j] = true; queue.push(j); }
    }
  }
  const bad = [];
  for (let i = 0; i < items.length; i++) if (!seen[i]) bad.push(items[i].o);
  return { bad, n: items.length };
}
const FAILMAT = new THREE.MeshBasicMaterial({ color: 0xff3b30, wireframe: true });
let auditOn = false, auditMarks = [];
function runAudit() {
  auditOn = !auditOn;
  auditMarks.forEach((m) => { m.parent && m.parent.remove(m); });
  auditMarks = [];
  const b = document.getElementById('auditbtn');
  if (!auditOn) {
    if (b) { b.style.background = 'transparent'; b.style.color = '#cfd5df'; }
    specEl.style.opacity = '0';
    return;
  }
  let totalBad = 0, totalN = 0;
  const lines = [];
  houses.forEach((h) => {
    const r = auditHouse(h);
    totalBad += r.bad.length; totalN += r.n;
    if (r.bad.length) lines.push(h.userData.name + ' — ' + r.bad.length);
    r.bad.forEach((o) => {
      const bb = new THREE.Box3().setFromObject(o), sz = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
      const mk = new THREE.Mesh(new THREE.BoxGeometry(Math.max(sz.x, 0.05), Math.max(sz.y, 0.05), Math.max(sz.z, 0.05)), FAILMAT);
      mk.position.copy(c); scene.add(mk); auditMarks.push(mk);
    });
  });
  const rFails = CRITIC.filter((c) => !c.pass);
  const bad = totalBad + rFails.length;
  if (b) { b.style.background = bad ? '#ff3b30' : '#54c46a'; b.style.color = '#10191b'; }
  specEl.querySelector('b').textContent = bad
    ? 'NOT BUILDABLE — ' + totalBad + ' FLOATING · ' + rFails.length + ' RULES BROKEN'
    : 'ALL NINE STAND UP';
  specEl.querySelector('span').textContent = bad
    ? [...lines, ...rFails.slice(0, 4).map((c) => c.name + ' (' + c.detail + ')')].join(' · ')
    : totalN + ' parts trace contact to grade · ' + CRITIC.length + ' roof and stair rules hold.';
  specEl.style.opacity = '1';
  console.log('[buildability]', totalBad + '/' + totalN, 'floating;', rFails.length + '/' + CRITIC.length, 'rules broken', rFails.map((c) => c.name));
  window.__criticList = CRITIC;
  window.__audit = { houses, runAudit, auditHouse, THREE };   // so the check can be checked
}

/* the fire keeps common company: pair every flue with its nearest labelled
   room — a hearth whose closest room is a BED, BATH or WC fails the build */
FIREPITS.forEach((f) => {
  let best = null, bd = 1e9;
  ROOMTAGS.filter((r) => r.h === f.h).forEach((r) => {
    const d = Math.hypot(r.x - f.x, r.y - f.y);
    if (d < bd) { bd = d; best = r; }
  });
  CUR = f.h;
  if (best) crit('fire keeps common company', !/BED|BATH|WC|WET/i.test(best.t),
    'nearest room: ' + best.t + ' (' + bd.toFixed(0) + 'ft)');
});

/* ============================================================
   ORBIT · focus · hover
   ============================================================ */
const target = new THREE.Vector3(0, 1.6, 0), targetGoal = target.clone();
let azim = 0.5, polar = 0.94, radius = 40, radiusGoal = 40, dragging = false, px = 0, py = 0, moved = 0;
const minPolar = 0.16, maxPolar = 1.46, minR = 8, maxR = 70;
function applyCam() {
  const sp = Math.sin(polar), cp = Math.cos(polar);
  camera.position.set(target.x + radius * sp * Math.sin(azim), target.y + radius * cp, target.z + radius * sp * Math.cos(azim));
  camera.lookAt(target);
}
const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => { dragging = true; moved = 0; px = e.clientX; py = e.clientY; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointerup', (e) => { dragging = false; if (moved < 5) tryPick(e); });
el.addEventListener('pointerleave', () => { dragging = false; });
el.addEventListener('pointermove', (e) => {
  if (dragging) {
    moved += Math.abs(e.movementX) + Math.abs(e.movementY);
    azim -= (e.clientX - px) * 0.005;
    polar = Math.min(maxPolar, Math.max(minPolar, polar - (e.clientY - py) * 0.005));
    px = e.clientX; py = e.clientY;
  }
  updateHover(e);
});
el.addEventListener('wheel', (e) => { e.preventDefault(); radiusGoal = Math.min(maxR, Math.max(minR, radiusGoal + e.deltaY * 0.016)); }, { passive: false });
let pinchD = 0;
el.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY, d = Math.hypot(dx, dy);
    if (pinchD) radiusGoal = Math.min(maxR, Math.max(minR, radiusGoal + (pinchD - d) * 0.05));
    pinchD = d; e.preventDefault();
  }
}, { passive: false });
el.addEventListener('touchend', () => { pinchD = 0; });
function focusOn(i) {
  targetGoal.copy(tilePos[i]).add(new THREE.Vector3(0, 1.9, 0)); radiusGoal = 17;
  const h = houses[i];
  specEl.querySelector('b').textContent = h.userData.name;
  specEl.querySelector('span').textContent = h.userData.spec;
  specEl.style.opacity = '1';
}
function unfocus() { targetGoal.set(0, 1.6, 0); radiusGoal = 40; specEl.style.opacity = '0'; }
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') unfocus();
  if (e.key === 'r' || e.key === 'R') toggleRoofs();
  if (e.key === 'w' || e.key === 'W') toggleWalls();
  if (e.key === 'b' || e.key === 'B') runAudit();
});
/* LIFT THE ROOFS — the only way to judge whether you could live in one */
let roofsOn = true;
function toggleRoofs() {
  roofsOn = !roofsOn;
  houses.forEach((h) => h.traverse((o) => { if (o.userData && o.userData.roofPart) o.visible = roofsOn; }));
  const b = document.getElementById('roofbtn');
  if (b) b.style.background = roofsOn ? 'transparent' : '#e6b84d', b.style.color = roofsOn ? '#cfd5df' : '#10191b';
}
/* AND THE WALLS — roofs alone still leave you looking into a closed box.
   With both off you are reading a plan: partitions, cased door openings,
   thresholds and the floor they all stand on. */
let wallsOn = true;
function toggleWalls() {
  wallsOn = !wallsOn;
  houses.forEach((h) => h.traverse((o) => { if (o.userData && o.userData.wallPart) o.visible = wallsOn; }));
  const b = document.getElementById('wallbtn');
  if (b) { b.style.background = wallsOn ? 'transparent' : '#e6b84d'; b.style.color = wallsOn ? '#cfd5df' : '#10191b'; }
}
{ const b = document.getElementById('roofbtn'); if (b) b.addEventListener('click', toggleRoofs); }
{ const b = document.getElementById('wallbtn'); if (b) b.addEventListener('click', toggleWalls); }
{ const b = document.getElementById('auditbtn'); if (b) b.addEventListener('click', runAudit); }

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const tag = document.getElementById('tag');
const tagN = tag.querySelector('.n'), tagT = tag.querySelector('.t'), tagF = tag.querySelector('.f');
function rootOf(o) { while (o.parent && !(o.userData && o.userData.name)) o = o.parent; return o; }
function hit(e) {
  ndc.x = (e.clientX / innerWidth) * 2 - 1; ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const is = ray.intersectObjects(houses, true);
  return is.length ? rootOf(is[0].object) : null;
}
function updateHover(e) {
  const h = hit(e);
  if (h && h.userData.name) {
    tag.style.opacity = '1'; tag.style.left = e.clientX + 'px'; tag.style.top = (e.clientY - 12) + 'px';
    tagN.textContent = h.userData.num; tagT.textContent = h.userData.name; tagF.textContent = h.userData.note;
  } else tag.style.opacity = '0';
}
function tryPick(e) {
  const h = hit(e);
  if (!h || !h.userData.name) return unfocus();
  focusOn(houses.indexOf(h));
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop() {
  requestAnimationFrame(loop);
  target.lerp(targetGoal, 0.08);
  radius += (radiusGoal - radius) * 0.08;
  applyCam();
  renderer.render(scene, camera);
})();
</script>
</body>
