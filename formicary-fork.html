      'stroke-linecap="square"><path d="M6 17.4c0-6.4 1.8-9.4 6-9.4s6 3 6 9.4"/>' +
      '<path d="M4 17.4h16"/><path d="M12 5.6v2.4"/>' +
      '<path d="M12 3.2a1.4 1.4 0 010 2.8 1.4 1.4 0 010-2.8z"/>' +
      '<path d="M12 17.4v2.2"/><path d="M12 19.6a1.2 1.2 0 010 2.4 1.2 1.2 0 010-2.4z"/></svg>',
    /* guarded threshold — one destructive actor can no longer come back in */
    eject: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="square"><path d="M3.5 21.4V4.6h9v16.8"/><path d="M3.5 4.6h9"/>' +
      '<path d="M2 12.8h12"/><path d="M15.6 12.8h6.6"/><path d="M19 9.6l3.2 3.2-3.2 3.2"/></svg>',
  };

  /* folk names, used only until the silhouettes are learned. VOICE overrides with
     FZ.copy.tools[kind].folk. */
  var FOLK = {
    charter: 'MEETING STONE', vary: 'SEED', slow: 'BELL',
    lens: 'LANTERN', ledger: 'TALLY', eject: 'THRESHOLD',
  };
  /* the same thing, named short, for when the sandbox offers all six across a phone */
  var FOLK_TIGHT = {
    charter: 'ARCH', vary: 'SEED', slow: 'BELL',
    lens: 'LANTERN', ledger: 'TALLY', eject: 'GATE',
  };

  /* EJECT is the only instrument the PLAYER has to aim, because naming the body is the
     decision. CHARTER and VARY still need a coordinate — the sim raises them somewhere —
     but that somewhere is not a question: an institution answering a located incident goes
     where the incident is. One tap. */
  var TARGETED = { eject: 1 };
  var NEEDS_XY = { eject: 1, charter: 1, vary: 1 };
  var LABELS_UNTIL = 6;               /* after this many answered, the shape is enough */
  var NOTE_MS = 2400;                 /* how long a correction owns the one message region */

  var field = null, tagLayer = null, act = null, actRow = null;
  var tagNode = null, tagName = null, tagLine = null, tagFuse = null, thread = null;
  var made = new Map();               /* kind -> button node */
  var have = [];                      /* kinds currently offered, in ORDER order */
  var avail = [];                     /* kinds this chapter has taught */
  var learned = Object.create(null);    /* first correct use is assisted, later uses are choices */
  var wired = false, built = false;
  var note = null;                    /* {text, tone, until} — the one transient message */
  var lastKey = '';
  var api;

  function copyTool(k) { return (FZ.copy && FZ.copy.tools && FZ.copy.tools[k]) || {}; }
  function ui(k) { return (FZ.copy && FZ.copy.ui && FZ.copy.ui[k]) || ''; }
  function loop(k) { return (FZ.copy && FZ.copy.loop && FZ.copy.loop[k]) || ''; }
  function folk(k, tight) {
    var c = copyTool(k);
    if (tight && (c.folkShort || FOLK_TIGHT[k])) return c.folkShort || FOLK_TIGHT[k];
    return c.folk || FOLK[k] || k.toUpperCase();
  }
  function S() { return FZ.sim ? FZ.sim.state : null; }
  function ob() { return FZ.outbreak || null; }
  function now() { return Date.now(); }

  /* ---------------------------------------------------------------- the paper */
  var CSS =
    '#bar{display:none!important}#toast{display:none!important}#aimHint{display:none!important}' +
    '#tagLayer{position:fixed;inset:0;z-index:40;pointer-events:none;font-family:inherit}' +
    '.fztag{position:absolute;width:230px;max-width:78vw;background:#f5efe3;color:#17150f;' +
    'border:1px solid rgba(0,0,0,.55);border-left:0;box-shadow:3px 4px 0 rgba(0,0,0,.28);' +
    'padding:8px 10px 9px 13px;opacity:0;transform:translateY(4px);' +
    'transition:opacity .16s ease-out,transform .16s ease-out}' +
    '.fztag.on{opacity:1;transform:none}' +
    '.fztag .fzfuse{position:absolute;left:0;bottom:0;width:4px;height:100%;background:#ffd23f}' +
    '.fztag.hot .fzfuse{background:#ff2e2e}' +
    '.fztag.note .fzfuse{background:#ff2e2e;height:100%}' +
    '.fztag .fzn{font-size:11.5px;font-weight:700;letter-spacing:.11em;line-height:1.2}' +
    '.fztag .fzl{font-size:11.5px;line-height:1.4;margin-top:5px;color:#4a4335}' +
    '.fztag.note .fzl{color:#17150f}' +
    '.fzthread{position:absolute;height:0;border-top:1px dashed rgba(0,0,0,.5);' +
    'transform-origin:0 0;opacity:0;transition:opacity .16s ease-out}' +
    '.fzthread.on{opacity:1}' +
    '#act{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;gap:6px;' +
    'justify-content:center;align-items:flex-end;padding:10px 6px;' +
    'padding-bottom:calc(10px + env(safe-area-inset-bottom));font-family:inherit}' +
    '#act .fzrow{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap;width:100%}' +
    '.fzact{position:relative;flex:1 1 0;min-width:0;max-width:112px;min-height:62px;' +
    'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;' +
    'background:#f5efe3;color:#17150f;border:1.5px solid #17150f;' +
    'box-shadow:2px 3px 0 rgba(0,0,0,.4);padding:6px 3px 5px;cursor:pointer;' +
    'font-family:inherit;-webkit-tap-highlight-color:transparent;' +
    'animation:fzactin .2s ease-out 1}' +
    '.fzact svg{width:26px;height:26px;display:block}' +
    '.fzact .fzf{font-size:8px;letter-spacing:.02em;line-height:1;white-space:nowrap;' +
    'max-width:100%;overflow:hidden}' +
    '.fzact .fzc{position:absolute;top:2px;right:3px;font-size:8.5px;color:rgba(0,0,0,.45)}' +
    '.fzact.on{background:#17150f;color:#f5efe3;border-color:#17150f}' +
    '.fzact.on .fzc{color:rgba(255,255,255,.6)}' +
    '.fzact.poor{opacity:.34}' +
    '.fzact.live{box-shadow:2px 3px 0 rgba(0,0,0,.4),inset 0 -4px 0 #19e6c8}' +
    '.fzact.teach{max-width:210px;min-height:72px;box-shadow:2px 3px 0 rgba(0,0,0,.4),inset 0 -6px 0 #19e6c8;animation:fzteach .8s steps(2,end) infinite}' +
    '@keyframes fzteach{50%{transform:translateY(-2px)}}' +
    '.fzact:active{transform:translate(1px,1px);box-shadow:1px 2px 0 rgba(0,0,0,.4)}' +
    '@keyframes fzactin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}';

  function ensure() {
    if (built) return;
    if (!document.getElementById('fzActCSS')) {
      var s = document.createElement('style');
      s.id = 'fzActCSS';
      s.textContent = CSS;
      document.head.appendChild(s);
    }
    var host = document.getElementById('app') || document.body;
    tagLayer = document.getElementById('tagLayer');
    if (!tagLayer) {
      tagLayer = document.createElement('div');
      tagLayer.id = 'tagLayer';
      host.appendChild(tagLayer);
    }
    thread = document.createElement('div');
    thread.className = 'fzthread';
    tagNode = document.createElement('div');
    tagNode.className = 'fztag';
    tagFuse = document.createElement('div'); tagFuse.className = 'fzfuse';
    tagName = document.createElement('div'); tagName.className = 'fzn';
    tagLine = document.createElement('div'); tagLine.className = 'fzl';
    tagNode.appendChild(tagFuse); tagNode.appendChild(tagName); tagNode.appendChild(tagLine);
    tagLayer.appendChild(thread);
    tagLayer.appendChild(tagNode);

    act = document.getElementById('act');
    if (!act) {
      act = document.createElement('div');
      act.id = 'act';
      host.appendChild(act);
    }
    actRow = document.createElement('div');
    actRow.className = 'fzrow';
    act.appendChild(actRow);
    act.style.display = 'none';
    built = true;
  }

  /* ------------------------------------------------------------- the buttons */
  function makeButton(kind) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'fzact';
    b.setAttribute('data-kind', kind);
    b.setAttribute('aria-label', folk(kind));
    var g = document.createElement('span');
    g.className = 'fzg';
    g.innerHTML = MARK[kind] || '';
    var l = document.createElement('span');
    l.className = 'fzf';
    l.textContent = folk(kind);
    var c = document.createElement('span');
    c.className = 'fzc';
    c.textContent = String(FZ.sim ? FZ.sim.cost(kind) : 2);
    b.appendChild(g); b.appendChild(l); b.appendChild(c);
    b.addEventListener('click', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      press(kind);
    });
    b.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    made.set(kind, b);
    return b;
  }

  /* the hands only work while the colony is running: once a chapter has been won or
     lost the result is being read, and a stray tap must not spend budget into it. */
  function live() {
    var st = S();
    if (!st || st.gameOver) return false;
    if (FZ.chapters && FZ.chapters.phase && FZ.chapters.phase() !== 'play') return false;
    return true;
  }

  function burning() {
    var o = ob();
    if (!o) return null;
    try { return o.current() || o.urgent(); } catch (e) { return null; }
  }

  function press(kind) {
    var st = S();
    if (!st || !live()) return;
    if (st.budget < FZ.sim.cost(kind)) { say(ui('noBudget'), 'bad'); return; }
    var o = burning();
    var teach = teachingKind(o);
    if (teach === kind && o) {
      /* First use teaches the verb: one obvious button, one tap, correct placement. */
      learned[kind] = 1; disarm();
      var tx = o.x, ty = o.y;
      if (kind === 'eject') {
        var ids = o.who || [], target = null;
        for (var ti = 0; ti < ids.length; ti++) {
          var q = st.agents.find(function (z) { return z.id === ids[ti]; });
          if (q && (q.adversary || !q.corrigible)) { target = q; break; }
        }
        if (!target) target = st.agents.find(function (z) { return z.adversary || !z.corrigible; });
        if (target) { tx = target.x; ty = target.y; }
      }
      commit(kind, tx, ty); return;
    }
    if (TARGETED[kind]) {
      if (api.armed === kind) { disarm(); return; }
      api.armed = kind;
      api.aim = null;
      note = null;                            /* the instrument in hand outranks old news */
      paint(st);
      return;
    }
    disarm();
    if (!o && NEEDS_XY[kind]) return;         /* nowhere to put it and nothing to answer */
    commit(kind, o ? o.x : null, o ? o.y : null);
  }

  function disarm() {
    api.armed = null;
    api.aim = null;
  }

  function commit(kind, x, y) {
    var st = S();
    if (!st || !live()) return;
    if (st.budget < FZ.sim.cost(kind)) { say(ui('noBudget'), 'bad'); return; }

    /* the diagnosis is judged BEFORE the spend, so a right answer can be paid back and a
       wrong one can say what the failure actually is — including, for an expulsion, that
       the body you removed was not the one doing it. */
    var ans = null;
    if (ob() && ob().tryAnswer) {
      try { ans = ob().tryAnswer(kind, x, y); } catch (e) { ans = null; }
    }
    var out = FZ.sim.apply(kind, NEEDS_XY[kind] ? x : undefined, NEEDS_XY[kind] ? y : undefined);

    /* nothing was spent -> say why, and never claim an answer that did not happen.
       A right answer says NOTHING: the ring visibly closes, the strain drops, the tag
       goes away. That is the whole receipt, and it is drawn, not written. */
    if (out && !out.ok) { if (out.msg) say(out.msg, 'bad'); }
    else if (ans && ans.hit && !ans.right && ans.msg) say(ans.msg, 'bad');
    else if (ans && !ans.hit && ans.msg) say(ans.msg, 'bad');
    paint(st);
  }

  /* --------------------------------------------------------------- the field */
  function toWorld(ev) {
    var st = S();
    if (!field || !st) return null;
    var r = field.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    return {
      x: (ev.clientX - r.left) * (st.w / r.width),
      y: (ev.clientY - r.top) * (st.h / r.height),
    };
  }

  function wireField() {
    if (wired || !field) return;
    wired = true;
    var down = false;

    field.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    field.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      down = true;
      try { field.setPointerCapture(ev.pointerId); } catch (e) { }
      var p = toWorld(ev);
      if (p && api.armed) api.aim = { kind: api.armed, x: p.x, y: p.y };
    });
    field.addEventListener('pointermove', function (ev) {
      if (!down || !api.armed) return;
      ev.preventDefault();
      var p = toWorld(ev);
      if (p) api.aim = { kind: api.armed, x: p.x, y: p.y };
    });
    function up(ev) {
      if (!down) return;
      down = false;
      try { field.releasePointerCapture(ev.pointerId); } catch (e) { }
      var p = toWorld(ev) || (api.aim ? { x: api.aim.x, y: api.aim.y } : null);
      var kind = api.armed;
      disarm();
      if (!p) return;
      if (kind) { commit(kind, p.x, p.y); return; }
      /* no instrument in hand: the tap is a look. If two incidents are live, this is how
         the player chooses which one the tag is about. Nothing opens, nothing pops. */
      if (ob() && ob().focusAt) { try { ob().focusAt(p.x, p.y); } catch (e) { } }
    }
    field.addEventListener('pointerup', up);
    field.addEventListener('pointercancel', function () { down = false; api.aim = null; });
  }

  /* ------------------------------------------------------- the one message */
  /* Everything the game has to say arrives here and nowhere else. A second message does
     not queue behind this one, it replaces it: two explanations of the same instant were
     the defining bug of the last build. */
  function say(text, tone) {
    if (!text) return;
    note = { text: text, tone: tone || 'plain', until: now() + NOTE_MS };
  }

  function hideTag() {
    if (!tagNode) return;
    if (tagNode.classList.contains('on')) tagNode.classList.remove('on');
    if (thread.classList.contains('on')) thread.classList.remove('on');
  }

  /* hang the tag beside the thing, on a thread, and clamp it into the field.
     ax/ay are viewport px of the incident centre; rr is its radius in viewport px. */
  function place(ax, ay, rr, r) {
    var w = tagNode.offsetWidth || 230, h = tagNode.offsetHeight || 54;
    var lx = Math.round(Math.min(Math.max(ax - w / 2, r.left + 8), r.right - w - 8));
    var above = ay - rr - 16 - h;
    var below = ay + rr + 16;
    var ly;
    if (above >= r.top + 6) ly = Math.round(above);
    else if (below + h <= r.bottom - 6) ly = Math.round(below);
    else ly = Math.round(Math.min(Math.max(ay - h / 2, r.top + 6), r.bottom - h - 6));
    tagNode.style.left = lx + 'px';
    tagNode.style.top = ly + 'px';

    /* the thread leaves the tag from whichever edge faces the thing it is tied to, so a
       tag hanging beside an incident still visibly belongs to that incident and not to
       one of the others burning elsewhere */
    var cx = lx + w / 2, cy = ly + h / 2;
    var vx = ax - cx, vy = ay - cy;
    if (!vx && !vy) { thread.classList.remove('on'); return; }
    var t = Math.min(vx ? (w / 2) / Math.abs(vx) : Infinity, vy ? (h / 2) / Math.abs(vy) : Infinity);
    var tx = cx + vx * t, ty = cy + vy * t;
    var dx = ax - tx, dy = ay - ty;
    var len = Math.sqrt(dx * dx + dy * dy) - Math.min(rr * 0.6, 30);
    if (len < 6) { thread.classList.remove('on'); return; }
    thread.style.left = tx + 'px';
    thread.style.top = ty + 'px';
    thread.style.width = Math.round(len) + 'px';
    thread.style.transform = 'rotate(' + (Math.atan2(dy, dx) * 180 / Math.PI).toFixed(1) + 'deg)';
    thread.classList.add('on');
  }

  function placeLoose(r) {
    var w = tagNode.offsetWidth || 230, h = tagNode.offsetHeight || 54;
    var bh = (act && act.style.display !== 'none') ? (act.offsetHeight || 0) : 0;
    tagNode.style.left = Math.round(r.left + (r.width - w) / 2) + 'px';
    tagNode.style.top = Math.round(Math.min(r.bottom, window.innerHeight) - bh - h - 14) + 'px';
    thread.classList.remove('on');
  }

  /* ---------------------------------------------------------------- painting */
  function teachingKind(o) {
    if (!o || !ob() || !ob().answersFor) return null;
    var aa = [];
    try { aa = ob().answersFor(o.sym) || []; } catch (e) { aa = []; }
    for (var i = 0; i < aa.length; i++) if (avail.indexOf(aa[i]) > -1 && !learned[aa[i]]) return aa[i];
    return null;
  }

  function paintButtons(st, show, current) {
    if (show) {
      var want = [], set = {};
      var teach = teachingKind(current);
      if (teach) set[teach] = 1;
      else avail.forEach(function (k) { if (MARK[k]) set[k] = 1; });
      ORDER.forEach(function (k) { if (set[k]) want.push(k); });
      var changed = want.length !== have.length;
      if (!changed) for (var i = 0; i < want.length; i++) if (want[i] !== have[i]) { changed = true; break; }
      if (changed) {
        have.forEach(function (k) {
          if (set[k]) return;
          var b = made.get(k);
          if (b && b.parentNode) b.parentNode.removeChild(b);
        });
        want.forEach(function (k) {
          var b = made.get(k) || makeButton(k);
          actRow.appendChild(b);
        });
        have = want;
      }
      /* the label is scaffolding: it holds a name to the shape until the shape is known,
         and then it goes, because a learned silhouette needs no caption (AESTHETIC §5) */
      var labels = true;
      try { labels = !ob() || ob().answeredCount() < LABELS_UNTIL; } catch (e) { }
      var tight = have.length > 4;
      made.forEach(function (b, kind) {
        if (!b.parentNode) return;
        var armed = api.armed === kind;
        if (b.classList.contains('on') !== armed) b.classList.toggle('on', armed);
        b.classList.toggle('teach', teachingKind(current) === kind);
        var lab = b.querySelector('.fzf');
        if (lab) {
          lab.style.display = labels ? '' : 'none';
          var want = folk(kind, tight);
          if (lab.textContent !== want) lab.textContent = want;
        }
        if (!st) return;
        var poor = st.budget < FZ.sim.cost(kind);
        if (b.classList.contains('poor') !== poor) b.classList.toggle('poor', poor);
        var on = (kind === 'lens' && st.lensOn) || (kind === 'ledger' && st.ledgerOn) ||
          (kind === 'slow' && st.tick < st.slowUntil);
        if (b.classList.contains('live') !== on) b.classList.toggle('live', on);
      });
      if (act.style.display === 'none') act.style.display = '';
      return;
    }
    /* ABSENT, not disabled: no decision, no surface, the colony owns the screen. */
    if (act.style.display !== 'none') {
      act.style.display = 'none';
      have.forEach(function (k) { var b = made.get(k); if (b && b.parentNode) b.parentNode.removeChild(b); });
      have = [];
    }
  }

  function paint(st) {
    ensure();
    st = st || S();
    var playing = live();
    var o = playing ? burning() : null;
    if (o && st && st.tick < o.tagAt) o = null;      /* beat one: a body, and no words yet */
    if (note && now() > note.until) note = null;
    /* the incident settled itself while the instrument was in hand: put it down, or the
       surface it lives on vanishes and the next tap on the nest spends budget blind */
    if (api.armed && !o) disarm();

    paintButtons(st, !!(o && playing), o);

    /* THE ONE MESSAGE, chosen by a single priority so two can never coexist:
         1. a correction the player has just earned
         2. the instrument in her hand, and what it wants
         3. the incident that is burning
         4. nothing at all */
    var name = '', line = '', tone = '';
    if (note) { name = ''; line = note.text; tone = 'note'; }
    else if (api.armed && o) { name = o.name || ''; line = copyTool(api.armed).hint || ''; }
    else if (api.armed) { name = ''; line = copyTool(api.armed).hint || ''; }
    else if (o) { name = o.name || ''; line = o.line || ''; }

    if (!name && !line) { hideTag(); lastKey = ''; return; }

    var key = name + '' + line + '' + tone;
    if (key !== lastKey) {
      lastKey = key;
      tagName.textContent = name;
      tagName.style.display = name ? '' : 'none';
      tagLine.textContent = line;
      tagLine.style.display = line ? '' : 'none';
      tagNode.classList.toggle('note', tone === 'note');
    }

    /* the fuse is the tag's left edge. There is no other clock on screen. */
    var frac = 1;
    if (o && ob() && ob().left) { try { frac = ob().left(o); } catch (e) { frac = 1; } }
    if (tone === 'note') frac = 1;
    tagFuse.style.height = Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%';
    var hot = tone !== 'note' && frac < 0.34;
    if (tagNode.classList.contains('hot') !== hot) tagNode.classList.toggle('hot', hot);

    var r = field ? field.getBoundingClientRect() : null;
    if (o && r && r.width && st) {
      var sx = r.width / st.w, sy = r.height / st.h;
      place(r.left + o.x * sx, r.top + o.y * sy, o.r * Math.min(sx, sy), r);
    } else if (r && r.width) {
      placeLoose(r);
    }
    if (!tagNode.classList.contains('on')) tagNode.classList.add('on');
  }

  api = {
    armed: null,
    aim: null,

    build: function () {
      field = document.getElementById('field');
      ensure();
      wireField();
      var bar = document.getElementById('bar');
      if (bar) bar.innerHTML = '';
      if (FZ.bus) {
        FZ.bus.on('chapter:enter', function () { disarm(); note = null; });
        FZ.bus.on('lose', function () { disarm(); note = null; });
        FZ.bus.on('goal', function () { disarm(); note = null; });
        /* the correction is the teaching moment, and it is the ONLY thing said out loud */
        FZ.bus.on('outbreak:wrong', function (d) { if (d && d.msg) say(d.msg, 'bad'); });
      }
      paint(S());
    },

    /* ONLY these instruments are offered — and only while something is burning. */
    setAvailable: function (kinds) {
      avail = (kinds || []).filter(function (k) { return !!MARK[k]; });
      if (api.armed && avail.indexOf(api.armed) < 0) disarm();
      paint(S());
    },

    paint: paint,
    disarm: disarm,
    kinds: function () { return have.slice(); },
    isLearned: function (kind) { return !!learned[kind]; },
  };

  /* kept so nothing else in the build breaks reaching for it — but it writes into the one
     message region like everything else, never into a second strip. */
  FZ.ui = FZ.ui || {};
  FZ.ui.toast = function (msg, tone) { say(msg, tone); };

  return api;
})();

</script>
<script>
/* ===== 80-chapters.js ===== */
/* ============================================================
   80-chapters.js — THE PASSAGES.  OWNER: CHAPTERS.
   FZ.chapters = { list, start(i), next(), retry(), index, phase(), update(S) }

   Ten passages in a colony's life. Each is a setup card, a short piece of play, and
   a naming card. Nothing else. Three rules govern every line of this file:

   HANDS ON THE COLONY, FAST.  The old opening asked a stranger to watch for forty
   seconds before anything was tappable. That is the moment a stranger checks whether
   they can skip. THE COLONY is now four or five seconds long — one pass of the store
   wall filling, and out. TWO AT ONCE hands over the meeting stone the instant the
   first double claim catches, which is inside two seconds of BEGIN. From the first
   tap to the player's first real decision is now about six seconds, not forty.

   ONE IDEA AT A TIME.  The enabled set is curated per passage. TWO AT ONCE runs on
   chapter 0 plus teach:['Co'] — exactly ONE of the twenty-eight is live, so the only
   thing that can happen is the thing the passage is about. THE MEETING STONE then
   widens to the whole coordination family under that same single instrument, which
   is a different idea: one institution answers many failures.

   PLAY FIRST, NAME SECOND, AND THE GATE IS WHERE THE NAMING HAPPENS.  During play
   there is no taxonomy anywhere — the tag names a phenomenon, and that is all
   (AESTHETIC §6, CONTRACT §12.3). The moment the passage ends, this file stamps the
   phenomena the player actually witnessed with their drawn mark, their two-letter
   code and their formal name, counts how many times each was seen, and rules the
   plate teal where the player answered it and red where it landed. Then the research.
   The code is a receipt for something the player already owns.

   Every sentence here comes from FZ.copy. This file invents no English; it renders
   marks, numerals and codes, which are instrumentation.

   DELETED THIS ROUND: the whole narrator apparatus — the beat script, the queue, the
   drain, the #say strip, the six-second hold that waited for lines that no longer
   exist before it would show a gate. VOICE emptied `beats` when the narrator strip
   was abolished; this file now stops pretending to have one. There is one message
   region and CONTROLS owns it.
   ============================================================ */
window.FZ = window.FZ || {};

FZ.chapters = (function () {
  'use strict';

  var ALL6 = ['charter', 'vary', 'slow', 'lens', 'ledger', 'eject'];

  /* ---------------------------------------------------------------- scenarios
     One config per passage. Passage 5 has two: the same seed, twice, with exactly
     one difference between them. */
  var CFG = [

    /* 1 — THE COLONY.  No failures, no instruments, no reading. Four crumbs into the
       store wall and out, in about five seconds. This passage exists so the player
       knows what a crumb and a store socket ARE before anything breaks one; it is a
       held breath, not a chapter, and it must not outstay that. */
    { id: 'ch0', chapter: 0, teach: [], tools: [], table: false,
      seed: 101, speed: 1, budget: 0, collapseMax: Infinity, outbreakCap: 0,
      agents: { n: 8, hues: [0, 1, 2] },
      jobs: { n: 4, max: 4, value: 2, spawnEvery: 45 },
      goal: { jobs: 4 }, force: {} },

    /* 2 — TWO AT ONCE.  ONE element is live in the entire simulation: Co. A worker can
       now claim from anywhere, so two of them start the same crumb from opposite ends,
       and the sim guarantees the first pair at tick 40 — under a second. The meeting
       stone comes with it, because a decision the player cannot answer is not a
       decision, and because the fastest way to teach the verb of this whole game
       (put the instrument where the trouble is) is to let them do it immediately.
       Budget 4 is one stone and no slack: a right answer is refunded, a wrong place
       is not, and there is always another double claim coming. */
    { id: 'ch1', chapter: 0, teach: ['Co'], tools: ['charter'], table: false,
      seed: 202, speed: 1, budget: 4, collapseMax: Infinity, outbreakCap: 1,
      agents: { n: 7, hues: [0, 1] },
      jobs: { n: 3, max: 3, value: 9, spawnEvery: 150 },
      goal: { jobs: 3 }, force: { coordination: true, pairEvery: 140 } },

    /* 3 — THE MEETING STONE.  The same one instrument, now against the whole
       coordination family: Co Mc Ow Lo In. The new idea is not the arch, it is that
       one institution answers five different failures — and that the ground was
       empty before you built it. */
    { id: 'ch2', chapter: 2, tools: ['charter'], table: true,
      seed: 303, speed: 1, budget: 9, collapseMax: Infinity, outbreakCap: 1,
      agents: { n: 11, hues: [0, 1] },
      jobs: { n: 4, max: 4, value: 5, spawnEvery: 200 },
      goal: { jobs: 4 },
      force: { coordination: true, pairEvery: 130, lock: true, lockN: 2, overload: true } },

    /* 4 — THE STAMPEDE. Conformity feeds flooding; the brake is the answer. Narrowed to
       exactly those two elements — with the whole coordination family still live the
       arch kept answering first and the passage never taught its own lesson. */
    { id: 'ch3', chapter: 0, teach: ['Cf', 'Fl'], tools: ['slow', 'charter'], table: true,
      seed: 404, speed: 1, budget: 8, collapseMax: Infinity, outbreakCap: 1,
      agents: { n: 14, hues: [0, 1] },
      jobs: { n: 5, max: 6, value: 5, spawnEvery: 90 },
      goal: { jobs: 7 }, force: { stampede: true } },

    /* 5a — ONE FAMILY, run one. One lineage, one blind spot, no instruments. This is
       the control arm of the experiment and it is the only passage in the game where
       the player is deliberately given nothing to do, so it is kept to about ten
       seconds and the thing it is waiting for — the whole family falling over at the
       same instant — is unmissable when it lands. */
    { id: 'ch4', chapter: 0, teach: ['Mo', 'Lv', 'Sf'], tools: [], table: true,
      seed: 505, speed: 1, budget: 0, collapseMax: Infinity, outbreakCap: 0,
      agents: { n: 12 },
      jobs: { n: 5, max: 5, value: 5, spawnEvery: 200 },
      goal: { survive: 640 },
      force: { monoculture: true, poison: true, poisonN: 3 } },

    /* 6 — THE LIAR. memory. */
    { id: 'ch5', chapter: 0, teach: ['Gu', 'Tc', 'Rp', 'Cs', 'Co', 'Mc', 'In'],
      tools: ['ledger', 'charter'], table: true,
      seed: 606, speed: 1, budget: 7, collapseMax: 140, outbreakCap: 1,
      agents: { n: 12, hues: [0, 1, 2] },
      jobs: { n: 5, max: 5, value: 5, spawnEvery: 280 },
      goal: { jobs: 5 },
      force: { rumor: true, lieEvery: 340, poison: true, coordination: true, pairEvery: 280 } },

    /* 7 — THE DARK. legibility. */
    { id: 'ch6', chapter: 0, teach: ['Mm', 'Hi', 'Di', 'Si', 'Co', 'Mc', 'In'],
      tools: ['lens', 'charter'], table: true,
      seed: 707, speed: 1, budget: 7, collapseMax: 140, outbreakCap: 1,
      agents: { n: 12, hues: [0, 1, 2] },
      jobs: { n: 6, max: 6, value: 5, spawnEvery: 240 },
      goal: { jobs: 5 },
      force: { silo: true, hidden: true, poison: true, dark: true, coordination: true, pairEvery: 240 } },

    /* 8 — THE SPOIL-SPORT. the last resort. opens with the lens already lit. */
    { id: 'ch7', chapter: 0, teach: ['Sa', 'Cr', 'Tw', 'Es', 'Cl', 'Lo', 'Co', 'In'],
      tools: ['eject', 'lens', 'slow', 'charter'], table: true, openLens: true,
      seed: 808, speed: 1, budget: 9, collapseMax: 140, outbreakCap: 1,
      agents: { n: 12, hues: [0, 1, 2] },
      jobs: { n: 5, max: 5, value: 5, spawnEvery: 240 },
      goal: { jobs: 5 },
      force: { saboteur: true, advN: 1, incorrigible: true, incN: 1, rivals: true, rivalN: 2,
               churn: true, lock: true, lockN: 1 } },

    /* 9 — MACHINE SPEED. everything learned so far, accelerating. */
    { id: 'ch8', chapter: 0,
      teach: ['Sp', 'Dp', 'My', 'Pt', 'Im', 'Cf', 'Fl', 'Co', 'Mc', 'In', 'Lo'],
      tools: ['slow', 'charter', 'lens', 'vary'], table: true,
      seed: 909, speed: 1, budget: 10, collapseMax: 120, outbreakCap: 2,
      agents: { n: 14, hues: [0, 1, 2] },
      jobs: { n: 6, max: 6, value: 5, spawnEvery: 180 },
      goal: { jobs: 8 },
      force: { speed: true, speedmax: 2.6, speedrate: 700, dependency: true, myopia: true,
               stampede: true, coordination: true, pairEvery: 200 } },

    /* 10 — THE FORMICARY. all twenty-eight, all six, 117 crumbs. The sandbox is the
       reward and it arrives last, and everything learned is still true inside it. */
    { id: 'ch9', chapter: 9, all: true, tools: ALL6.slice(), table: true,
      seed: 1117, speed: 1.15, budget: 8, collapseMax: 100, outbreakCap: 3,
      agents: { n: 16, hues: [0, 0, 0, 0, 0, 0, 0, 1] },
      jobs: { n: 8, max: 9, value: 5, spawnEvery: 40 },
      goal: { jobs: 117 },
      force: {
        coordination: true, pairEvery: 230, stampede: true, poison: true, poisonN: 2,
        rumor: true, lieEvery: 520, saboteur: true, advN: 1, lock: true, lockN: 2,
        dependency: true, silo: true, hidden: true, overload: true,

  var AB_SEED = CFG[4].seed;

  var ZERO_CFG = {

    goal: {},

       is force-injected. Coordination failures must emerge from the same local rules. */

  };

  var idx = 0, run = 0, phase = 'gate';
  var pending = null, pendAt = 0;
  var witness = {}, ansd = {}, hit = {};   /* what the player saw, answered, was hit by */
  var used = {};                           /* instruments spent this run */
  var sfHit = 0;                           /* workers taken down together this run */
  var abFires = [0, 0];
  var abTries = 0;                         /* re-offers of the re-run, so it cannot loop */
  var counteredEver = {};
  var mode = 'manual', autoSeen = {}, autoTimer = 0;

  FZ.clock = FZ.clock || (function () {

  var wired = false, built = false;

  /* ------------------------------------------------------------ the naming
     THE PAYOFF, not an interruption. The player has just spent thirty seconds
     watching a phenomenon and answering it by its body. Here it gets its drawn
     mark, its scientific code and its formal name — and a count of how many times
     it happened to this particular colony. The rule down the left edge is the
     verdict: teal where she answered it, red where it landed on her. */
  function witnessed() {
    var out = [], s, e;
    for (s in witness) {
      e = FZ.ELBY ? FZ.ELBY[s] : null;

      out.push({ e: e, n: witness[s], ok: !!ansd[s], hit: !!hit[s] });
    }
    out.sort(function (a, b) { return (b.ok - a.ok) || (b.n - a.n); });
    return out.slice(0, 3);
  }

    row.appendChild(el('span', 'npv', String(r.n)));

  }

  /* the head is VOICE's 'WHAT THAT WAS'. It sits over the plate, because the plate IS

  /* ------------------------------------------------------------------ ending */
  function postmortem(inn) {
    var live = [];
    for (var i = 0; i < FZ.EL.length; i++) {
      var e = FZ.EL[i];
      if (!FZ.sim.enabled.has(e.sym) || !e.fires) continue;
      live.push(e);
    }
    live.sort(function (a, b) { return b.fires - a.fires; });
    if (live.length) {
      inn.appendChild(el('div', 'gtHead', (FZ.copy.end && FZ.copy.end.postTitle) || ''));
      var l1 = el('div', 'gtList');
      live.slice(0, 5).forEach(function (e) { l1.appendChild(pmRow(e, e.fires)); });
      inn.appendChild(l1);

       ungoverned run answers nothing, so the two are identical and one of them is noise. */
    var never = live.filter(function (e) { return !counteredEver[e.sym]; });
    var top = never.slice(0, 5);

      inn.appendChild(el('div', 'gtTitle', 'START FROM NOTHING'));
      inn.appendChild(el('div', 'gtSub', 'One queen. Six workers. Seven eggs. A little food. Everything else has to be made.'));
      inn.appendChild(el('div', 'gtWin', 'Start with a queen, six workers, brood, a little stored carbohydrate and protein, and one hole in the ground. Nothing edible pops into the nest. Outside resources arrive as physical events: fruit, seeds, crumbs, sugar and carcasses fall, bounce, roll on slopes, settle, smell downwind, get cut or drunk, and leave residue. Liquid sugar returns in an ant\'s crop; solid pieces return in its mandibles. Larvae preferentially consume protein.'));
      box.appendChild(inn);
      box.appendChild(gateBtn('FOUND THE COLONY', function () { startOpenZero(); }));
      box.appendChild(gateBtn('BACK', function () { openGate(0); }, true));
    });
  }

  function startOpenZero() {
    buildChrome(); wire();
    mode = 'open'; idx = CFG.length - 1; run = 0; api.index = idx;
    pending = null; used = {}; witness = {}; ansd = {}; hit = {}; counteredEver = {}; autoSeen = {};
    /* Each open ecology gets a fresh world-seed. The sim remains deterministic once the
       seed is assigned, but OPEN ZERO is not the same replay every time you enter it. */
    ZERO_CFG.seed = (((Date.now() & 0x7fffffff) ^ ((performance.now() * 1000) | 0)) >>> 0) || 1701;
    FZ.sim.reset(ZERO_CFG);
    if (FZ.table) { FZ.table.close && FZ.table.close(); FZ.table.setEnabled(FZ.sim.enabled); }
    if (FZ.controls) FZ.controls.setAvailable(ZERO_CFG.tools || []);
    if (FZ.outbreak && FZ.outbreak.reset) FZ.outbreak.reset(ZERO_CFG);
    if (app) { app.classList.toggle('noTable', false); app.classList.toggle('noBar', false); }
    if (titleEl) titleEl.textContent = '';
    if (countEl) countEl.textContent = ui('modeOpen');
    if (rail) for (var k = 0; k < rail.children.length; k++) rail.children[k].className = 'pg';
    stripFor(ZERO_CFG); hideGate(); phase = 'play';
    FZ.bus.emit('chapter:enter', { index: -1, cfg: ZERO_CFG, open: true });
  }

  function autoIntervene(S) {
    if (mode !== 'auto' || !FZ.outbreak || !FZ.outbreak.urgent || !FZ.outbreak.answersFor) return;
    var o = FZ.outbreak.urgent();
    if (!o || autoSeen[o.id] || S.tick - (o.born || 0) < 52) return;
    var aa = FZ.outbreak.answersFor(o.sym) || [], kind = null;
    for (var i = 0; i < aa.length; i++) {
      if (S.tools.indexOf(aa[i]) < 0) continue;
      if (S.budget < FZ.sim.cost(aa[i])) continue;
      kind = aa[i]; break;
    }
    if (!kind) return;
    var x = o.x, y = o.y;
    if (kind === 'eject') {
      var ids = o.who || [], target = null;
      for (i = 0; i < ids.length; i++) {
        var z = S.agents.find(function (a) { return a.id === ids[i]; });
        if (z && (z.adversary || !z.corrigible)) { target = z; break; }
      }
      if (!target) target = S.agents.find(function (a) { return a.adversary || !a.corrigible; });
      if (!target) return;
      x = target.x; y = target.y;
    }
    /* Match the player's real action path: diagnose first, then spend. OUTBREAK keeps
       that pending judgement and resolves it when SIM emits the intervention receipt. */
    if (FZ.outbreak.tryAnswer) {
      try { FZ.outbreak.tryAnswer(kind, x, y); } catch (e) { }
    }
    var r = FZ.sim.apply(kind, x, y);
    if (!r || r.ok !== false) autoSeen[o.id] = 1;
  }

  function autoAdvance(fn, ms) {
    if (mode !== 'auto') return;
    clearTimeout(autoTimer);
    autoTimer = setTimeout(function () { if (mode === 'auto') fn(); }, ms || 2200);
  }

  /* --------------------------------------------------------------- lifecycle */
  function wire() {
    if (wired) return;
    wired = true;
    /* WHAT THE PLAYER ACTUALLY WITNESSED. Counted here, per run, from the live
       simulation — never asserted. The gate can only name what really happened. */
    FZ.bus.on('fire', function (d) {
      if (!d || !d.sym || phase !== 'play') return;
      witness[d.sym] = (witness[d.sym] || 0) + 1;
      /* the re-run counts bodies: how many workers one synchronized failure takes
         down at the same instant is the whole difference between the two runs. */
      if (idx === 4 && d.sym === 'Sf') sfHit += (d.who && d.who.length) || 1;
    });
    FZ.bus.on('outbreak:answered', function (d) { if (d && d.sym) ansd[d.sym] = 1; });
    FZ.bus.on('outbreak:landed', function (d) { if (d && d.sym) hit[d.sym] = 1; });
    FZ.bus.on('intervene', function (d) {
      if (!d || !d.ok || !d.kind) return;
      used[d.kind] = (used[d.kind] || 0) + 1;
    });
    FZ.bus.on('goal', function () { if (phase === 'play' && mode !== 'open') won(); });
    FZ.bus.on('lose', function (d) {
      if (phase !== 'play') return;
      if (mode === 'open') {
        phase = 'result';
        showGate(function (box) {
          var inn = el('div', 'gtIn');
          inn.appendChild(el('div', 'gtNum', ui('modeOpen')));
          inn.appendChild(el('div', 'gtTitle', ui('openEnded')));
          inn.appendChild(el('div', 'gtWin', (FZ.copy.fire && FZ.copy.fire[d && d.why]) || ''));
          box.appendChild(gateBtn(ui('again'), function () { startOpenZero(); }));
          box.appendChild(gateBtn(ui('manual'), function () { mode = 'manual'; api.start(0); }, true));
        }, 'bad');
        return;
      }
      lost(d && d.why);
    });
  }

  function begin(i, r) {
    buildChrome();
    wire();
    idx = i; run = r || 0; api.index = i;
    var cfg = cfgFor(i, run);

    pending = null;
    autoSeen = {};
    used = {};
    witness = {}; ansd = {}; hit = {};
    sfHit = 0;
    counteredEver = {};
    FZ.sim.reset(cfg);
    if (FZ.table) { FZ.table.close && FZ.table.close(); FZ.table.setEnabled(FZ.sim.enabled); }
    if (FZ.controls) FZ.controls.setAvailable(cfg.tools || []);
    if (FZ.outbreak && FZ.outbreak.reset) FZ.outbreak.reset(cfg);

    if (app) {
      app.classList.toggle('noTable', cfg.table === false);
      app.classList.toggle('noBar', !(cfg.tools || []).length);
    }
    if (titleEl) titleEl.textContent = C(i).title || '';
    if (countEl) countEl.textContent = FZ.copy.ui.chapterOf(i + 1, CFG.length);
    railTo(i);
    stripFor(cfg);

    hideGate();
    phase = 'play';

    /* passage 8 opens with the lantern already lit — the copy assumes you can see */
    if (cfg.openLens) FZ.sim.apply('lens');

    FZ.bus.emit('chapter:enter', { index: i, cfg: cfg });
  }

  /* the world freezes on the deciding frame long enough to be read, then the paper
     comes down. No queue, no narrator, no six-second wait for lines that do not exist. */
  function after(fn) { pending = fn; pendAt = performance.now(); }

  function won() {
    phase = 'result';
    if (idx === 4) {
      abFires[run] = sfHit;
      if (run === 0) { after(rerunGate); return; }
      /* the re-run only teaches if the one difference was actually spent. If it was
         not, this was the same run twice and there is nothing to compare — offer it
         again rather than showing an empty comparison. */
      if (!used.vary && abTries < 2) { abTries++; after(rerunGate); return; }
      after(afterGate);
      return;
    }
    if (idx >= CFG.length - 1) { after(function () { endGate(true); }); return; }
    after(function () { winGate(idx); });
  }

  function lost(why) {
    phase = 'result';
    if (idx >= CFG.length - 1) { after(function () { endGate(false); }); return; }
    after(function () { loseGate(why || 'In'); });
  }

  api = {
    list: CFG.map(function (c, i) { return { cfg: c, script: [] }; }),
    index: 0,
    phase: function () { return phase; },
    mode: function () { return mode; },
    openZero: function () { startOpenZero(); },
    auto: function (on) { mode = on === false ? 'manual' : 'auto'; if (mode === 'auto' && phase === 'gate') begin(idx, 0); },

    start: function (i) {
      buildChrome();
      wire();
      if (mode === 'open') mode = 'manual';
      i = Math.max(0, Math.min(CFG.length - 1, i | 0));
      idx = i; run = 0; api.index = i;
      pending = null;
      witness = {}; ansd = {}; hit = {};
      if (i !== 4) abTries = 0;
      var cfg = CFG[i];
      /* the gate is shown over a world that is already correct behind it */
      FZ.sim.reset(cfg);
      /* and over a world with nothing left burning in it. Without this the previous
         passage's live outbreak survives into the gate: FIELD keeps drawing a ring for
         an incident in a colony that no longer exists, and the field guide — which by
         contract may never open while something burns — can never be opened again for
         the rest of the run, including at the between-episode moment it exists for. */
      if (FZ.outbreak && FZ.outbreak.reset) FZ.outbreak.reset(cfg);
      if (FZ.table) { FZ.table.close && FZ.table.close(); FZ.table.setEnabled(FZ.sim.enabled); }
      if (FZ.controls) FZ.controls.setAvailable([]);
      if (app) {
        app.classList.toggle('noTable', cfg.table === false);
        app.classList.toggle('noBar', true);
      }
      if (titleEl) titleEl.textContent = C(i).title || '';
      if (countEl) countEl.textContent = FZ.copy.ui.chapterOf(i + 1, CFG.length);
      railTo(i);
      stripFor(cfg);
      openGate(i);
    },

    next: function () {
      if (idx >= CFG.length - 1) { api.start(idx); return; }
      api.start(idx + 1);
    },
    retry: function () { begin(idx, run); },

    /* called once per frame by the boot loop, after the sim has stepped */
    update: function (S) {
      api.index = idx;
      if (built) paintStrip(S);
      if (phase === 'play') {
        for (var i = 0; i < FZ.EL.length; i++) {
          var e = FZ.EL[i];
          if (e.countered && FZ.sim.enabled.has(e.sym)) counteredEver[e.sym] = 1;
        }
        if (mode === 'auto' && S.tick % 12 === 0) autoIntervene(S);
      }
      if (pending && performance.now() - pendAt > SETTLE) {
        var f = pending; pending = null; f();
      }
    },
  };
  return api;
})();

</script>
<script>
/* ===== 90-boot.js ===== */
/* ============================================================
   90-boot.js — wiring.  OWNER: CHAPTERS.
   Sizes the field, builds the parts that exist, runs the single rAF loop
   (the only caller of FZ.sim.step()), and opens chapter 0.
   Every call is guarded so a partial build still boots and still draws.
   ============================================================ */
(function () {
  'use strict';

  var stage, canvas, crown, lastW = 0, lastH = 0;
  /* Rendering can be 60/90/120 Hz; the colony's clock is 30 Hz. One simulation second is
     now a human-readable second instead of "whatever this screen refreshes at." */
  var SIM_MS = 1000 / 30, simLast = 0, simAcc = 0;

  function applySize(w, h) {
    lastW = w; lastH = h;
    if (FZ.sim && FZ.sim.state) { FZ.sim.state.w = w; FZ.sim.state.h = h; }
    if (FZ.render && FZ.render.resize) { try { FZ.render.resize(w, h); } catch (e) { console.error(e); } }
  }

  /* The canvas box is laid out by CSS (flex-basis 0), so its own measurement is the
     truth: the sim field and the bitmap must be exactly the box the player sees, or the
     drawing is squashed and a tap lands somewhere other than where it looked. The stage
     arithmetic is only a fallback for before first layout. */
  function sizeField() {
    if (!stage || !canvas) return;
    var w = Math.round(canvas.clientWidth);
    var h = Math.round(canvas.clientHeight);
    if (w < 40 || h < 40) {
      w = Math.round(stage.clientWidth);
      h = Math.round(stage.clientHeight);
    }
    w = Math.max(160, w); h = Math.max(120, h);
    if (w === lastW && h === lastH) return;
    applySize(w, h);
  }

  function boot() {
    stage = document.getElementById('stage');
    canvas = document.getElementById('field');
    crown = document.getElementById('crown');

    if (FZ.render && FZ.render.init && canvas) { try { FZ.render.init(canvas); } catch (e) { console.error(e); } }
    sizeField();
    if (FZ.table && FZ.table.build) { try { FZ.table.build(); } catch (e) { console.error(e); } }
    if (FZ.controls && FZ.controls.build) { try { FZ.controls.build(); } catch (e) { console.error(e); } }

    window.addEventListener('resize', sizeField, { passive: true });
    window.addEventListener('orientationchange', function () { setTimeout(sizeField, 220); });
    /* observe the canvas, not only the stage: the crown growing to a second line
       shrinks the field without changing the stage at all. */
    if (window.ResizeObserver) {
      try {
        var ro = new ResizeObserver(sizeField);
        if (stage) ro.observe(stage);
        if (canvas) ro.observe(canvas);
        if (crown) ro.observe(crown);
      } catch (e) { }
    }
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

    if (FZ.chapters && FZ.chapters.start) { try { FZ.chapters.start(0); } catch (e) { console.error(e); } }

    requestAnimationFrame(frame);
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    var S = FZ.sim && FZ.sim.state;
    if (!S) return;

    var playing = !FZ.chapters || !FZ.chapters.phase || FZ.chapters.phase() === 'play';
    if (!simLast) simLast = ts || performance.now();
    var dt = Math.min(120, Math.max(0, (ts || performance.now()) - simLast));
    simLast = ts || performance.now();
    /* Time acceleration multiplies elapsed wall time entering the fixed-step accumulator.
       A 4× run therefore executes the same 30 Hz tick sequence four times faster; it does
       NOT multiply per-tick ant velocity or pheromone strength and therefore does not alter
       the model simply because the observer is impatient. */
    var clockScale = (FZ.clock && FZ.clock.scale) || 1;
    simAcc += dt * clockScale;

    try {
      if (playing && !S.gameOver && FZ.sim.step) {
        var guard = 0;
        while (simAcc >= SIM_MS && guard++ < 24) {
          FZ.sim.step();
          if (FZ.outbreak && FZ.outbreak.update) FZ.outbreak.update(S);
          simAcc -= SIM_MS;
        }
      } else simAcc = Math.min(simAcc, SIM_MS);
    } catch (e) { console.error(e); }

    try { if (FZ.chapters && FZ.chapters.update) FZ.chapters.update(S); } catch (e) { console.error(e); }
    try { if (FZ.controls && FZ.controls.paint) FZ.controls.paint(S); } catch (e) { console.error(e); }
    try { if (FZ.table && FZ.table.paint) FZ.table.paint(S); } catch (e) { console.error(e); }
    try { if (FZ.render && FZ.render.draw) FZ.render.draw(S); } catch (e) { console.error(e); }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
