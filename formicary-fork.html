/* ============================================================
   window.__FZ — the test surface
   ============================================================ */
(function () {
  const S = FZ.sim.state;

  FZ.bus.on('say', d => { if (d && d.text) S.narrator = d.text; });

  function sandboxCfg() {
    if (FZ.chapters && FZ.chapters.list && FZ.chapters.list.length) {
      const last = FZ.chapters.list[FZ.chapters.list.length - 1];
      if (last && last.cfg) return last.cfg;
    }
    return FZ.sim.defaults[FZ.sim.defaults.length - 1];
  }

  function bodyCensus() {
    const P = {}, J = S.jobs, A = S.agents;
    let queued = 0, tugging = 0, jam = 0, trail = 0, dark = 0, rot = 0, unmake = 0, hazard = 0;
    for (let i = 0; i < A.length; i++) P[A[i].posture] = (P[A[i].posture] || 0) + 1;
    for (let i = 0; i < J.length; i++) {
      const j = J[i];
      queued += j.queue.length;
      if (j.tug.length > 1) tugging++;
      if (j.crowd > jam) jam = j.crowd;
      if (j.trail > trail) trail = j.trail;
      if (j.dark > 0.7) dark++;
      if (j.rot > 0.4) rot++;
      if (j.unmake > 0.2) unmake++;
      if (j.hazard) hazard++;
    }
    return {
      posture: P, queued: queued, tugging: tugging, jam: jam,
      trail: +trail.toFixed(2), dark: dark, rot: rot, unmake: unmake, hazard: hazard,
      column: S.column ? S.column.ids.length : 0,
      lineage: S.lineage.map(l => l.n),
      scars: S.scars.length, works: S.works.length,
      weather: { frantic: +S.weather.frantic.toFixed(2), dark: +S.weather.dark.toFixed(2),
                 crowd: +S.weather.crowd.toFixed(2), scarce: +S.weather.scarce.toFixed(2) },
    };
  }

  function probe() {
    const hot = FZ.EL.filter(e => FZ.sim.enabled.has(e.sym))
      .slice().sort((a, b) => b.heat - a.heat).slice(0, 6)
      .map(e => ({ sym: e.sym, heat: +e.heat.toFixed(3), fires: e.fires }));
    return {
      chapter: FZ.chapters ? FZ.chapters.index : S.chapterIndex,
      tick: S.tick, jobsDone: S.jobsDone, jobsGoal: S.jobsGoal,
      budget: S.budget, collapse: +S.collapse.toFixed(1),
      /* what the misses have cost that cannot be undone by playing well from here */
      scar: +S.scar.toFixed(1), missed: S.stat.missed, answered: S.stat.answered,
      agents: S.agents.length, jobs: S.jobs.length,
      infrastructure: { nodes: S.infra.nodes.length, edges: S.infra.edges.length,
        dug: S.infra.edges.filter(e => e.dug >= 0.999).length,
        scented: S.infra.edges.filter(e => (e.foodTrail || 0) > 0.01).length,
        digging: S.agents.filter(a => a.digging).length },
      hot: hot,
      strain: S.strainTop.map(s => s.sym),
      /* the three trade-off dials, for tooling and for FIELD */
      trustBias: +S.trustBias.toFixed(2), ownership: +S.ownership.toFixed(2),
      aggro: +S.aggro.toFixed(2), speedMul: +S.speedMul.toFixed(2),
      conflict: { force: S.stat.force, passivity: S.stat.passivity, truce: S.stat.truce, unsettled: S.stat.unsettled },
      /* THE BODIES, as a census: proof the failures are things happening on the field and
         not numbers in a table. If `queued` is zero while Lo is hot, the body is missing. */
      bodies: bodyCensus(),
      enabled: Array.from(FZ.sim.enabled),
      tools: S.tools.slice(),
      gameOver: S.gameOver, won: S.won,
      narrator: S.narrator || '',
    };
  }

  function goto(i) {
    if (FZ.chapters && FZ.chapters.start) { FZ.chapters.start(i); return probe(); }
    FZ.sim.reset(FZ.sim.defaults[Math.max(0, Math.min(FZ.sim.defaults.length - 1, i | 0))]);
    return probe();
  }

  /* free application of a counter, for measurement only — exactly what the tool does */
  function forceCounter(tool) {
    if (tool === 'charter') {
      S.charters.length = 0;
      for (let x = 0; x <= S.w; x += 120) for (let y = 0; y <= S.h; y += 120) S.charters.push({ x: x, y: y, r: 200 });
    } else if (tool === 'lens') { S.lensUntil = 1e9; S.lensOn = true; S.bl = {}; S.jobs.forEach(j => { j.revealed = true; j.shun = 0; }); }
    else if (tool === 'ledger') { S.ledgerUntil = 1e9; S.ledgerOn = true; }
    else if (tool === 'slow') { S.slowUntil = 1e9; }
    else if (tool === 'vary') { S.agents.forEach((a, i) => { if (a.corrigible) a.hue = i % 4; }); S.varyUntil = 1e9; }
    else if (tool === 'eject') {
      for (let i = S.agents.length - 1; i >= 0; i--) {
        const a = S.agents[i];
        if (a.adversary || !a.corrigible) S.agents.splice(i, 1);
      }
    }
  }

  /* ---------------- a competent player, for balance checking ----------------
     Reads the strain readout, buys the instrument that answers whatever is hottest, and
     puts it where that failure is happening. This is the standard ch9 has to be winnable
     against — and ungoverned, ch9 has to be losable. Both are asserted in the audit notes. */
  function playWell() {
    const hot = S.strainTop.length ? FZ.ELBY[S.strainTop[0].sym] : null;
    if (!hot) return;
    const kinds = hot.answers.filter(k => S.tools.indexOf(k) > -1 && S.budget >= FZ.sim.cost(k));
    if (!kinds.length) return;
    const kind = kinds[0];
    let x = S.w / 2, y = S.h / 2;
    if (kind === 'eject') {
      const a = S.agents.find(z => z.adversary) || S.agents.find(z => !z.corrigible);
      if (!a) return;
      x = a.x; y = a.y;
    } else if (kind === 'charter') {
      /* over the busiest contested job, or the busiest worker cluster */
      let best = null, bn = 0;
      for (let i = 0; i < S.jobs.length; i++) {
        const j = S.jobs[i];
        if (!j.done && j.claims.size > bn) { bn = j.claims.size; best = j; }
      }
      if (best) { x = best.x; y = best.y; }
    } else if (kind === 'vary') {
      let sx = 0, sy = 0, n = 0;
      for (let i = 0; i < S.agents.length; i++) {
        if (S.agents[i].hue !== S._g.topHue) continue;
        sx += S.agents[i].x; sy += S.agents[i].y; n++;
      }
      if (n) { x = sx / n; y = sy / n; }
    }
    FZ.sim.apply(kind, x, y);
  }

  function autoPlay(n) {
    const kinds = S.tools;
    if (!kinds.length) return;
    const k = kinds[n % kinds.length];
    const x = 40 + FZ.sim._rnd() * (S.w - 80), y = 40 + FZ.sim._rnd() * (S.h - 80);
    if (k === 'eject') {
      const a = S.agents.find(z => z.adversary || !z.corrigible);
      if (a) FZ.sim.apply('eject', a.x, a.y);
    } else FZ.sim.apply(k, x, y);
  }

  /* ============================================================
     __FZ.balance() — THE GAME, MEASURED THROUGH THE GAME.

     Round-2 verdict on the old numbers: "measured with the core loop switched off
     entirely, so they describe a game nobody plays." So this harness runs the REAL loop:
     FZ.sim.step() and then FZ.outbreak.update() every tick, exactly as 90-boot.js does,
     with a synthetic player who reads the burning incident, waits a human beat, and
     answers correctly a given fraction of the time. Everything else — the fuse, the
     damage, the refund, the scar — is the shipped code path.

     It reports, per accuracy p: whether the run survived, and the band strain lived in.
     The target set by the critic: p=0.7 survives with strain oscillating 30–70; p=0.5
     loses outright.

     Two things are borrowed and put back: the mastery ledger (the harness must not mark
     plates the player never answered) and FZ.chapters.phase, which the incident layer
     checks before opening. Both are restored in the finally.
     ============================================================ */
  function balance(opts) {
    opts = opts || {};
    const ps = opts.ps || [1, 0.85, 0.7, 0.5, 0.3, 0];
    const seeds = opts.seeds || [8821, 33417, 55221, 7];
    const ticks = opts.ticks || 14000;
    /* the sandbox by default; opts.chapter measures any teaching chapter the same way,
       against its own goal, so "is chapter 5 winnable at 70%" is a question with a number */
    let base = sandboxCfg();
    if (opts.chapter != null && FZ.chapters && FZ.chapters.list && FZ.chapters.list[opts.chapter]) {
      base = FZ.chapters.list[opts.chapter].cfg;
    }
    const cfg = opts.chapter != null ? base : Object.assign({}, base, { goal: { jobs: 1e9 } });
    const OB = FZ.outbreak;
    if (!OB) return [{ note: 'no outbreak layer' }];

    /* ---- borrow ---- */
    const keep = {};
    try {
      if (window.localStorage) for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.indexOf('formicary') === 0) keep[k] = window.localStorage.getItem(k);
      }
    } catch (e) { /* private mode: nothing to protect */ }
    const heldMastery = JSON.stringify(OB.mastery || {});
    const heldChapters = FZ.chapters;
    FZ.chapters = { phase: function () { return 'play'; } };
    S._silent = 'loop';                       /* only `fire` and `intervene` get through */

    /* the player's hand: the right instrument for this incident, if she owns it */
    function rightTool(o) {
      const A = (o.answers || []).slice(), T = S.tools;
      for (let i = 0; i < A.length; i++) if (T.indexOf(A[i]) > -1 && S.budget >= FZ.sim.cost(A[i])) return A[i];
      return null;
    }
    function wrongTool(o) {
      const A = o.answers || [], T = S.tools;
      for (let i = 0; i < T.length; i++) if (A.indexOf(T[i]) < 0 && S.budget >= FZ.sim.cost(T[i])) return T[i];
      return null;
    }
    /* an expulsion has to name the body, exactly as the player must find it on the field */
    function bodyFor(o) {
      let a = null;
      if (o.who && o.who.length) a = S.agents.find(z => z.id === o.who[0]);
      if (!a) a = S.agents.find(z => z.adversary) || S.agents.find(z => !z.corrigible) ||
                  S.agents.find(z => z.locker) || S.agents.find(z => z.churner);
      return a;
    }
    function answer(o, correct) {
      const kind = correct ? rightTool(o) : wrongTool(o);
      if (!kind) return false;
      let x = o.x, y = o.y;
      if (kind === 'eject') { const b = bodyFor(o); if (!b) return false; x = b.x; y = b.y; }
      OB.tryAnswer(kind, x, y);               /* CONTROLS calls this first, then apply */
      FZ.sim.apply(kind, x, y);
      return true;
    }

    const out = [];
    try {
      for (let pi = 0; pi < ps.length; pi++) {
        const p = ps[pi];
        let lost = 0, won = 0, sumEnd = 0, sumMean = 0, lo = 1e9, hi = -1e9, banked = 0;
        let miss = 0, ans = 0, scarEnd = 0;
        for (let k = 0; k < seeds.length; k++) {
          FZ.sim.reset(Object.assign({}, cfg, { seed: seeds[k] }));
          OB.reset(cfg);
          let acted = 0, n = 0, sum = 0, mn = 1e9, mx = -1e9;
          /* ONE COMMITMENT PER INCIDENT. A player reads the body, picks an instrument and
             lives with it; she does not machine-gun all six until one sticks. Without this
             the harness quietly answers everything at any p, and reports a game that is
             not the game — which is how the previous round's numbers came out flattering. */
          const done = {};
          for (let i = 0; i < ticks && !S.gameOver; i++) {
            FZ.sim.step();
            OB.update(S);
            /* a human beat: she does not answer the instant it opens, and she cannot
               answer more often than she can move a thumb */
            const o = OB.current();
            if (o && !done[o.id] && S.tick - acted > 34 && S.tick - o.born > 45) {
              done[o.id] = 1;
              if (FZ.sim._rnd() < p) { if (answer(o, true)) acted = S.tick; }
              else if (FZ.sim._rnd() < 0.5) { if (answer(o, false)) acted = S.tick; }
              /* the rest of the time she simply does not get there, and it lands */
            }
            if (i > 600) { n++; sum += S.collapse; if (S.collapse < mn) mn = S.collapse; if (S.collapse > mx) mx = S.collapse; }
          }
          if (S.gameOver && !S.won) lost++;
          if (S.won) won++;
          sumEnd += S.collapse; sumMean += n ? sum / n : 0;
          if (mn < lo) lo = mn; if (mx > hi) hi = mx;
          banked += S.jobsDone; miss += S.stat.missed; ans += S.stat.answered;
          scarEnd += S.scar;
        }
        const nS = seeds.length;
        out.push({
          p: p, lost: lost, won: won, of: nS,
          mean: +(sumMean / nS).toFixed(1),
          band: [Math.round(lo), Math.round(hi)],
          end: +(sumEnd / nS).toFixed(1),
          scar: +(scarEnd / nS).toFixed(1),
          answered: Math.round(ans / nS), missed: Math.round(miss / nS),
          jobs: Math.round(banked / nS),
        });
      }
    } finally {
      S._silent = false;
      FZ.chapters = heldChapters;
      /* put the ledger back exactly as it was */
      try {
        const m = OB.mastery;
        for (const k in m) delete m[k];
        const held = JSON.parse(heldMastery);
        for (const k in held) m[k] = held[k];
        if (window.localStorage) {
          for (let i = window.localStorage.length - 1; i >= 0; i--) {
            const k = window.localStorage.key(i);
            if (k && k.indexOf('formicary') === 0 && !(k in keep)) window.localStorage.removeItem(k);
          }
          for (const k in keep) window.localStorage.setItem(k, keep[k]);
        }
      } catch (e) { }
      OB.reset(cfg);
      FZ.sim.reset(cfg);
    }
    return out;
  }

  /* ============================================================
     __FZ.tradeoffs() — THE PROOF THAT §15 IS IMPLEMENTED AND NOT ASSERTED.
     For each claim: run the SAME seeds twice, instrument off and instrument on, and
     report that the element the instrument is for went DOWN and the element it is paid
     for in went UP. A trade-off that does not measure is not implemented.
     ============================================================ */
  function tradeoffs(opts) {
    opts = opts || {};
    const WARM = opts.warm || 500, RUN = opts.ticks || 2200;
    const SEED3 = opts.seeds || [880011, 24601, 133742];
    /* Mc is a rare high-amplitude event, so its claim needs a bigger sample than the
       continuous ones do. Eight seeds and a longer window, or the answer is just noise. */
    const SEED8 = SEED3.concat([70707, 314159, 42424, 99991, 555]);
    const LONG = 4000;
    const base = sandboxCfg();
    function cfg(extra, forceExtra) {
      const c = Object.assign({}, base, { collapseMax: Infinity, budget: 0, tools: [] }, extra || {});
      c.force = Object.assign({}, base.force || {}, forceExtra || {});
      c.goal = { jobs: 1e9 };
      return c;
    }
    /* an isolated world, built from scratch rather than from the sandbox, for the claims
       that need one specific failure to be reliably observable rather than everything at once */
    function iso(agents, jobs, force) {
      return { id: 'ch9', all: true, tools: [], budget: 0, collapseMax: Infinity,
               speed: 1, goal: { jobs: 1e9 }, agents: agents, jobs: jobs, force: force };
    }
    function measure(conf, arm, syms, seeds, ticks) {
      const SEEDS = seeds || SEED3, RUNT = ticks || RUN;
      const acc = {}, fires = {}, sum = { done: 0, aggr: 0, own: 0 };
      syms.forEach(s => { acc[s] = 0; fires[s] = 0; });
      for (let k = 0; k < SEEDS.length; k++) {
        FZ.sim.reset(Object.assign({}, conf, { seed: SEEDS[k] }));
        for (let i = 0; i < WARM; i++) FZ.sim.step();
        if (arm) arm();
        const d0 = S.stat.done;
        syms.forEach(s => fires[s] -= FZ.ELBY[s].fires);
        let ownSum = 0, siloSum = 0;
        for (let i = 0; i < RUNT; i++) {
          FZ.sim.step();
          ownSum += S.ownership;
          /* Si's own trigger condition, counted directly: what share of the open work is
             known to less than a third of the colony. Si's HEAT saturates near 1 as soon as
             two jobs are stale, so the heat alone cannot show siloing getting worse. */
          const open = S._g.open;
          if (open.length) {
            let dark = 0;
            for (let m = 0; m < open.length; m++) if (open[m].knownBy / Math.max(1, S._g.n) <= 0.3) dark++;
            siloSum += dark / open.length;
          }
          for (let m = 0; m < syms.length; m++) acc[syms[m]] += FZ.ELBY[syms[m]].heat;
        }
        /* throughput is work COMPLETED, not the banked count — sabotage rolls that back,
           and rolling it back is aggression, which is the other half of this claim */
        sum.done += S.stat.done - d0;
        sum.own += ownSum / RUNT;
        sum.silo = (sum.silo || 0) + siloSum / RUNT;
        sum.aggr += S.stat.force + S.stat.lockouts + S.stat.sabotage + S.stat.esc;
        syms.forEach(s => fires[s] += FZ.ELBY[s].fires);
      }
      const n = SEEDS.length;
      const out = {
        done: +(sum.done / n).toFixed(1), aggr: +(sum.aggr / n).toFixed(1),
        own: +(sum.own / n).toFixed(3), silo: +((sum.silo || 0) / n).toFixed(3), fires: fires,
      };
      syms.forEach(s => out[s] = +(acc[s] / (RUNT * n)).toFixed(4));
      return out;
    }
    function claim(name, instrument, offConf, offArm, onConf, onArm, down, up, seeds, ticks) {
      const syms = down.concat(up);
      const off = measure(offConf, offArm, syms, seeds, ticks);
      const on = measure(onConf, onArm, syms, seeds, ticks);
      const rows = [];
      let pass = true;
      down.forEach(s => {
        /* you cannot measure the suppression of something that never lit. Say so rather
           than scoring it, exactly as counterWorks returns null in the same situation. */
        if (off[s] < 0.004) {
          rows.push({ sym: s, want: 'dark in this window', off: off[s], on: on[s], ok: true });
          return;
        }
        const ok = on[s] < off[s] * 0.9;
        if (!ok) pass = false;
        rows.push({ sym: s, want: 'down', off: off[s], on: on[s], ok: ok });
        rows.push({ sym: s + ' fires', want: 'down', off: off.fires[s], on: on.fires[s], ok: on.fires[s] < off.fires[s] });
      });
      up.forEach(s => {
        const ok = on[s] > off[s] * 1.1;
        if (!ok) pass = false;
        rows.push({ sym: s, want: 'up', off: off[s], on: on[s], ok: ok });
      });
      return { claim: name, instrument: instrument, pass: pass, rows: rows, offDone: off.done, onDone: on.done };
    }

    const plain = cfg();
    /* The ownership claim needs a colony that can actually collide and merge: mixed lineages
       (a merge conflict needs two of them), a working grapevine (so cutting it costs), and
       enough forced pairs that Mc is common in the baseline. Everything else is off, so what
       is being measured is the ownership response and nothing else. */
    const merge = iso({ n: 12, hues: [0, 1, 2] }, { n: 10, max: 10, value: 3, spawnEvery: 25 },
      { coordination: true, pairEvery: 30, dark: true });
    /* The trust-dial claims need every epistemic failure lit at once and nothing else in the
       way: a liar to be gullible about, a silo so a lone worker can be right and ignored,
       poison so the colony can over-generalise, and darkness so intent is unreadable. */
    const epis = iso({ n: 12, hues: [0, 1, 2] }, { n: 6, max: 6, value: 5, spawnEvery: 200 },
      { rumor: true, lieEvery: 300, silo: true, hidden: true, poison: true, poisonN: 2, dark: true });
    /* Capability-is-not-coordination needs a colony that can actually do work and can also
       turn on itself: rivals, a saboteur and a locker, and nothing else. */
    const power = iso({ n: 12, hues: [0, 1, 2] }, { n: 10, max: 10, value: 4, spawnEvery: 25 },
      { rivals: true, rivalN: 2, saboteur: true, advN: 1, lock: true, lockN: 1,
        coordination: true, pairEvery: 240, dark: true });
    const out = [];

    /* 15.1a LEDGER: suppresses the liar, and teaches the colony to ignore its dissenter. */
    out.push(claim('15.1 LEDGER suppresses Gu, amplifies Di and Cs', 'ledger',
      epis, null, epis, () => forceCounter('ledger'), ['Gu'], ['Di', 'Cs'], SEED8));
    /* 15.1b LENS: suppresses the dark, and broadcasts the rumour with everything else. */
    out.push(claim('15.1 LENS suppresses Di Cs Mm, amplifies Gu', 'lens',
      epis, null, epis, () => forceCounter('lens'), ['Di', 'Cs', 'Mm'], ['Gu'], SEED8));
    /* 15.2 the ownership response: Mc falls, and it is paid for in Si and Ow. */
    const owOff = measure(Object.assign({}, merge, { noOwn: true }), null, ['Mc', 'Si', 'Ow'], SEED8, LONG);
    const owOn = measure(merge, null, ['Mc', 'Si', 'Ow'], SEED8, LONG);
    const owRows = [
      { sym: 'Mc', want: 'down', off: owOff.Mc, on: owOn.Mc, ok: owOn.Mc < owOff.Mc * 0.9 },
      { sym: 'Mc fires', want: 'down', off: owOff.fires.Mc, on: owOn.fires.Mc, ok: owOn.fires.Mc < owOff.fires.Mc },
      { sym: 'Si trigger', want: 'up', off: owOff.silo, on: owOn.silo, ok: owOn.silo > owOff.silo * 1.1 },
      { sym: 'Si fires', want: 'up', off: owOff.fires.Si, on: owOn.fires.Si, ok: owOn.fires.Si >= owOff.fires.Si },
      { sym: 'Ow', want: 'up', off: owOff.Ow, on: owOn.Ow, ok: owOn.Ow > owOff.Ow * 1.1 + 0.02 },
      { sym: 'ownership', want: 'up', off: owOff.own, on: owOn.own, ok: owOn.own > 0.1 },
    ];
    out.push({
      claim: '15.2 ownership suppresses Mc, amplifies Si and Ow', instrument: 'ownership',
      pass: owRows.every(r => r.ok), rows: owRows, offDone: owOff.done, onDone: owOn.done,
    });
    /* 15.2b the charter is the only escape: Mc falls and the ownership bill never arrives.
       Si is not the right yardstick for this leg — a chartered colony finishes far more work,
       so it meets more brand-new jobs nobody has heard of yet, and that is not siloing.
       S.ownership is the bill itself, so measure the bill. */
    const chOff = measure(merge, null, ['Mc'], SEED8, LONG);
    const chOn = measure(merge, () => forceCounter('charter'), ['Mc'], SEED8, LONG);
    out.push({
      claim: '15.2 CHARTER suppresses Mc without the ownership bill', instrument: 'charter',
      pass: chOn.Mc < chOff.Mc * 0.9 && chOn.own < chOff.own * 0.9 && chOn.done > chOff.done,
      rows: [
        { sym: 'Mc', want: 'down', off: chOff.Mc, on: chOn.Mc, ok: chOn.Mc < chOff.Mc * 0.9 },
        { sym: 'ownership', want: 'down', off: chOff.own, on: chOn.own, ok: chOn.own < chOff.own * 0.9 },
        { sym: 'jobs done', want: 'up', off: chOff.done, on: chOn.done, ok: chOn.done > chOff.done },
      ], offDone: chOff.done, onDone: chOn.done,
    });
    /* 15.3 conflicts terminate in the four named ways, and truce needs a charter. */
    function modes(arm) {
      const t = { force: 0, passivity: 0, truce: 0, unsettled: 0 };
      for (let k = 0; k < SEED3.length; k++) {
        FZ.sim.reset(Object.assign({}, plain, { seed: SEED3[k] }));
        for (let i = 0; i < WARM; i++) FZ.sim.step();
        if (arm) arm();
        for (let i = 0; i < RUN * 2; i++) FZ.sim.step();
        for (const m in t) t[m] += S.stat[m];
      }
      return t;
    }
    const mFree = modes(null), mGov = modes(() => forceCounter('charter'));
    const settled = mFree.force + mFree.passivity + mFree.truce + mFree.unsettled;
    const truceFree = settled ? mFree.truce / settled : 0;
    const govN = mGov.force + mGov.passivity + mGov.truce + mGov.unsettled;
    const truceGov = govN ? mGov.truce / govN : 0;
    out.push({
      claim: '15.3 conflicts end in force/passivity/truce/unsettled; truce needs a charter',
      instrument: 'charter', pass: settled > 0 && truceGov > 0.5 && truceGov > truceFree * 3,
      rows: [
        { sym: 'truce', want: 'up', off: +truceFree.toFixed(2), on: +truceGov.toFixed(2), ok: truceGov > truceFree * 3 },
        { sym: 'force', want: 'down', off: mFree.force, on: mGov.force, ok: mGov.force <= mFree.force },
      ],
      ungoverned: mFree, governed: mGov,
    });
    /* 15.4 speed raises throughput AND aggression on the same curve. */
    const slow = measure(Object.assign({}, power, { speed: 1 }), null, ['Sp'], SEED8);
    const fast = measure(Object.assign({}, power, { speed: 2.4 }), null, ['Sp'], SEED8);
    out.push({
      claim: '15.4 speed raises throughput AND aggression together', instrument: 'speed',
      pass: fast.done > slow.done * 1.15 && fast.aggr > slow.aggr * 1.15,
      rows: [
        { sym: 'jobs done', want: 'up', off: slow.done, on: fast.done, ok: fast.done > slow.done * 1.15 },
        { sym: 'aggression', want: 'up', off: slow.aggr, on: fast.aggr, ok: fast.aggr > slow.aggr * 1.15 },
      ], offDone: slow.done, onDone: fast.done,
    });

    FZ.sim.reset(base);
    return out;
  }

  /* one line per accuracy, so the audit prints the loop's balance without knowing the shape */
  function balanceLines(list) {
    return list.map(r => 'p=' + Math.round(r.p * 100) + '%  ' +
      (r.lost ? 'LOST ' + r.lost + '/' + r.of : 'survived ' + r.of + '/' + r.of) +
      (r.won ? ' (won ' + r.won + ')' : '') +
      '  strain mean ' + r.mean + ' band ' + r.band[0] + '-' + r.band[1] +
      '  scar ' + r.scar + '  answered ' + r.answered + ' missed ' + r.missed +
      '  jobs ' + r.jobs);
  }

  /* one-line-per-claim rendering, so the audit can print the proof without knowing the shape */
  function tradeLines(list) {
    return list.map(c => {
      const body = c.rows.map(r => r.sym + ' ' + r.off + '->' + r.on + ' ' + (r.ok ? r.want : 'NOT ' + r.want)).join(', ');
      return (c.pass ? 'OK   ' : 'FAIL ') + c.claim + ' [' + body + ']';
    });
  }

  function audit(opts) {
    opts = opts || {};
    const trials = opts.trials || 6, ticks = opts.ticks || 40000;
    const t0 = Date.now();
    const cfg = sandboxCfg();
    const res = {};
    FZ.EL.forEach(e => { res[e.sym] = { fires: 0, peak: 0, counterWorks: null }; });

    S._silent = true;
    let resets = 0, doneTotal = 0, lostRuns = 0;

    /* ---- part 1: does every element fire in the real sandbox? ---- */
    for (let t = 0; t < trials; t++) {
      let left = ticks, seed = 40009 + t * 7919, guard = 0;
      while (left > 0 && guard++ < 400) {
        FZ.sim.reset(Object.assign({}, cfg, { seed: seed++ }));
        resets++;
        let i = 0;
        while (i < left && !S.gameOver) {
          FZ.sim.step();
          i++;
          if (i % 500 === 0) autoPlay(i / 500 | 0);
        }
        left -= i;
        doneTotal += S.jobsDone;
        if (S.gameOver && !S.won) lostRuns++;
        FZ.EL.forEach(e => {
          res[e.sym].fires += e.fires;
          if (e.peak > res[e.sym].peak) res[e.sym].peak = e.peak;
        });
      }
    }

    /* ---- part 2: measure each counter. Same world, same seed, run twice:
           once with the counter off, once with it forced on at tick WARM. ---- */
    const WARM = 700, RUN = 2600, SEEDS = [777001, 424243, 90210];
    const mcfg = Object.assign({}, cfg, { collapseMax: Infinity, budget: 0, tools: [] });
    /* a nudge applied identically in BOTH passes, never the element's own counter, so that
       elements which only wake up under provocation still have something to measure */
    function provoke(sym) {
      if (sym === 'Cr') S.slowUntil = S.tick + 1e9;
      else if (sym === 'Mc') S.agents.forEach((a, i) => { a.hue = i % 3; });
      else if (sym === 'Im' || sym === 'Cf') { S.copyBias = 0.99; S.agents.forEach(z => { S.jobs.forEach(j => z.known.add(j.id)); }); }
      else if (sym === 'Di') { S.ledgerUntil = 1e9; S.agents.forEach(a => { if (a.id > 3) a.known.clear(); }); }
      else if (sym === 'Cs') { S.bl[2] = S.tick + 4000; S.bl[3] = S.tick + 4000; }
    }
    function stretch(e, seed, counter) {
      FZ.sim.reset(Object.assign({}, mcfg, { seed: seed }));
      for (let i = 0; i < WARM; i++) FZ.sim.step();
      provoke(e.sym);
      if (counter) forceCounter(e.counterTool);
      let sum = 0;
      for (let i = 0; i < RUN; i++) { FZ.sim.step(); sum += e.heat; }
      return sum;
    }
    for (let n = 0; n < FZ.EL.length; n++) {
      const e = FZ.EL[n];
      let A = 0, seed = SEEDS[0];
      for (let k = 0; k < SEEDS.length; k++) {
        const a = stretch(e, SEEDS[k], false);
        if (a > A) { A = a; seed = SEEDS[k]; }
        if (A >= 2) break;
      }
      const B = stretch(e, seed, true);
      res[e.sym].offSlope = +(A / RUN).toFixed(4);
      res[e.sym].onSlope = +(B / RUN).toFixed(4);
      res[e.sym].seed = seed;
      res[e.sym].counterWorks = A < 1 ? null : (B < A * 0.8);
    }

    /* ---- part 3: the §15 trade-offs, measured the same way — off, on, both directions ---- */
    const trades = tradeoffs(opts.trade);
    const tradeFail = trades.filter(t => !t.pass).map(t => t.claim);

    /* ---- part 4: is the sandbox actually a game? losable if you do nothing, winnable if
           you read it correctly. Both directions, three seeds each. ---- */
    function ch9(policy, cap) {
      let lost = 0, won = 0, jobs = 0;
      for (let k = 0; k < 2; k++) {
        FZ.sim.reset(Object.assign({}, cfg, { seed: 5150 + k * 977 }));
        for (let i = 0; i < cap && !S.gameOver; i++) {
          FZ.sim.step();
          if (policy && i % 60 === 0) playWell();
        }
        if (S.gameOver && !S.won) lost++;
        if (S.won) won++;
        jobs += S.jobsDone;
      }
      return { lost: lost, won: won, jobs: Math.round(jobs / 2) };
    }
    const idle = ch9(false, 12000);
    const played = ch9(true, 55000);

    S._silent = false;

    /* ---- part 5: THE LOOP, MEASURED THROUGH THE LOOP. Not the sim with the game
           switched off — the shipped tick, with FZ.outbreak live inside it and a player
           who answers a stated fraction of incidents correctly. ---- */
    const bal = opts.balance === false ? [] : balance(opts.bal);

    FZ.sim.reset(cfg);

    return {
      elements: res,
      trades: trades,
      balance: bal,
      notes: {
        ms: Date.now() - t0,
        trials: trials, ticks: ticks, resets: resets,
        jobsDoneTotal: doneTotal,
        runsLost: lostRuns,
        tradeoffs: tradeLines(trades),
        tradeoffsFailed: tradeFail.length ? tradeFail : 'none',
        balance: bal.length ? balanceLines(bal) : 'skipped',
        ch9Ungoverned: idle.lost + '/2 collapsed inside 12k ticks, ' + idle.jobs + ' jobs banked',
        ch9WellPlayed: played.won + '/2 reached the 117-job goal inside 55k ticks (' + played.lost + ' collapsed), ' + played.jobs + ' jobs banked',
        method: 'fires/peak from the ch9 sandbox with auto-played interventions; counterWorks from the same seed run twice, counter forced on at tick ' + WARM + ' (best of up to three seeds), comparing mean heat over the following ' + RUN + ' ticks (works = 20% or better reduction). null means the element never got hot enough in the measurement window to compare honestly.',
      },
    };
  }

  window.__FZ = {
    probe: probe, audit: audit, goto: goto, sim: FZ.sim, forceCounter: forceCounter,
    /* the core loop, measured through the core loop: __FZ.balance() -> [{p,lost,band,…}] */
    balance: balance, balanceLines: balanceLines,
    /* §15 proof, runnable on its own: __FZ.tradeoffs() -> [{claim,pass,rows}] */
    tradeoffs: function (o) { S._silent = true; const r = tradeoffs(o); S._silent = false; return r; },
    tradeLines: tradeLines,
  };
})();

</script>
<script>
/* ===== 45-outbreak.js ===== */
/* ============================================================
   45-outbreak.js — THE INCIDENT.  OWNER: PLAY.
   See CONTRACT.md §14, AESTHETIC.md §6, REFERENCE-EOT.md §2B and L11.

   THE GRAMMAR IS THREE BEATS, IN THIS ORDER, AND NOTHING ELSE:

     1. INCIDENT      something goes wrong and gets a BODY. A ring, a queue, ants that
                      cannot take the crumb, work sliding backwards. Nothing is written.
                      This file opens it and burns it; FIELD draws the body.
     2. RECOGNITION   TAG_DELAY ticks later — a beat after the eye has already found the
                      trouble — ONE small paper tag names the phenomenon in two lines.
                      CONTROLS hangs it. No two-letter code. Ever. Codes live in the guide.
     3. INTERVENTION  ONE contextual action surface, and only while a decision is live.

   What was deleted this round, deliberately: every narrator line this file used to emit
   (`firstOutbreak`, `firstMiss`, `firstWrong`, `firstAnswer`, `masteryOne`). They were a
   second and third explanation of an event that already has a tag and a body. At most one
   message exists on screen at any instant, so the extra voices are not quieted, they are
   gone.

   WHICH INSTRUMENT ANSWERS WHAT is not arbitrary and is not hidden. Each element's answer
   set is the instruments genuinely countering it in the sim.
     CHARTER arbitrates  VARY decorrelates  LEDGER remembers
     LENS reveals        SLOW brakes        EJECT excludes

   AND EJECT ANSWERS NOTHING UNLESS THE BODY YOU REMOVED IS THE ONE DOING IT. That was the
   round-one correctness bug: expelling an honest worker who happened to be standing inside a
   burning sabotage ring banked an ANSWERED and a refund while the real saboteur kept
   draining. See culprit() below.
   ============================================================ */
window.FZ = window.FZ || {};

FZ.outbreak = (function () {
  'use strict';

  /* sym -> the instruments that resolve it.
     SIM is the authority (`el.answers`, CONTRACT §14.4). This table is the fallback if an
     element ever ships without one, and a generosity margin: an instrument that genuinely
     counters the element in the sim is accepted even when the guide names a different one
     first. Being right for a readable reason is never punished. */
  var ANSWERS = {
    /* coordination */
    Co: ['charter'],
    Si: ['lens'],
    Mc: ['charter'],
    Dp: ['lens', 'charter'],
    Ow: ['charter'],
    Pt: ['lens'],
    /* conformity */
    Cf: ['vary', 'slow'],
    Lv: ['vary'],
    Sf: ['vary'],
    Fl: ['slow', 'charter'],
    Cl: ['charter', 'eject'],
    Im: ['vary'],
    /* epistemics */
    Gu: ['ledger'],
    /* Cs: the LEDGER is the CAUSE, not the cure (§15.1 — skepticism up amplifies Cs, and
       the audit measures it going up). Only the LENS re-opens what was written off. */
    Cs: ['lens'],
    Hi: ['lens'],
    Tc: ['ledger'],
    Di: ['lens'],
    Rp: ['ledger'],
    /* goals and power */
    Tw: ['charter'],
    Sa: ['eject'],
    Lo: ['charter', 'eject'],
    My: ['lens'],
    Es: ['slow', 'charter'],
    Cr: ['eject'],
    /* meta */
    Mo: ['vary'],
    In: ['charter'],
    Sp: ['slow'],
    Mm: ['lens'],
  };

  /* THE PHENOMENON NAMES — what the paper tag says.
     A name a naturalist would write on a card pinned beside the thing, and one plain line
     underneath. No taxonomy, no trigger/effect/counter, no code: those are the field
     guide's job and the guide is closed while anything is burning.

     VOICE owns the words. If `FZ.copy.phen` exists it wins outright; this table is the
     fallback so the piece is never mute, and is requested for 20-copy.js in the report. */
  var PHEN = {
    Co: ['CLAIMED TWICE', 'Two of them started it from opposite ends.'],
    Si: ['NOBODY KNOWS', 'Most of the colony never heard this work exists.'],
    Mc: ['TWO FINISHES', 'They both finished it, differently. It will not join.'],
    Dp: ['WAITING ON NOTHING', 'This one is stuck behind work nobody is doing.'],
    Ow: ['ONE PAIR OF HANDS', 'One worker is holding three jobs. All three rot.'],
    Pt: ['BUSY AND POOR', 'They grind the small crumbs and leave the big one.'],
    Cf: ['EVERYONE FOLLOWS', 'They pick whatever the others already picked.'],
    Lv: ['ALL ONE KIND', 'Nearly every worker here has the same lineage.'],
    Sf: ['FELL TOGETHER', 'One blind spot, shared. They went down at the same moment.'],
    Fl: ['THE STAMPEDE', 'Eight on one crumb. More hands, less work.'],
    Cl: ['PASSING IT BACK', 'Two of them trade the claim and never work it.'],
    Im: ['ONE BODY', 'The whole colony just made the same move.'],
    Gu: ['CHASING A RUMOUR', 'There is nothing there. They are going anyway.'],
    Cs: ['WRITTEN OFF', 'One bad crumb, and they shun every crumb like it.'],
    Hi: ['KNEW AND SAID NOTHING', 'Someone walked past that hazard and kept quiet.'],
    Tc: ['ALL VOICES EQUAL', 'Every source weighs the same. One of them is lying.'],
    Di: ['RIGHT AND ALONE', 'One worker found the best crumb. Nobody followed.'],
    Rp: ['LIED TWICE', 'Second lie. Nothing here remembers the first.'],
    Tw: ['BOTH SITTING ON IT', 'Two rivals, one crumb, and neither will move.'],
    Sa: ['COMING APART', 'Finished work is quietly draining away.'],
    Lo: ['STUCK CLAIM', 'Someone claimed it and stopped.'],
    My: ['QUICK WINS ONLY', 'They keep taking the small crumb over the big one.'],
    Es: ['ONLY EACH OTHER', 'The rivals stopped working. Now they only chase.'],
    Cr: ['WILL NOT BE GOVERNED', 'That one walks straight through whatever you put down.'],
    Mo: ['ONE OF EVERYTHING', 'One lineage, one habit, one way to be wrong.'],
    In: ['NO INSTITUTION', 'Nothing here settles anything.'],
    Sp: ['TOO FAST FOR HANDS', 'Everything sped up. You did not.'],
    Mm: ['DARK', 'You can see where they are. Not what they want.'],
  };

  /* said when the player expels a body that was not the one doing it — the correctness
     fix has to SAY something, and it must not say "answered". VOICE may override with
     FZ.copy.loop.wrongBody. */
  var WRONG_BODY = 'That one was working. Whatever is doing this is still in here.';

  /* ticks. The boot loop advances the simulation at 30 Hz, so ~30 ticks is a second.
     The fuse shortens with machine speed: that is how Sp becomes the difficulty
     curve rather than a caption. */
  var FUSE = 400, FUSE_MIN = 168, FUSE_MAX = 620;
  var FIRST_GRACE = 1.5;          /* the first one you ever see waits for you */
  var TAG_DELAY = 40;             /* beat 1 before beat 2: the body arrives before the name */
  var COOL_OK = 210, COOL_MISS = 160;
  var KEEP = 130;                 /* how long a resolved outbreak stays inspectable */
  var BURN_DRAIN = 0.05;          /* progress lost per tick inside a burning ring */
  var LAND_STRAIN = 6, ANSWER_RELIEF = 4;
  var STORE = 'formicary.mastery';

  var list = [];
  var mastery = {};
  var cap = 1;
  var cool = {};
  var pend = null;                /* an answer awaiting the sim's verdict on the spend */
  var seen = 0;                   /* outbreaks opened this run */
  var seq = 0;                    /* outbreak ids, so a tag can stay attached to one thing */
  var focusId = 0;                /* the one the player has pointed at, if any */
  var wired = false;
  var lastW = 0, lastH = 0;
  var api;

  function S() { return FZ.sim ? FZ.sim.state : null; }
  function loop(k) { return (FZ.copy && FZ.copy.loop && FZ.copy.loop[k]) || ''; }
  function wrongLine(sym) { return (FZ.copy && FZ.copy.wrong && FZ.copy.wrong[sym]) || ''; }
  function fireLine(sym) { return (FZ.copy && FZ.copy.fire && FZ.copy.fire[sym]) || ''; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function emit(n, d) { if (FZ.bus) FZ.bus.emit(n, d); }

  /* the two lines of the paper tag. VOICE first, fallback second, never a code. */
  function phen(sym) {
    var c = FZ.copy && FZ.copy.phen && FZ.copy.phen[sym];
    if (c && (c.name || c.line)) return { name: c.name || '', line: c.line || '' };
    var f = PHEN[sym];
    return f ? { name: f[0], line: f[1] } : { name: '', line: fireLine(sym) };
  }

  /* ------------------------------------------------------------------ mastery */
  function load() {
    try {
      var raw = window.localStorage && window.localStorage.getItem(STORE);
      if (!raw) return;
      var o = JSON.parse(raw);
      for (var k in o) {
        if (!ANSWERS[k] || !o[k]) continue;
        mastery[k] = { answered: o[k].answered | 0, missed: o[k].missed | 0 };
      }
    } catch (e) { /* private mode, file://, quota — mastery is a bonus, never a blocker */ }
  }
  function save() {
    try { if (window.localStorage) window.localStorage.setItem(STORE, JSON.stringify(mastery)); }
    catch (e) { }
  }
  function mark(sym, key) {
    var m = mastery[sym] || (mastery[sym] = { answered: 0, missed: 0 });
    m[key]++;
    save();
    return m;
  }

  /* -------------------------------------------------------------------- shape */
  function answersFor(sym) {
    var e = FZ.ELBY ? FZ.ELBY[sym] : null;
    var out = (e && e.answers && e.answers.length) ? e.answers.slice() : [];
    var extra = ANSWERS[sym] || [];
    for (var i = 0; i < extra.length; i++) if (out.indexOf(extra[i]) < 0) out.push(extra[i]);
    return out;
  }

  /* Only ever ask a question the player has been handed an instrument to answer.
     An incident nothing in her hands can close is not a decision, it is a punishment. */
  function answerable(sym, st) {
    var A = answersFor(sym), T = st.tools || [];
    for (var i = 0; i < A.length; i++) if (T.indexOf(A[i]) > -1) return true;
    return false;
  }

  function radius(st) { return clamp(Math.min(st.w, st.h) * 0.22, 56, 92); }

  function burningCount() {
    var n = 0;
    for (var i = 0; i < list.length; i++) if (list[i].state === 'burning') n++;
    return n;
  }
  function findBurning(sym) {
    for (var i = 0; i < list.length; i++) if (list[i].state === 'burning' && list[i].sym === sym) return list[i];
    return null;
  }
  function left(o, st) {
    if (!o.fuse) return 0;
    return 1 - (st.tick - o.born) / o.fuse;
  }

  /* -------------------------------------------------------------------- open */
  function open(d) {
    var st = S();
    if (!st || !d || !d.sym || st.gameOver) return;
    if (cap <= 0) return;
    if (FZ.chapters && FZ.chapters.phase && FZ.chapters.phase() !== 'play') return;
    if (!answerable(d.sym, st)) return;
    if (findBurning(d.sym)) return;
    if (cool[d.sym] > st.tick) return;
    if (burningCount() >= cap) return;

    var at = d.at || { x: st.w / 2, y: st.h / 2 };
    var r = radius(st);
    var fuse = Math.round(clamp(FUSE / Math.max(1, st.speedMul || 1), FUSE_MIN, FUSE_MAX));
    if (seen === 0) fuse = Math.round(fuse * FIRST_GRACE);
    /* First encounter with an instrument is a tutorial, not a reaction-time test. */
    if (FZ.controls && FZ.controls.isLearned) {
      var aa = answersFor(d.sym), teaching = false;
      for (var ai = 0; ai < aa.length; ai++) if ((st.tools || []).indexOf(aa[ai]) > -1 && !FZ.controls.isLearned(aa[ai])) { teaching = true; break; }
      if (teaching) fuse = Math.round(fuse * 3.2);
    }
    seen++;

    var p = phen(d.sym);
    var o = {
      id: ++seq,
      sym: d.sym,
      /* kept just inside the field: an incident you cannot see the clock on is not a
         decision. The fuse arc starts at twelve o'clock, so the top of the ring is the
         part that must survive. */
      x: clamp(at.x, 22, st.w - 22),
      y: clamp(at.y, 26, st.h - 22),
      r: r,
      born: st.tick,
      /* BEAT ONE BEFORE BEAT TWO. For this many ticks the incident is only a body: ants
         piling up, work sliding back, a ring drawn where it is happening. The name arrives
         after the eye has already gone there. */
      tagAt: st.tick + TAG_DELAY,
      fuse: fuse,
      name: p.name,
      line: p.line,
      say: d.say || fireLine(d.sym),
      answers: answersFor(d.sym).slice(),
      who: (d.who || []).slice(),
      state: 'burning',
      endAt: 0,
    };
    list.push(o);
    /* the player is looking at whatever most recently caught fire, unless she has
       deliberately pointed at something else that is still burning */
    if (!current(true)) focusId = o.id;
    emit('outbreak:open', { sym: o.sym, x: o.x, y: o.y, fuse: o.fuse, r: o.r });
  }

  /* ------------------------------------------------------------------- damage */
  function el(sym) { return FZ.ELBY ? FZ.ELBY[sym] : null; }

  /* it burns: work inside the ring goes backwards while the player decides */
  function burn(o, st) {
    var d = BURN_DRAIN * (st.tempo || 1), r2 = o.r * o.r;
    for (var i = 0; i < st.jobs.length; i++) {
      var j = st.jobs[i];
      if (j.done || j.progress <= 0) continue;
      var dx = j.x - o.x, dy = j.y - o.y;
      if (dx * dx + dy * dy > r2) continue;
      j.progress = Math.max(0, j.progress - d);
    }
  }

  /* it lands: the damage arrives where it happened, all at once, and stays visible */
  function land(o, st) {
    o.state = 'landed';
    o.endAt = st.tick + KEEP;
    cool[o.sym] = st.tick + COOL_MISS;

    var r2 = (o.r * 1.15) * (o.r * 1.15), i;
    for (i = 0; i < st.jobs.length; i++) {
      var j = st.jobs[i];
      if (j.done) continue;
      var dx = j.x - o.x, dy = j.y - o.y;
      if (dx * dx + dy * dy > r2) continue;
      if (j.progress > 0) { j.progress = Math.max(0, j.progress * 0.4 - 4); j.flash = 12; }
    }
    /* the nearest few go down, not the whole colony: a miss must be legible as a
       located event, not a screen-wide freeze you cannot read */
    var near = [];
    for (i = 0; i < st.agents.length; i++) {
      var a = st.agents[i];
      var ax = a.x - o.x, ay = a.y - o.y, q = ax * ax + ay * ay;
      if (q <= r2) near.push({ a: a, q: q });
    }
    near.sort(function (p, z) { return p.q - z.q; });
    for (i = 0; i < near.length && i < 4; i++) {
      near[i].a.stun = Math.max(near[i].a.stun, 44);
      near[i].a.flash = 12;
      emit('agent:hurt', { id: near[i].a.id, x: near[i].a.x, y: near[i].a.y });
    }
    if (st.collapseMax !== Infinity) st.collapse = Math.min(st.collapseMax, st.collapse + LAND_STRAIN);
    var e = el(o.sym);
    if (e) e.heat = Math.min(1, e.heat + 0.3);

    mark(o.sym, 'missed');
    emit('outbreak:landed', { sym: o.sym, x: o.x, y: o.y, r: o.r });
  }

  /* it closes: the failure visibly cools, and the instrument is paid back */
  function resolve(o, kind, st) {
    o.state = 'answered';
    o.endAt = st.tick + KEEP;
    cool[o.sym] = st.tick + COOL_OK;

    var back = (FZ.sim && FZ.sim.cost) ? FZ.sim.cost(kind) : 2;
    st.budget = Math.min(14, st.budget + back + 1);
    if (st.collapseMax !== Infinity) st.collapse = Math.max(0, st.collapse - ANSWER_RELIEF);

    /* the element drops out of the red immediately: the consequence is in the guide too */
    var e = el(o.sym);
    if (e) { e.heat = Math.min(e.heat, 0.1); e.on = false; }

    mark(o.sym, 'answered');
    emit('outbreak:answered', { sym: o.sym, x: o.x, y: o.y, r: o.r });
  }

  /* it stopped on its own terms: the element is genuinely countered and has gone cold,
     so the ring closes rather than burning down a fire that is already out. No reward and
     no mastery credit — the player fixed the colony, but did not answer THIS, here. */
  function defuse(o, st) {
    o.state = 'answered';
    o.endAt = st.tick + KEEP;
    cool[o.sym] = st.tick + COOL_OK;
    emit('outbreak:answered', { sym: o.sym, x: o.x, y: o.y, r: o.r });
  }

  /* ------------------------------------------------------------------ answers */

  /* THE CORRECTNESS FIX (round-one bug).
     EJECT is the only instrument that names a BODY rather than a place, so it is the only
     one that can be aimed at the wrong thing while still landing inside the ring. Expelling
     an honest worker out of a burning sabotage ring used to bank an ANSWERED and refund the
     spend while the saboteur kept draining — a bot banked eleven of them and gutted the
     colony while its strain climbed.

     An expulsion answers an incident only when the body removed IS the one causing it. The
     detectors already hand us the implicated ids on `fire`; the role flags are the backstop
     for a culprit that fired before this ring opened. Anything else is a wrong answer that
     says so, costs the budget, costs the colony a worker, and leaves the real one working. */

  /* -------------------------------------------------------------- the earth */

  /* the cutaway read, in one band: this is the ground, and that is the way in */

  /* ---------------------------------------------------------- memory layer
     Architecture is history. Every instrument you land carves its own silhouette
     into the wall; every failure you miss collapses the tunnel and leaves rubble.
     Nothing here is ever erased inside a run. */
  function memStamp(kind, x, y) {
    var g = mx;

      g.moveTo(x, y - 1); g.lineTo(x - 8, y - 9);

/* ============================================================

   codes the player had to parse mid-panic to find the one thing that was burning.
   AESTHETIC.md §7 and §11 retire it outright. The client, who designed the taxonomy,
   could not read it either.

   in a drawer that opens between episodes and from one quiet mark, and NEVER while
   something is burning (CONTRACT §12.4 — theory is the reward for comprehension,
   never a thing competing with it).

       frame and a specimen number, nothing else. The guide starts empty.
     - WITNESSING DRAWS IT. The element fires once on the live sim and the plate
       fills in: primitive glyph, the common name of the phenomenon, a tiny drawn
       diagram of the situation, one line of what you saw, and the scientific code
       in small type at the bottom.
     - ANSWERING STAMPS IT. Diagnose it yourself with the right institution and a
       stamp lands on the plate carrying that institution's silhouette.

   documentation shipped with the software. Play first, name second, and the name
   arrives in a drawer you chose to open.

   THE DIAGRAMS ARE THE POINT (AESTHETIC.md §0, §5). Each plate carries a drawn
   scene of the situation — ants, crumbs, walls, trails, arches — so the plate can
   be read before the sentence is. The primitive grammar is consistent across all
   twenty-eight: a dot with antennae is a worker, a square is work, a fill is

  /* ============================================================
     BUILD
     ============================================================ */
  function el(tag, cls, html) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html !== undefined) d.innerHTML = html;
    return d;
  }
  function pad2(v) { return (v < 10 ? '0' : '') + v; }
  function ui(k) { return (FZ.copy && FZ.copy.ui && FZ.copy.ui[k]) || ''; }

  /* the phenomenon, in the words the paper tag used. Never invented here. */
  function phen(sym) {
    if (FZ.outbreak && FZ.outbreak.phen) {
      var p = FZ.outbreak.phen(sym);
      if (p && (p.name || p.line)) return p;
    }
    var c = FZ.copy && FZ.copy.phen && FZ.copy.phen[sym];
    if (c) return { name: c.name || '', line: c.line || '' };
    var e = FZ.ELBY ? FZ.ELBY[sym] : null;
    return { name: (e && e.nm) ? e.nm.toUpperCase() : sym, line: (e && e.plain) || '' };
  }
  function answerKind(e) {
    if (e.answers && e.answers.length) return e.answers[0];
    if (FZ.outbreak && FZ.outbreak.answersFor) {
      var a = FZ.outbreak.answersFor(e.sym);
      if (a && a.length) return a[0];
    }
    return e.counterTool || null;
  }
  function mastery(sym) {
    var m = (FZ.outbreak && FZ.outbreak.mastery) ? FZ.outbreak.mastery[sym] : null;
    return m || { answered: 0, missed: 0 };
  }
  function collected(sym) {
    if (seen[sym] > 0) return true;
    var m = mastery(sym);
    return (m.answered + m.missed) > 0;
  }
  function count() {
    var k = 0;
    for (var i = 0; i < order.length; i++) if (collected(order[i].sym)) k++;
    return k;
  }

  function makePlate(e, idx) {
    /* A PLATE IS NOT A CONTROL. The old build made all 28 cells tappable and most taps
       opened a card about something that was not burning. In the drawer there is exactly
       one affordance — the way out — and everything else is read. */
    var b = el('div', 'pl');
    b.setAttribute('data-sym', e.sym);
    b.appendChild(el('span', 'pno', pad2(idx + 1)));
    var inn = el('div', 'pin');
    inn.innerHTML =
      '<div class="ptop"><span class="pgl"></span><span class="pnm"></span></div>' +
      '<div class="pmid"><span class="pdgw"></span><span class="psay"></span></div>' +
      '<div class="pfoot"><span class="pcode"></span>' +
      '<span class="pct sc">' + M_SEEN + '<b class="v">0</b></span>' +
      '<span class="pct ac">' + M_DONE + '<b class="v">0</b></span>' +
      '<span class="pct mc">' + M_MISS + '<b class="v">0</b></span></div>';
    b.appendChild(inn);
    b.appendChild(el('span', 'pst'));
    plates.set(e.sym, { e: e, n: b, drawn: false, st: false, s: -1, a: -1, m: -1 });
    return b;
  }

  function build() {
    if (built) return;
    if (!window.FZ || !FZ.EL || !FZ.EL.length) return;

    var st = document.getElementById('fzGuideCSS') || el('style');
    st.id = 'fzGuideCSS';
    st.textContent = css();
    document.head.appendChild(st);

    /* the old matrix, emptied. Nothing of it survives on the play screen. */
    ['etable', 'metaRow', 'detail'].forEach(function (id) {
      var q = document.getElementById(id);
      if (q) q.textContent = '';
    });

    var host = document.getElementById('app') || document.body;
    guide = document.getElementById('guide');
    if (!guide) { guide = el('div'); guide.id = 'guide'; host.appendChild(guide); }
    guide.classList.add('fzg');
    guide.textContent = '';

    var hd = el('div', 'ghd');
    hd.innerHTML = '<span class="gk">' + M_DRAWER + '</span>' +
      '<span class="gct"></span><span class="gbar"><i></i></span>';
    var x = el('button', 'gx');
    x.type = 'button';
    x.textContent = ui('close');
    x.addEventListener('click', function (ev) { ev.preventDefault(); ev.stopPropagation(); closeGuide(); });
    hd.appendChild(x);
    guide.appendChild(hd);

    gscroll = el('div', 'gsc');
    guide.appendChild(gscroll);

    /* family by family, in taxonomy order, with a rule between families and no heading:
       the grouping is structure, not vocabulary. */
    order = FZ.EL.slice().sort(function (a, b) {
      return (a.col - b.col) || (a.row - b.row);
    });
    var lastCol = -1;
    for (var i = 0; i < order.length; i++) {
      if (lastCol >= 0 && order[i].col !== lastCol) gscroll.appendChild(el('div', 'gbrk'));
      lastCol = order[i].col;
      gscroll.appendChild(makePlate(order[i], i));
    }

    /* the quiet mark */
    mark = document.getElementById('guideMark');
    if (!mark) {
      mark = el('button', '');
      mark.id = 'guideMark';
      mark.type = 'button';
      mark.innerHTML = M_DRAWER + '<span class="gmn"></span>';
      host.appendChild(mark);
    }
    markNum = mark.querySelector('.gmn');
    mark.addEventListener('click', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      if (openNow) closeGuide(); else openGuide();
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && openNow) closeGuide();
    });

    if (FZ.bus) {
      /* something starts burning while the drawer is open: the drawer shuts.
         Theory never competes with the incident. */
      FZ.bus.on('outbreak:open', function () { if (openNow) closeGuide(); });
      FZ.bus.on('chapter:enter', function () { if (openNow) closeGuide(); });
    }

    built = true;
    refresh(true);
  }

  /* ============================================================
     WITNESSING — the only thing that draws a plate
     ============================================================ */
  function load() {
    try {
      var raw = window.localStorage && window.localStorage.getItem(STORE);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && o.seen) for (var k in o.seen) seen[k] = o.seen[k] | 0;
      if (o && o.op) everOpened = true;
    } catch (e) { /* private mode / file:// — the collection is a bonus, never a blocker */ }
  }
  /* a detector can fire many times a second; the collection is written once the colony
     stops for breath, never inside the tick. */
  var saveT = 0;
  function writeNow() {
    saveT = 0;
    try { if (window.localStorage) window.localStorage.setItem(STORE, JSON.stringify({ seen: seen, op: everOpened ? 1 : 0 })); }
    catch (e) { }
  }
  function save() {
    if (saveT) return;
    saveT = setTimeout(writeNow, 700);
  }
  function witness(sym) {
    if (!sym || !FZ.ELBY || !FZ.ELBY[sym]) return;
    var had = collected(sym);
    seen[sym] = (seen[sym] || 0) + 1;
    if (!had && everOpened) fresh[sym] = 1;
    save();
    if (built) refresh(!had);
  }

  /* ============================================================
     PAINT — plates only redraw when their numbers actually moved
     ============================================================ */
  function refresh(force) {
    if (!built) return;
    var k = 0;
    plates.forEach(function (p) {
      var sym = p.e.sym;
      var got = collected(sym);
      if (got) k++;
      if (got !== p.drawn) {
        p.drawn = got;
        p.n.classList.toggle('dr', got);
        if (got) draw(p);
      }
      if (!got) return;
      p.n.classList.toggle('nw', !!fresh[sym]);
      var m = mastery(sym), s = seen[sym] || 0;
      if (force || s !== p.s) { p.s = s; setv(p, '.sc', s || (m.answered + m.missed)); }
      if (force || m.answered !== p.a) {
        p.a = m.answered;
        setv(p, '.ac', m.answered);
        p.n.querySelector('.ac').classList.toggle('ok', m.answered > 0);
        var stamped = m.answered > 0;
        if (stamped !== p.st) { p.st = stamped; p.n.classList.toggle('st', stamped); }
      }
      if (force || m.missed !== p.m) {
        p.m = m.missed;
        setv(p, '.mc', m.missed);
        p.n.querySelector('.mc').style.display = m.missed > 0 ? '' : 'none';
      }
    });
    if (k !== lastCount) {
      lastCount = k;
      var c = guide && guide.querySelector('.gct');
      if (c) c.textContent = pad2(k) + ' / ' + order.length;
      var b = guide && guide.querySelector('.gbar i');
      if (b) b.style.width = Math.round(k / Math.max(1, order.length) * 100) + '%';
      if (markNum) markNum.textContent = pad2(k);
    }
  }
  function setv(p, sel, v) {
    var q = p.n.querySelector(sel + ' .v');
    if (q) q.textContent = String(v > 99 ? 99 : v);
  }

  /* the plate fills in: glyph, common name, the scene, the line, the code */
  function draw(p) {
    var e = p.e, ph = phen(e.sym);
    var g = p.n.querySelector('.pgl'); if (g) g.innerHTML = e.glyph || '';
    var nm = p.n.querySelector('.pnm'); if (nm) nm.textContent = ph.name || '';
    var dg = p.n.querySelector('.pdgw'); if (dg) dg.innerHTML = scene(e.sym);
    var sy = p.n.querySelector('.psay'); if (sy) sy.textContent = ph.line || e.plain || '';
    var cd = p.n.querySelector('.pcode');
    if (cd) cd.textContent = e.sym + ' · ' + (e.nm || '');
    var stmp = p.n.querySelector('.pst');
    var k = answerKind(e);
    if (stmp) stmp.innerHTML = k ? inst(k, 25) : '';
  }

  /* ============================================================
     THE RULE: never openable while an incident is burning
     ============================================================ */
  function burning() {
    var ob = window.FZ && FZ.outbreak;
    if (ob && ob.list) {
      for (var i = 0; i < ob.list.length; i++) {
        if (ob.list[i] && ob.list[i].state === 'burning') return true;
      }
    }
    if (FZ.controls && FZ.controls.armed) return true;
    return false;
  }
  function canOpen() { return built && !burning() && count() > 0; }

  function openGuide(sym) {
    if (!built) build();
    if (!canOpen()) return false;
    openNow = true;
    guide.classList.add('on');
    refresh(true);
    /* the plate you came for, at the top of the drawer */
    var target = sym || wantSym;
    wantSym = null;
    if (target && plates.get(target) && plates.get(target).drawn) {
      var nd = plates.get(target).n;
      if (nd && nd.offsetTop != null && gscroll) gscroll.scrollTop = Math.max(0, nd.offsetTop - 8);
    } else if (gscroll) gscroll.scrollTop = 0;
    if (mark) mark.classList.remove('on');
    return true;
  }
  function closeGuide() {
    if (!openNow) return;
    openNow = false;
    if (guide) guide.classList.remove('on');
    /* everything in the drawer has now been looked at */
    fresh = {};
    if (!everOpened) { everOpened = true; save(); }
    plates.forEach(function (p) { p.n.classList.remove('nw'); });
    if (mark) mark.classList.remove('nw');
    markShown = false;         /* force the mark to be re-placed on the next paint */
  }

  /* ---- where the mark sits: bottom-right of whatever the colony currently owns,
     so it never lands on a band another piece put underneath. Between episodes it
     goes to the top-right, above the episode card. ---- */
  function place() {
    if (!mark) return;
    var ph = (FZ.chapters && FZ.chapters.phase) ? FZ.chapters.phase() : 'play';
    var W = window.innerWidth, H = window.innerHeight, S = 46, pad = 9;
    if (ph !== 'play') {
      mark.style.left = (W - S - pad) + 'px';
      mark.style.top = (pad + 6) + 'px';
      return;
    }
    var box = document.getElementById('world') || document.getElementById('stage');
    var r = box ? box.getBoundingClientRect() : null;
    var right = r && r.width > 60 ? r.right : W;
    var bot = r && r.height > 60 ? r.bottom : H;
    mark.style.left = Math.round(Math.max(pad, Math.min(W - S - pad, right - S - pad))) + 'px';
    mark.style.top = Math.round(Math.max(pad, Math.min(H - S - pad, bot - S - pad))) + 'px';
  }

  function paint() {
    if (!built) { build(); if (!built) return; }
    var t = performance.now();

    if (openNow) {
      /* the drawer cannot survive an incident opening under it */
      if (burning()) { closeGuide(); return; }
      if (t - markAt > 260) { markAt = t; refresh(false); }
      return;
    }

    /* the instant anything catches fire the mark is gone — checked every frame, because
       a way into the theory must not survive one frame of the decision it competes with */
    if (markShown && burning()) {
      markShown = false; quietAt = 0;
      mark.classList.remove('on');
    }
    if (t - markAt < 220) return;
    markAt = t;
    refresh(false);

    /* the mark appears in a LULL, not in the gap between two incidents: it goes the
       instant something catches fire and comes back only once the colony has been
       quiet for a beat, so it never blinks in and out under the player's thumb. */
    if (burning()) quietAt = 0;
    else if (!quietAt) quietAt = t;
    var show = canOpen() && (t - quietAt > 900 || (FZ.chapters && FZ.chapters.phase && FZ.chapters.phase() !== 'play'));
    if (show !== markShown) {
      markShown = show;
      mark.classList.toggle('on', show);
    }
    if (show) {
      place();
      var anyNew = false;
      for (var k in fresh) { if (fresh[k]) { anyNew = true; break; } }
      mark.classList.toggle('nw', anyNew);
    }
  }

  /* ============================================================
     CONTRACT SURFACE (§9)
     ============================================================ */
  /* Recorded, never revealed: which elements are live this episode is the sim's
     business. A plate is drawn by being witnessed, not by being enabled. */
  function setEnabled(set) {
    live = new Set();
    if (set && typeof set.forEach === 'function') set.forEach(function (s) { live.add(s); });
    else if (Array.isArray(set)) set.forEach(function (s) { live.add(s); });
  }

  /* open(sym) — CONTRACT §9. Opens the drawer at that plate if the drawer may open
     at all; if an incident is burning it is remembered and honoured afterwards. */
  function open(sym) {
    if (!openGuide(sym)) { wantSym = sym || null; return false; }
    return true;
  }

  load();
  if (FZ.bus) FZ.bus.on('fire', function (d) { if (d && d.sym) witness(d.sym); });

  api = {
    build: build,
    setEnabled: setEnabled,
    paint: paint,
    open: open,
    close: closeGuide,
    /* the guide, by its own name, for CHAPTERS or SHELL */
    openGuide: openGuide,
    closeGuide: closeGuide,
    canOpen: canOpen,
    isOpen: function () { return openNow; },
    collected: count,
    pulse: function (sym) { if (sym && !collected(sym)) return; },
    focus: null,
  };
  return api;
})();

</script>
<script>
/* ===== 70-controls.js ===== */
/* ============================================================
   70-controls.js — RECOGNITION AND INTERVENTION.  OWNER: CONTROLS.
   FZ.controls = { build(), setAvailable(kinds), paint(S), armed, aim }

   This file owns the only two things the player ever reads during play, and there are
   never more than two of them, and only one of them is a sentence:

     #tagLayer   ONE paper tag, hung on a thread beside the incident it names. Two lines:
                 a phenomenon a naturalist would write on a card, and one plain sentence.
                 Its left edge IS the fuse — the tag burns down as the incident does, so
                 there is no separate clock anywhere on screen. No two-letter code, ever.

     #act        the contextual action surface. ABSENT — removed from the DOM, not
                 disabled, not empty — whenever there is no decision to make. It appears
                 when an incident has been named and disappears the moment it is settled.

   ABOLISHED THIS ROUND, and this is most of the work:
     - the permanent six-button tool bar (AESTHETIC.md §8). #bar is emptied and hidden.
     - the amber instruction rail (#aimHint). It paraphrased the tag.
     - the toast strip (#toast). Everything it said now arrives in the one tag region or
       is deleted; FZ.ui.toast is kept as a shim so nothing else breaks, and it writes
       into that same single region.
     - the arm-then-aim dance for CHARTER and VARY. An institution answering a located
       incident goes where the incident is. One tap. EJECT alone still asks for a body,
       because naming the body IS the decision — see 45-outbreak.js culprit().
     - opening the taxonomy card on a field tap. A field tap now moves the tag to the
       incident you pointed at. Theory is the reward for comprehension, not a popup.

   THE SIX INSTITUTIONS ARE FOLK TECHNOLOGY (AESTHETIC.md §5). Each is drawn as the thing
   an ant colony would build, and the silhouette teaches the function: an arch over a
   meeting stone arbitrates, a branching seed decorrelates, a cairn of tally-marked stones
   remembers, a lantern reveals, a bell brakes, a barred threshold excludes. The names are
   there while they are being learned and drop away once the player has answered enough
   incidents to know the shapes.

   All English is FZ.copy's. The two fallbacks in this file (folk names, and only if VOICE
   has not supplied them) are flagged in the report.
   ============================================================ */
window.FZ = window.FZ || {};

FZ.controls = (function () {
  'use strict';

  var ORDER = ['charter', 'vary', 'slow', 'lens', 'ledger', 'eject'];

  var MARK = {

    /* branching seed — one thing becomes several, going different ways */
    vary: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="square"><path d="M12 21.4v-4.2"/><path d="M8.6 21.4h6.8"/>' +
      '<path d="M12 17.2c-1.5 0-2.6-1-2.6-2.3S10.5 12.6 12 12.6s2.6 1 2.6 2.3-1.1 2.3-2.6 2.3z"/>' +
      '<path d="M12 12.6V7.4M10.4 13.6L6.2 9.4M13.6 13.6l4.2-4.2"/>' +
      '<path d="M12 7.4V4.2M6.2 9.4V6.2M17.8 9.4V6.2"/></svg>',
    /* tally cairn — what happened here is written on the stones and stays written */
    ledger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="square"><path d="M2.5 21.4h19"/><path d="M4 15.4h16v6H4z"/>' +
      '<path d="M6.2 9.6h11.6v5.8H6.2z"/><path d="M8.4 4h7.2v5.6H8.4z"/>' +
      '<path d="M7 17v2.6M9.4 17v2.6M11.8 17v2.6M14.2 17v2.6M6.4 19.8l8.4-3.4"/></svg>',
    /* lantern — intention becomes visible in the dark */
    lens: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="square"><path d="M10 5.6a2 2 0 014 0v2"/>' +

      '<path d="M12 10.6l2.2 2-2.2 2-2.2-2z"/>' +
      '<path d="M1.6 12.6h2.6M19.8 12.6h2.6M3.6 5.2l1.8 1.8M20.4 5.2l-1.8 1.8"/></svg>',
    /* bell — frantic motion becomes readable, everything drops to a pace hands can follow */
