<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#bfdff2">
<meta name="description" content="TERRARIUM is a world in which language acquires consequences.">
<meta property="og:type" content="website">
<meta property="og:title" content="TERRARIUM">
<meta property="og:description" content="What happens when words have somewhere to live?">
<meta property="og:url" content="https://hartswf0.github.io/terrarium/">

<title>TERRARIUM — Words have somewhere to live</title>
<style>
:root {
  --sky: #bfdff2;
  --panel: #182127;
  --glass: #edf4f2;
  --cyan: #17ddd0;
  --lime: #78e35a;
  --yellow: #f4c62f;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif: "Instrument Serif", "Iowan Old Style", Baskerville, Georgia, serif;
}

* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: var(--sky); }
body { margin: 0; min-width: 320px; overflow: hidden; color: var(--panel); font-family: var(--mono); }
button, input, a { font: inherit; }
button, input { color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
.skip { position: fixed; left: 12px; top: -80px; z-index: 100; padding: 12px 14px; background: var(--panel); color: white; text-decoration: none; }
.skip:focus { top: 12px; }

#world {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: linear-gradient(#bfe1f5 0 54%, #9bca70 54% 100%);
  touch-action: none;
}
.wash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg, rgba(191, 223, 242, .78) 0, rgba(191, 223, 242, .2) 43%, transparent 70%);
}
.grain {
  position: fixed;
  inset: 0;
  z-index: 20;
  pointer-events: none;
  opacity: .07;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
}

.topbar {
  position: fixed;
  z-index: 30;
  top: max(14px, env(safe-area-inset-top));
  left: 18px;
  right: 18px;
  height: 44px;
  display: flex;
  gap: 7px;
  pointer-events: none;
}
.brand, .creo, .status, .play {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  border: 1px solid rgba(237, 244, 242, .7);
  background: rgba(24, 33, 39, .93);
  color: var(--glass);
  box-shadow: 0 7px 22px rgba(22, 35, 42, .14);
  pointer-events: auto;
}
.brand { padding: 0 14px; font-size: 9px; font-weight: 700; letter-spacing: .2em; text-decoration: none; }
.creo { padding: 0 12px; border-color: var(--cyan); color: var(--cyan); font-size: 8px; letter-spacing: .12em; }
.status { margin-left: auto; padding: 0 12px; color: rgba(237, 244, 242, .65); font-size: 7px; letter-spacing: .1em; }
.status i { width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 9px var(--lime); }
.play { width: 48px; justify-content: center; padding: 0; border-color: var(--cyan); color: var(--cyan); font-size: 8px; font-weight: 700; cursor: pointer; }
.play.active { background: var(--cyan); color: var(--panel); }

main { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.question {
  position: absolute;
  top: clamp(112px, 15vh, 160px);
  left: max(22px, calc((100vw - 1180px) / 2));
  width: min(750px, calc(100% - 44px));
  transition: opacity .8s ease, transform .8s ease;
}
.question.spoken { opacity: .18; transform: translateY(-8px); }
.question h1 {
  margin: 0;
  max-width: 720px;
  color: var(--panel);
  font: 400 clamp(68px, 7.7vw, 112px)/.85 var(--serif);
  letter-spacing: -.047em;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .22);
}
.question h1 span { display: block; }

.world-word {
  position: fixed;
  z-index: 9;
  left: 50%;
  top: 53%;
  max-width: min(620px, calc(100% - 100px));
  padding: 10px 13px;
  transform: translate(-50%, 14px);
  opacity: 0;
  border: 1px solid var(--cyan);
  background: rgba(24, 33, 39, .9);
  color: var(--glass);
  font-size: 8px;
  letter-spacing: .11em;
  text-align: center;
  text-transform: uppercase;
  transition: opacity .25s ease, transform .25s ease;
  pointer-events: none;
}
.world-word.show { opacity: 1; transform: translate(-50%, 0); }

.dock {
  position: fixed;
  z-index: 31;
  left: 50%;
  bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px));
  width: min(680px, calc(100% - 36px));
  transform: translateX(-50%);
}
.dock-meta {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  margin: 0 3px 8px;
  color: rgba(24, 33, 39, .58);
  font-size: 7px;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.dock-meta b { color: var(--panel); font-weight: 700; }
.say {
  min-height: 64px;
  display: grid;
  grid-template-columns: 1fr 54px 54px;
  border: 1px solid rgba(237, 244, 242, .76);
  background: rgba(24, 33, 39, .94);
  box-shadow: 0 12px 36px rgba(24, 33, 39, .24);
}
.say input {
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--glass);
  padding: 0 20px;
  font-size: 11px;
}
.say input::placeholder { color: rgba(237, 244, 242, .48); }
.say button { border: 0; border-left: 1px solid rgba(237, 244, 242, .16); background: transparent; color: var(--glass); cursor: pointer; }
.say button:hover { color: var(--cyan); }
.say .mic { color: var(--cyan); font-size: 15px; }
.say .mic.listening { background: var(--cyan); color: var(--panel); }
.say .send { background: var(--cyan); color: var(--panel); font-size: 18px; }
.doors { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
.doors a { color: rgba(24, 33, 39, .64); font-size: 7px; font-weight: 700; letter-spacing: .12em; text-decoration: none; text-transform: uppercase; }
.doors a:hover { color: var(--panel); }

@media (max-width: 700px) {
  .wash { background: linear-gradient(180deg, rgba(191, 223, 242, .72) 0, rgba(191, 223, 242, .32) 34%, transparent 55%); }
  .topbar { top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; }
  .brand { padding-inline: 11px; }
  .creo { padding-inline: 9px; }
  .status { display: none; }
  .play { margin-left: auto; }
  .question { top: max(92px, calc(env(safe-area-inset-top) + 82px)); left: 16px; width: calc(100% - 32px); }
  .question h1 { max-width: 365px; font-size: clamp(51px, 14.5vw, 62px); line-height: .88; }
  .world-word { top: 55%; max-width: calc(100% - 92px); font-size: 7px; }
  .dock { bottom: max(10px, env(safe-area-inset-bottom)); width: calc(100% - 24px); }
  .dock-meta { margin-bottom: 6px; font-size: 6px; }
  .say { min-height: 58px; grid-template-columns: 1fr 50px 50px; }
  .say input { padding-inline: 14px; font-size: 10px; }
  .doors { justify-content: space-between; padding: 0 3px; gap: 8px; }
  .doors a { font-size: 6px; }
}

@media (max-width: 350px) {
  .question h1 { font-size: 48px; }
  .creo { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<a class="skip" href="#sayInput">Skip to speaking</a>
<canvas id="world" aria-label="A low-poly TERRARIUM world. Drag to inspect it. Say something to change it."></canvas>
<div class="wash" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="./">TERRARIUM</a>
  <span class="creo">CREO</span>
  <span class="status"><i></i><span id="worldStatus">WORLD READY</span></span>
  <button class="play" id="play" type="button" aria-label="Play the world">PLAY</button>
</header>

<main>
  <section class="question" id="question">
    <h1><span>What happens when</span><span>words have somewhere to live?</span></h1>
  </section>
</main>

<div class="world-word" id="worldWord" role="status" aria-live="polite"></div>

<div class="dock">
  <div class="dock-meta"><b>Hablando me creo.</b><span>Drag to inspect</span></div>
  <form class="say" id="say">
    <input id="sayInput" name="say" type="text" maxlength="120" autocomplete="off" enterkeyhint="send" placeholder="Say something to the world…" aria-label="Say something to the world">
    <button class="mic" id="mic" type="button" aria-label="Speak to the world">●</button>
    <button class="send" type="submit" aria-label="Send words into the world">↑</button>
  </form>
  <nav class="doors" aria-label="Enter TERRARIUM">
    <a href="TERRARIUM.html">Ground ↗</a>
    <a href="unset-04-hartsoe-jr.html">Body ↗</a>
    <a href="https://github.com/hartswf0/terrarium">Source ↗</a>
  </nav>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const canvas = document.querySelector('#world');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const dayColor = new THREE.Color(0xbfdff2);
const nightColor = new THREE.Color(0x172334);
scene.background = dayColor.clone();
scene.fog = new THREE.Fog(dayColor, 33, 70);
const camera = new THREE.PerspectiveCamera(38, 1, .1, 120);
const cameraTarget = new THREE.Vector3(0, 1.1, 0);

const skyLight = new THREE.HemisphereLight(0xeaf8ff, 0x50643a, 2.35);
scene.add(skyLight);
const sun = new THREE.DirectionalLight(0xfff2cf, 3.2);
sun.position.set(-12, 24, 13);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -28;
sun.shadow.camera.right = 28;
sun.shadow.camera.top = 24;
sun.shadow.camera.bottom = -24;
scene.add(sun);

let seed = 9341;
const random = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const heightAt = (x, z) => {
  const ridge = Math.sin(x * .23) * 1.15 + Math.cos(z * .29) * .82 + Math.sin((x + z) * .14) * .75;
  const hill = Math.max(0, 3.4 - Math.hypot(x + 7, z + 2) * .22);
  return Math.max(.15, ridge * .45 + hill + .4);
};

const base = new THREE.Mesh(new THREE.BoxGeometry(40, 2.5, 30), new THREE.MeshStandardMaterial({ color: 0x4d4b30, roughness: 1, flatShading: true }));
base.position.y = -1.45;
base.receiveShadow = true;
scene.add(base);

const terrainGeo = new THREE.PlaneGeometry(40, 30, 28, 22);
const terrainPos = terrainGeo.attributes.position;
for (let i = 0; i < terrainPos.count; i++) {
  const x = terrainPos.getX(i), z = -terrainPos.getY(i);
  terrainPos.setZ(i, heightAt(x, z) + (random() - .5) * .25);
}
terrainGeo.rotateX(-Math.PI / 2);
terrainGeo.computeVertexNormals();
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ color: 0x7fb544, roughness: .98, flatShading: true }));
terrain.receiveShadow = true;
scene.add(terrain);

const roadPoints = [[-20, -6], [-13, -4.8], [-5, -2.5], [1, 0], [8, 2.2], [20, 4.5]].map(([x, z]) => new THREE.Vector3(x, heightAt(x, z) + .25, z));
const roadCurve = new THREE.CatmullRomCurve3(roadPoints);
const road = new THREE.Mesh(new THREE.TubeGeometry(roadCurve, 90, .58, 4, false), new THREE.MeshStandardMaterial({ color: 0x61666a, roughness: .9, flatShading: true }));
road.receiveShadow = true;
scene.add(road);
const roadLine = new THREE.Mesh(new THREE.TubeGeometry(roadCurve, 90, .065, 4, false), new THREE.MeshBasicMaterial({ color: 0xedf4f2 }));
roadLine.position.y = .49;
scene.add(roadLine);

const worldObjects = [];
const foliage = new THREE.Group();
scene.add(foliage);

function makeTree(x, z, scale = 1) {
  const group = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.13, .19, 1.25, 5), new THREE.MeshStandardMaterial({ color: 0x73532f, flatShading: true }));
  trunk.position.y = .62;
  const crownMaterial = new THREE.MeshStandardMaterial({ color: random() > .5 ? 0x315d29 : 0x416f31, roughness: 1, flatShading: true });
  const crownA = new THREE.Mesh(new THREE.ConeGeometry(.68, 1.75, 6), crownMaterial);
  const crownB = new THREE.Mesh(new THREE.ConeGeometry(.52, 1.45, 6), crownMaterial);
  crownA.position.y = 1.55;
  crownB.position.y = 2.28;
  group.add(trunk, crownA, crownB);
  group.position.set(x, heightAt(x, z), z);
  group.scale.setScalar(scale);
  group.rotation.y = random() * Math.PI;
  group.userData.kind = 'tree';
  group.traverse(object => { if (object.isMesh) { object.castShadow = true; object.receiveShadow = true; object.userData.root = group; } });
  foliage.add(group);
  worldObjects.push(group);
  return group;
}

for (let i = 0; i < 42; i++) {
  let x = random() * 35 - 17.5, z = random() * 24 - 12;
  if (Math.abs(z - x * .27) < 1.8) z += z > 0 ? 2.5 : -2.5;
  makeTree(x, z, .68 + random() * .58);
}

function makeHouse(x, z, color = 0x355f4b) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.7, 1.5, 2), new THREE.MeshStandardMaterial({ color, roughness: .85, flatShading: true }));
  body.position.y = .75;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.15, 1.1, 4), new THREE.MeshStandardMaterial({ color: 0x29353c, roughness: .9, flatShading: true }));
  roof.position.y = 1.95;
  roof.rotation.y = Math.PI / 4;
  group.add(body, roof);
  group.position.set(x, heightAt(x, z), z);
  group.rotation.y = -.18;
  group.userData.kind = 'house';
  group.traverse(object => { if (object.isMesh) { object.castShadow = true; object.receiveShadow = true; object.userData.root = group; } });
  scene.add(group);
  worldObjects.push(group);
  return group;
}

makeHouse(-6.8, 4.3);
makeHouse(7.5, -4.2, 0xd7d4b8);
makeHouse(2.8, 5.8, 0x3e7958);

function makeForm(x, z) {
  const form = new THREE.Mesh(
    new THREE.DodecahedronGeometry(1.15 + random() * .45, 0),
    new THREE.MeshStandardMaterial({ color: random() > .5 ? 0xec27da : 0xf4c62f, roughness: .75, flatShading: true })
  );
  form.position.set(x, heightAt(x, z) + 1.2, z);
  form.castShadow = true;
  form.userData.kind = 'form';
  form.userData.root = form;
  scene.add(form);
  worldObjects.push(form);
  return form;
}

function makePath() {
  const points = [[-11, 7], [-6, 5], [-2, 6], [3, 4], [8, 6]].map(([x, z]) => new THREE.Vector3(x, heightAt(x, z) + .22, z));
  const curve = new THREE.CatmullRomCurve3(points);
  const path = new THREE.Mesh(new THREE.TubeGeometry(curve, 54, .22, 4, false), new THREE.MeshStandardMaterial({ color: 0xd69a55, roughness: .9, flatShading: true }));
  path.receiveShadow = true;
  scene.add(path);
  return path;
}

const selected = makeTree(1.7, -3.6, 1.2);
let selectedObject = selected;
const selection = new THREE.BoxHelper(selected, 0x17ddd0);
scene.add(selection);
const ring = new THREE.Mesh(new THREE.RingGeometry(.8, 1.02, 32), new THREE.MeshBasicMaterial({ color: 0x17ddd0, side: THREE.DoubleSide, transparent: true, opacity: .9 }));
ring.rotation.x = -Math.PI / 2;
scene.add(ring);

const glassVolume = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(5.4, 4.2, 4.5)), new THREE.LineBasicMaterial({ color: 0x17ddd0, transparent: true, opacity: .3 }));
glassVolume.position.set(-8.2, heightAt(-8.2, -5.3) + 2.1, -5.3);
scene.add(glassVolume);

const rover = new THREE.Group();
const roverBody = new THREE.Mesh(new THREE.BoxGeometry(1.15, .42, .72), new THREE.MeshStandardMaterial({ color: 0xf4c62f, roughness: .75, flatShading: true }));
roverBody.castShadow = true;
rover.add(roverBody);
for (const x of [-.38, .38]) for (const z of [-.42, .42]) {
  const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.18, .18, .14, 8), new THREE.MeshStandardMaterial({ color: 0x182127, flatShading: true }));
  wheel.rotation.x = Math.PI / 2;
  wheel.position.set(x, -.18, z);
  rover.add(wheel);
}
scene.add(rover);

let playing = false;
let night = false;
let pathMade = false;
let orbitYaw = -.64;
let orbitPitch = .64;
let orbitRadius = innerWidth < 700 ? 31 : 35;
let pointerDown = false;
let pointerMoved = false;
let lastX = 0, lastY = 0;
let roverT = .12;
let wordTimer = 0;

function selectObject(object) {
  selectedObject = object;
  selection.setFromObject(object);
  ring.position.set(object.position.x, object.position.y + .06, object.position.z);
}

function showWords(words) {
  const element = document.querySelector('#worldWord');
  element.textContent = words;
  element.classList.add('show');
  document.querySelector('#question').classList.add('spoken');
  clearTimeout(wordTimer);
  wordTimer = setTimeout(() => element.classList.remove('show'), 2700);
}

function setPlaying(next) {
  playing = next;
  const button = document.querySelector('#play');
  button.classList.toggle('active', playing);
  button.textContent = playing ? 'STOP' : 'PLAY';
  document.querySelector('#worldStatus').textContent = playing ? 'WORLD ALIVE' : 'WORLD READY';
}

function speakIntoWorld(raw) {
  const words = raw.trim();
  if (!words) return;
  const command = words.toLowerCase();
  showWords(words);

  if (/\b(path|road|way|trail)\b/.test(command)) {
    if (!pathMade) { makePath(); pathMade = true; }
  } else if (/\b(tree|trees|forest|green)\b/.test(command)) {
    for (let i = 0; i < 5; i++) selectObject(makeTree(-5 + random() * 12, 3 + random() * 6, .78 + random() * .5));
  } else if (/\b(house|home|building|structure|shelter)\b/.test(command)) {
    selectObject(makeHouse(-3 + random() * 11, 3 + random() * 5, random() > .5 ? 0x355f4b : 0xd7d4b8));
  } else if (/\b(tall|higher|grow|rise)\b/.test(command)) {
    selectedObject.scale.y *= 1.5;
    selection.setFromObject(selectedObject);
  } else if (/\b(move|shift|elsewhere|there)\b/.test(command)) {
    selectedObject.position.x = -8 + random() * 16;
    selectedObject.position.z = -6 + random() * 12;
    selectedObject.position.y = heightAt(selectedObject.position.x, selectedObject.position.z);
    selectObject(selectedObject);
  } else if (/\b(more|clone|copy|again|five)\b/.test(command)) {
    selectObject(makeTree(selectedObject.position.x - 1.8, selectedObject.position.z + 1.6, selectedObject.scale.x || 1));
  } else if (/\b(night|dark|moon)\b/.test(command)) {
    night = true;
    scene.background.copy(nightColor);
    scene.fog.color.copy(nightColor);
    skyLight.intensity = .75;
    sun.intensity = .7;
  } else if (/\b(day|sun|light)\b/.test(command)) {
    night = false;
    scene.background.copy(dayColor);
    scene.fog.color.copy(dayColor);
    skyLight.intensity = 2.35;
    sun.intensity = 3.2;
  } else if (/\b(play|alive|run|begin|start)\b/.test(command)) {
    setPlaying(true);
  } else {
    selectObject(makeForm(-6 + random() * 12, -3 + random() * 9));
  }
}

document.querySelector('#say').addEventListener('submit', event => {
  event.preventDefault();
  const input = document.querySelector('#sayInput');
  speakIntoWorld(input.value);
  input.value = '';
  input.blur();
});
document.querySelector('#play').addEventListener('click', () => setPlaying(!playing));

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.querySelector('#mic');
if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = navigator.language || 'en-US';
  recognition.interimResults = false;
  recognition.onstart = () => mic.classList.add('listening');
  recognition.onend = () => mic.classList.remove('listening');
  recognition.onerror = () => mic.classList.remove('listening');
  recognition.onresult = event => speakIntoWorld(event.results[0][0].transcript);
  mic.addEventListener('click', () => recognition.start());
} else {
  mic.hidden = true;
  document.querySelector('.say').style.gridTemplateColumns = '1fr 54px';
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
canvas.addEventListener('pointerdown', event => {
  pointerDown = true;
  pointerMoved = false;
  lastX = event.clientX;
  lastY = event.clientY;
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', event => {
  if (!pointerDown) return;
  const dx = event.clientX - lastX, dy = event.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) pointerMoved = true;
  orbitYaw -= dx * .0055;
  orbitPitch = Math.max(.34, Math.min(1.02, orbitPitch + dy * .003));
  lastX = event.clientX;
  lastY = event.clientY;
});
canvas.addEventListener('pointerup', event => {
  pointerDown = false;
  if (!pointerMoved) {
    pointer.x = event.clientX / innerWidth * 2 - 1;
    pointer.y = -(event.clientY / innerHeight * 2 - 1);
    raycaster.setFromCamera(pointer, camera);
    const root = raycaster.intersectObjects(worldObjects, true)[0]?.object?.userData?.root;
    if (root) { selectObject(root); showWords((root.userData.kind || 'object') + ' selected'); }
  }
});

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < 700 ? 51 : 38;
  orbitRadius = innerWidth < 700 ? 31 : 35;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
function frame() {
  const time = clock.getElapsedTime();
  if (playing) orbitYaw -= .0007;
  camera.position.set(Math.sin(orbitYaw) * orbitRadius, Math.sin(orbitPitch) * orbitRadius * .72 + 3, Math.cos(orbitYaw) * orbitRadius);
  cameraTarget.y = innerWidth < 700 ? 1.5 : 1;
  camera.lookAt(cameraTarget);

  if (playing) roverT = (roverT + .0018) % 1;
  const roverPoint = roadCurve.getPoint(roverT);
  const roverNext = roadCurve.getPoint((roverT + .004) % 1);
  rover.position.copy(roverPoint).add(new THREE.Vector3(0, .78, 0));
  rover.lookAt(roverNext.x, rover.position.y, roverNext.z);
  rover.rotation.y += Math.PI / 2;

  selection.setFromObject(selectedObject);
  ring.position.set(selectedObject.position.x, selectedObject.position.y + .07, selectedObject.position.z);
  ring.scale.setScalar(1 + Math.sin(time * 2.8) * .08);
  foliage.children.forEach((tree, index) => { tree.rotation.z = Math.sin(time * .65 + index) * .012; });
  glassVolume.rotation.y = time * .035;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
