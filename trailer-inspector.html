<title>Ingold Trailer Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{
  --paper:#f2efe9; --sheet:#faf8f4; --rule:#d6d0c4; --rule-soft:#e6e1d6;
  --ink:#1b1d21; --ink-2:#4c5158; --ink-3:#7d8189;
  --accent:#0f8f96; --accent-soft:#0f8f9622;
  --unbuildable:#c8452e; --illegal:#b8830f; --unusable:#7b5ea7; --uncomfortable:#4b6b8a;
  --chassis:#8a6a3f; --structure:#4b6b8a; --envelope:#5b7a52; --opening:#a2683c;
  --roof:#7b5ea7; --circulation:#0f8f96;
  --sh:0 1px 2px #1b1d2110, 0 8px 24px #1b1d210c;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101315; --sheet:#161a1d; --rule:#2b3238; --rule-soft:#222831;
    --ink:#e8e6e1; --ink-2:#a2a8ae; --ink-3:#6f767d;
    --accent:#3fc9cf; --accent-soft:#3fc9cf22;
    --unbuildable:#e8674c; --illegal:#dda43a; --unusable:#a98cd4; --uncomfortable:#7ba0c4;
    --chassis:#c39b62; --structure:#7ba0c4; --envelope:#8fb083; --opening:#d0975f;
    --roof:#a98cd4; --circulation:#3fc9cf;
    --sh:0 1px 2px #0006, 0 8px 24px #0004;
  }
}
:root[data-theme="dark"]{
  --paper:#101315; --sheet:#161a1d; --rule:#2b3238; --rule-soft:#222831;
  --ink:#e8e6e1; --ink-2:#a2a8ae; --ink-3:#6f767d;
  --accent:#3fc9cf; --accent-soft:#3fc9cf22;
  --unbuildable:#e8674c; --illegal:#dda43a; --unusable:#a98cd4; --uncomfortable:#7ba0c4;
  --chassis:#c39b62; --structure:#7ba0c4; --envelope:#8fb083; --opening:#d0975f;
  --roof:#a98cd4; --circulation:#3fc9cf;
  --sh:0 1px 2px #0006, 0 8px 24px #0004;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5}
h1,h2,h3,.lab{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif}
.mono,td.num,.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sheet{max-width:1500px;margin:0 auto;padding:20px 18px 64px;display:grid;gap:14px;min-width:0}
.sheet>*{min-width:0}
header{border-bottom:1.5px solid var(--ink);padding-bottom:12px;
  display:flex;gap:20px;align-items:baseline;flex-wrap:wrap}
header h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
header .sub{color:var(--ink-2);font-size:13px;max-width:58ch}

.states{display:flex;gap:0;border:1px solid var(--rule);border-radius:3px;overflow:hidden;width:fit-content}
.states button{padding:8px 14px;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
  border-right:1px solid var(--rule);background:var(--sheet)}
.states button:last-child{border-right:0}
.states button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start;min-width:0}
.main>*{min-width:0}
@media (max-width:1080px){.main{grid-template-columns:minmax(0,1fr)}}

.frame{border:1px solid var(--rule);background:var(--sheet);border-radius:3px;box-shadow:var(--sh);
  position:relative;overflow:hidden}
.frame .bar{display:flex;gap:2px;padding:7px 9px;border-bottom:1px solid var(--rule-soft);
  align-items:center;flex-wrap:wrap}
.frame .bar button{padding:4px 9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;color:var(--ink-3);border-radius:2px}
.frame .bar button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
svg.draw{display:block;width:100%;height:auto;background:transparent;touch-action:none}
svg.draw polygon{cursor:pointer}
.hint{position:absolute;right:10px;bottom:10px;font-size:10.5px;color:var(--ink-3);
  background:var(--sheet);padding:3px 7px;border:1px solid var(--rule-soft);border-radius:2px}

.side{display:grid;gap:12px}
.card{border:1px solid var(--rule);background:var(--sheet);border-radius:3px;padding:11px 12px;
  box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.kv dt{color:var(--ink-3);font-size:11px;letter-spacing:.04em;padding-top:1px}
.kv dd{margin:0;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12px}

.fail{display:grid;gap:0;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.fail button{display:grid;grid-template-columns:4px 1fr;gap:0;text-align:left;width:100%;
  border-bottom:1px solid var(--rule-soft);background:var(--sheet)}
.fail button:last-child{border-bottom:0}
.fail button:hover,.fail button[aria-pressed="true"]{background:var(--accent-soft)}
.fail .stripe{width:4px;height:100%}
.fail .body{padding:8px 10px;display:grid;gap:3px}
.fail .top{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.fail .sev{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700}
.fail .sys{font-size:10px;letter-spacing:.06em;color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace}
.fail .id{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:13px}
.fail .txt{font-size:12px;color:var(--ink-2);line-height:1.45}
.fail .at{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}

.legend{display:flex;gap:5px;flex-wrap:wrap}
.legend button{display:flex;gap:5px;align-items:center;border:1px solid var(--rule);
  border-radius:2px;padding:3px 7px;font-size:11px}
.legend button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.legend i{width:9px;height:9px;border-radius:1px;display:block}
.legend .n{color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:10px}

.history{border:1px solid var(--rule);background:var(--sheet);border-radius:3px;box-shadow:var(--sh);
  overflow:hidden;min-width:0}
.history .hd{padding:9px 12px;border-bottom:1px solid var(--rule-soft);display:flex;
  justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.track{display:flex;gap:0;overflow-x:auto;padding:10px 12px;scrollbar-width:thin;max-width:100%}
.step{flex:0 0 236px;border-left:2px solid var(--rule);padding:0 12px;display:grid;gap:5px;
  align-content:start;text-align:left;background:none}
.step:hover,.step[aria-pressed="true"]{background:var(--accent-soft)}
.step.agentA{border-left-color:var(--unbuildable)}
.step.agentB{border-left-color:var(--accent)}
.step .n{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.step .who{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:700;font-size:12px}
.step .say{font-size:11.5px;color:var(--ink-2);line-height:1.4}
.step .delta{font-family:"IBM Plex Mono",monospace;font-size:11px}
.up{color:var(--unbuildable)}.down{color:var(--envelope)}.flat{color:var(--ink-3)}

.titleblock{border:1.5px solid var(--ink);border-radius:2px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--sheet)}
.titleblock div{padding:9px 12px;border-right:1px solid var(--rule)}
.titleblock div:last-child{border-right:0}
.titleblock b{display:block;font-family:"IBM Plex Sans Condensed",sans-serif;font-size:15px;
  font-weight:700;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;padding:4px 6px;border-bottom:1px solid var(--rule)}
td{padding:4px 6px;border-bottom:1px solid var(--rule-soft)}
td.num{text-align:right}
.scroll{max-height:230px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="sheet">
<header>
  <div>
    <h1>Ingold Trailer Survey</h1>
    <div class="sub">Every part, every defect, and every move the agents made &#8212; three states of the same
      trailer, drawn from the part data rather than photographed.</div>
  </div>
  <div style="margin-left:auto" class="states" id="states"></div>
</header>

<div class="main">
  <div>
    <div class="frame">
      <div class="bar" id="views"></div>
      <svg class="draw" id="draw" viewBox="0 0 1000 620" role="img" aria-label="Trailer drawing"></svg>
      <div class="hint" id="hint">click any part</div>
    </div>
    <div style="height:12px"></div>
    <div class="card">
      <h3>Systems</h3>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="side">
    <div class="card"><h3 id="failhd">Failures</h3><div class="fail" id="fails"></div></div>
    <div class="card" id="inspector"></div>
    <div class="card"><h3>Measured</h3><div id="measured"></div></div>
  </div>
</div>

<div class="history">
  <div class="hd">
    <div><span class="lab">Build history</span>
      <div id="histnote" style="font-size:12px;color:var(--ink-2);max-width:80ch"></div></div>
    <div class="legend" id="histtabs"></div>
  </div>
  <div class="track" id="track"></div>
</div>

<div class="titleblock" id="titleblock"></div>
</div>

<script>
'use strict';
const D=JSON.parse(document.getElementById('bundle').textContent);
const $=s=>document.querySelector(s);
const fx=(v,n=2)=>Number.isFinite(+v)?(+v).toFixed(n):'\u2014';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SYS=['chassis','structure','envelope','opening','roof','circulation'];
const SEV=['unbuildable','illegal','unusable','uncomfortable'];
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();

let stateKey='ingold', view='AXON', sel=null, selFail=null, sysFilter=null,
    histTrack='ingold', histStep=null;
const S=()=>D.states[stateKey];

/* ---- projection: parts are drawn as their oriented boxes, which is what a
   survey drawing is \u2014 an outline you can measure, not a render ------------- */
function corners(p){
  const s=p.size||[1,1,1], q=p.position||[0,0,0], r=p.rotation||[0,0,0];
  const k=(p.kind||'box').toLowerCase();
  let hx=s[0]/2,hy=s[1]/2,hz=s[2]/2;
  if(k==='cylinder'||k==='cone'){hx=hz=s[0]/2;hy=s[1]/2}
  if(k==='sphere'){const rr=Math.max(s[0],s[1],s[2])/2;hx=hy=hz=rr}
  const c=[Math.cos(r[0]||0),Math.cos(r[1]||0),Math.cos(r[2]||0)];
  const n=[Math.sin(r[0]||0),Math.sin(r[1]||0),Math.sin(r[2]||0)];
  const R=[[c[1]*c[2],-c[1]*n[2],n[1]],
           [n[0]*n[1]*c[2]+c[0]*n[2],-n[0]*n[1]*n[2]+c[0]*c[2],-n[0]*c[1]],
           [-c[0]*n[1]*c[2]+n[0]*n[2],c[0]*n[1]*n[2]+n[0]*c[2],c[0]*c[1]]];
  const out=[];
  for(const sx of[-hx,hx])for(const sy of[-hy,hy])for(const sz of[-hz,hz])
    out.push([q[0]+R[0][0]*sx+R[0][1]*sy+R[0][2]*sz,
              q[1]+R[1][0]*sx+R[1][1]*sy+R[1][2]*sz,
              q[2]+R[2][0]*sx+R[2][1]*sy+R[2][2]*sz]);
  return out;
}
const C30=Math.cos(Math.PI/6), S30=Math.sin(Math.PI/6);
const PROJ={
  AXON:{p:v=>[(v[0]-v[2])*C30,(v[0]+v[2])*S30-v[1]], d:v=>v[0]+v[1]+v[2], name:'axonometric'},
  FRONT:{p:v=>[v[0],-v[1]], d:v=>-v[2], name:'front elevation \u00b7 looking north'},
  SIDE:{p:v=>[-v[2],-v[1]], d:v=>-v[0], name:'end elevation \u00b7 looking east'},
  PLAN:{p:v=>[v[0],v[2]], d:v=>v[1], name:'plan \u00b7 looking down'}
};
function hull(pts){
  const P=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  for(let i=P.length-1;i>=0;i--){const p=P[i];
    while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  lo.pop();up.pop();return lo.concat(up);
}

function drawSheet(){
  const st=S(), pr=PROJ[view], W=1000,H=620,pad=54;
  const shapes=st.parts.map(p=>{
    const cs=corners(p), pts=cs.map(pr.p);
    return {p,hull:hull(pts),depth:Math.max(...cs.map(pr.d))};
  });
  const all=shapes.flatMap(s=>s.hull);
  const xs=all.map(a=>a[0]), ys=all.map(a=>a[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const k=Math.min((W-pad*2)/Math.max(1e-6,x1-x0),(H-pad*2)/Math.max(1e-6,y1-y0));
  const ox=(W-(x1-x0)*k)/2-x0*k, oy=(H-(y1-y0)*k)/2-y0*k;
  const T=a=>[a[0]*k+ox,a[1]*k+oy];
  shapes.sort((a,b)=>a.depth-b.depth);

  const failParts=new Set(selFail?selFail.parts:[]);
  const sevCol=selFail?cssv(selFail.severity):null;
  let svg='';
  /* ground line, because the whole question is what touches it */
  if(view!=='PLAN'){
    const g0=T(pr.p([x0/k,0,0])), g1=T(pr.p([x1/k,0,0]));
    const gy=T(view==='AXON'?pr.p([0,0,0]):[0,0])[1];
    svg+=`<line x1="20" y1="${T(pr.p([0,0,0]))[1]}" x2="${W-20}" y2="${T(pr.p([0,0,0]))[1]}"
      stroke="${cssv('rule')}" stroke-width="1.5" stroke-dasharray="6 4"/>`;
  }
  for(const s of shapes){
    const p=s.p, d=s.hull.map(T).map(a=>a[0].toFixed(1)+','+a[1].toFixed(1)).join(' ');
    const dim=sysFilter&&p.system!==sysFilter;
    const isSel=sel&&sel.id===p.id, inFail=failParts.has(p.id);
    const base=cssv(p.system);
    const fill=inFail?sevCol:base;
    const op=dim?0.06:inFail?0.42:isSel?0.5:0.18;
    const stroke=isSel?cssv('accent'):inFail?sevCol:dim?cssv('rule-soft'):cssv('ink-3');
    svg+=`<polygon points="${d}" fill="${fill}" fill-opacity="${op}" stroke="${stroke}"
      stroke-width="${isSel?2.4:inFail?1.6:0.8}" stroke-linejoin="round"
      data-id="${esc(p.id)}"><title>${esc(p.id)} \u00b7 ${esc(p.system)}</title></polygon>`;
  }
  if(selFail&&selFail.where){
    const w=selFail.where, box=[];
    for(const sx of[w.min[0],w.max[0]])for(const sy of[w.min[1],w.max[1]])for(const sz of[w.min[2],w.max[2]])
      box.push(pr.p([sx,sy,sz]));
    const h=hull(box).map(T).map(a=>a[0].toFixed(1)+','+a[1].toFixed(1)).join(' ');
    svg+=`<polygon points="${h}" fill="none" stroke="${sevCol}" stroke-width="1.4"
      stroke-dasharray="7 5" opacity=".85"/>`;
  }
  svg+=`<text x="20" y="${H-16}" font-family="IBM Plex Mono, monospace" font-size="11"
    fill="${cssv('ink-3')}" letter-spacing="1">${pr.name.toUpperCase()} \u00b7 1 unit = 1 m \u00b7 parts drawn as oriented boxes</text>`;
  $('#draw').innerHTML=svg;
  $('#draw').querySelectorAll('polygon[data-id]').forEach(el=>
    el.addEventListener('click',()=>{ sel=S().parts.find(p=>p.id===el.dataset.id); render() }));
}

function severityDot(s){ return `<i style="background:${cssv(s)}"></i>` }

function render(){
  const st=S();
  $('#states').innerHTML=Object.entries(D.states).map(([k,v])=>
    `<button aria-pressed="${k===stateKey}" data-k="${k}">${k==='correspondence'?'as built by the loop'
      :k==='completed'?'hand-completed':'after the ingold loop'}</button>`).join('');
  $('#states').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    stateKey=b.dataset.k; sel=null; selFail=null;
    histTrack = stateKey==='correspondence'?'correspondence':'ingold'; histStep=null; render();});

  $('#views').innerHTML=Object.keys(PROJ).map(v=>
    `<button aria-pressed="${v===view}" data-v="${v}">${v}</button>`).join('')+
    `<span style="margin-left:auto;font-size:11px;color:var(--ink-3)" class="mono">${st.parts.length} parts \u00b7 ${esc(st.caption)}</span>`;
  $('#views').querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});

  const counts={}; for(const p of st.parts) counts[p.system]=(counts[p.system]||0)+1;
  $('#legend').innerHTML=SYS.filter(s=>counts[s]).map(s=>{
    const fs=st.failures.filter(f=>String(f.system).split(' / ').includes(s)).length;
    return `<button aria-pressed="${sysFilter===s}" data-s="${s}">
      <i style="background:${cssv(s)}"></i>${s}<span class="n">${counts[s]}${fs?' \u00b7 '+fs+'\u2691':''}</span></button>`;
  }).join('');
  $('#legend').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    sysFilter=sysFilter===b.dataset.s?null:b.dataset.s; render()});

  $('#failhd').textContent=st.failures.length?st.failures.length+' failures, worst first':'no failures';
  $('#fails').innerHTML=st.failures.map((f,i)=>
    `<button data-i="${i}" aria-pressed="${selFail&&selFail.id===f.id}">
      <span class="stripe" style="background:${cssv(f.severity)}"></span>
      <span class="body">
        <span class="top"><span class="sev" style="color:${cssv(f.severity)}">${f.severity}</span>
          <span class="id">${f.id}</span><span class="sys">${esc(f.system)}</span></span>
        <span class="txt">${esc(f.text)}</span>
        ${f.where?`<span class="at">x ${f.where.min[0]}\u2026${f.where.max[0]}  y ${f.where.min[1]}\u2026${f.where.max[1]}  z ${f.where.min[2]}\u2026${f.where.max[2]}</span>`:''}
      </span></button>`).join('')||'<div style="padding:10px;color:var(--ink-3)">nothing fails</div>';
  $('#fails').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const f=st.failures[+b.dataset.i];
    selFail=(selFail&&selFail.id===f.id)?null:f; sel=null; render()});

  /* inspector */
  let ins='';
  if(sel){
    const touching=st.failures.filter(f=>(f.parts||[]).includes(sel.id));
    ins=`<h3>${esc(sel.id)}</h3><dl class="kv">
      <dt>system</dt><dd>${esc(sel.system)}</dd>
      <dt>role</dt><dd>${esc(sel.role||'\u2014')}</dd>
      <dt>kind</dt><dd>${esc(sel.kind)}</dd>
      <dt>position</dt><dd>${sel.position.map(v=>fx(v)).join('  ')}</dd>
      <dt>size</dt><dd>${sel.size.map(v=>fx(v)).join('  ')}</dd>
      <dt>rotation</dt><dd>${sel.rotation.map(v=>fx(v,3)).join('  ')}</dd>
      <dt>locked</dt><dd>${sel.locked?'yes \u2014 given chassis':'no'}</dd></dl>`;
    ins+=touching.length
      ? `<div style="margin-top:9px" class="lab">implicated in</div>`+
        touching.map(f=>`<div style="font-size:12px;margin-top:3px">
          <span style="color:${cssv(f.severity)}">\u25cf</span> ${f.id} <span class="mono"
          style="color:var(--ink-3);font-size:11px">${esc(f.system)}</span></div>`).join('')
      : `<div style="margin-top:9px;font-size:12px;color:var(--ink-3)">no failure names this part</div>`;
  } else if(selFail){
    ins=`<h3 style="color:${cssv(selFail.severity)}">${selFail.id}</h3>
      <div style="font-size:12.5px;color:var(--ink-2)">${esc(selFail.text)}</div>
      <div style="margin-top:9px" class="lab">system</div><div class="mono">${esc(selFail.system)}</div>`;
    if(selFail.where) ins+=`<div style="margin-top:9px" class="lab">extent</div>
      <div class="mono" style="font-size:11.5px">x ${selFail.where.min[0]} \u2026 ${selFail.where.max[0]}<br>
      y ${selFail.where.min[1]} \u2026 ${selFail.where.max[1]}<br>
      z ${selFail.where.min[2]} \u2026 ${selFail.where.max[2]}</div>`;
    if(selFail.parts.length) ins+=`<div style="margin-top:9px" class="lab">parts</div>
      <div class="mono" style="font-size:11.5px;line-height:1.7">${selFail.parts.map(esc).join('<br>')}</div>`;
  } else if(histStep){ ins=histStep; }
  else ins=`<h3>Inspector</h3><div style="font-size:12.5px;color:var(--ink-2)">
    Pick a part in the drawing, a failure above, or a step in the history. Selecting a failure outlines
    where it happens and stains the parts it names.</div>`;
  $('#inspector').innerHTML=ins;

  /* measured */
  const r=st.report;
  $('#measured').innerHTML=`<table><tbody>
    <tr><td>wheels on the road</td><td class="num">${r.wheels.touching}/${r.wheels.count}</td></tr>
    <tr><td>lowest wheel above grade</td><td class="num">${fx(r.wheels.clearance)} m</td></tr>
    <tr><td>towing width</td><td class="num" style="color:${r.road.passesWidth?'':cssv('illegal')}">${fx(r.road.width)} m / 2.59</td></tr>
    <tr><td>towing height</td><td class="num">${fx(r.road.height)} m / 4.12</td></tr>
    <tr><td>door clear</td><td class="num" style="color:${r.door.passesWidth&&r.door.passesHeight?'':cssv('unusable')}">${fx(r.door.clearWidth)} \u00d7 ${fx(r.door.clearHeight)} m</td></tr>
    <tr><td>rise to floor</td><td class="num" style="color:${r.step.passes?'':cssv('unusable')}">${fx(r.step.totalRise)} m in ${r.step.risers||0}</td></tr>
    <tr><td>enclosed volume</td><td class="num" style="color:${r.envelope.enclosed>0?'':cssv('unusable')}">${fx(r.envelope.enclosed)} m\u00b3</td></tr>
    <tr><td>air reaching indoors</td><td class="num">${fx(r.envelope.leak)} m\u00b3</td></tr>
    <tr><td>parts reaching ground</td><td class="num">${r.loadPath.grounded}/${r.loadPath.total}</td></tr>
    <tr><td>gross interpenetrations</td><td class="num" style="color:${r.collisions.gross?cssv('unbuildable'):''}">${r.collisions.gross}</td></tr>
    <tr><td>moderate overlaps</td><td class="num">${r.collisions.moderate}</td></tr>
    </tbody></table>`;

  renderHistory();
  drawSheet();
}

/* ---- the back and forth ---------------------------------------------------
   Two histories, because two different loops made this thing. The
   correspondence loop is an argument between a critic and a builder about a
   photograph. The Ingold loop is a program arguing with a tape measure. ---- */
function renderHistory(){
  const tracks={correspondence:'critic \u2194 builder \u00b7 7 cycles',ingold:'read \u2194 repair \u00b7 17 cycles'};
  $('#histtabs').innerHTML=Object.entries(tracks).map(([k,v])=>
    `<button aria-pressed="${histTrack===k}" data-h="${k}">${k}<span class="n">${v.split('\u00b7')[1]}</span></button>`).join('');
  $('#histtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    histTrack=b.dataset.h; histStep=null; render()});

  let steps=[];
  if(histTrack==='correspondence'){
    $('#histnote').textContent='The cabin session, 03:04Z. A critic names one worst thing in one view; '+
      'the builder patches only that. A low score does not mean good \u2014 it means this target survived '+
      'this look, so move the camera.';
    const L=D.correspondence.cyclesLog;
    L.forEach((c,i)=>{
      if(c.build) steps.push({cls:'agentB',n:'cycle '+c.cycle+' \u00b7 builder',
        who:(c.build.changed!=null?c.build.changed+' parts changed':'whole world rebuilt'),
        say:c.build.summary,
        detail:`<h3>Builder \u00b7 cycle ${c.cycle}</h3>
          <div class="lab">it was told</div><div style="font-size:12.5px;color:var(--ink-2)">\u201c${esc(L[i-1]?L[i-1].killer:'no critic message yet')}\u201d</div>
          <div class="lab" style="margin-top:9px">it did</div><div style="font-size:12.5px">${esc(c.build.summary)}</div>
          <dl class="kv" style="margin-top:9px"><dt>changed</dt><dd>${c.build.changed==null?'whole world':c.build.changed+' parts'}</dd></dl>`});
      steps.push({cls:'agentA',n:'cycle '+c.cycle+' \u00b7 critic \u00b7 '+esc(c.view||''),
        who:c.state==='LOCKED'?'TARGET LOCKED \u00b7 suck '+c.suck:'target survived \u00b7 suck '+c.suck,
        say:c.focus,
        detail:`<h3>Critic \u00b7 cycle ${c.cycle}</h3>
          <dl class="kv"><dt>view</dt><dd>${esc(c.view||'\u2014')}</dd><dt>suck</dt><dd>${c.suck}</dd>
          <dt>verdict</dt><dd>${esc(c.state)}</dd><dt>target</dt><dd>${esc(c.focus)}</dd></dl>
          <div class="lab" style="margin-top:9px">accusation, verbatim</div>
          <div style="font-size:12.5px;color:var(--ink-2)">\u201c${esc(c.killer||'')}\u201d</div>
          <div style="margin-top:9px;font-size:11.5px;color:var(--ink-3)">
            ${c.state==='LOCKED'?'High score means a target was found. The builder runs next.'
              :'Low score means this target survived this look. The camera moves; the builder does not run.'}</div>`});
    });
  } else {
    $('#histnote').textContent='The Ingold loop reads the geometry, names the worst failure with its '+
      'system and its coordinates, makes one deterministic repair, and reads again. It refuses when the '+
      'problem is upstream of any repair.';
    D.ingoldTrace.forEach(t=>{
      const ref=!!t.refused;
      steps.push({cls:ref?'agentA':'agentB',n:'cycle '+t.cycle+' \u00b7 '+t.failure,
        who:ref?'REFUSED':(t.repair?t.repair.op:'no repair available'),
        say:ref?t.refused:(t.repair?t.repair.text:t.note||''),
        delta:t.after?t.after.length:null,
        detail:`<h3>${ref?'Refused':'Repair'} \u00b7 cycle ${t.cycle}</h3>
          <div class="lab">failure</div><div class="mono">${esc(t.failure)}</div>
          ${t.repair?`<div class="lab" style="margin-top:9px">operation</div>
            <div class="mono">${esc(t.repair.op)}</div>
            <div style="font-size:12.5px;color:var(--ink-2);margin-top:4px">${esc(t.repair.text)}</div>`:''}
          ${ref?`<div style="font-size:12.5px;color:var(--ink-2);margin-top:6px">${esc(t.refused)}</div>`:''}
          ${t.after?`<div class="lab" style="margin-top:9px">left standing</div>
            <div class="mono" style="font-size:11.5px;line-height:1.7">${t.after.map(esc).join('<br>')||'nothing'}</div>`:''}`});
    });
  }
  $('#track').innerHTML=steps.map((s,i)=>
    `<button class="step ${s.cls}" data-i="${i}" aria-pressed="${histStep===s.detail}">
      <span class="n">${s.n}</span><span class="who">${esc(s.who)}</span>
      <span class="say">${esc(String(s.say||'').slice(0,150))}</span>
      ${s.delta!=null?`<span class="delta ${s.delta>0?'up':'flat'}">${s.delta} failures left</span>`:''}
    </button>`).join('');
  $('#track').querySelectorAll('.step').forEach(b=>b.onclick=()=>{
    const d=steps[+b.dataset.i].detail;
    histStep=histStep===d?null:d; sel=null; selFail=null; render()});
}

function boot(){
  const st=D.states.ingold, c=D.cost.total;
  $('#titleblock').innerHTML=`
    <div><span class="lab">Subject</span><b>Tiny house on a 6.1 m trailer</b></div>
    <div><span class="lab">Chassis</span><b>9 locked parts, given</b></div>
    <div><span class="lab">Correspondence loop</span><b>${D.cost.perLog.find(l=>l.log==='cabin').apiCalls} calls \u00b7 ${D.cost.perLog.find(l=>l.log==='cabin').inputKB} KB</b></div>
    <div><span class="lab">Ingold loop</span><b>0 calls \u00b7 17 cycles</b></div>
    <div><span class="lab">Verdict</span><b style="color:var(--unbuildable)">${st.failures.length} failures</b></div>`;
  render();
}
boot();
</script>
