      if (live) {
        A(0.85); ctx.fillStyle = MAT.sand2;
        for (var c2 = 0; c2 < 4; c2++) {
          var ph2 = ((now * 0.004 + c2 * 0.25 + le.id * 0.13) % 1);
          ctx.beginPath();
          ctx.ellipse(-2 - ph2 * 16, (hash(le.id + c2) - 0.5) * hw * 1.2 + ph2 * 3,
            1.8 * (1 - ph2 * 0.5), 1.4, 0, 0, TAU);
          ctx.fill();
        }
      }
      ctx.restore();
      /* THE SPOIL. What has come out is heaped at the mouth and it stays there:
         a tunnel you can see was dug, by somebody, at a cost. */
      var heap = clamp(pr * 1.4 + (e.spoil || 0), 0.06, 1);
      var mo = Math.atan2(f.y - mouth.y, f.x - mouth.x);
      ctx.save();
      ctx.translate(mouth.x + Math.cos(mo) * 5, mouth.y + Math.sin(mo) * 5);
      ctx.rotate(mo);
      A(0.9); ctx.fillStyle = MAT.sand2;
      ctx.beginPath();
      ctx.moveTo(-6, hw * 0.9);
      ctx.quadraticCurveTo(0, hw * 0.9 - 5 - heap * 9, 7 + heap * 5, hw * 0.9);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-6, -hw * 0.9);
      ctx.quadraticCurveTo(0, -hw * 0.9 + 5 + heap * 9, 7 + heap * 5, -hw * 0.9);
      ctx.closePath(); ctx.fill();
      A(0.5); ctx.fillStyle = MAT.soil3;
      for (var g = 0; g < Math.round(heap * 8) + 2; g++) {
        var gx2 = -4 + hash(le.id + g * 3.7) * 12;
        var gy2 = (g % 2 ? 1 : -1) * (hw * 0.9 - 1 - hash(g + le.id) * heap * 8);
        ctx.beginPath(); ctx.ellipse(gx2, gy2, 1.5, 1.2, 0, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }

  /* ------------------------------------------------------- drawn intentions */
  function edgeById(id) {
    if (!L) return null;
    for (var i = 0; i < L.edges.length; i++) if (L.edges[i].id === id) return L.edges[i];
    return null;
  }
  function drawIntent(S, agents) {
    ctx.setLineDash([2, 4]); ctx.lineWidth = 1.3; ctx.strokeStyle = SIG.blue;
    for (var i = 0; i < agents.length; i++) {
      var a = agents[i], r = a.route;
      if (!r || !r.length) continue;
      var cur = a.at;
      if (cur == null && a.edge != null) {
        var e0 = edgeById(a.edge);
        if (e0) cur = a.dir > 0 ? e0.b : e0.a;
      }
      if (cur == null) continue;
      A(0.7);
      ctx.beginPath();
      ctx.moveTo(AX(a), AY(a));
      var n0 = L.nodes[cur];
      if (n0) ctx.lineTo(n0.x, n0.y);
      for (var k = 0; k < r.length && k < 9; k++) {
        var le = edgeById(r[k]);
        if (!le) break;
        var nxt = (le.a === cur) ? le.b : le.a;
        var nn = L.nodes[nxt];
        if (!nn) break;
        ctx.lineTo(nn.x, nn.y);
        cur = nxt;
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------------ what the passages are like
     Wear is a road the colony has chosen; a jam is a road it cannot get down.
     Both are drawn on the floor, in earth, and neither has a number. */
  function drawRoads(S) {
    if (!L) return;
    for (var i = 0; i < L.edges.length; i++) {
      var le = L.edges[i], e = le.ref;
      if (!e.dug) continue;
      /* A JAMMED PASSAGE NEEDS NO OVERLAY. The bodies wedged in it, shoulder to
         shoulder and not moving, are the jam — AESTHETIC §0. What used to be
         drawn here was a dashed band across the tunnel that read as rungs on a
         ladder, a second explanation of something the picture already showed. */
    }
    /* a chamber no tunnel reaches. Nobody is coming, and you can see why. */
    for (i = 0; i < L.nodes.length; i++) {
      var n = L.nodes[i];
      if (!n.ref || n.ref.comp === undefined) continue;
      var cut = L.edges.length && n.ref.comp !== (S.nest ? S.nest.main : n.ref.comp);
      if (!cut) continue;
      A(0.5); ctx.strokeStyle = MAT.ink; ctx.lineWidth = 1.2;
      ctx.setLineDash([2, 4]);
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 4, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
  }


  /* -------------------------------------------------------------- the earth */
  function rebuildNest() {
    var g = nx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.drawImage(earth, 0, 0);
    var i;

    /* packed earth immediately around every excavation: spoil pressed into the
       wall, darker than the soil, so a tunnel reads as a hole and not a light */
    mxx.setTransform(1, 0, 0, 1, 0, 0);
    mxx.globalCompositeOperation = 'source-over'; mxx.globalAlpha = 1;
    mxx.clearRect(0, 0, W, H);
    mxx.fillStyle = MAT.soil3; mxx.fillRect(0, 0, W, H);
    mxx.globalCompositeOperation = 'destination-in';
    try { mxx.filter = 'blur(4px)'; } catch (e1) { }
    mxx.drawImage(dig, 0, 0, W, H);
    try { mxx.filter = 'none'; } catch (e2) { }
    g.globalAlpha = 0.9; g.drawImage(mix, 0, 0); g.globalAlpha = 1;

    /* the excavated floor itself, eroded a little tighter than the rim */
    mxx.globalCompositeOperation = 'source-over';
    mxx.clearRect(0, 0, W, H);
    mxx.drawImage(floor2, 0, 0);
    mxx.globalCompositeOperation = 'destination-in';
    mxx.drawImage(dig, 0, 0, W, H);
    mxx.drawImage(dig, 0, 0, W, H);
    g.drawImage(mix, 0, 0);

    /* the wall casts a shadow onto its own floor, which is what makes a chamber
       read as a room you are looking into rather than a hole punched in a page */
    mxx.globalCompositeOperation = 'source-over';
    mxx.clearRect(0, 0, W, H);
    mxx.fillStyle = MAT.soil3; mxx.fillRect(0, 0, W, H);
    mxx.globalCompositeOperation = 'destination-in';
    try { mxx.filter = 'blur(3px)'; } catch (e3) { }
    mxx.drawImage(dig, 0, 0, W, H);
    try { mxx.filter = 'none'; } catch (e4) { }
    mxx.globalCompositeOperation = 'destination-out';
    mxx.drawImage(dig, 0, 0, W, H);
    mxx.drawImage(dig, 0, 0, W, H);
    mxx.drawImage(dig, 0, 0, W, H);
    g.globalAlpha = 0.55; g.drawImage(mix, 0, 0); g.globalAlpha = 1;

    /* spoil heaps and pebbles in the dead ends nobody uses */
    if (L && L.spurs) {
      for (i = 0; i < L.spurs.length; i++) {
        var sp = L.spurs[i];
        for (var d = 0; d < 4; d++) {
          var an = hash(sp.s * 3.9 + d) * TAU, rr = hash(sp.s + d * 2.2) * sp.r * 0.7;
          var px = sp.x + Math.cos(an) * rr, py = sp.y + Math.sin(an) * rr;
          g.globalAlpha = 0.5; g.fillStyle = d % 2 ? MAT.soil3 : MAT.ink2;
          g.beginPath(); g.ellipse(px, py, 1.6 + hash(d + sp.s) * 1.8, 1.3 + hash(d) * 1.2, an, 0, TAU); g.fill();
        }
      }
      g.globalAlpha = 1;
    }

    /* everything the colony remembers: scars, stamps, stains */
    g.drawImage(mem, 0, 0);

    crust(g);
    nestDirty = false;
  }

  /* the cutaway read, in one band: this is the ground, and that is the way in */
  function crust(g) {
    var hgt = 13;
    g.globalAlpha = 1; g.fillStyle = MAT.soil3;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, hgt);
    for (var x = W; x >= 0; x -= 10) g.lineTo(x, hgt - 2 + hash(x * 0.31) * 5);
    g.closePath(); g.fill();
    g.globalAlpha = 0.9; g.strokeStyle = MAT.ink; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(0, 1); g.lineTo(W, 1); g.stroke();
    /* tufts above the line */
    g.globalAlpha = 0.55; g.lineWidth = 1.2;
    for (var t = 0; t < 9; t++) {
      var gx = (t + 0.5) * (W / 9) + hash(t * 3.7) * 8;
      g.beginPath(); g.moveTo(gx, 5); g.quadraticCurveTo(gx + 2, 2, gx + 4 + hash(t) * 3, 0); g.stroke();
      g.beginPath(); g.moveTo(gx, 5); g.quadraticCurveTo(gx - 2, 2, gx - 3 - hash(t + 2) * 3, 0); g.stroke();
    }
    /* the entrance: a spoil mound and a hole */
    if (L) {
      var ex = L.entry.x;
      g.globalAlpha = 0.9; g.fillStyle = MAT.sand2;
      g.beginPath(); g.moveTo(ex - 17, hgt + 1); g.quadraticCurveTo(ex, 1, ex + 17, hgt + 1); g.closePath(); g.fill();
      g.globalAlpha = 1; g.fillStyle = MAT.ink;
      g.beginPath(); g.ellipse(ex, hgt - 1, 5.5, 3.2, 0, 0, TAU); g.fill();
    }
    g.globalAlpha = 1;
  }

  /* ---------------------------------------------------------- memory layer
     Architecture is history. Every instrument you land carves its own silhouette
     into the wall; every failure you miss collapses the tunnel and leaves rubble.
     Nothing here is ever erased inside a run. */
  function memStamp(kind, x, y) {
    var g = mx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.strokeStyle = MAT.ink; g.fillStyle = MAT.ink;
    g.lineWidth = 1.8; g.lineCap = 'butt'; g.globalAlpha = 0.5;
    if (kind === 'charter') {
      g.beginPath(); g.arc(x, y, 11, Math.PI, 0); g.stroke();
      g.beginPath(); g.moveTo(x - 11, y); g.lineTo(x - 11, y + 9);
      g.moveTo(x + 11, y); g.lineTo(x + 11, y + 9); g.stroke();
    } else if (kind === 'ledger') {
      for (var i = 0; i < 4; i++) { g.beginPath(); g.moveTo(x - 8 + i * 4, y - 7); g.lineTo(x - 8 + i * 4, y + 7); g.stroke(); }
      g.beginPath(); g.moveTo(x - 11, y + 7); g.lineTo(x + 8, y - 7); g.stroke();
    } else if (kind === 'lens') {
      g.beginPath(); g.moveTo(x - 11, y); g.quadraticCurveTo(x, y - 9, x + 11, y);
      g.quadraticCurveTo(x, y + 9, x - 11, y); g.stroke();
      g.beginPath(); g.arc(x, y, 3, 0, TAU); g.fill();
    } else if (kind === 'slow') {
      g.beginPath(); g.moveTo(x - 9, y + 8); g.quadraticCurveTo(x - 9, y - 8, x, y - 8);
      g.quadraticCurveTo(x + 9, y - 8, x + 9, y + 8); g.closePath(); g.stroke();
      g.beginPath(); g.moveTo(x - 12, y + 8); g.lineTo(x + 12, y + 8); g.stroke();
    } else if (kind === 'vary') {
      g.beginPath(); g.moveTo(x, y + 9); g.lineTo(x, y - 1);
      g.moveTo(x, y - 1); g.lineTo(x - 8, y - 9);
      g.moveTo(x, y - 1); g.lineTo(x + 8, y - 9);
      g.moveTo(x, y + 3); g.lineTo(x + 6, y - 2); g.stroke();
    } else if (kind === 'eject') {
      g.beginPath(); g.moveTo(x - 11, y - 8); g.lineTo(x - 11, y + 8);
      g.moveTo(x + 11, y - 8); g.lineTo(x + 11, y + 8); g.stroke();
      g.globalAlpha = 0.3;
      for (var k = -6; k <= 6; k += 4) { g.beginPath(); g.moveTo(x + k, y - 7); g.lineTo(x + k - 3, y + 7); g.stroke(); }
    }
    g.globalAlpha = 1;
    nestDirty = true;
  }
  /* a miss: the roof comes in. Rubble in earth tones, a red hatch that says it
     landed, and the element's own primitive mark scratched beside it. */
  function memScar(sym, x, y) {
    var g = mx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    var i;
    g.globalAlpha = 0.85; g.fillStyle = MAT.soil3;
    for (i = 0; i < 9; i++) {
      var an = hash(x + i * 3.1) * TAU, rr = 4 + hash(y + i * 5.7) * 15;
      var px = x + Math.cos(an) * rr, py = y + Math.sin(an) * rr;
      g.beginPath();
      g.moveTo(px, py - 3 - hash(i) * 2); g.lineTo(px + 3 + hash(i + 1) * 2, py + 2); g.lineTo(px - 3, py + 3);
      g.closePath(); g.fill();
    }
    g.globalAlpha = 0.38; g.strokeStyle = SIG.red; g.lineWidth = 1.3;
    for (i = 0; i < 3; i++) {
      g.beginPath(); g.moveTo(x - 7 + i * 5, y + 8); g.lineTo(x - 2 + i * 5, y - 8); g.stroke();
    }
    var im = sym ? glyph(sym, MAT.ink) : null;
    if (im) { g.globalAlpha = 0.42; g.drawImage(im, x + 11, y - 9, 17, 17); }
    g.globalAlpha = 1;
    nestDirty = true;
  }
  /* water rises, water falls, the tidemark stays */
  function memTide(level) {
    var g = mx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 0.2; g.strokeStyle = MAT.soil3; g.lineWidth = 2;
    g.beginPath();
    for (var x = 0; x <= W; x += 9) {
      var y = level + Math.sin(x * 0.09 + level) * 2;
      if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
    g.globalAlpha = 1;
    nestDirty = true;
  }

  /* ================================================================== beats */
  function push(b) { b.t = now || performance.now(); beats.push(b); if (beats.length > 26) beats.splice(0, beats.length - 26); }

  function wire() {
    if (wired || !window.FZ || !FZ.bus) return;
    wired = true;
    /* A detector firing is a small physical event, not an announcement: dust, a
       flinch. The outbreak that opens on top of it does all the naming. */
    FZ.bus.on('fire', function (d) {
      if (!d || !d.at) return;
      push({ k: 'jolt', x: d.at.x, y: d.at.y, who: idsOf(d.who), life: 620 });
    });
    FZ.bus.on('job:done', function (d) { if (d) push({ k: 'haul', x: d.x, y: d.y, v: d.value || 1, life: 900 }); });
    FZ.bus.on('job:lost', function (d) {
      if (!d) return;
      var n = 0;
      for (var i = beats.length - 1; i >= 0; i--) if (beats[i].k === 'spill' && ++n > 3) beats.splice(i, 1);
      push({ k: 'spill', x: d.x, y: d.y, life: 820 });
    });
    FZ.bus.on('agent:hurt', function (d) {
      if (!d) return;
      push({ k: 'hurt', x: d.x, y: d.y, life: 560 });
      if (d.id !== undefined) hurtAt.set(d.id, performance.now());
    });
    FZ.bus.on('intervene', function (d) {
      if (!d || d.x === undefined || d.x === null) return;
      push({ k: 'act', x: d.x, y: d.y, ok: !!d.ok, kind: d.kind, life: 700 });
      if (d.ok && d.kind && mx) memStamp(d.kind, X(d.x), Y(d.y));
    });
    FZ.bus.on('outbreak:open', function (d) { if (d) push({ k: 'open', x: d.x, y: d.y, life: 560 }); });
    FZ.bus.on('outbreak:answered', function (d) {
      if (!d) return;
      push({ k: 'shut', x: d.x, y: d.y, r: d.r || 60, life: 900 });
    });
    FZ.bus.on('outbreak:landed', function (d) {
      if (!d) return;
      push({ k: 'burst', x: d.x, y: d.y, r: d.r || 60, life: 900 });
      if (dx) collapseAt(X(d.x), Y(d.y), 17);
      if (mx) memScar(d.sym, X(d.x), Y(d.y));
    });
    FZ.bus.on('conflict:resolved', function (d) {
      if (d) push({ k: 'end', x: d.x, y: d.y, mode: d.mode, life: 1100 });
    });
  }

  /* ================================================================ the ants
     Bodies, not dots. Gait, antennae, load, posture and markings, all of it
     driven by state the sim already computes. This is where "idle: 7" dies. */
  function bodyOf(id) {
    var b = bodies.get(id);
    if (!b) { b = { ang: hash(id * 3.3) * TAU, ph: hash(id) * 6, mov: 0, k: hash(id * 9.1) }; bodies.set(id, b); }
    return b;
  }
  function antScale(n) { return clamp(Math.sqrt((W * H) / (370 * 560)) * (n > 26 ? 0.82 : n > 16 ? 0.92 : 1), 0.72, 1.28); }

  /* THE POSTURE VOCABULARY. SIM chooses one word per worker per tick and the
     word is the whole drawing: how the legs are set, where the antennae are,
     how the body leans. During a burning incident the posture is FROZEN, so
     the bodies stop being animation and become a diagram of the failure you
     are being asked to name — a line of waiting workers, two braced against
     each other, five wedged in a doorway. */
  var POSE = {
    carry: { gait: 0, brace: -0.4, droop: 0.2, lean: 0.5, splay: 0, work: 1 },
    haul: { gait: 1, brace: 0, droop: 0.3, lean: 0.3, splay: 0, work: 1 },
    tug: { gait: 0, brace: -1.5, droop: 0.1, lean: -1.6, splay: 1.5, work: 1 },
    jam: { gait: 0.25, brace: 1.4, droop: 2.6, lean: 0, splay: 2.2, work: 0 },
    wait: { gait: 0, brace: -0.2, droop: 1.9, lean: 0, splay: 0.2, work: 0 },
    guard: { gait: 0, brace: -0.9, droop: 0.1, lean: 0.8, splay: 1.6, work: 0 },
    march: { gait: 1.2, brace: 0, droop: 0, lean: 0.4, splay: 0, work: 0 },
    chase: { gait: 1.4, brace: 0.3, droop: 0, lean: 1.2, splay: 0, work: 0 },
    dig: { gait: 0.3, brace: -1.2, droop: 0.4, lean: 1.4, splay: 1.1, work: 2 },
    wander: { gait: 0.7, brace: 0, droop: 1.6, lean: 0, splay: 0, work: 0 },
    idle: { gait: 0, brace: -0.4, droop: 2.7, lean: -0.4, splay: 0.6, work: 0 },
    down: { gait: 0, brace: 1.1, droop: 3, lean: 0, splay: 2.4, work: 0 }
  };

  function drawAnt(a, S, sc, dim, frozen) {
    var x = AX(a), y = AY(a);
    var b = bodyOf(a.id);
    var held = (a.hold && a.hold.length) ? a.hold.length : 0;
    var stunned = (a.stun || 0) > 0;
    var gave = !!a.gaveUp;
    var own = (a.terr || 0) > 0.5;

    /* heading and gait come from where the body actually went in the nest */
    var mx2 = b.px === undefined ? 0 : x - b.px, my2 = b.py === undefined ? 0 : y - b.py;
    var spd = Math.sqrt(mx2 * mx2 + my2 * my2);
    b.px = x; b.py = y;
    if (spd > 0.25) { b.ang = angLerp(b.ang, Math.atan2(my2, mx2), 0.3); b.mov = b.mov * 0.84 + 0.16; }
    else b.mov *= 0.88;

    /* the nest says what it is doing before the taxonomy does: cutting a face,
       standing in a queue that will not move, or pressed into a full passage */
    var pose = a.posture;
    if (stunned) pose = 'down';
    else if (a.place === 'dig' || a.digE != null) pose = 'dig';
    else if ((a.blockT || 0) > 26) pose = a.headOn ? 'tug' : 'wait';
    else if (!pose) pose = held ? 'haul' : 'wander';
    var P = POSE[pose] || POSE.wander;
    var idle = P.droop > 1.4;

    if (idle && !stunned && !frozen) b.ang += Math.sin(now * 0.0016 + b.k * 21) * 0.055;
    if (!frozen) b.ph += spd * 0.34 * P.gait + (stunned ? 0 : 0.015 * P.gait);

    var job = held ? jobIx.get(a.hold[0]) : null;
    var atWork = P.work > 0 && !stunned;
    if (P.work === 1 && job) {
      var ddx = X(job.x) - x, ddy = Y(job.y) - y;
      atWork = (ddx * ddx + ddy * ddy) < 30 * 30;
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(stunned ? b.ang + 1.4 : b.ang);
    ctx.scale(sc, sc);
    var al = dim * (gave ? 0.7 : 1);

    /* --- the little pocket a body is always standing in, and its shadow --- */
    A(0.26 * al); ctx.fillStyle = MAT.sand;
    ctx.beginPath(); ctx.ellipse(-1, 0, 11, 8, 0, 0, TAU); ctx.fill();
    A(0.16 * al); ctx.fillStyle = MAT.ink;
    ctx.beginPath(); ctx.ellipse(-1, 1.6, 7, 3.4, 0, 0, TAU); ctx.fill();

    /* --- the hoard: every extra job it is sitting on is a crumb under it --- */
    if (held > 1 && taught('Ow')) {
      for (var q = 1; q < held && q < 5; q++) {
        A(0.95 * al); ctx.fillStyle = MAT.sand2;
        ctx.beginPath(); ctx.ellipse(-6 - q * 1.6, (q % 2 ? 3.1 : -3.1), 2.4, 1.9, 0, 0, TAU); ctx.fill();
        A(0.6 * al); ctx.strokeStyle = MAT.ink; ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.ellipse(-6 - q * 1.6, (q % 2 ? 3.1 : -3.1), 2.4, 1.9, 0, 0, TAU); ctx.stroke();
      }
    }

    /* --- legs: tripod gait, braced when pulling, splayed when wedged --- */
    A(0.85 * al); ctx.strokeStyle = MAT.ink; ctx.lineWidth = 0.8;
    ctx.lineCap = 'round';
    var bases = [1.7, 0.2, -1.3];
    for (var s = -1; s <= 1; s += 2) {
      for (var i = 0; i < 3; i++) {
        var ph = b.ph + i * 2.0 + (s > 0 ? 0 : Math.PI);
        var sw = P.brace + Math.sin(ph) * 0.9 * P.gait * (0.35 + b.mov);
        var bx = bases[i];

    drawJostle(S, sc);

         thirteen workers, and thirteen rings scattered over the whole nest is
         not a causal beat, it is confetti. The ones inside the ground that is
         burning are the ones the player is being asked to look at. */
      var ox = X(top.o.x), oy = Y(top.o.y);

    drawDark(S);
    aim(S);
    outbreakInstrument(S);

    if (S.slowUntil && S.tick < S.slowUntil) {

      ctx.strokeRect(1.5, 1.5, W - 3, H - 3);

      crumb(29, 14, 10, .3) + ant(12, 20, 1) + ant(62, 20, -1) + xmark(34, 19, 4, { c: RED, w: 1.3 }),
    /* everything sped up. You did not. */
    Sp: ant(16, 12, 1) + ant(16, 25, 1) + ant(40, 18, 1) +
      line(5, 12, 11, 12, { c: INK2 }) + line(3, 15, 10, 15, { c: INK2 }) +

  function scene(sym) {
    return '<svg class="pdg" viewBox="0 0 76 34" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' +
      GROUND + (SCENE[sym] || '') + '</svg>';

  /* ---- the two marks that carry the counts. Both are already in the player's eye
     from play: the dashed incident ring is what witnessing looks like on the field,
     and the stamp is what an answered one looks like. No word needed for either. */
  var M_SEEN = '<svg viewBox="0 0 14 14" fill="none" aria-hidden="true">' +

  var M_DRAWER = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +

      '#guide.fzg .gbrk{height:0;border-top:2px solid ' + g('.35') + ';margin:2px 0 10px}',

  /* ============================================================
     BUILD
     ============================================================ */
  function el(tag, cls, html) {
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (html !== undefined) d.innerHTML = html;
    return d;
  }
  function pad2(v) { return (v < 10 ? '0' : '') + v; }
  function ui(k) { return (FZ.copy && FZ.copy.ui && FZ.copy.ui[k]) || ''; }

  /* the phenomenon, in the words the paper tag used. Never invented here. */
  function phen(sym) {
    if (FZ.outbreak && FZ.outbreak.phen) {
      var p = FZ.outbreak.phen(sym);
      if (p && (p.name || p.line)) return p;
    }
    var c = FZ.copy && FZ.copy.phen && FZ.copy.phen[sym];
    if (c) return { name: c.name || '', line: c.line || '' };
    var e = FZ.ELBY ? FZ.ELBY[sym] : null;
    return { name: (e && e.nm) ? e.nm.toUpperCase() : sym, line: (e && e.plain) || '' };
  }
  function answerKind(e) {
    if (e.answers && e.answers.length) return e.answers[0];
    if (FZ.outbreak && FZ.outbreak.answersFor) {
      var a = FZ.outbreak.answersFor(e.sym);
      if (a && a.length) return a[0];
    }
    return e.counterTool || null;
  }
  function mastery(sym) {
    var m = (FZ.outbreak && FZ.outbreak.mastery) ? FZ.outbreak.mastery[sym] : null;
    return m || { answered: 0, missed: 0 };
  }
  function collected(sym) {
    if (seen[sym] > 0) return true;
    var m = mastery(sym);
    return (m.answered + m.missed) > 0;
  }
  function count() {
    var k = 0;
    for (var i = 0; i < order.length; i++) if (collected(order[i].sym)) k++;
    return k;
  }

  function makePlate(e, idx) {
    /* A PLATE IS NOT A CONTROL. The old build made all 28 cells tappable and most taps
       opened a card about something that was not burning. In the drawer there is exactly
       one affordance — the way out — and everything else is read. */
    var b = el('div', 'pl');
    b.setAttribute('data-sym', e.sym);
    b.appendChild(el('span', 'pno', pad2(idx + 1)));
    var inn = el('div', 'pin');
    inn.innerHTML =
      '<div class="ptop"><span class="pgl"></span><span class="pnm"></span></div>' +
      '<div class="pmid"><span class="pdgw"></span><span class="psay"></span></div>' +
      '<div class="pfoot"><span class="pcode"></span>' +
      '<span class="pct sc">' + M_SEEN + '<b class="v">0</b></span>' +
      '<span class="pct ac">' + M_DONE + '<b class="v">0</b></span>' +
      '<span class="pct mc">' + M_MISS + '<b class="v">0</b></span></div>';
    b.appendChild(inn);
    b.appendChild(el('span', 'pst'));
    plates.set(e.sym, { e: e, n: b, drawn: false, st: false, s: -1, a: -1, m: -1 });
    return b;
  }

  function build() {
    if (built) return;
    if (!window.FZ || !FZ.EL || !FZ.EL.length) return;

    var st = document.getElementById('fzGuideCSS') || el('style');
    st.id = 'fzGuideCSS';
    st.textContent = css();
    document.head.appendChild(st);

    /* the old matrix, emptied. Nothing of it survives on the play screen. */
    ['etable', 'metaRow', 'detail'].forEach(function (id) {
      var q = document.getElementById(id);
      if (q) q.textContent = '';
    });

    var host = document.getElementById('app') || document.body;
    guide = document.getElementById('guide');
    if (!guide) { guide = el('div'); guide.id = 'guide'; host.appendChild(guide); }
    guide.classList.add('fzg');
    guide.textContent = '';

    var hd = el('div', 'ghd');
    hd.innerHTML = '<span class="gk">' + M_DRAWER + '</span>' +
      '<span class="gct"></span><span class="gbar"><i></i></span>';
    var x = el('button', 'gx');
    x.type = 'button';
    x.textContent = ui('close');
    x.addEventListener('click', function (ev) { ev.preventDefault(); ev.stopPropagation(); closeGuide(); });
    hd.appendChild(x);
    guide.appendChild(hd);

    gscroll = el('div', 'gsc');
    guide.appendChild(gscroll);

    /* family by family, in taxonomy order, with a rule between families and no heading:
       the grouping is structure, not vocabulary. */
    order = FZ.EL.slice().sort(function (a, b) {
      return (a.col - b.col) || (a.row - b.row);
    });
    var lastCol = -1;
    for (var i = 0; i < order.length; i++) {
      if (lastCol >= 0 && order[i].col !== lastCol) gscroll.appendChild(el('div', 'gbrk'));
      lastCol = order[i].col;
      gscroll.appendChild(makePlate(order[i], i));
    }

    /* the quiet mark */
    mark = document.getElementById('guideMark');
    if (!mark) {
      mark = el('button', '');
      mark.id = 'guideMark';
      mark.type = 'button';
      mark.innerHTML = M_DRAWER + '<span class="gmn"></span>';
      host.appendChild(mark);
    }
    markNum = mark.querySelector('.gmn');
    mark.addEventListener('click', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      if (openNow) closeGuide(); else openGuide();
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && openNow) closeGuide();
    });

    if (FZ.bus) {
      /* something starts burning while the drawer is open: the drawer shuts.
         Theory never competes with the incident. */
      FZ.bus.on('outbreak:open', function () { if (openNow) closeGuide(); });
      FZ.bus.on('chapter:enter', function () { if (openNow) closeGuide(); });
    }

    built = true;
    refresh(true);
  }

  /* ============================================================
     WITNESSING — the only thing that draws a plate
     ============================================================ */
  function load() {
    try {
      var raw = window.localStorage && window.localStorage.getItem(STORE);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && o.seen) for (var k in o.seen) seen[k] = o.seen[k] | 0;
      if (o && o.op) everOpened = true;
    } catch (e) { /* private mode / file:// — the collection is a bonus, never a blocker */ }
  }
  /* a detector can fire many times a second; the collection is written once the colony
     stops for breath, never inside the tick. */
  var saveT = 0;
  function writeNow() {
    saveT = 0;
    try { if (window.localStorage) window.localStorage.setItem(STORE, JSON.stringify({ seen: seen, op: everOpened ? 1 : 0 })); }
    catch (e) { }
  }
  function save() {
    if (saveT) return;
    saveT = setTimeout(writeNow, 700);
  }
  function witness(sym) {
    if (!sym || !FZ.ELBY || !FZ.ELBY[sym]) return;
    var had = collected(sym);
    seen[sym] = (seen[sym] || 0) + 1;
    if (!had && everOpened) fresh[sym] = 1;
    save();
    if (built) refresh(!had);
  }

  /* ============================================================
     PAINT — plates only redraw when their numbers actually moved
     ============================================================ */
  function refresh(force) {
    if (!built) return;
    var k = 0;
    plates.forEach(function (p) {
      var sym = p.e.sym;
      var got = collected(sym);
      if (got) k++;
      if (got !== p.drawn) {
        p.drawn = got;
        p.n.classList.toggle('dr', got);
        if (got) draw(p);
      }
      if (!got) return;
      p.n.classList.toggle('nw', !!fresh[sym]);
      var m = mastery(sym), s = seen[sym] || 0;
      if (force || s !== p.s) { p.s = s; setv(p, '.sc', s || (m.answered + m.missed)); }
      if (force || m.answered !== p.a) {
        p.a = m.answered;
        setv(p, '.ac', m.answered);
        p.n.querySelector('.ac').classList.toggle('ok', m.answered > 0);
        var stamped = m.answered > 0;
        if (stamped !== p.st) { p.st = stamped; p.n.classList.toggle('st', stamped); }
      }
      if (force || m.missed !== p.m) {
        p.m = m.missed;
        setv(p, '.mc', m.missed);
        p.n.querySelector('.mc').style.display = m.missed > 0 ? '' : 'none';
      }
    });
    if (k !== lastCount) {
      lastCount = k;
      var c = guide && guide.querySelector('.gct');
      if (c) c.textContent = pad2(k) + ' / ' + order.length;
      var b = guide && guide.querySelector('.gbar i');
      if (b) b.style.width = Math.round(k / Math.max(1, order.length) * 100) + '%';
      if (markNum) markNum.textContent = pad2(k);
    }
  }
  function setv(p, sel, v) {
    var q = p.n.querySelector(sel + ' .v');
    if (q) q.textContent = String(v > 99 ? 99 : v);
  }

  /* the plate fills in: glyph, common name, the scene, the line, the code */
  function draw(p) {
    var e = p.e, ph = phen(e.sym);
    var g = p.n.querySelector('.pgl'); if (g) g.innerHTML = e.glyph || '';
    var nm = p.n.querySelector('.pnm'); if (nm) nm.textContent = ph.name || '';
    var dg = p.n.querySelector('.pdgw'); if (dg) dg.innerHTML = scene(e.sym);
    var sy = p.n.querySelector('.psay'); if (sy) sy.textContent = ph.line || e.plain || '';
    var cd = p.n.querySelector('.pcode');
    if (cd) cd.textContent = e.sym + ' · ' + (e.nm || '');
    var stmp = p.n.querySelector('.pst');
    var k = answerKind(e);
    if (stmp) stmp.innerHTML = k ? inst(k, 25) : '';
  }

  /* ============================================================
     THE RULE: never openable while an incident is burning
     ============================================================ */
  function burning() {
    var ob = window.FZ && FZ.outbreak;
    if (ob && ob.list) {
      for (var i = 0; i < ob.list.length; i++) {
        if (ob.list[i] && ob.list[i].state === 'burning') return true;
      }
    }
    if (FZ.controls && FZ.controls.armed) return true;
    return false;
  }
  function canOpen() { return built && !burning() && count() > 0; }

  function openGuide(sym) {
    if (!built) build();
    if (!canOpen()) return false;
    openNow = true;
    guide.classList.add('on');
    refresh(true);
    /* the plate you came for, at the top of the drawer */
    var target = sym || wantSym;
    wantSym = null;
    if (target && plates.get(target) && plates.get(target).drawn) {
      var nd = plates.get(target).n;
      if (nd && nd.offsetTop != null && gscroll) gscroll.scrollTop = Math.max(0, nd.offsetTop - 8);
    } else if (gscroll) gscroll.scrollTop = 0;
    if (mark) mark.classList.remove('on');
    return true;
  }
  function closeGuide() {
    if (!openNow) return;
    openNow = false;
    if (guide) guide.classList.remove('on');
    /* everything in the drawer has now been looked at */
    fresh = {};
    if (!everOpened) { everOpened = true; save(); }
    plates.forEach(function (p) { p.n.classList.remove('nw'); });
    if (mark) mark.classList.remove('nw');
    markShown = false;         /* force the mark to be re-placed on the next paint */
  }

  /* ---- where the mark sits: bottom-right of whatever the colony currently owns,
     so it never lands on a band another piece put underneath. Between episodes it
     goes to the top-right, above the episode card.

     The top-right corner belongs to the crown (CONTRACT §12) and is only ceded once
     the episode card is actually covering it — 10-style.css hides #crown on
     `#app:has(#gate.on)` and nothing else. Keying this off the phase instead would
     move the mark a whole SETTLE beat early: chapters flip to 'result' and then hold
     the colony on screen for 600ms before raising the gate, and for that beat the
     crown is still up, so the mark would sit on top of #aboutBtn on every single
     chapter transition. Follow the same signal the stylesheet follows. ---- */
  function place() {
    if (!mark) return;
    var gt = document.getElementById('gate');
    var covered = !!gt && gt.classList.contains('on');
    var W = window.innerWidth, H = window.innerHeight, S = 46, pad = 9;
    if (covered) {
      mark.style.left = (W - S - pad) + 'px';
      mark.style.top = (pad + 6) + 'px';
      return;
    }
    var box = document.getElementById('world') || document.getElementById('stage');
    var r = box ? box.getBoundingClientRect() : null;
    var right = r && r.width > 60 ? r.right : W;
    var bot = r && r.height > 60 ? r.bottom : H;
    mark.style.left = Math.round(Math.max(pad, Math.min(W - S - pad, right - S - pad))) + 'px';
    mark.style.top = Math.round(Math.max(pad, Math.min(H - S - pad, bot - S - pad))) + 'px';
  }

  function paint() {
    if (!built) { build(); if (!built) return; }
    var t = performance.now();

    if (openNow) {
      /* the drawer cannot survive an incident opening under it */
      if (burning()) { closeGuide(); return; }
      if (t - markAt > 260) { markAt = t; refresh(false); }
      return;
    }

    /* the instant anything catches fire the mark is gone — checked every frame, because
       a way into the theory must not survive one frame of the decision it competes with */
    if (markShown && burning()) {
      markShown = false; quietAt = 0;
      mark.classList.remove('on');
    }
    if (t - markAt < 220) return;
    markAt = t;
    refresh(false);

    /* the mark appears in a LULL, not in the gap between two incidents: it goes the
       instant something catches fire and comes back only once the colony has been
       quiet for a beat, so it never blinks in and out under the player's thumb. */
    if (burning()) quietAt = 0;

  /* ============================================================
     CONTRACT SURFACE (§9)
     ============================================================ */
  /* Recorded, never revealed: which elements are live this episode is the sim's
     business. A plate is drawn by being witnessed, not by being enabled. */
  function setEnabled(set) {
    live = new Set();
    if (set && typeof set.forEach === 'function') set.forEach(function (s) { live.add(s); });
    else if (Array.isArray(set)) set.forEach(function (s) { live.add(s); });
  }

  /* open(sym) — CONTRACT §9. Opens the drawer at that plate if the drawer may open
     at all; if an incident is burning it is remembered and honoured afterwards. */
  function open(sym) {
    if (!openGuide(sym)) { wantSym = sym || null; return false; }
    return true;
  }

  if (FZ.bus) FZ.bus.on('fire', function (d) { if (d && d.sym) witness(d.sym); });

  api = {
    build: build,
    setEnabled: setEnabled,
    paint: paint,
    open: open,
    close: closeGuide,
    /* the guide, by its own name, for CHAPTERS or SHELL */
    openGuide: openGuide,
    closeGuide: closeGuide,
    canOpen: canOpen,
    isOpen: function () { return openNow; },

  return api;
})();

<script>

   an instrument and placing it on the colony is the answer gesture for every instrument

   an ant colony would build, and the silhouette teaches the function: an arch over a
   meeting stone arbitrates, a branching seed decorrelates, a cairn of tally-marked stones

   there while they are being learned and drop away once the player has answered enough

      '<path d="M4 17.4h16"/><path d="M12 5.6v2.4"/>' +

  /* folk names, used only until the silhouettes are learned. VOICE overrides with

  /* the same thing, named short, for when the sandbox offers all six across a phone */
  var FOLK_TIGHT = {
    charter: 'ARCH', vary: 'SEED', slow: 'BELL',
    lens: 'LANTERN', ledger: 'TALLY', eject: 'GATE',
  };

  /* THE COLONY IS THE ANSWER SURFACE.
     Last round CHARTER and VARY auto-placed themselves at the focused incident, which
     meant the nest — eighty-five per cent of the screen — was inert to touch while the

     instrument that needs a coordinate is now ARMED, then PLACED with a tap on the nest,

     meeting stone goes AT A JUNCTION, and snapAim() below puts it on one, so the gesture
     the player makes is "this crossroads" and not "these coordinates". */
  var TARGETED = { eject: 1, charter: 1, vary: 1 };
  var NEEDS_XY = { eject: 1, charter: 1, vary: 1 };
  var LABELS_UNTIL = 6;               /* after this many answered, the shape is enough */
  var NOTE_MS = 2400;                 /* how long a correction owns the one message region */

  var field = null, tagLayer = null, act = null, actRow = null;
  var tagNode = null, tagName = null, tagLine = null, tagFuse = null, thread = null;
  var made = new Map();               /* kind -> button node */
  var have = [];                      /* kinds currently offered, in ORDER order */
  var avail = [];                     /* kinds this chapter has taught */
  var wired = false, built = false;
  var note = null;                    /* {text, tone, until} — the one transient message */

  var api;

  function copyTool(k) { return (FZ.copy && FZ.copy.tools && FZ.copy.tools[k]) || {}; }

  }
  /* the one line an armed instrument says, and it is an instruction to touch the colony:

  function aimLine(kind) { return ui(kind === 'eject' ? 'tapAgent' : 'tapField'); }

  /* ---------------------------------------------------------------- the paper */
  var CSS =

    '#tagLayer{position:fixed;inset:0;z-index:40;pointer-events:none;font-family:inherit}' +
    '.fztag{position:absolute;width:230px;max-width:78vw;background:#f5efe3;color:#17150f;' +
    'border:1px solid rgba(0,0,0,.55);border-left:0;box-shadow:3px 4px 0 rgba(0,0,0,.28);' +
    'padding:8px 10px 9px 13px;opacity:0;transform:translateY(4px);' +
    'transition:opacity .16s ease-out,transform .16s ease-out}' +
    '.fztag.on{opacity:1;transform:none}' +
    '.fztag .fzfuse{position:absolute;left:0;bottom:0;width:4px;height:100%;background:#ffd23f}' +
    '.fztag.hot .fzfuse{background:#ff2e2e}' +
    '.fztag.note .fzfuse{background:#ff2e2e;height:100%}' +
    '.fztag .fzn{font-size:11.5px;font-weight:700;letter-spacing:.11em;line-height:1.2}' +
    '.fztag .fzl{font-size:11.5px;line-height:1.4;margin-top:5px;color:#4a4335}' +
    '.fztag.note .fzl{color:#17150f}' +
    '.fzthread{position:absolute;height:0;border-top:1px dashed rgba(0,0,0,.5);' +
    'transform-origin:0 0;opacity:0;transition:opacity .16s ease-out}' +
    '.fzthread.on{opacity:1}' +
    '#act{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;gap:6px;' +
    'justify-content:center;align-items:flex-end;padding:10px 6px;' +
    'padding-bottom:calc(10px + env(safe-area-inset-bottom));font-family:inherit}' +
    '#act .fzrow{display:flex;gap:5px;justify-content:center;flex-wrap:nowrap;width:100%}' +
    '.fzact{position:relative;flex:1 1 0;min-width:0;max-width:112px;min-height:62px;' +
    'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;' +
    'background:#f5efe3;color:#17150f;border:1.5px solid #17150f;' +
    'box-shadow:2px 3px 0 rgba(0,0,0,.4);padding:6px 3px 5px;cursor:pointer;' +
    'font-family:inherit;-webkit-tap-highlight-color:transparent;' +
    'animation:fzactin .2s ease-out 1}' +
    '.fzact svg{width:26px;height:26px;display:block}' +
    '.fzact .fzf{font-size:8px;letter-spacing:.02em;line-height:1;white-space:nowrap;' +
    'max-width:100%;overflow:hidden}' +
    '.fzact .fzc{position:absolute;top:2px;right:3px;font-size:8.5px;color:rgba(0,0,0,.45)}' +
    '.fzact.on{background:#17150f;color:#f5efe3;border-color:#17150f}' +
    '.fzact.on .fzc{color:rgba(255,255,255,.6)}' +
    '.fzact.poor{opacity:.34}' +

    tagNode = document.createElement('div');
    tagNode.className = 'fztag';
    tagFuse = document.createElement('div'); tagFuse.className = 'fzfuse';
    tagName = document.createElement('div'); tagName.className = 'fzn';
    tagLine = document.createElement('div'); tagLine.className = 'fzl';
    tagNode.appendChild(tagFuse); tagNode.appendChild(tagName); tagNode.appendChild(tagLine);
    tagLayer.appendChild(thread);

  }

  /* ------------------------------------------------------------- the buttons */
  function makeButton(kind) {

    b.className = 'fzact';
    b.setAttribute('data-kind', kind);
    b.setAttribute('aria-label', folk(kind));

    g.className = 'fzg';
    g.innerHTML = MARK[kind] || '';
    var l = document.createElement('span');
    l.className = 'fzf';
    l.textContent = folk(kind);
    var c = document.createElement('span');
    c.className = 'fzc';
    c.textContent = String(FZ.sim ? FZ.sim.cost(kind) : 2);
    b.appendChild(g); b.appendChild(l); b.appendChild(c);
    b.addEventListener('click', function (ev) {
      ev.preventDefault(); ev.stopPropagation();

  /* the hands only work while the colony is running: once a chapter has been won or
     lost the result is being read, and a stray tap must not spend budget into it. */
  function live() {
    var st = S();
    if (!st || st.gameOver) return false;
    if (FZ.chapters && FZ.chapters.phase && FZ.chapters.phase() !== 'play') return false;
    return true;

  }

  function press(kind) {
    var st = S();
    if (!st || !live()) return;
    if (st.budget < FZ.sim.cost(kind)) { say(ui('noBudget'), 'bad'); return; }
    if (TARGETED[kind]) {
      if (api.armed === kind) { disarm(); return; }
      api.armed = kind;
      note = null;                            /* the instrument in hand outranks old news */
      /* the instrument comes up already resting on the trouble, so the player can see
         what placing it would cover before touching anything — and can carry it
         somewhere else, which is the decision. */
      api.aim = null;

      if (o) {
        var p = snapAim(kind, o.x, o.y);

      }

       there is nowhere to put them, so they need no gesture but the press. */
    disarm();

  }

  function disarm() {
    api.armed = null;
    api.aim = null;
  }

  function commit(kind, x, y) {
    var st = S();
    if (!st || !live()) return;
    if (st.budget < FZ.sim.cost(kind)) { say(ui('noBudget'), 'bad'); return; }

    /* the diagnosis is judged BEFORE the spend, so a right answer can be paid back and a
       wrong one can say what the failure actually is — including, for an expulsion, that
       the body you removed was not the one doing it. */
    var ans = null;
    if (ob() && ob().tryAnswer) {
      try { ans = ob().tryAnswer(kind, x, y); } catch (e) { ans = null; }
    }
    var out = FZ.sim.apply(kind, NEEDS_XY[kind] ? x : undefined, NEEDS_XY[kind] ? y : undefined);

    /* nothing was spent -> say why, and never claim an answer that did not happen.
       A right answer says NOTHING: the ring visibly closes, the strain drops, the tag
       goes away. That is the whole receipt, and it is drawn, not written. */
    if (out && !out.ok) { if (out.msg) say(out.msg, 'bad'); }
    else if (ans && ans.hit && !ans.right && ans.msg) say(ans.msg, 'bad');
    else if (ans && !ans.hit && ans.msg) say(ans.msg, 'bad');
    paint(st);
  }

  /* ------------------------------------------------------------ where it lands
     A thumb is nine millimetres wide and the thing it is pointing at is a crossroads
     twelve pixels across. So the tap names a FEATURE, not a coordinate: the instrument
     is carried to the nearest thing it can actually be built on, and the preview is
     drawn there, so what the player sees before committing is what happens.

     This is forgiveness, not automation — the player still chooses WHICH crossroads,
     which crowd, which body, and choosing wrong is still wrong. */
  var SNAP_NODE = 62, SNAP_BODY = 74;

  function nearestNode(st, x, y, junctionBonus) {
    var N = (st.nest && st.nest.nodes) || [], E = (st.nest && st.nest.edges) || [];
    var best = null, bd = SNAP_NODE;
    for (var i = 0; i < N.length; i++) {
      var n = N[i];
      if (n.kind === 'surface') continue;
      var dx = n.x - x, dy = n.y - y, d = Math.sqrt(dx * dx + dy * dy);
      if (junctionBonus) {
        var ways = 0;
        for (var k = 0; k < n.edges.length; k++) { var e = E[n.edges[k]]; if (e && e.dug) ways++; }
        if (ways >= 3) d -= junctionBonus;

    return best;

  function nearestBody(st, x, y, reach) {
    var best = null, bd = reach;
    for (var i = 0; i < st.agents.length; i++) {
      var a = st.agents[i], dx = a.x - x, dy = a.y - y, d = Math.sqrt(dx * dx + dy * dy);
      if (d < bd) { bd = d; best = a; }

    return best;
  }
  /* a tap inside a burning ring is an ANSWER, and nothing may carry it back out of the
     ring it was aimed at. Snapping is allowed to move the instrument to a feature; it is
     never allowed to turn a correct answer into a miss. */
  function inside(o, x, y) {
    if (!o) return false;
    var dx = o.x - x, dy = o.y - y;
    return dx * dx + dy * dy <= o.r * o.r;
  }

    if (kind === 'charter') {
      /* the stone belongs on the ground it governs, and that ground is a crossroads */
      var n = nearestNode(st, x, y, 26);
      if (!n) return { x: x, y: y };
      if (keep && !inside(o, n.x, n.y)) return { x: x, y: y };
      return { x: n.x, y: n.y };

    if (kind === 'vary') {
      /* a seed does nothing where there is nobody to take a different route */
      var R = (FZ.sim && FZ.sim.varyR) || 95, hit = false;
      for (i = 0; i < st.agents.length; i++) {
        a = st.agents[i];
        if (!a.corrigible) continue;
        var dx = a.x - x, dy = a.y - y;
        if (dx * dx + dy * dy < R * R * 0.81) { hit = true; break; }
      }
      if (hit) return { x: x, y: y };
      var best = null, bd = 170;
      for (i = 0; i < st.agents.length; i++) {
        a = st.agents[i];
        if (!a.corrigible) continue;
        if (keep && !inside(o, a.x, a.y)) continue;
        q = Math.sqrt((a.x - x) * (a.x - x) + (a.y - y) * (a.y - y));
        if (q < bd) { bd = q; best = a; }
      }
      return best ? { x: best.x, y: best.y } : { x: x, y: y };
    }
    if (kind === 'eject') {
      var b = nearestBody(st, x, y, SNAP_BODY);
      return b ? { x: b.x, y: b.y } : { x: x, y: y };
    }
    return { x: x, y: y };
  }

  /* --------------------------------------------------------------- the field */
  function toWorld(ev) {
    var st = S();
    if (!field || !st) return null;
    var r = field.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    return {
      x: (ev.clientX - r.left) * (st.w / r.width),
      y: (ev.clientY - r.top) * (st.h / r.height),
    };
  }

  function wireField() {
    if (wired || !field) return;
    wired = true;
    var down = false;

    field.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    field.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      down = true;
      try { field.setPointerCapture(ev.pointerId); } catch (e) { }
      var p = toWorld(ev);
      if (p && api.armed) { p = snapAim(api.armed, p.x, p.y); api.aim = { kind: api.armed, x: p.x, y: p.y }; }
    });
    field.addEventListener('pointermove', function (ev) {
      if (!down || !api.armed) return;
      ev.preventDefault();
      var p = toWorld(ev);
      if (p) { p = snapAim(api.armed, p.x, p.y); api.aim = { kind: api.armed, x: p.x, y: p.y }; }
    });
    function up(ev) {
      if (!down) return;
      down = false;
      try { field.releasePointerCapture(ev.pointerId); } catch (e) { }
      var p = toWorld(ev) || (api.aim ? { x: api.aim.x, y: api.aim.y } : null);
      var kind = api.armed;
      disarm();
      if (!p) return;
      if (kind) { var q = snapAim(kind, p.x, p.y); commit(kind, q.x, q.y); return; }
      /* no instrument in hand: the tap is a look. If two incidents are live, this is how
         the player chooses which one the tag is about. Nothing opens, nothing pops. */
      if (ob() && ob().focusAt) { try { ob().focusAt(p.x, p.y); } catch (e) { } }
    }
    field.addEventListener('pointerup', up);
    field.addEventListener('pointercancel', function () { down = false; api.aim = null; });
  }

  /* ------------------------------------------------------- the one message */
  /* Everything the game has to say arrives here and nowhere else. A second message does
     not queue behind this one, it replaces it: two explanations of the same instant were
     the defining bug of the last build. */
  function say(text, tone) {
    if (!text) return;
    note = { text: text, tone: tone || 'plain', until: now() + NOTE_MS };
  }

  function hideTag() {
    if (!tagNode) return;
    if (tagNode.classList.contains('on')) tagNode.classList.remove('on');
    if (thread.classList.contains('on')) thread.classList.remove('on');
  }

  /* hang the tag beside the thing, on a thread, and clamp it into the field.
     ax/ay are viewport px of the incident centre; rr is its radius in viewport px. */
  function place(ax, ay, rr, r) {
    var w = tagNode.offsetWidth || 230, h = tagNode.offsetHeight || 54;
    var lx = Math.round(Math.min(Math.max(ax - w / 2, r.left + 8), r.right - w - 8));
    var above = ay - rr - 16 - h;
    var below = ay + rr + 16;
    var ly;
    if (above >= r.top + 6) ly = Math.round(above);
    else if (below + h <= r.bottom - 6) ly = Math.round(below);
    else ly = Math.round(Math.min(Math.max(ay - h / 2, r.top + 6), r.bottom - h - 6));
    tagNode.style.left = lx + 'px';
    tagNode.style.top = ly + 'px';

    /* the thread leaves the tag from whichever edge faces the thing it is tied to, so a
       tag hanging beside an incident still visibly belongs to that incident and not to
       one of the others burning elsewhere */
    var cx = lx + w / 2, cy = ly + h / 2;
    var vx = ax - cx, vy = ay - cy;
    if (!vx && !vy) { thread.classList.remove('on'); return; }
    var t = Math.min(vx ? (w / 2) / Math.abs(vx) : Infinity, vy ? (h / 2) / Math.abs(vy) : Infinity);
    var tx = cx + vx * t, ty = cy + vy * t;
    var dx = ax - tx, dy = ay - ty;
    var len = Math.sqrt(dx * dx + dy * dy) - Math.min(rr * 0.6, 30);
    if (len < 6) { thread.classList.remove('on'); return; }
    thread.style.left = tx + 'px';
    thread.style.top = ty + 'px';
    thread.style.width = Math.round(len) + 'px';
    thread.style.transform = 'rotate(' + (Math.atan2(dy, dx) * 180 / Math.PI).toFixed(1) + 'deg)';
    thread.classList.add('on');
  }

  function placeLoose(r) {
    var w = tagNode.offsetWidth || 230, h = tagNode.offsetHeight || 54;
    var bh = (act && act.style.display !== 'none') ? (act.offsetHeight || 0) : 0;
    tagNode.style.left = Math.round(r.left + (r.width - w) / 2) + 'px';
    tagNode.style.top = Math.round(Math.min(r.bottom, window.innerHeight) - bh - h - 14) + 'px';
    thread.classList.remove('on');
  }

  /* ---------------------------------------------------------------- painting */
  function paintButtons(st, show) {
    if (show) {
      var want = [], set = {};
      avail.forEach(function (k) { if (MARK[k]) set[k] = 1; });
      ORDER.forEach(function (k) { if (set[k]) want.push(k); });
      var changed = want.length !== have.length;
      if (!changed) for (var i = 0; i < want.length; i++) if (want[i] !== have[i]) { changed = true; break; }
      if (changed) {
        have.forEach(function (k) {
          if (set[k]) return;
          var b = made.get(k);
          if (b && b.parentNode) b.parentNode.removeChild(b);
        });
        want.forEach(function (k) {
          var b = made.get(k) || makeButton(k);
          actRow.appendChild(b);
        });
        have = want;
      }
      /* the label is scaffolding: it holds a name to the shape until the shape is known,
         and then it goes, because a learned silhouette needs no caption (AESTHETIC §5) */
      var labels = true;
      try { labels = !ob() || ob().answeredCount() < LABELS_UNTIL; } catch (e) { }
      var tight = have.length > 4;
      made.forEach(function (b, kind) {
        if (!b.parentNode) return;
        var armed = api.armed === kind;
        if (b.classList.contains('on') !== armed) b.classList.toggle('on', armed);
        var lab = b.querySelector('.fzf');
        if (lab) {
          lab.style.display = labels ? '' : 'none';
          var want = folk(kind, tight);
          if (lab.textContent !== want) lab.textContent = want;
        }
        if (!st) return;
        var poor = st.budget < FZ.sim.cost(kind);
        if (b.classList.contains('poor') !== poor) b.classList.toggle('poor', poor);
        var on = (kind === 'lens' && st.lensOn) || (kind === 'ledger' && st.ledgerOn) ||
          (kind === 'slow' && st.tick < st.slowUntil);
        if (b.classList.contains('live') !== on) b.classList.toggle('live', on);
      });
      if (act.style.display === 'none') act.style.display = '';
      return;
    }
    /* ABSENT, not disabled: no decision, no surface, the colony owns the screen. */
    if (act.style.display !== 'none') {
      act.style.display = 'none';
      have.forEach(function (k) { var b = made.get(k); if (b && b.parentNode) b.parentNode.removeChild(b); });
      have = [];
    }
  }

  function paint(st) {
    ensure();
    st = st || S();
    var playing = live();
    var o = playing ? burning() : null;
    if (o && st && st.tick < o.tagAt) o = null;      /* beat one: a body, and no words yet */
    if (note && now() > note.until) note = null;
    /* the incident settled itself while the instrument was in hand: put it down, or the
       surface it lives on vanishes and the next tap on the nest spends budget blind */
    if (api.armed && !o) disarm();

    paintButtons(st, !!(o && playing));

    /* THE ONE MESSAGE, chosen by a single priority so two can never coexist:
         1. a correction the player has just earned
         2. the instrument in her hand, and what it wants
         3. the incident that is burning
         4. nothing at all */
    var name = '', line = '', tone = '';
    if (note) { name = ''; line = note.text; tone = 'note'; }
    else if (api.armed) { name = o ? (o.name || '') : ''; line = aimLine(api.armed); }
    else if (o) { name = o.name || ''; line = o.line || ''; }

    if (!name && !line) { hideTag(); lastKey = ''; return; }

    var key = name + '' + line + '' + tone;
    if (key !== lastKey) {
      lastKey = key;
      tagName.textContent = name;
      tagName.style.display = name ? '' : 'none';
      tagLine.textContent = line;
      tagLine.style.display = line ? '' : 'none';
      tagNode.classList.toggle('note', tone === 'note');
    }

    /* the fuse is the tag's left edge. There is no other clock on screen. */
    var frac = 1;
    if (o && ob() && ob().left) { try { frac = ob().left(o); } catch (e) { frac = 1; } }
    if (tone === 'note') frac = 1;
    tagFuse.style.height = Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%';
    var hot = tone !== 'note' && frac < 0.34;
    if (tagNode.classList.contains('hot') !== hot) tagNode.classList.toggle('hot', hot);

    var r = field ? field.getBoundingClientRect() : null;
    if (o && r && r.width && st) {
      var sx = r.width / st.w, sy = r.height / st.h;
      place(r.left + o.x * sx, r.top + o.y * sy, o.r * Math.min(sx, sy), r);
    } else if (r && r.width) {
      placeLoose(r);
    }
    if (!tagNode.classList.contains('on')) tagNode.classList.add('on');
  }

  api = {
    armed: null,
    aim: null,

    build: function () {
      field = document.getElementById('field');
      ensure();
      wireField();
      var bar = document.getElementById('bar');
      if (bar) bar.innerHTML = '';
      if (FZ.bus) {
        FZ.bus.on('chapter:enter', function () { disarm(); note = null; });
        FZ.bus.on('lose', function () { disarm(); note = null; });
        FZ.bus.on('goal', function () { disarm(); note = null; });
        /* the correction is the teaching moment, and it is the ONLY thing said out loud */
        FZ.bus.on('outbreak:wrong', function (d) { if (d && d.msg) say(d.msg, 'bad'); });
      }
      paint(S());
    },

    /* ONLY these instruments are offered — and only while something is burning. */
    setAvailable: function (kinds) {
      avail = (kinds || []).filter(function (k) { return !!MARK[k]; });
      if (api.armed && avail.indexOf(api.armed) < 0) disarm();
      paint(S());
    },

    paint: paint,
    disarm: disarm,
    kinds: function () { return have.slice(); },
  };

  /* kept so nothing else in the build breaks reaching for it — but it writes into the one
     message region like everything else, never into a second strip. */
  FZ.ui = FZ.ui || {};
  FZ.ui.toast = function (msg, tone) { say(msg, tone); };

  return api;
})();

<script>
/* ===== 80-chapters.js ===== */
/* ============================================================
   80-chapters.js — THE PASSAGES.  OWNER: CHAPTERS.
   FZ.chapters = { list, start(i), next(), retry(), index, phase(), update(S) }

   Ten passages in a colony's life. Each is a setup card, a short piece of play, and
   a naming card. Nothing else. Three rules govern every line of this file:

   HANDS ON THE COLONY, FAST.  The old opening asked a stranger to watch for forty
   seconds before anything was tappable. That is the moment a stranger checks whether
   they can skip. THE COLONY is now four or five seconds long — one pass of the store
   wall filling, and out. TWO AT ONCE hands over the meeting stone the instant the
   first double claim catches, which is inside two seconds of BEGIN. From the first
   tap to the player's first real decision is now about six seconds, not forty.

   ONE IDEA AT A TIME.  The enabled set is curated per passage. TWO AT ONCE runs on
   chapter 0 plus teach:['Co'] — exactly ONE of the twenty-eight is live, so the only
   thing that can happen is the thing the passage is about. THE MEETING STONE then
   widens to the whole coordination family under that same single instrument, which
   is a different idea: one institution answers many failures.

   PLAY FIRST, NAME SECOND, AND THE GATE IS WHERE THE NAMING HAPPENS.  During play
   there is no taxonomy anywhere — the tag names a phenomenon, and that is all
   (AESTHETIC §6, CONTRACT §12.3). The moment the passage ends, this file stamps the
   phenomena the player actually witnessed with their drawn mark, their two-letter
   code and their formal name, counts how many times each was seen, and rules the
   plate teal where the player answered it and red where it landed. Then the research.
   The code is a receipt for something the player already owns.

   Every sentence here comes from FZ.copy. This file invents no English; it renders
   marks, numerals and codes, which are instrumentation.

   DELETED THIS ROUND: the whole narrator apparatus — the beat script, the queue, the
   drain, the #say strip, the six-second hold that waited for lines that no longer
   exist before it would show a gate. VOICE emptied `beats` when the narrator strip
   was abolished; this file now stops pretending to have one. There is one message
   region and CONTROLS owns it.

window.FZ = window.FZ || {};

FZ.chapters = (function () {
  'use strict';

  var ALL6 = ['charter', 'vary', 'slow', 'lens', 'ledger', 'eject'];

  /* ---------------------------------------------------------------- scenarios

     one difference between them. */
  var CFG = [

    /* 1 — THE COLONY.  No failures, no instruments, no reading. Four crumbs into the
       store wall and out, in about five seconds. This passage exists so the player
       knows what a crumb and a store socket ARE before anything breaks one; it is a
       held breath, not a chapter, and it must not outstay that. */
    { id: 'ch0', chapter: 0, teach: [], tools: [], table: false,
      seed: 101, speed: 1, budget: 0, collapseMax: Infinity, outbreakCap: 0,
      agents: { n: 8, hues: [0, 1, 2] },
      jobs: { n: 4, max: 4, value: 2, spawnEvery: 45 },
      goal: { jobs: 4 }, force: {} },

    /* 2 — TWO AT ONCE.  ONE element is live in the entire simulation: Co. A worker can
       now claim from anywhere, so two of them start the same crumb from opposite ends,
       and the sim guarantees the first pair at tick 40 — under a second. The meeting
       stone comes with it, because a decision the player cannot answer is not a
       decision, and because the fastest way to teach the verb of this whole game
       (put the instrument where the trouble is) is to let them do it immediately.
       Budget 4 is one stone and no slack: a right answer is refunded, a wrong place
       is not, and there is always another double claim coming. */
    { id: 'ch1', chapter: 0, teach: ['Co'], tools: ['charter'], table: false,
      seed: 202, speed: 1, budget: 4, collapseMax: Infinity, outbreakCap: 1,
      agents: { n: 7, hues: [0, 1] },
      jobs: { n: 3, max: 3, value: 9, spawnEvery: 150 },
      goal: { jobs: 3 }, force: { coordination: true, pairEvery: 140 } },

       coordination family: Co Mc Ow Lo In. The new idea is not the arch, it is that

    { id: 'ch2', chapter: 2, tools: ['charter'], table: true,
      seed: 303, speed: 1, budget: 9, collapseMax: Infinity, outbreakCap: 1,
      agents: { n: 11, hues: [0, 1] },
      jobs: { n: 4, max: 4, value: 5, spawnEvery: 200 },
      goal: { jobs: 4 },
      force: { coordination: true, pairEvery: 130, lock: true, lockN: 2, overload: true } },

       exactly those two elements — with the whole coordination family still live the

    { id: 'ch3', chapter: 0, teach: ['Cf', 'Fl'], tools: ['slow', 'charter'], table: true,
      seed: 404, speed: 1, budget: 8, collapseMax: Infinity, outbreakCap: 1,

    { id: 'ch4', chapter: 0, teach: ['Mo', 'Lv', 'Sf'], tools: [], table: true,

    { id: 'ch5', chapter: 0, teach: ['Gu', 'Tc', 'Rp', 'Cs', 'Co', 'Mc', 'In'],

    { id: 'ch6', chapter: 0, teach: ['Mm', 'Hi', 'Di', 'Si', 'Co', 'Mc', 'In'],
      tools: ['lens', 'charter'], table: true,
      seed: 707, speed: 1, budget: 7, collapseMax: 140, outbreakCap: 1,

    /* 8 — THE SPOIL-SPORT. the last resort. opens with the lens already lit. */
    { id: 'ch7', chapter: 0, teach: ['Sa', 'Cr', 'Tw', 'Es', 'Cl', 'Lo', 'Co', 'In'],

      seed: 808, speed: 1, budget: 9, collapseMax: 140, outbreakCap: 1,
      agents: { n: 12, hues: [0, 1, 2] },
      jobs: { n: 5, max: 5, value: 5, spawnEvery: 240 },

      force: { saboteur: true, advN: 1, incorrigible: true, incN: 1, rivals: true, rivalN: 2,
               churn: true, lock: true, lockN: 1 } },

    /* 9 — MACHINE SPEED. everything learned so far, accelerating. */
    { id: 'ch8', chapter: 0,
      teach: ['Sp', 'Dp', 'My', 'Pt', 'Im', 'Cf', 'Fl', 'Co', 'Mc', 'In', 'Lo'],
      tools: ['slow', 'charter', 'lens', 'vary'], table: true,
      seed: 909, speed: 1, budget: 10, collapseMax: 120, outbreakCap: 2,
      agents: { n: 14, hues: [0, 1, 2] },
      jobs: { n: 6, max: 6, value: 5, spawnEvery: 180 },
      goal: { jobs: 8 },
      force: { speed: true, speedmax: 2.6, speedrate: 700, dependency: true, myopia: true,
               stampede: true, coordination: true, pairEvery: 200 } },

       reward and it arrives last, and everything learned is still true inside it. */
    { id: 'ch9', chapter: 9, all: true, tools: ALL6.slice(), table: true,
      seed: 1117, speed: 1.15, budget: 8, collapseMax: 100, outbreakCap: 3,
      agents: { n: 16, hues: [0, 0, 0, 0, 0, 0, 0, 1] },
      jobs: { n: 8, max: 9, value: 5, spawnEvery: 40 },

      force: {
        coordination: true, pairEvery: 230, stampede: true, poison: true, poisonN: 2,

        dependency: true, silo: true, hidden: true, overload: true,

        speed: true, speedmax: 2.2, speedrate: 4200, dark: true, drift: true,

  /* 5b — THE RE-RUN.  Identical seed, identical lineage, identical poison, identical
     length. The ONE difference in the entire configuration is that the seed exists.
     This is the controlled experiment the whole standard is built on, so nothing else
     may drift: it is cloned from CFG[4] rather than written out again, and the diff
     below is the whole diff. */
  var AB_SEED = CFG[4].seed;
  var CFG4B = (function () {
    var a = CFG[4], b = {}, k;
    for (k in a) b[k] = a[k];
    b.tools = ['vary'];              /* <- the one variable */

  var idx = 0, run = 0, phase = 'gate';

  var used = {};                           /* instruments spent this run */

    'font-variant-numeric:tabular-nums;color:rgba(0,0,0,.55)}' +
    '.gtAB .abk{flex:0 0 auto;font-size:9px;font-weight:500;letter-spacing:.1em;' +
    'color:rgba(0,0,0,.4);font-variant-numeric:tabular-nums}';

  function chromeCSS() {
    if (document.getElementById('fzGateCSS')) return;

    s.id = 'fzGateCSS';
