<script>
/* ===== 45-outbreak.js ===== */
/* ============================================================
   45-outbreak.js — THE CORE LOOP.  OWNER: PLAY.
   See CONTRACT.md §14 and REFERENCE-EOT.md §2B.

   A detector firing used to warm a table cell and nothing else. Here it opens an
   OUTBREAK: a bounded place on the field, named in one plain sentence, on a fuse of a
   few seconds, doing real damage the whole time it burns. The player reads which
   failure it is and answers it with the right institution, in the right place, in time.

     right instrument, inside the ring, before the fuse   -> it closes, the strain is
        refunded, the cell is marked as one she has answered herself
     wrong instrument                                     -> it does not close, and the
        game says plainly what the failure actually is
     the fuse runs out                                    -> the damage lands where it
        happened: work rolls back, workers go down, strain spikes, a scar stays

   FIELD draws the ring, the fuse and the resolution; TABLE pulses and marks the cell;
   CONTROLS routes every tap through tryAnswer() before FZ.sim.apply, so a correct
   diagnosis can be paid back and a wrong one can teach. This file draws nothing and
   contains no English: every sentence comes from FZ.copy.

   WHICH INSTRUMENT ANSWERS WHAT is not arbitrary and is not hidden. Each element's
   answer set is exactly the instruments NAMED in the counter line the player can already
   read on its table cell (FZ.copy.detail[sym].counter), so the mapping is learnable by
   tapping the cell — with one deliberate exception, noted at Sa below.
     CHARTER arbitrates  VARY decorrelates  LEDGER remembers
     LENS reveals        SLOW brakes        EJECT excludes
   ============================================================ */
window.FZ = window.FZ || {};

FZ.outbreak = (function () {
  'use strict';

  /* sym -> the instruments that resolve it.
     SIM is the authority (`el.answers`, CONTRACT §14.4). This table is the fallback if an
     element ever ships without one, and a generosity margin: an instrument that genuinely
     counters the element in the sim is accepted even when the cell's counter line names a
     different one first. Being right for a readable reason is never punished. */
  var ANSWERS = {
    /* coordination */
    Co: ['charter'],
    Si: ['lens'],
    Mc: ['charter'],
    Dp: ['lens', 'charter'],
    Ow: ['charter'],
    Pt: ['lens'],
    /* conformity */
    Cf: ['vary', 'slow'],
    Lv: ['vary'],
    Sf: ['vary'],
    Fl: ['slow', 'charter'],
    Cl: ['charter', 'eject'],
    Im: ['vary'],
    /* epistemics */
    Gu: ['ledger'],
    /* Cs: the LEDGER is the CAUSE, not the cure (§15.1 — skepticism up amplifies Cs, and
       the audit measures it going up). Only the LENS re-opens what was written off, and
       only the LENS is in counteredBy. Accepting a ledger here would pay the player for
       the exact move that made it worse. */
    Cs: ['lens'],
    Hi: ['lens'],
    Tc: ['ledger'],
    Di: ['lens'],
    Rp: ['ledger'],
    /* goals and power */
    Tw: ['charter'],
    /* Sa: the counter line says find it with a LENS, then EJECT. Only the expulsion
       ends it, so only the expulsion answers it — looking is not doing. */
    Sa: ['eject'],
    Lo: ['charter', 'eject'],
    My: ['lens'],
    Es: ['slow', 'charter'],
    Cr: ['eject'],
    /* meta */
    Mo: ['vary'],
    In: ['charter'],
    Sp: ['slow'],
    Mm: ['lens'],
  };

  /* ticks. The rAF loop steps once per frame, so ~60 ticks is a second.
     The fuse shortens with machine speed: that is how Sp becomes the difficulty
     curve rather than a caption. */
  var FUSE = 400, FUSE_MIN = 168, FUSE_MAX = 620;
  var FIRST_GRACE = 1.5;          /* the first one you ever see waits for you */
  var COOL_OK = 210, COOL_MISS = 160;
  var KEEP = 130;                 /* how long a resolved outbreak stays inspectable */
  var BURN_DRAIN = 0.05;          /* progress lost per tick inside a burning ring */
  var LAND_STRAIN = 6, ANSWER_RELIEF = 4;
  var STORE = 'formicary.mastery';

  var list = [];
  var mastery = {};
  var cap = 1;
  var cool = {};
  var pend = null;                /* an answer awaiting the sim's verdict on the spend */
  var seen = 0;                   /* outbreaks opened this run */
  var said = {};                  /* one-off narrator lines, once per session */
  var wired = false;
  var lastW = 0, lastH = 0;
  var api;

  function S() { return FZ.sim ? FZ.sim.state : null; }
  function loop(k) { return (FZ.copy && FZ.copy.loop && FZ.copy.loop[k]) || ''; }
  function wrongLine(sym) { return (FZ.copy && FZ.copy.wrong && FZ.copy.wrong[sym]) || ''; }
  function fireLine(sym) { return (FZ.copy && FZ.copy.fire && FZ.copy.fire[sym]) || ''; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function emit(n, d) { if (FZ.bus) FZ.bus.emit(n, d); }
  function say(key, tone) {
    if (said[key]) return;
    said[key] = 1;
    var t = loop(key);
    if (t) emit('say', { text: t, tone: tone || 'plain' });
  }

  /* ------------------------------------------------------------------ mastery */
  function load() {
    try {
      var raw = window.localStorage && window.localStorage.getItem(STORE);
      if (!raw) return;
      var o = JSON.parse(raw);
      for (var k in o) {
        if (!ANSWERS[k] || !o[k]) continue;
        mastery[k] = { answered: o[k].answered | 0, missed: o[k].missed | 0 };
      }
    } catch (e) { /* private mode, file://, quota — mastery is a bonus, never a blocker */ }
  }
  function save() {
    try { if (window.localStorage) window.localStorage.setItem(STORE, JSON.stringify(mastery)); }
    catch (e) { }
  }
  function mark(sym, key) {
    var m = mastery[sym] || (mastery[sym] = { answered: 0, missed: 0 });
    m[key]++;
    save();
    return m;
  }

  /* -------------------------------------------------------------------- shape */
  function answersFor(sym) {
    var e = FZ.ELBY ? FZ.ELBY[sym] : null;
    var out = (e && e.answers && e.answers.length) ? e.answers.slice() : [];
    var extra = ANSWERS[sym] || [];
    for (var i = 0; i < extra.length; i++) if (out.indexOf(extra[i]) < 0) out.push(extra[i]);
    return out;
  }

  /* Only ever ask a question the player has been handed an instrument to answer.
     An outbreak nothing in the bar can close is not a decision, it is a punishment. */
  function answerable(sym, st) {
    var A = answersFor(sym), T = st.tools || [];
    for (var i = 0; i < A.length; i++) if (T.indexOf(A[i]) > -1) return true;
    return false;
  }

  function radius(st) { return clamp(Math.min(st.w, st.h) * 0.22, 56, 92); }

  function burningCount() {
    var n = 0;
    for (var i = 0; i < list.length; i++) if (list[i].state === 'burning') n++;
    return n;
  }
  function findBurning(sym) {
    for (var i = 0; i < list.length; i++) if (list[i].state === 'burning' && list[i].sym === sym) return list[i];
    return null;
  }
  function left(o, st) {
    if (!o.fuse) return 0;
    return 1 - (st.tick - o.born) / o.fuse;
  }

  /* -------------------------------------------------------------------- open */
  function open(d) {
    var st = S();
    if (!st || !d || !d.sym || st.gameOver) return;
    if (cap <= 0) return;
    if (FZ.chapters && FZ.chapters.phase && FZ.chapters.phase() !== 'play') return;
    if (!answerable(d.sym, st)) return;
    if (findBurning(d.sym)) return;
    if (cool[d.sym] > st.tick) return;
    if (burningCount() >= cap) return;

    var at = d.at || { x: st.w / 2, y: st.h / 2 };
    var r = radius(st);
    var fuse = Math.round(clamp(FUSE / Math.max(1, st.speedMul || 1), FUSE_MIN, FUSE_MAX));
    if (seen === 0) fuse = Math.round(fuse * FIRST_GRACE);
    seen++;

    var o = {
      sym: d.sym,
      /* kept just inside the field: an outbreak you cannot see the clock on is not a
         decision. The fuse arc starts at twelve o'clock, so the top of the ring is the
         part that must survive. */
      x: clamp(at.x, 22, st.w - 22),
      y: clamp(at.y, 26, st.h - 22),
      r: r,
      born: st.tick,
      fuse: fuse,
      say: d.say || fireLine(d.sym),
      answers: answersFor(d.sym).slice(),
      who: (d.who || []).slice(),
      state: 'burning',
      endAt: 0,
    };
    list.push(o);
    emit('outbreak:open', { sym: o.sym, x: o.x, y: o.y, fuse: o.fuse, r: o.r });
    say('firstOutbreak', 'bad');
  }

  /* ------------------------------------------------------------------- damage */
  function el(sym) { return FZ.ELBY ? FZ.ELBY[sym] : null; }

  /* it burns: work inside the ring goes backwards while the player decides */
  function burn(o, st) {
    var d = BURN_DRAIN * (st.tempo || 1), r2 = o.r * o.r;
    for (var i = 0; i < st.jobs.length; i++) {
      var j = st.jobs[i];
      if (j.done || j.progress <= 0) continue;
      var dx = j.x - o.x, dy = j.y - o.y;
      if (dx * dx + dy * dy > r2) continue;
      j.progress = Math.max(0, j.progress - d);
    }
  }

  /* it lands: the damage arrives where it happened, all at once, and stays visible */
  function land(o, st) {
    o.state = 'landed';
    o.endAt = st.tick + KEEP;
    cool[o.sym] = st.tick + COOL_MISS;

    var r2 = (o.r * 1.15) * (o.r * 1.15), i;
    for (i = 0; i < st.jobs.length; i++) {
      var j = st.jobs[i];
      if (j.done) continue;
      var dx = j.x - o.x, dy = j.y - o.y;
      if (dx * dx + dy * dy > r2) continue;
      if (j.progress > 0) { j.progress = Math.max(0, j.progress * 0.4 - 4); j.flash = 12; }
    }
    /* the nearest few go down, not the whole colony: a miss must be legible as a
       located event, not a screen-wide freeze you cannot read */
    var near = [];
    for (i = 0; i < st.agents.length; i++) {
      var a = st.agents[i];
      var ax = a.x - o.x, ay = a.y - o.y, q = ax * ax + ay * ay;
      if (q <= r2) near.push({ a: a, q: q });
    }
    near.sort(function (p, z) { return p.q - z.q; });
    for (i = 0; i < near.length && i < 4; i++) {
      near[i].a.stun = Math.max(near[i].a.stun, 44);
      near[i].a.flash = 12;
      emit('agent:hurt', { id: near[i].a.id, x: near[i].a.x, y: near[i].a.y });
    }
    if (st.collapseMax !== Infinity) st.collapse = Math.min(st.collapseMax, st.collapse + LAND_STRAIN);
    var e = el(o.sym);
    if (e) e.heat = Math.min(1, e.heat + 0.3);

    mark(o.sym, 'missed');
    emit('outbreak:landed', { sym: o.sym, x: o.x, y: o.y, r: o.r });
    say('firstMiss', 'bad');
  }

  /* it closes: the failure visibly cools, and the instrument is paid back */
  function resolve(o, kind, st) {
    o.state = 'answered';
    o.endAt = st.tick + KEEP;
    cool[o.sym] = st.tick + COOL_OK;

    var back = (FZ.sim && FZ.sim.cost) ? FZ.sim.cost(kind) : 2;
    st.budget = Math.min(14, st.budget + back + 1);
    if (st.collapseMax !== Infinity) st.collapse = Math.max(0, st.collapse - ANSWER_RELIEF);

    /* the cell drops out of the red immediately: the consequence is in the table too */
    var e = el(o.sym);
    if (e) { e.heat = Math.min(e.heat, 0.1); e.on = false; }

    var m = mark(o.sym, 'answered');
    emit('outbreak:answered', { sym: o.sym, x: o.x, y: o.y, r: o.r });
    say('firstAnswer', 'good');
    if (m.answered === 1) say('masteryOne', 'good');
  }

  /* it stopped on its own terms: the element is genuinely countered and has gone cold,
     so the ring closes rather than burning down a fire that is already out. No reward and
     no mastery credit — the player fixed the colony, but did not answer THIS, here. */
  function defuse(o, st) {
    o.state = 'answered';
    o.endAt = st.tick + KEEP;
    cool[o.sym] = st.tick + COOL_OK;
    emit('outbreak:answered', { sym: o.sym, x: o.x, y: o.y, r: o.r });
  }

  /* ------------------------------------------------------------------ answers */
  /* CONTROLS calls this BEFORE FZ.sim.apply. The spend can still fail (no budget, a
     tap with no worker under it), so the outcome is held until the sim reports back
     on `intervene`, and rolled back if nothing was actually spent. */
  function tryAnswer(kind, x, y) {
    var st = S();
    var miss = { hit: false, right: false, sym: null, msg: '' };
    if (!st || !kind) return miss;

    var best = null, bd = Infinity, near = null;
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      if (o.state !== 'burning') continue;
      var d = (x == null) ? 0 : Math.sqrt((o.x - x) * (o.x - x) + (o.y - y) * (o.y - y));
      var reach = o.r + 26;
      if (d <= reach) { if (d < bd) { bd = d; best = o; } }
      else if (o.answers.indexOf(kind) > -1 && !near) near = o;
    }

    if (!best) {
      /* the right instrument, in the wrong place: say so, and let it apply anyway */
      if (near) return { hit: false, right: false, sym: near.sym, msg: loop('tooFar') };
      return miss;
    }

    if (best.answers.indexOf(kind) > -1) {
      pend = { o: best, kind: kind, right: true };
      return { hit: true, right: true, sym: best.sym, msg: loop('answered') + ' — ' + loop('refund') };
    }
    pend = { o: best, kind: kind, right: false };
    return { hit: true, right: false, sym: best.sym, msg: wrongLine(best.sym) };
  }

  function settle(d) {
    if (!pend) return;
    var p = pend; pend = null;
    var st = S();
    if (!st || !d || !d.ok) return;              /* nothing was spent — nothing happened */
    if (p.o.state !== 'burning') return;
    if (p.right) { resolve(p.o, p.kind, st); return; }
    emit('outbreak:wrong', { sym: p.o.sym, kind: p.kind, msg: wrongLine(p.o.sym) });
    say('firstWrong', 'bad');
  }

  /* ------------------------------------------------------------------- update */
  function update(st) {
    if (!st) return;
    if (!wired) wire();

    /* the phone rotated, or the ticker grew a line: the sim rescales its world, so
       the outbreaks have to move with it or they point at nothing. */
    if (lastW && lastH && (lastW !== st.w || lastH !== st.h)) {
      var kx = st.w / lastW, ky = st.h / lastH;
      for (var q = 0; q < list.length; q++) { list[q].x *= kx; list[q].y *= ky; }
    }
    lastW = st.w; lastH = st.h;

    for (var i = list.length - 1; i >= 0; i--) {
      var o = list[i];
      if (o.state === 'burning') {
        var e = el(o.sym);
        if (e && e.countered && e.heat < 0.1 && st.tick - o.born > 45) defuse(o, st);
        else if (st.tick - o.born >= o.fuse) land(o, st);
        else burn(o, st);
      } else if (st.tick >= o.endAt) {
        list.splice(i, 1);
      }
    }
  }

  function wire() {
    if (wired || !FZ.bus) return;
    wired = true;
    FZ.bus.on('fire', open);
    FZ.bus.on('intervene', settle);
    FZ.bus.on('lose', function () { list.length = 0; pend = null; });
    FZ.bus.on('goal', function () { list.length = 0; pend = null; });
  }

  load();
  wire();

  api = {
    list: list,
    mastery: mastery,
    enabled: true,
    cap: 1,

    reset: function (scenario) {
      list.length = 0;
      pend = null;
      cool = {};
      seen = 0;
      var st = S();
      lastW = st ? st.w : 0; lastH = st ? st.h : 0;
      cap = (scenario && scenario.outbreakCap != null) ? scenario.outbreakCap : 1;
      api.cap = cap;
      wire();
    },

    update: update,
    tryAnswer: tryAnswer,

    /* the one a tap should be judged against when the instrument is untargeted:
       whichever is closest to landing. CONTROLS uses this. */
    urgent: function () {
      var st = S();
      if (!st) return null;
      var best = null, bl = 2;
      for (var i = 0; i < list.length; i++) {
        var o = list[i];
        if (o.state !== 'burning') continue;
        var l = left(o, st);
        if (l < bl) { bl = l; best = o; }
      }
      return best;
    },

    /* how many of the twenty-eight this player has personally answered */
    answeredCount: function () {
      var n = 0;
      for (var k in mastery) if (mastery[k] && mastery[k].answered > 0) n++;
      return n;
    },

    answersFor: answersFor,
  };
  return api;
})();

</script>
<script>
/* ===== 50-render.js ===== */
/* ============================================================
   50-render.js — THE FIELD.  OWNER: FIELD.
   FZ.render = { init(canvas), resize(w,h), draw(S) }

   Rules obeyed here:
     - S is read, never written.
     - Colors are only the six palette literals. Every tint is done with
       ctx.globalAlpha over a palette literal, so no derived color exists.
     - The field is always black: a lit vitrine, legible on a light or dark page.
     - The causal beat (Law 3) is the point of this file. Every failure is drawn
       AT the coordinate where it happened, pointing at the bodies responsible,
       carrying the element's own mark, decaying in about a second.
   ============================================================ */
FZ.render = (function () {
  'use strict';

  var C = { teal: '#19e6c8', amber: '#ffd23f', red: '#ff2e2e', blue: '#3b82f6', white: '#ffffff', black: '#000000' };
  /* lineage -> one of five palette values. Red is last so it is rare. */
  var LINEAGE = [C.teal, C.amber, C.blue, C.white, C.red];
  var TAU = Math.PI * 2;

  var cv = null, ctx = null, dpr = 1, W = 360, H = 300;
  var wired = false, now = 0, sx = 1, sy = 1;
  var beats = [];                 // transient causal marks
  var dots = null;                // cached pattern: charter interior
  var peak = new Map();           // job id -> best progress seen (rollback ghost)
  var hurtAt = new Map();         // agent id -> t of last stun
  var gimg = new Map();           // 'sym|color' -> {img, ok}
  var agentIx = new Map();        // per-frame id -> agent
  var jobIx = new Map();          // per-frame id -> job
  var lastTick = -1;
  var tickMine = '', tickAt = 0;

  /* ---------------------------------------------------------- small helpers */
  function A(a) { ctx.globalAlpha = a < 0 ? 0 : a > 1 ? 1 : a; }
  function X(v) { return v * sx; }
  function Y(v) { return v * sy; }
  function ease(t) { return 1 - Math.pow(1 - t, 3); }

  function ring(x, y, r, col, lw, a) {
    if (r <= 0) return;
    A(a); ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  }
  function disc(x, y, r, col, a) {
    A(a); ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  function box(x, y, s, col, lw, a) {
    A(a); ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.strokeRect(x - s / 2 + lw / 2, y - s / 2 + lw / 2, s - lw, s - lw);
  }
  function line(x1, y1, x2, y2, col, lw, a) {
    A(a); ctx.strokeStyle = col; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  /* four L brackets converging on a point — the "this, here" mark */
  function brackets(x, y, r, len, col, lw, a) {
    A(a); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'butt';
    var d = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
    for (var i = 0; i < 4; i++) {
      var ox = d[i][0] * r, oy = d[i][1] * r;
      ctx.beginPath();
      ctx.moveTo(x + ox - d[i][0] * len, y + oy);
      ctx.lineTo(x + ox, y + oy);
      ctx.lineTo(x + ox, y + oy - d[i][1] * len);
      ctx.stroke();
    }
  }
  function lineage(h) {
    var i = 0;
    if (typeof h === 'number' && isFinite(h)) i = h > 4 ? Math.round(h / 72) : Math.round(h);
    i = ((i % LINEAGE.length) + LINEAGE.length) % LINEAGE.length;
    return LINEAGE[i];
  }
  /* The field only shouts about failures this chapter has taught. Chapter one has
     to look calm even when two workers happen to share a job. */
  function taught(sym) {
    var e = (window.FZ && FZ.sim) ? FZ.sim.enabled : null;
    if (!e || typeof e.has !== 'function') return true;
    return e.has(sym);
  }
  function idsOf(v) {
    if (!v) return [];
    if (Array.isArray(v)) return v;
    if (typeof v.forEach === 'function') { var o = []; v.forEach(function (x) { o.push(x); }); return o; }
    return [];
  }

  /* -------------------------------------------------- element mark, on canvas
     The same drawn glyph the table cell shows, rasterized once per colour.
     This is what makes a fire on the field and a cell in the table the same

        var y1 = ty2 > y ? bx2.y : bx2.y + bx2.h, y2 = ty2 > y ? y + 30 : y - 30;
        A(0.9 * fade); ctx.strokeStyle = C.red; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(px2, y1); ctx.lineTo(px2, y2); ctx.lineTo(x, y2); ctx.stroke();
      }
      return true;
    }

    if (b.k === 'done') {
      var e = ease(k);
      if (k < 0.3) { A((1 - k / 0.3) * 0.9); ctx.fillStyle = C.teal; ctx.fillRect(x - 13, y - 13, 26, 26); }
      box(x, y, 18 + e * 34, C.teal, 3 - k * 2.4, (1 - k) * 0.98);
      box(x, y, 18 + e * 18, C.teal, 2 - k * 1.6, (1 - k) * 0.6);
      var n = Math.max(1, Math.min(6, Math.round(b.v)));
      A((1 - k) * 0.98); ctx.fillStyle = C.teal;
      for (var p = 0; p < n; p++) ctx.fillRect(x - n * 3.5 + p * 7, y - 12 - e * 30, 4, 4);
      return true;
    }

    if (b.k === 'lost') {
      var e2 = ease(k), d = 3 + e2 * 16;
      A((1 - k) * 0.7); ctx.strokeStyle = C.red; ctx.lineWidth = 1.5;
      var q = [[-1, -1], [1, -1], [-1, 1], [1, 1]];
      for (var f = 0; f < 4; f++) {
        var fx = x + q[f][0] * d, fy = y + q[f][1] * d;
        ctx.strokeRect(fx - 3.5, fy - 3.5, 7, 7);
      }
      brackets(x, y, 7 + e2 * 5, 4, C.red, 1.5, (1 - k) * 0.65);
      return true;
    }

    if (b.k === 'hurt') {
      var e3 = ease(k);
      A((1 - k) * 0.95); ctx.strokeStyle = C.red; ctx.lineWidth = 2;
      for (var s = 0; s < 6; s++) {
        var an2 = (s / 6) * TAU;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(an2) * (5 + e3 * 8), y + Math.sin(an2) * (5 + e3 * 8));
        ctx.lineTo(x + Math.cos(an2) * (10 + e3 * 14), y + Math.sin(an2) * (10 + e3 * 14));
        ctx.stroke();
      }
      return true;
    }

    /* an outbreak opening: the field flinches at the exact spot */
    if (b.k === 'open') {
      var eo = ease(k);
      brackets(x, y, 60 - eo * 22, 10, C.red, 3, 1 - k);
      ring(x, y, 10 + eo * 30, C.red, 3 - k * 2, (1 - k) * 0.9);
      return true;
    }
    /* answered: the boundary closes, in the colour of things that work */
    if (b.k === 'shut') {
      var es = ease(k), r0 = Math.max(26, (b.r || 60) * sx);
      ring(x, y, r0 * (1 - es * 0.86), C.teal, 3.5 - k * 2, (1 - k) * 0.98);
      A((1 - k) * 0.9); ctx.strokeStyle = C.teal; ctx.lineWidth = 3;
      for (var s2 = 0; s2 < 4; s2++) {
        var sa = -Math.PI / 4 + s2 * (TAU / 4), rr = r0 * (1 - es) + 6;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(sa) * rr, y + Math.sin(sa) * rr);
        ctx.lineTo(x + Math.cos(sa) * (rr - 10), y + Math.sin(sa) * (rr - 10));
        ctx.stroke();
      }
      if (b.sym && k < 0.75) tag(b.sym, x, y - r0 - 18 < 16 ? y + r0 + 18 : y - r0 - 18, C.teal, 1 - k / 0.75);
      return true;
    }
    /* it landed: the boundary bursts outward and leaves a mark */
    if (b.k === 'land') {
      var el2 = ease(k), r1 = Math.max(26, (b.r || 60) * sx);
      ring(x, y, r1 * (1 + el2 * 0.5), C.red, 4 - k * 3, (1 - k) * 0.95);
      A((1 - k) * 0.9); ctx.strokeStyle = C.red; ctx.lineWidth = 2.5;
      for (var l2 = 0; l2 < 8; l2++) {
        var la = (l2 / 8) * TAU, d4 = r1 * (0.4 + el2 * 0.7);
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(la) * d4, y + Math.sin(la) * d4);
        ctx.lineTo(x + Math.cos(la) * (d4 + 13), y + Math.sin(la) * (d4 + 13));

    if (b.k === 'scar') {
      var a5 = (1 - k) * 0.4;
      A(a5); ctx.strokeStyle = C.red; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 7, y - 7); ctx.lineTo(x + 7, y + 7);
      ctx.moveTo(x + 7, y - 7); ctx.lineTo(x - 7, y + 7);

    }

  function aim(S) {
    var am = (window.FZ && FZ.controls) ? FZ.controls.aim : null;
    if (!am || am.x === undefined || am.x === null) return;
    var x = X(am.x), y = Y(am.y);
    var pulse = 0.72 + Math.sin(now * 0.006) * 0.18;

    if (am.kind === 'charter') {
      var r = (FZ.sim && FZ.sim.charterR) || 82;
      charter(x, y, r * sx, pulse, false);

      ctx.setLineDash([6, 5]);

      ctx.setLineDash([]);
      var ags = (S.agents || []);
      for (var i = 0; i < ags.length; i++) {
        var dx = X(ags[i].x) - x, dy = Y(ags[i].y) - y;
        if (dx * dx + dy * dy < vr * vr) ring(X(ags[i].x), Y(ags[i].y), 11, C.amber, 2, 0.9);
      }
      return;

      for (var k = 0; k < as.length; k++) {
        var ddx = X(as[k].x) - x, ddy = Y(as[k].y) - y, d2 = ddx * ddx + ddy * ddy;
        if (d2 < bd) { bd = d2; best = as[k]; }

      if (best) {
        var bx = X(best.x), by = Y(best.y);
        brackets(bx, by, 16, 6, C.red, 2.5, pulse + 0.2);
        ring(bx, by, 22, C.red, 1.5, 0.4);
        line(bx - 26, by, bx - 18, by, C.red, 2, 0.8);
        line(bx + 18, by, bx + 26, by, C.red, 2, 0.8);
      } else {
        brackets(x, y, 16, 6, C.white, 2, 0.35);

  function draw(S) {
    if (!ctx) return;
    now = performance.now();
    wire();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter'; ctx.setLineDash([]);
    A(1); ctx.fillStyle = C.black; ctx.fillRect(0, 0, W, H);

    if (!S) { A(0.14); ctx.strokeStyle = C.white; ctx.lineWidth = 1; ctx.strokeRect(0.5, 0.5, W - 1, H - 1); return; }

    sx = S.w ? W / S.w : 1;
    sy = S.h ? H / S.h : 1;

    if (typeof S.tick === 'number' && S.tick < lastTick) { peak.clear(); hurtAt.clear(); beats.length = 0; }
    lastTick = S.tick || 0;
    if ((lastTick % 600) === 0 && peak.size > 64) {
      var alive = new Set();
      for (var pk2 = 0; pk2 < (S.jobs || []).length; pk2++) alive.add(S.jobs[pk2].id);
      peak.forEach(function (v, k2) { if (!alive.has(k2)) peak.delete(k2); });
    }

    var agents = S.agents || [], jobs = S.jobs || [];
    agentIx.clear(); jobIx.clear();
    for (var i = 0; i < agents.length; i++) agentIx.set(agents[i].id, agents[i]);
    for (var q = 0; q < jobs.length; q++) {
      var jb = jobs[q];
      jobIx.set(jb.id, jb);
      var pv = Math.max(0, Math.min(1, (jb.progress || 0) / (jb.need || 1)));
      var old = peak.get(jb.id);
      if (old === undefined || pv > old) peak.set(jb.id, pv);

    var fel = (fsym && FZ.ELBY) ? FZ.ELBY[fsym] : null;

    var fset = focusing ? new Set(fwho) : null;

    grid();

    var chs = S.charters || [];
    for (var c = 0; c < chs.length; c++) charter(X(chs[c].x), Y(chs[c].y), (chs[c].r || 60) * sx, 1, true);

    outbreaks(S, 1);
    prereqLinks(S, dimBase);

    /* a rumor is a job-shaped hole: dashed, empty, drifting */
    if (S.rumor && taught('Gu')) {
      var rx = X(S.rumor.x), ry = Y(S.rumor.y), rp = 0.55 + Math.sin(now * 0.005) * 0.3;
      A(rp); ctx.strokeStyle = C.amber; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
      ctx.strokeRect(rx - 11, ry - 11, 22, 22);
      ctx.beginPath(); ctx.arc(rx, ry, 18 + Math.sin(now * 0.005) * 4, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      A(rp * 0.9); ctx.strokeStyle = C.amber; ctx.lineWidth = 2;

    for (var t = 0; t < jobs.length; t++) {
      var job = jobs[t];
      var cl = (job.claims && taught('Co')) ? idsOf(job.claims) : [];
      if (cl.length < 2) continue;
      for (var u = 0; u < cl.length; u++) {
        var ca = agentIx.get(cl[u]);
        if (!ca) continue;
        A(0.26 * dimBase); ctx.strokeStyle = C.red; ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(X(job.x), Y(job.y)); ctx.lineTo(X(ca.x), Y(ca.y)); ctx.stroke();
        ctx.setLineDash([]);

    /* the lens: every worker draws a line to what it intends. One will not. */
    if (S.lensOn) {
      for (var l = 0; l < agents.length; l++) {
        var ag = agents[l];
        var tj = jobIx.get(ag.job);
        if (!tj) continue;
        var d1 = (fset && !fset.has(ag.id)) ? 0.3 : 1;
        line(X(ag.x), Y(ag.y), X(tj.x), Y(tj.y), lineage(ag.hue), 1.2, 0.5 * d1);
      }
    }

    var rad = (agents.length > 30 ? 5.8 : agents.length > 20 ? 6.4 : 7.2) * zoom();
    for (var m = 0; m < agents.length; m++) {
      var a2 = agents[m];
      drawAgent(a2, rad, (fset && !fset.has(a2.id)) ? dimBase : 1, S);
    }

    /* the table is pointing: ring the bodies it means, and name them there */
    if (focusing) {
      var wob = 0.6 + Math.sin(now * 0.007) * 0.35;
      for (var f = 0; f < fwho.length; f++) {
        var fa = agentIx.get(fwho[f]);
        if (!fa) continue;
        var fx = X(fa.x), fy = Y(fa.y);
        ring(fx, fy, 13, C.white, 2, wob);
        ring(fx, fy, 17.5, C.white, 1, wob * 0.5);
        markAt(fsym, fx + 15, fy - 14, 14, C.white, wob);
      }
    }

    outbreaks(S, 2);

    /* Beats. Everything that is not a fire draws in place; a fire first pulls the
       whole field down so the one thing that just went wrong is the only thing lit. */
    var fires = [];
    for (var b = beats.length - 1; b >= 0; b--) {
      var bt = beats[b];
      if (now - bt.t >= bt.life) { beats.splice(b, 1); continue; }
      if (bt.k === 'fire') fires.push(bt); else drawBeat(bt);
    }
    if (fires.length) {
      var dk = 0;
      for (var d2 = 0; d2 < fires.length; d2++) {
        var ag2 = now - fires[d2].t;
        if (ag2 < 460) dk = Math.max(dk, (1 - ag2 / 460) * 0.58);
      }
      if (fires.length > 2) dk *= 0.5;   /* in a storm, stop strobing the field */
      if (dk > 0.01) { A(dk); ctx.fillStyle = C.black; ctx.fillRect(0, 0, W, H); }
      for (var d3 = fires.length - 1; d3 >= 0; d3--) drawBeat(fires[d3]);

    /* the colony is being held at human speed */
    if (S.slowUntil && S.tick < S.slowUntil) {
      A(0.35 + Math.sin(now * 0.004) * 0.15); ctx.strokeStyle = C.blue; ctx.lineWidth = 3;

    A(0.16); ctx.strokeStyle = C.white; ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
    A(1);
    tickerHold(S);
    tickerAge();
  }

  return {
    init: function (canvas) {
      cv = canvas;
      if (!cv) return;

      dpr = Math.min(3, window.devicePixelRatio || 1);
      dots = null;
      wire();
      warm();
      this.resize(cv.clientWidth || W, cv.clientHeight || H);
    },
    resize: function (w, h) {
      W = Math.max(1, Math.round(w)); H = Math.max(1, Math.round(h));
      if (!cv) return;
      dpr = Math.min(3, window.devicePixelRatio || 1);
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      if (ctx) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); dots = null; }
    },
    draw: draw,
  };
})();

    /* nothing was spent -> say why, and never claim an answer that did not happen */
    if (out && !out.ok) { if (out.msg) FZ.ui.toast(out.msg, 'bad'); }
    else if (ans && ans.hit && ans.right) FZ.ui.toast(ans.msg || loop('answered'), 'good');
    else if (ans && ans.msg) FZ.ui.toast(ans.msg, 'bad');

    var L = (FZ.outbreak && FZ.outbreak.list) ? FZ.outbreak.list : null;
    var best = null, bd = Infinity;

      var o = L[i];

         still answers "what am I looking at". */
      var hot = null;

    field.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    field.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();

      var p = toWorld(ev);

    function up(ev) {

  }

  /* ---------------------------------------------------------------- painting */
  function paintBar() {
    var st = S();

      if (!st) return;

  api = {
    armed: null,
    aim: null,

    build: function () {

      hint = document.getElementById('aimHint');
      wireField();
      if (FZ.bus) {

        FZ.bus.on('lose', function () { disarm(); });
        FZ.bus.on('goal', function () { disarm(); });

    /* ONLY these buttons exist. Absent, never greyed-out-forever. */
    setAvailable: function (kinds) {

      if (!bar) return;
      var want = [];
      var set = {};
      (kinds || []).forEach(function (k) { if (MARK[k]) set[k] = 1; });
      ORDER.forEach(function (k) { if (set[k]) want.push(k); });

      if (api.armed && !set[api.armed]) disarm();

      /* remove what is no longer taught */
      have.forEach(function (k) {
        if (set[k]) return;

    kinds: function () { return have.slice(); },

  return api;

      goal: { jobs: 117 },
      force: {
        coordination: true, pairEvery: 230, stampede: true, poison: true, poisonN: 2,
        rumor: true, lieEvery: 520, saboteur: true, advN: 1, lock: true, lockN: 2,
        dependency: true, silo: true, hidden: true, overload: true,
        rivals: true, rivalN: 2, incorrigible: true, incN: 1, myopia: true, churn: true,

  /* 4b — the re-run. Identical seed, identical poison, identical length.

  var CFG4B = (function () {
    var a = CFG[4], b = {};
    for (var k in a) b[k] = a[k];
    b.tools = ['vary'];
    b.budget = 4;
    b.outbreakCap = 1;

  })();

  /* ------------------------------------------------------------------- state */
  var idx = 0, run = 0, phase = 'gate';
  var beats = [], queue = [], shownAt = 0, cur = null, pending = null, pendAt = 0;
  var abFires = [0, 0];              /* chapter 4: how hot Sf got, run 1 vs run 2 */
  var used = {};                     /* tools spent this run */
  var sfHit = 0;                     /* workers taken down by Sf this run */
  var counteredEver = {};
  var wired = false, built = false;
  var app = null, gate = null, sayEl = null, rail = null, titleEl = null, countEl = null, strip = null, aboutEl = null;
  var stripCells = null;
  var api;

  function C(i) { return (FZ.copy.chapters && FZ.copy.chapters[i]) || {}; }
  function ui(k) { return (FZ.copy.ui && FZ.copy.ui[k]) || ''; }
  function cfgFor(i, r) { return (i === 4 && r === 1) ? CFG4B : CFG[i]; }
  function el(tag, cls, txt) {

  /* --------------------------------------------------------------- narrator */
  function enqueue(text, tone) {

    queue.push({ text: text, tone: tone || 'plain' });
  }
  function drain() {
    if (!queue.length || !sayEl) return;
    var now = performance.now();
    var hold = queue.length > 2 ? 1500 : 2600;
    if (cur && now - shownAt < hold) return;
    cur = queue.shift();
    shownAt = now;
    sayEl.textContent = cur.text;
    sayEl.setAttribute('data-tone', cur.tone);

  }

  /* ------------------------------------------------------------------ beats */
  function loadBeats(i) {
    var src = C(i).beats || [];
    beats = src.map(function (b) { return { at: b.at, text: b.text, tone: b.tone, used: false, headAt: null }; });
    evc = {};

    if (sayEl) { sayEl.textContent = ''; sayEl.removeAttribute('data-tone'); }
  }
  /* Beats are a script, not a set of independent triggers: only the next unspoken line
     can fire, so a line that assumes the one before it can never arrive first.
     Events (a detector firing, a tool being spent) are RECORDED rather than matched
     on the spot, so a beat still gets its trigger if it was not yet the head when the
     thing happened. A head beat whose trigger never comes at all is dropped after SKIP

  var SKIP = 500;
  var evc = {};                      /* recorded, unconsumed triggers */

  function record(key) { evc[key] = (evc[key] || 0) + 1; pump(); }

  function match(at, S) {
    if (at === 'start') return 'start';
    if (!at || typeof at !== 'object') return false;
    if (at.tick != null) return S.tick >= at.tick;
    if (at.jobs != null) return S.jobsDone >= at.jobs;
    if (at.fire) return evc['fire:' + at.fire] > 0 ? 'fire:' + at.fire : false;
    if (at.tool) return evc['tool:' + at.tool] > 0 ? 'tool:' + at.tool : false;
    return false;

  function pump() {
    var S = FZ.sim.state;

      if (b.headAt == null) b.headAt = S.tick;
      var m = match(b.at, S);
      if (m) {
        b.used = true;
        if (typeof m === 'string' && evc[m]) evc[m]--;
        FZ.bus.emit('say', { text: b.text, tone: b.tone });
        return true;

      if (S.tick - b.headAt < SKIP) return false;
      /* Overdue — but only drop it if it is actually blocking a line that could speak
         now. A trigger that is merely slow still gets to arrive. */
      var blocking = false;
      for (var j = i + 1; j < beats.length; j++) {
        if (!beats[j].used && match(beats[j].at, S)) { blocking = true; break; }
      }

      b.used = true;

    gate = document.getElementById('gate');
    sayEl = document.getElementById('say');

      var row = el('div', 'hrow');
      hdr.insertBefore(row, hdr.firstChild);

  /* ------------------------------------------------------------------- gates */
  function showGate(build, tone) {

  function gateBtn(label, fn, alt) {

    b.type = 'button';

  function head(box, i, card) {
    var inn = el('div', 'gtIn' + (card ? ' card' : ''));
    if (card) {

      inn.appendChild(w);

      learnBlock(inn, i);
      box.appendChild(gateBtn(ui('next'), function () { api.next(); }));

  /* chapter 4, between the two runs and after them */
  function rerunGate() {
    phase = 'result';
    showGate(function (box) {
      var inn = head(box, 4);
      inn.appendChild(el('div', 'gtWin', C(4).win || ''));
      box.appendChild(gateBtn(ui('again'), function () { begin(4, 1); }));
    }, 'good');
  }
  /* one row per run: how hot Sf got, on the same heat scale the table has been
     showing all game. Same seed, same poison, one difference. */
  function abRow(n, sym, val, isB, scale) {
    var r = el('div', 'abr' + (isB ? ' b' : ''));
    r.appendChild(el('span', 'abn', String(n)));
    var e = FZ.ELBY ? FZ.ELBY[sym] : null;
    var g = el('span', 'abg');
    if (e && e.glyph) g.innerHTML = e.glyph;
    r.appendChild(g);

    bar.appendChild(fill);

    showGate(function (box) {
      var inn = head(box, 4);

      inn.appendChild(el('div', 'gtWin', rr.after || ''));

  /* losing is information, not punishment: it names what killed you and re-runs */
  function loseGate(why) {

  /* ------------------------------------------------------------------ ending */
  function postmortem(inn) {

    for (var i = 0; i < FZ.EL.length; i++) {

      var l2 = el('div', 'gtList');

  }
  function pmRow(e, v) {

    r.appendChild(g);

    return r;
  }
  function endGate(won) {
    phase = 'result';
    var E = FZ.copy.end || {};
    showGate(function (box) {
      var inn = el('div', 'gtIn');
      inn.appendChild(el('div', 'gtNum', FZ.copy.ui.chapterOf(CFG.length, CFG.length)));
      inn.appendChild(el('div', 'gtTitle', won ? (E.wonTitle || '') : (E.lostTitle || '')));
      inn.appendChild(el('div', 'gtSub', ui('tagline')));
      inn.appendChild(el('div', 'gtWin', won ? (E.wonBody || '') : (E.lostBody || '')));
      postmortem(inn);
      box.appendChild(inn);
      box.appendChild(gateBtn(E.again || ui('again'), function () { begin(9, 0); }));
      box.appendChild(gateBtn(ui('about'), function () { openAbout(); }, true));
    }, won ? 'good' : 'bad');
  }

  /* ------------------------------------------------------------------- about */
  function buildAbout() {
    if (!aboutEl || aboutEl.children.length) return;
    var A = FZ.copy.about || {};
    var inn = el('div', 'abIn');
    inn.appendChild(el('h1', null, ui('title')));
    inn.appendChild(el('div', 'abTag', ui('tagline')));
    (A.body || []).forEach(function (pair) {
      inn.appendChild(el('h2', null, pair[0]));
      inn.appendChild(el('p', null, pair[1]));
    });
    aboutEl.appendChild(inn);
    var b = el('button', 'gtBtn', ui('close'));
    b.type = 'button';
    b.addEventListener('click', function (e) { e.preventDefault(); aboutEl.classList.remove('on'); });
    aboutEl.appendChild(b);
  }
  function openAbout() { buildAbout(); if (aboutEl) aboutEl.classList.add('on'); }

  /* -------------------------------------------------------------- status strip */
  function stripFor(cfg) {
    if (!stripCells) return;
    show(stripCells.jobs, true);
    show(stripCells.budget, (cfg.tools || []).length > 0);
    show(stripCells.collapse, cfg.collapseMax !== Infinity);
    show(stripCells.speed, !!(cfg.force && cfg.force.speed));
  }
  function show(n, on) { if (n) n.style.display = on ? '' : 'none'; }

  function paintStrip(S) {
    if (!stripCells) return;
    var b;
    b = stripCells.jobs.lastChild;
    b.textContent = S.jobsGoal ? (S.jobsDone + '/' + S.jobsGoal) : String(S.jobsDone);
    b = stripCells.budget.lastChild;
    b.textContent = String(S.budget);
    if (stripCells.collapse.style.display !== 'none') {
      var f = Math.max(0, Math.min(1, S.collapse / (S.collapseMax || 100)));
      stripCells.collapse.querySelector('.mtr i').style.width = Math.round(f * 100) + '%';
      stripCells.collapse.classList.toggle('hot', f > 0.66);
      stripCells.collapse.lastChild.textContent = String(Math.round(f * 100));
    }
    if (stripCells.speed.style.display !== 'none') {
      stripCells.speed.lastChild.textContent = (S.tempo || S.speedMul || 1).toFixed(1);
      stripCells.speed.classList.toggle('fast', (S.tempo || 1) > 1.6);
    }
  }

  /* --------------------------------------------------------------- lifecycle */
  function wire() {
    if (wired) return;
    wired = true;
    FZ.bus.on('say', function (d) { if (d) enqueue(d.text, d.tone); });
    FZ.bus.on('fire', function (d) {
      if (!d || phase !== 'play') return;
      /* chapter 4 counts the bodies: how many workers one synchronized failure takes
         down at once is the whole difference between the two runs. */
      if (idx === 4 && d.sym === 'Sf') sfHit += (d.who && d.who.length) || 1;
      if (app && cfgFor(idx, run).tableOnFire) app.classList.remove('noTable');
      record('fire:' + d.sym);
    });
    FZ.bus.on('intervene', function (d) {
      if (!d || !d.ok) return;
      if (d.kind) used[d.kind] = (used[d.kind] || 0) + 1;
      if (phase === 'play') record('tool:' + d.kind);
    });
    FZ.bus.on('goal', function () { if (phase === 'play') won(); });
    FZ.bus.on('lose', function (d) { if (phase === 'play') lost(d && d.why); });
  }

  function begin(i, r) {
    buildChrome();
    wire();
    idx = i; run = r || 0;
    var cfg = cfgFor(i, run);

    pending = null;
    used = {};
    sfHit = 0;
    counteredEver = {};
    FZ.sim.reset(cfg);
    if (FZ.table) { FZ.table.close && FZ.table.close(); FZ.table.setEnabled(FZ.sim.enabled); }
    if (FZ.controls) FZ.controls.setAvailable(cfg.tools || []);
    if (FZ.outbreak && FZ.outbreak.reset) FZ.outbreak.reset(cfg);

    if (app) {
      app.classList.toggle('noTable', cfg.table === false);
      app.classList.toggle('noBar', !(cfg.tools || []).length);
    }
    if (titleEl) titleEl.textContent = C(i).title || '';
    if (countEl) countEl.textContent = FZ.copy.ui.chapterOf(i + 1, CFG.length);
    railTo(i);
    stripFor(cfg);

    loadBeats(i);
    hideGate();
    phase = 'play';

    /* chapter 7 opens with the lens already lit — the copy assumes you can see */
    if (cfg.openLens) FZ.sim.apply('lens');

    FZ.bus.emit('chapter:enter', { index: i, cfg: cfg });

    /* the re-run speaks its own opening line: same colony, one difference */
    if (i === 4 && run === 1) {
      var rr = C(4).rerun || {};
      FZ.bus.emit('say', { text: rr.intro || '', tone: 'name' });
    }
    pump();
    drain();
  }

  /* a gate never cuts the narrator off mid-thought: the world freezes on the deciding
     frame, the remaining lines are spoken, then the card comes up. */
  function after(fn) { pending = fn; pendAt = performance.now(); }

  function won() {
    phase = 'result';
    record('win');
    if (idx === 4) {
      abFires[run] = sfHit;
      after(run === 0 ? rerunGate : afterGate);
      return;
    }
    if (idx >= CFG.length - 1) { after(function () { endGate(true); }); return; }
    after(function () { winGate(idx); });
  }

  function lost(why) {
    phase = 'result';
    record('lose');
    if (idx >= CFG.length - 1) { after(function () { endGate(false); }); return; }
    after(function () { loseGate(why || 'In'); });
  }

  api = {
    list: CFG.map(function (c, i) { return { cfg: c, script: (C(i).beats || []) }; }),
    index: 0,
    phase: function () { return phase; },

    start: function (i) {
      buildChrome();
      wire();
      i = Math.max(0, Math.min(CFG.length - 1, i | 0));
      idx = i; run = 0; api.index = i;
      pending = null;
      var cfg = CFG[i];
      /* the gate is shown over a world that is already correct behind it */
      FZ.sim.reset(cfg);
      if (FZ.table) FZ.table.setEnabled(FZ.sim.enabled);
      if (FZ.controls) FZ.controls.setAvailable([]);
      if (app) {
        app.classList.toggle('noTable', cfg.table === false);
        app.classList.toggle('noBar', true);
      }
      if (titleEl) titleEl.textContent = C(i).title || '';
      if (countEl) countEl.textContent = FZ.copy.ui.chapterOf(i + 1, CFG.length);
      railTo(i);
      stripFor(cfg);
      openGate(i);
    },

    next: function () {
      if (idx >= CFG.length - 1) { api.start(idx); return; }
      api.start(idx + 1);
    },
    retry: function () { begin(idx, run); },

    /* called once per frame by the boot loop, after the sim has stepped */
    update: function (S) {
      api.index = idx;
      if (built) paintStrip(S);
      if (phase === 'play') {
        pump();
        /* the re-run only teaches if the one difference actually gets spent */
        if (idx === 4 && run === 1 && !used.vary && S.tick === 320) {
          FZ.bus.emit('say', { text: (C(4).rerun || {}).intro || '', tone: 'name' });
        }
        for (var i = 0; i < FZ.EL.length; i++) {
          var e = FZ.EL[i];
          if (e.countered && FZ.sim.enabled.has(e.sym)) counteredEver[e.sym] = 1;
        }
      }
      drain();
      if (pending) {
        var now = performance.now();
        var quiet = !queue.length && now - shownAt > 1500;
        if (quiet || now - pendAt > 6000) { var f = pending; pending = null; f(); }
      }
    },
  };
  return api;
})();

</script>
<script>
/* ===== 90-boot.js ===== */
/* ============================================================
   90-boot.js — wiring.  OWNER: CHAPTERS.
   Sizes the field, builds the parts that exist, runs the single rAF loop
   (the only caller of FZ.sim.step()), and opens chapter 0.
   Every call is guarded so a partial build still boots and still draws.
   ============================================================ */
(function () {
  'use strict';

  var stage, canvas, strip, ticker, lastW = 0, lastH = 0;

  function applySize(w, h) {
    lastW = w; lastH = h;
    if (FZ.sim && FZ.sim.state) { FZ.sim.state.w = w; FZ.sim.state.h = h; }
    if (FZ.render && FZ.render.resize) { try { FZ.render.resize(w, h); } catch (e) { console.error(e); } }
  }

  /* The canvas box is laid out by CSS (flex-basis 0), so its own measurement is the
     truth: the sim field and the bitmap must be exactly the box the player sees, or the
     drawing is squashed and a tap lands somewhere other than where it looked. The stage
     arithmetic is only a fallback for before first layout. */
  function sizeField() {
    if (!stage || !canvas) return;
    var w = Math.round(canvas.clientWidth);
    var h = Math.round(canvas.clientHeight);
    if (w < 40 || h < 40) {
      w = Math.round(stage.clientWidth);
      h = Math.round(stage.clientHeight - ((strip && strip.offsetHeight) || 0) - ((ticker && ticker.offsetHeight) || 0));
    }
    w = Math.max(160, w); h = Math.max(120, h);
    if (w === lastW && h === lastH) return;
    applySize(w, h);
  }

  function boot() {
    stage = document.getElementById('stage');
    canvas = document.getElementById('field');
    strip = document.getElementById('statusStrip');
    ticker = document.getElementById('ticker');

    if (FZ.render && FZ.render.init && canvas) { try { FZ.render.init(canvas); } catch (e) { console.error(e); } }
    sizeField();
    if (FZ.table && FZ.table.build) { try { FZ.table.build(); } catch (e) { console.error(e); } }
    if (FZ.controls && FZ.controls.build) { try { FZ.controls.build(); } catch (e) { console.error(e); } }

    window.addEventListener('resize', sizeField, { passive: true });
    window.addEventListener('orientationchange', function () { setTimeout(sizeField, 220); });
    /* observe the canvas, not only the stage: the ticker growing to a second line
       shrinks the field without changing the stage at all. */
    if (window.ResizeObserver) {
      try {
        var ro = new ResizeObserver(sizeField);
        if (stage) ro.observe(stage);
        if (canvas) ro.observe(canvas);
      } catch (e) { }
    }
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

    if (FZ.chapters && FZ.chapters.start) { try { FZ.chapters.start(0); } catch (e) { console.error(e); } }

    requestAnimationFrame(frame);
  }

  function frame() {
    requestAnimationFrame(frame);
    var S = FZ.sim && FZ.sim.state;
    if (!S) return;

    var playing = !FZ.chapters || !FZ.chapters.phase || FZ.chapters.phase() === 'play';

    try {
      if (playing && !S.gameOver && FZ.sim.step) {
        FZ.sim.step();
        if (FZ.outbreak && FZ.outbreak.update) FZ.outbreak.update(S);
      }
    } catch (e) { console.error(e); }

    try { if (FZ.chapters && FZ.chapters.update) FZ.chapters.update(S); } catch (e) { console.error(e); }
    try { if (FZ.controls && FZ.controls.paint) FZ.controls.paint(S); } catch (e) { console.error(e); }
    try { if (FZ.table && FZ.table.paint) FZ.table.paint(S); } catch (e) { console.error(e); }
    try { if (FZ.render && FZ.render.draw) FZ.render.draw(S); } catch (e) { console.error(e); }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
