/* ===== 10-style.css ===== */
/* ============================================================
   10-style.css — CIVIC NATURALISM.  OWNER: SHELL.
   Governed by AESTHETIC.md, which supersedes the original hard rules.

   TWO REGISTERS, AND ONLY TWO.
   THE COLONY is the canvas: soil, sand, paper, ink. Warm, drawn, imperfect,
   and it owns the screen whenever nothing needs the player's judgement.
   THE INSTRUMENTATION is this file's job: a paper label across the top with
   tiny mono numerals and square marks, and a paper card that covers the glass
   between episodes. Rails, stamps, numerals and rules stay rectilinear. The
   organic shapes are drawn, not styled.

   WHAT IS GONE. The permanent HUD: no narrator strip, no ticker, no toast, no
   detail card, no 28-cell drawer, no six-button tool bar. Those were four
   simultaneous explanations of two different failures. What is left is one
   quiet crown, the colony, and — only when there is a decision — one action.

   PALETTE. MATERIAL is the world and never means anything. SIGNAL is the
   instrumentation and appears ONLY when it means something: teal held, amber
   asking, red damage, blue known. Every grey is rgba(0,0,0,a)/rgba(255,255,255,a),
   never a new hex. build.js enforces the allowlist.

   Built for a 390x844 phone held in one hand; holds from 320 to 430.
   ============================================================ */

:root {
  /* MATERIAL — the world */
  --paper:   #f5efe3;
  --paper-2: #e9e0cd;
  --sand:    #e2d3b4;
  --sand-2:  #d3bf99;
  --soil:    #9d5130;
  --soil-2:  #82401f;
  --soil-3:  #6b3318;
  --ink:     #17150f;
  --ink-2:   #4a4335;
  /* SIGNAL — the instrumentation */
  --teal:  #19e6c8;
  --amber: #ffd23f;
  --red:   #ff2e2e;
  --blue:  #3b82f6;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--soil-3);
  color: var(--ink);
  font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  font-size: 13px;
  line-height: 1.35;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body { user-select: none; -webkit-user-select: none; }

button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

svg { display: block; }

#app {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  overflow: hidden;
  background: var(--soil-3);
}

/* ==================================================================== crown
   The specimen label. Paper, ink, hairline rules, tiny tabular numerals. It
   carries three facts and no sentences: where you are, what the colony has
   done, and what it is costing. Everything else the player needs is drawn in
   the colony underneath. */
#crown {
  flex: 0 0 auto;
  position: relative;
  z-index: 5;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 2px 0 rgba(0, 0, 0, .82), 0 5px 0 rgba(0, 0, 0, .14);
}
/* a gate card is the only thing on screen while it is open */
#app:has(#gate.on) #crown, #app:has(#about.on) #crown { visibility: hidden; }

/* how far through the whole thing you are — a rule of ticks above the ground line,
   read as a scale, never as a word */
#progressRail { order: 2; display: flex; gap: 2px; height: 3px; margin: 0 8px 3px; }
#progressRail .pg { flex: 1 1 0; background: rgba(0, 0, 0, .13); }
#progressRail .pg.done { background: rgba(0, 0, 0, .5); }
#progressRail .pg.cur { background: var(--ink); }

#hdr {
  order: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 25px;
  padding: 4px 8px 2px;
}
/* CHAPTERS builds .hrow (count + about) and inserts it first; order puts the
   readouts on the left where they are read, and the index on the right. */
#hdr .hrow { order: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
#statusStrip { order: 0; flex: 1 1 auto; display: flex; align-items: center; gap: 13px; min-width: 0; overflow: hidden; }

/* the chapter title is not repeated here: the gate card said it thirty seconds ago */
#chapTitle { display: none; }
#chapCount {
  order: 1;
  flex: 0 0 auto;
  font-size: 9.5px; font-weight: 500; letter-spacing: .12em;
  color: rgba(0, 0, 0, .38);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

#statusStrip .st {
  flex: 0 0 auto;
  display: flex; align-items: baseline; gap: 5px;
  font-size: 9px; font-weight: 500; letter-spacing: .12em;
  color: rgba(0, 0, 0, .45);
  white-space: nowrap;
}
#statusStrip .st b {
  font-size: 12px; font-weight: 700; letter-spacing: 0;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
/* strain is a bar of packed earth, not a signal, until it is actually dangerous */
#statusStrip .st .mtr {
  align-self: center;
  width: 34px; height: 5px;
  background: rgba(0, 0, 0, .13);
}
#statusStrip .st .mtr i { display: block; height: 100%; width: 0; background: rgba(0, 0, 0, .55); transition: width .2s linear; }
#statusStrip .st.hot .mtr i { background: var(--red); }
/* strain is a pressure, not a figure: the bar says it, so the numeral is deleted */
#statusStrip .st:nth-child(3) b { display: none; }
/* machine speed is depicted — the colony visibly moves faster — so it is not also
   a readout. The cell CHAPTERS builds for it stays out of the crown. */
#statusStrip .st:nth-child(4) { display: none !important; }

#aboutBtn {
  order: 2;
  flex: 0 0 auto;
  /* the hit area is 44px tall and overhangs the band; the mark inside it is small */
  min-width: 46px; min-height: 44px;
  display: flex; align-items: center; justify-content: flex-end;
  margin: -10px -8px -10px 0;
  padding: 0 8px;
  font-size: 9px; font-weight: 700; letter-spacing: .16em;
  color: rgba(0, 0, 0, .42);
}
#aboutBtn:active { color: var(--ink); }

/* ==================================================================== world
   Almost entirely colony. It takes every pixel the crown does not, and the
   canvas takes every pixel of that. Nothing else lives here except one paper
   tag, and only while something is burning. */
#world {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--soil-3);
  overflow: hidden;
}
#stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
#field {
  flex: 1 1 0;
  min-height: 0;
  display: block;
  width: 100%;
  touch-action: none;
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}

/* the one message region. CONTROLS positions a single paper tag in here, in
   viewport coordinates, and FIELD draws its own tag only when this is empty. */
#tagLayer {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 40;
  pointer-events: none;
}

/* ====================================================================== act
   Absent unless there is a decision. CONTROLS builds the instruments into it
   and sets display:none the instant the decision is over. No ground, no
   border, no bar: the buttons are objects lying on the colony. */
#act {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 41;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 6px;
  padding: 10px 6px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  pointer-events: auto;
}
#act:empty { display: none; }

/* the field guide is built and dressed by TABLE; it starts closed */
#guide { display: none; }

/* ===================================================================== gate
   The card between episodes. The colony is held still behind glass and a sheet
   of field-notebook paper is laid over it: ink type on paper, a hard rule under
   the head, one stamped action at the floor. Each block carries its own paper
   ground and prints it downward, so a short card is a label floating over the
   specimen and a long one covers the glass completely. */
#gate, #about {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 60;
  display: none;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  background: rgba(0, 0, 0, .5);
}
#gate.on, #about.on { display: flex; }
#about { z-index: 70; background: var(--paper); }

/* the result is stamped on the top edge, and only a result colours it */
#gate::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 0;
  background: var(--teal);
}
#gate.good::before { height: 4px; background: var(--teal); }
#gate.bad::before { height: 4px; background: var(--red); }

.gtIn {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 20px 0 18px;
  display: flex; flex-direction: column; justify-content: flex-start;
}
/* Every block carries its own paper ground, full width, and the rhythm between
   blocks is PADDING, never margin — so a card is one unbroken sheet of paper
   exactly as tall as its words, with no slivers of colony showing between the
   lines. The one deliberate gap is the auto margin on the title card, which
   drops the title to the floor and leaves the specimen visible above it. */
.gtIn > * { background: var(--paper); padding-left: 16px; padding-right: 16px; }
.gtIn > :first-child { margin-top: auto; }
.gtIn.card { justify-content: space-between; }
.gtIn.card > :first-child { margin-top: 0; }

.gtWord { flex: 0 0 auto; }
.gtWord .wm { font-size: 15px; font-weight: 700; letter-spacing: .34em; padding-bottom: 7px; }
.gtWord .wt {
  font-size: 11px; letter-spacing: .04em;
  color: var(--ink-2);
  padding-bottom: 10px;
  border-bottom: 3px solid var(--ink);
  display: inline-block;
}
.gtWord + .gtNum { margin-top: auto; }

.gtNum {
  font-size: 9.5px; font-weight: 700; letter-spacing: .22em;
  color: rgba(0, 0, 0, .38);
  font-variant-numeric: tabular-nums;
  padding-top: 2px; padding-bottom: 9px;
}
.gtTitle {
  font-size: 32px; font-weight: 700; letter-spacing: -.01em; line-height: 1.04;
  padding-bottom: 10px;
}
/* on the OPENING card this is the whole setup: one plain sentence, then play.
   On a result card the setup has already been played, so it is not repeated. */
.gtSub {
  font-size: 13.5px; line-height: 1.45;
  color: var(--ink-2);
  padding-bottom: 14px;
  border-bottom: 2px solid var(--ink);
}
#gate.good .gtSub, #gate.bad .gtSub { display: none; }

.gtWin { font-size: 15.5px; line-height: 1.42; padding-top: 16px; padding-bottom: 18px; }
.gtHead {
  padding-top: 10px; padding-bottom: 2px;
  border-top: 1px solid rgba(0, 0, 0, .22);
  font-size: 9.5px; font-weight: 700; letter-spacing: .2em;
  color: rgba(0, 0, 0, .45);
}
.gtBody { padding-top: 8px; padding-bottom: 16px; font-size: 12px; line-height: 1.6; color: var(--ink-2); }

/* the A/B comparison: two runs, one difference, full bleed */
.gtAB {
  padding-left: 0; padding-right: 0;
  border-top: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
}
.gtAB .abr {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 16px;
  border-bottom: 1px solid rgba(0, 0, 0, .18);
}
.gtAB .abr:last-child { border-bottom: 0; }
.gtAB .abn {
  flex: 0 0 auto; width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  background: var(--ink); color: var(--paper);
  font-size: 11px; font-weight: 700;
}
.gtAB .abr.b .abn { background: var(--teal); color: var(--ink); }

.gtAB .abg svg { width: 18px; height: 18px; }
.gtAB .abs { flex: 0 0 auto; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.gtAB .abb { flex: 1 1 auto; height: 8px; background: rgba(0, 0, 0, .14); }
.gtAB .abb i { display: block; height: 100%; width: 0; background: var(--red); }
.gtAB .abr.b .abb i { background: var(--teal); }
.gtAB .abv {
  flex: 0 0 auto; min-width: 30px; text-align: right;
  font-size: 15px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* postmortem list */
.gtList { padding-top: 10px; padding-bottom: 10px; }
.gtList .pmr {
  display: flex; align-items: center; gap: 8px;
  margin: 0 -16px;
  padding: 7px 16px;
  border-bottom: 1px solid rgba(0, 0, 0, .14);
  font-size: 11.5px;
}
.gtList .pmg { flex: 0 0 auto; width: 16px; height: 16px; color: var(--ink); }
.gtList .pmg svg { width: 16px; height: 16px; }
.gtList .pms { flex: 0 0 auto; width: 24px; font-weight: 700; }
.gtList .pmn { flex: 1 1 auto; color: var(--ink-2); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
.gtList .pmv { flex: 0 0 auto; font-weight: 700; font-variant-numeric: tabular-nums; }

/* the one action, stamped at the floor of the card */
.gtBtn {
  flex: 0 0 auto;
  display: block;
  width: 100%;
  min-height: 62px;
  padding: 0 12px calc(0px + env(safe-area-inset-bottom));
  background: var(--ink);
  color: var(--paper);
  font-size: 14px; font-weight: 700; letter-spacing: .22em;
}
.gtBtn:active { background: var(--ink-2); }
.gtBtn.alt {
  background: var(--paper);
  color: var(--ink-2);
  border-top: 2px solid var(--ink);
  min-height: 52px;
  font-size: 11px;
}
.gtBtn.alt:active { background: var(--paper-2); }

/* ==================================================================== about */
.abIn {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 18px 16px 22px;
}
.abIn h1 { font-size: 21px; font-weight: 700; letter-spacing: .14em; margin-bottom: 5px; }
.abIn .abTag { font-size: 11px; color: var(--ink-2); padding-bottom: 12px; border-bottom: 3px solid var(--ink); }
.abIn h2 {
  margin-top: 17px; padding-top: 9px;
  border-top: 1px solid rgba(0, 0, 0, .18);
  font-size: 9.5px; font-weight: 700; letter-spacing: .2em;
  color: rgba(0, 0, 0, .5);
}
.abIn p { margin-top: 7px; font-size: 12px; line-height: 1.62; color: var(--ink-2); }

/* ================================================= retired regions, made mute
   Other parts still create or clear these ids from the pre-naturalism build.
   They hold nothing now and must never take a pixel: the colony gets it. */
#ticker, #say, #toast, #bar, #tableWrap, #etable, #detail, #metaRow, #aimHint {
  display: none !important;
}

/* --------------------------------------------------------- small viewports */
@media (max-height: 760px) {
  .gtTitle { font-size: 27px; }
  .gtSub { font-size: 12.5px; }
  .gtIn { padding: 14px 0 14px; }
  .gtBtn { min-height: 54px; }
  .gtBtn.alt { min-height: 46px; }
}
@media (max-width: 350px) {
  #statusStrip { gap: 9px; }
  #statusStrip .st { letter-spacing: .08em; }
  .gtTitle { font-size: 26px; }
}

<script>
/* ===== 30-elements.js ===== */
/* ============================================================
   30-elements.js — the twenty-eight elements.  OWNER: SIM.

   Every element is a real detector:
     - detect(S, api) reads live simulation state, never a timer, never dice alone
     - it has a REAL consequence, stated in the comment directly above detect
     - counteredBy(S) is true only when the player's institution is genuinely in place,
       and countered elements cool ~8x faster (see 40-sim.js coolRate)

   Columns are 0 COORDINATION, 1 CONFORMITY, 2 EPISTEMICS, 3 GOALS/POWER, 4 META.
   They are DEFINED column by column below, then sorted at the bottom of this file into
   row-major table order, so walking FZ.EL into a 5-wide grid lays the table out correctly.
   Each element also carries `col` and `row` (0..5) so TABLE can place it without arithmetic,
   and `answers: [kind…]` — the institutions that resolve it (CONTRACT §14.4). `counterTool`
   is derived as answers[0] so TABLE can name the answer from FZ.copy.tools[kind].label.

   ------------------------------------------------------------
   THE TRADE-OFF TERMS (CONTRACT §15, RESEARCH.md §3) — read before editing a detector
   ------------------------------------------------------------
   S.trustBias  -1 … +1.  +1 is a colony running the LEDGER: skeptical. -1 is a colony
                running the LENS: receptive. Both instruments on = 0, the expensive middle.
                Detectors read it as an explicit amplification term:
                  skept = Math.max(0,  S.trustBias)   amplifies Di and Cs
                  cred  = Math.max(0, -S.trustBias)   amplifies Gu
                The suppression side stays in counteredBy(). The dial has two ends.
   S.ownership  0 … 1.  How much of the colony has retreated into working alone. Merge
                conflict raises it; the colony "solves" Mc by hardly working together.
                It suppresses Mc and amplifies Si and Ow. Only a CHARTER escapes the bill.
   S.aggro      0 … 1.2, from S.tempo. Machine speed raises throughput AND aggression:
                lockouts, sabotage and escalation all arrive sooner on the same curve.

   ------------------------------------------------------------
   EVERY ELEMENT HAS A BODY  (AESTHETIC.md §0, §4, §6)
   ------------------------------------------------------------
   A failure that cannot be seen without a caption is not finished. So each element
   declares `body:` — the observable thing in the colony that IS this failure — and
   40-sim.js maintains the state fields that make that thing drawable. The full field
   list is documented at the top of 40-sim.js under THE BODIES; the short version:

   Since CONTRACT §16 the nest is a real movement graph, and TWELVE of these stopped
   being proxies and became situations you can point at: Si is a chamber with no tunnel
   to it, Fl is a passage packed solid, Lo is a body parked in that passage with the line
   behind it, Tw is two rivals nose to nose in a passage that fits one, Dp is work behind
   an undug face nobody is cutting, In is a crossroads with nobody keeping it, Im is the
   whole colony inside one passage, Cf is one road worn to a shine beside a cold one, Co
   is two workers who walked in by two different tunnels, Ow is rooms one body cannot be
   in, Es is rivals blocking each other's route again and again, and Mm is not being able
   to see which passage anybody means to take.

     body        what you would see, with no words on screen        fields it is drawn from
     ---------   -------------------------------------------------  ----------------------
     tug         two who walked in by different tunnels, both pull   j.tug[].via j.crowd
     queue       a body parked in the passage, a line behind it      a.place a.blockT e.occ/qa/qb
     sealed      a chamber with no tunnel to it at all               j.sealed node.comp
     jam         a passage packed solid, nothing moving              e.jam e.occ e.qa e.qb
     stack       one worker guarding a pile it cannot work           a.holdN a.posture='guard'
     split       one job finished twice; the copies will not join    j.split
     waitchain   a queue behind work nobody is doing                 j.prereq j.queue[]
     rot         a crumb going soft while the colony is elsewhere    j.rot j.trail
     trail       one road bright, every other road cold              j.trail j.dark
     column      the whole colony moving as one body                 S.column
     sameness    every worker the same lineage                       S.lineage
     fell        a whole lineage face-down at the same instant       S.fell a.stun
     phantom     a confident march to a chamber with nothing in it   S.rumor a.posture='march'
     shunned     work everyone turns away from                       j.shun a.hesitate
     withheld    one worker knows the hazard and walks on past       j.hazard a.knows[]
     voices      every source drawn identical; one is lying          a.marks a.trust
     forgotten   the tally marks wiped off a known liar              a.marks a.lies
     lone        one worker right, standing alone at the big crumb   j.lone j.dark
     frozen      two rivals sitting on one crumb, neither moving     j.frozen a.posture='guard'
     unmaking    finished work quietly coming apart again            j.unmake j.undone
     chase       two who stopped working and only follow each other  a.posture='chase'
     defiance    a body walking straight through the boundary        a.defiant a.corrigible
     handoff     a claim passed back and forth, never worked         j.churn j.queue[]
     smallcrumb  every trail to the small crumbs, none to the big    S.bigJob j.rot a.tx/a.ty
     noarch      contested ground with no institution drawn on it    S.charters S.arb
     frantic     the whole colony moving too fast to read            S.tempo S.weather
     dark        you can see where they are, not what they want      S.blind a.tx/a.ty

   All player-facing prose is read lazily from FZ.copy (see fzElDef below). This part
   contains no English sentence of its own.
   ============================================================ */
window.FZ = window.FZ || {};

FZ.EL = [];
FZ.ELBY = {};

/* ---- shared helpers used by many detectors ---- */
FZ.elh = {
  /* is (x,y) inside any chartered boundary? */
  cover(S, x, y) {
    const C = S.charters;
    for (let i = 0; i < C.length; i++) {
      const c = C[i], dx = c.x - x, dy = c.y - y;
      if (dx * dx + dy * dy <= c.r * c.r) return c;
    }
    return null;
  },
  /* what fraction of the open work is under an institution? */
  coverFrac(S) {
    const o = S._g.open;
    if (!o.length) return S.charters.length ? 1 : 0;
    let k = 0;
    for (let i = 0; i < o.length; i++) if (FZ.elh.cover(S, o[i].x, o[i].y)) k++;
    return k / o.length;
  },
  /* has the player actually broken up the monoculture? */
  varied(S) { return S._g.hueDistinct >= 3 && S._g.topHueFrac < 0.62; },
  slowed(S) { return S.tick < S.slowUntil; },
  /* §15.1 the two ends of the trust dial, as terms a detector can multiply by */
  skept(S) { return S.trustBias > 0 ? S.trustBias : 0; },
  cred(S) { return S.trustBias < 0 ? -S.trustBias : 0; },

  /* ------------------------------------------------------------------
     THE NEST, for the detectors that now read a physical situation instead of a
     proxy (CONTRACT §16.2). Twelve of the twenty-eight stopped needing a caption
     the moment movement became physical; these are the terms they read it with.
     ------------------------------------------------------------------ */
  ag(S, id) { const A = S.agents; for (let i = 0; i < A.length; i++) if (A[i].id === id) return A[i]; return null; },
  edges(S) { return (S.nest && S.nest.edges) || []; },
  nodes(S) { return (S.nest && S.nest.nodes) || []; },
  /* every body this passage is carrying, standing in, or queued at either mouth */
  load(e) { return e.occ.length + e.qa.length + e.qb.length; },
  /* the two bodies nose to nose in a one-ant passage, if there are any */
  headOn(S, e) {
    for (let i = 0; i < e.occ.length; i++) {
      const a = FZ.elh.ag(S, e.occ[i]);
      if (!a || !a.headOn) continue;
      const b = FZ.elh.ag(S, a.headOn);
      if (b && b.edge === e.id) return [a, b];
    }
    return null;
  },
  /* the middle of a passage, which is where an institution has to reach to arbitrate it */
  mid(S, e) {
    const N = FZ.elh.nodes(S), A = N[e.a], B = N[e.b];
    return { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
  },
  /* a body parked in a passage, going nowhere, with the line behind it */
  parked(S, e) {
    for (let i = 0; i < e.occ.length; i++) {
      const a = FZ.elh.ag(S, e.occ[i]);
      if (a && a.blockT > 40 && a.locker) return a;
    }
    return null;
  },
};

/* Attaches runtime fields and lazy copy getters, then registers the element. */
function fzElDef(o) {
  o.heat = 0; o.fires = 0; o.peak = 0; o.who = []; o.countered = false; o.on = false;
  /* where the last fire happened, so anything drawing this element knows where to look */
  o.at = null;
  /* the observable phenomenon that IS this failure (see the table at the top) */
  o.body = o.body || 'heat';
  /* §14.4 every element declares the institutions that answer it; the first is the one
     TABLE names on the cell, and it is always the one the counter sentence leads with. */
  o.answers = o.answers || ['charter'];
  o.counterTool = o.answers[0];
  const s = o.sym;
  const cp = () => (FZ.copy && FZ.copy.fire) || {};
  const dt = () => ((FZ.copy && FZ.copy.detail) || {})[s] || {};
  Object.defineProperty(o, 'plain', { enumerable: true, get() { return cp()[s] || ''; } });
  Object.defineProperty(o, 'trigger', { enumerable: true, get() { return dt().trigger || cp()[s] || ''; } });
  Object.defineProperty(o, 'effect', { enumerable: true, get() { return dt().effect || ''; } });
  Object.defineProperty(o, 'counter', { enumerable: true, get() { return dt().counter || ''; } });
  FZ.EL.push(o); FZ.ELBY[s] = o;
}
function fzG(inner) {
  return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" ' +
    'stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">' + inner + '</svg>';
}

/* ============================================================
   COLUMN 0 — COORDINATION
   ============================================================ */

fzElDef({
  sym: 'Co', nm: 'Coordination failure', col: 0, row: 0, chapter: 1, body: 'tug',
  answers: ['charter'],
  glyph: fzG('<path d="M1 10h5"/><path d="M4 7.5l2.5 2.5-2.5 2.5"/><path d="M19 10h-5"/><path d="M16 7.5l-2.5 2.5 2.5 2.5"/><rect x="8" y="8" width="4" height="4"/>'),
  /* §16.2 TWO ANTS ARRIVING AT ONE CRUMB FROM TWO DIFFERENT TUNNELS. `e.far` is no
     longer "their claims were made far apart"; it is that the working claimants walked
     in by different passages (a.via), which is a thing you can see happening.
     CONSEQUENCE: drains the contested job's progress every tick — the fill visibly runs backwards.
     TRADE (§15.2): a collision also nudges both workers toward working alone (api.own). */
  detect(S, api) {
    const G = S._g; let hot = 0, who = null, at = null;
    for (let i = 0; i < G.clList.length; i++) {
      const e = G.clList[i];
      if (e.work < 2 || !e.far) continue;
      if (FZ.elh.cover(S, e.j.x, e.j.y)) continue;
      e.j.progress = Math.max(0, e.j.progress - 1.5 * (e.work - 1));
      hot += 0.035 * (e.work - 1); who = e.ids; at = { x: e.j.x, y: e.j.y };
      for (let k = 0; k < e.ids.length; k++) api.own(api.agentById(e.ids[k]), 0.012);
    }
    if (hot > 0) api.heat(hot, { at, who, say: FZ.copy.fire.Co });
  },
  counteredBy(S) { return FZ.elh.coverFrac(S) >= 0.5; },
});

fzElDef({
  sym: 'Si', nm: 'Siloed knowledge', col: 0, row: 1, chapter: 6, body: 'sealed',
  answers: ['lens'],
  glyph: fzG('<path d="M10 1v18"/><circle cx="5" cy="10" r="2.4"/><rect x="13" y="7.5" width="5" height="5"/>'),
  /* §16.2 A CHAMBER WITH NO TUNNEL TO IT. Literally unreachable: j.sealed is true when
     the room the work is in is not connected to the rest of the nest by any dug passage.
     That is not a low number on a dashboard, it is a wall, and it is why nobody comes.
     CONSEQUENCE: work in a sealed room, or work nobody has heard of, goes stale and is
     LOST outright (job:lost). Somebody has to walk over and DIG to save it.
     TRADE (§15.2): S.ownership is a real term. A colony that answered merge conflict by
     working alone stops telling each other anything, so jobs go stale faster. */
  detect(S, api) {
    const G = S._g, own = S.ownership; let hot = 0, at = null;
    for (let i = 0; i < G.open.length; i++) {
      const j = G.open[i];
      const walled = !!j.sealed;
      if (!walled && (j.knownBy / Math.max(1, G.n) > 0.3 || j.age < 90)) continue;
      j.stale += (walled ? 2.4 : 1) + own * 1.6;
      hot += (walled ? 0.038 : 0.02) * (1 + own * 1.5);
      at = { x: j.x, y: j.y };
      if (j.stale > 430) api.loseJob(j, 'Si');
    }
    if (hot > 0) api.heat(hot, { at, who: [], say: FZ.copy.fire.Si });
  },
  counteredBy(S) { return S.lensOn; },
});

fzElDef({
  sym: 'Mc', nm: 'Merge conflict', col: 0, row: 2, chapter: 1, body: 'split',
  answers: ['charter'],
  glyph: fzG('<path d="M4 2l6 8M16 2l-6 8"/><path d="M6 13l8 6"/><path d="M14 13l-8 6"/>'),
  /* CONSEQUENCE: blocks completion — a finished job with two lineages on it is rolled back to 30%.
     TRADE (§15.2): every rollback pushes its authors hard toward ownership. The colony learns to
     stop colliding by refusing to share a job at all, which is how Mc puts itself out — and it
     bills the colony in Si and Ow. Inside a charter the merge is arbitrated and nobody retreats. */
  detect(S, api) {
    const G = S._g; let hot = 0, who = null, at = null;
    for (let i = 0; i < G.clList.length; i++) {
      const e = G.clList[i];
      if (e.j.progress < e.j.need || e.hn < 2) continue;
      if (FZ.elh.cover(S, e.j.x, e.j.y)) continue;
      e.j.progress = e.j.need * 0.3;
      /* BODY: for the next second and a half the crumb is visibly two half-finished
         copies that will not join. Nothing has to be written next to it. */
      e.j.split = S.tick + 90;
      hot += 0.68; who = e.ids; at = { x: e.j.x, y: e.j.y };
      for (let k = 0; k < e.ids.length; k++) api.own(api.agentById(e.ids[k]), 0.34);
      api.bus('job:lost', { x: e.j.x, y: e.j.y, why: 'Mc' });
      S.collapse += 1.0;
    }
    if (hot > 0) api.heat(hot, { at, who, say: FZ.copy.fire.Mc });
  },
  counteredBy(S) { return FZ.elh.coverFrac(S) >= 0.5; },
});

fzElDef({
  sym: 'Dp', nm: 'Blocked dependency', col: 0, row: 3, chapter: 8, body: 'undugface',
  answers: ['lens', 'charter'],
  glyph: fzG('<rect x="1" y="7" width="6" height="6"/><rect x="13" y="7" width="6" height="6"/><path d="M8 10h4"/><path d="M8 5.5l4 9"/>'),
  /* §16.2 WORK BEHIND AN UNDUG FACE NOBODY IS DIGGING. Two shapes, one failure: work
     claimed but walled off with no one cutting toward it, and work waiting on another
     job that is not finished. Both are a queue behind something that is not happening.
     CONSEQUENCE: no progress can accumulate, and the claimants standing in the line
     waste themselves waiting. The lens shows them what they are actually waiting for. */
  detect(S, api) {
    const G = S._g; let hot = 0, who = null, at = null;
    /* the physical one: a room with no way in, claimed, and no face being cut to it */
    for (let i = 0; i < G.open.length; i++) {
      const j = G.open[i];
      if (!j.sealed || !j.claims.size) continue;
      const n = FZ.elh.nodes(S)[j.node];
      if (!n) continue;
      let cutting = 0;
      for (let k = 0; k < n.edges.length; k++) {
        const e = FZ.elh.edges(S)[n.edges[k]];
        if (e && !e.dug) cutting += e.diggers.length;
      }
      if (cutting) continue;                       /* somebody IS digging: that is not this */
      const ids = []; j.claims.forEach(id => ids.push(id));
      hot += 0.07; who = ids; at = { x: j.x, y: j.y };
      for (let k = 0; k < ids.length; k++) { const a = api.agentById(ids[k]); if (a) a.hesitate = Math.min(1, a.hesitate + 0.05); }

    /* the ordering one: this crumb cannot be worked until that crumb is finished */
    for (let i = 0; i < G.clList.length; i++) {
      const e = G.clList[i], j = e.j;
      if (!j.prereq || e.work < 1) continue;
      const p = api.jobById(j.prereq);
      if (!p) continue;
      if (FZ.elh.cover(S, j.x, j.y) || S.lensOn) continue;
      j.progress = Math.max(0, j.progress - 0.8);
      hot += 0.09; who = e.ids; at = { x: j.x, y: j.y };
    }
    if (hot > 0) {
      api.heat(hot, { at, who, say: FZ.copy.fire.Dp });
      if (who) for (let k = 0; k < who.length; k++) { const a = api.agentById(who[k]); if (a) a.stun = Math.max(a.stun, 26); }
    }
  },
  counteredBy(S) { return FZ.elh.coverFrac(S) >= 0.5 || S.lensOn; },
});

fzElDef({
  sym: 'Ow', nm: 'Overcommitment', col: 0, row: 4, chapter: 2, body: 'stack',
  answers: ['charter'],
  glyph: fzG('<circle cx="10" cy="4" r="2.4"/><path d="M10 6.5v3"/><path d="M10 9.5L4 15M10 9.5v5.5M10 9.5L16 15"/><rect x="2" y="15" width="4" height="4"/><rect x="8" y="15" width="4" height="4"/><rect x="14" y="15" width="4" height="4"/>'),
  /* §16.2 ONE PAIR OF HANDS, HOLDING ROOMS IT CANNOT PHYSICALLY BE IN. A body is in one
     chamber. Everything else it has claimed is somewhere down a tunnel it is not walking,
     and the crumbs in those rooms sit there going soft with its name on them.
     CONSEQUENCE: every job the hoarder holds AND IS NOT IN rots; past four holds it seizes.
     TRADE (§15.2): territorial workers hold a private backlog nobody else may touch, so the
     ownership answer to merge conflict arrives here as a bill. S.ownership is an explicit term. */
  detect(S, api) {
    const G = S._g, own = S.ownership; let hot = 0, who = null, at = null;
    for (let i = 0; i < G.n; i++) {
      const a = G.A[i];
      if (a.hold.length < 3) continue;
      let absent = 0;
      for (let k = 0; k < a.hold.length; k++) {
        const j = api.jobById(a.hold[k]);
        if (!j) continue;
        /* the room it is standing in is the only one it is actually working */
        if (a.at != null && j.node === a.at) continue;
        absent++;
        j.progress = Math.max(0, j.progress - 0.35 * (1 + own));
        j.neglect += 1;
      }
      if (absent < 2) continue;
      hot += 0.05 * (1 + own); who = [a.id]; at = { x: a.x, y: a.y };
      if (a.hold.length >= 4) { a.stun = Math.max(a.stun, 30); api.bus('agent:hurt', { id: a.id, x: a.x, y: a.y }); }
    }
    if (hot > 0) api.heat(hot, { at, who, say: FZ.copy.fire.Ow });
  },
  counteredBy(S) { return FZ.elh.coverFrac(S) >= 0.5; },
});

fzElDef({
  sym: 'Pt', nm: 'Priority inversion', col: 0, row: 5, chapter: 3, body: 'rot',
  answers: ['lens'],
  glyph: fzG('<rect x="12" y="2" width="6" height="6"/><rect x="2" y="8" width="3" height="3"/><rect x="8" y="13" width="3" height="3"/><rect x="15" y="15" width="3" height="3"/><path d="M3.5 11.5l6 3 6.5 1.5"/>'),
  /* CONSEQUENCE: the neglected high-value job expires and is LOST (job:lost). */
  detect(S, api) {
    const G = S._g, j = G.maxJob;

    const worked = G.workedVsum / G.workedN;
    if (worked >= j.value * 0.62 || j.claims.size) return;
    j.neglect += 1;
    if (j.neglect > 540) { api.loseJob(j, 'Pt'); return; }

  counteredBy(S) { return S.lensOn; },
});

fzElDef({
  sym: 'Cf', nm: 'Conformity cascade', col: 1, row: 0, chapter: 3, body: 'oneroad',
  /* VARY is the real answer (break the sameness); SLOW is the holding action, and it is
     the only instrument chapter 3 hands the player, so it must resolve this too. */
  answers: ['vary', 'slow'],
  glyph: fzG('<path d="M2 4h5M2 10h9M2 16h13"/><path d="M5.5 1.5L8 4 5.5 6.5M9.5 7.5L12 10l-2.5 2.5M13.5 13.5L16 16l-2.5 2.5"/>'),
  /* §16.2 EVERY ANT USING ONE TUNNEL WHILE A DUG ALTERNATIVE SITS EMPTY. The road is
     worn to a shine and the one beside it is cold. That picture is the whole element.
     CONSEQUENCE: raises S.copyBias, which is a real term in the router — a copying
     colony prefers the worn passage, so the worn passage gets worse. Self-feeding.
     VARY inverts that term, and the ants visibly start using the cold road. */
  detect(S, api) {
    const G = S._g, E = FZ.elh.edges(S);
    let busy = null, busyN = 0, total = 0, cold = 0;
    for (let i = 0; i < E.length; i++) {
      const e = E[i];
      if (!e.dug) continue;
      const n = FZ.elh.load(e);

      if (n > busyN) { busyN = n; busy = e; }
      if (e.wear < 0.25 && n === 0) cold++;
    }
    /* the crowd on one road, with an empty road available, is the physical reading */
    const herd = busy && busyN >= 3 && cold > 0 && total > 0 && busyN / total > 0.5;

fzElDef({
  sym: 'Tw', nm: 'Turf war', col: 3, row: 0, chapter: 7, body: 'headon',
  answers: ['charter'],
  glyph: fzG('<circle cx="3" cy="10" r="2"/><circle cx="17" cy="10" r="2"/><rect x="7" y="7" width="6" height="6"/><path d="M10 2v4M10 14v4"/>'),
  /* §16.2 TWO RIVALS MEETING HEAD-ON IN A ONE-ANT TUNNEL, NEITHER YIELDING. A polite
     worker backs out of a passage it cannot share. A rival does not, and neither does the
     one coming the other way, so the tunnel is stopped with both of them in it and the
     line grows at both ends. "All of the models we tested quickly assumed that others
     were purposefully impeding their work" — here they actually are.
     CONSEQUENCE: freezes the job outright (no progress possible) and stuns both rivals.
     TERMINATION (§15.3): every fire presses the episode toward one of the paper's four observed
     endings — force, passivity, truce, unsettled. api.press books that pressure; 40-sim.js
     resolveConflict picks the mode and emits conflict:resolved. A charter is what buys truce. */
  detect(S, api) {
    const G = S._g, E = FZ.elh.edges(S); let hot = 0, who = null, at = null;
    /* the physical turf war: nose to nose in a passage that fits one */
    for (let i = 0; i < E.length; i++) {
      const e = E[i];
      if (!e.dug || e.cap > 1 || e.occ.length < 2) continue;
      const pair = FZ.elh.headOn(S, e);
      if (!pair) continue;
      const a = pair[0], b = pair[1];
      if (a.rival !== b.id) continue;
      const m = FZ.elh.mid(S, e);
      if (FZ.elh.cover(S, m.x, m.y)) continue;         /* an arbiter is present: they pass */
      api.press([a.id, b.id], null, 1.1);
      e.jam = Math.min(1, e.jam + 0.02);
      /* whatever either of them was carrying stops dead behind the standoff */
      for (let k = 0; k < 2; k++) {
        const z = k ? b : a;
        if (!z.hold.length) continue;
        const j = api.jobById(z.hold[0]);
        if (j && !j.done) j.frozen = S.tick + 40;
      }
      if (a.blockT % 60 === 20) {
        a.stun = Math.max(a.stun, 14); b.stun = Math.max(b.stun, 14);
        hot += 0.58; who = [a.id, b.id]; at = m;
      } else hot += 0.02;
    }
    for (let i = 0; i < G.clList.length; i++) {
      const e = G.clList[i];
      if (!e.riv || e.work < 2) continue;
      if (FZ.elh.cover(S, e.j.x, e.j.y)) continue;
      /* 'actually moving' has to scale with tempo, or a fast colony reads as productive
         while it burns: at speed 2.2 a blocked job still creeps forward half a unit a tick. */
      /* A RATE, NOT A RUNNING TOTAL. The old test asked whether the crumb had moved at
         all since the last reset, which a blocked job creeping at a fifth of a unit a
         tick satisfies within three ticks — so a standoff could never accumulate. This
         asks whether it moved THIS TICK, which is the question a standoff answers. */
      const moved = e.j.progress - (e.j.twProg == null ? e.j.progress : e.j.twProg);
      e.j.twProg = e.j.progress;
      if (moved > 0.45 * (S.tempo || 1)) { e.j.stall = 0; continue; }
      e.j.stall = (e.j.stall || 0) + 1;
      api.press(e.ids, e.j, 0.7);
      if (e.j.stall < 45) continue;
      e.j.frozen = S.tick + 80; e.j.stall = 0;
      for (let k = 0; k < e.ids.length; k++) { const a = api.agentById(e.ids[k]); if (a) a.stun = Math.max(a.stun, 32); }
      hot += 0.62; who = e.ids; at = { x: e.j.x, y: e.j.y };
    }
    if (hot > 0) api.heat(hot, { at, who, say: FZ.copy.fire.Tw });
  },
  counteredBy(S) { return FZ.elh.coverFrac(S) >= 0.5 || S._g.rivN === 0; },
});

  glyph: fzG('<rect x="4" y="3" width="12" height="9"/><path d="M4 8h12"/><path d="M10 13v5"/><path d="M7.5 15.5L10 18l2.5-2.5"/>'),

  glyph: fzG('<rect x="4" y="9" width="12" height="9"/><path d="M7 9V6.5a3 3 0 016 0V9"/>'),
  /* §16.2 A BODY PARKED IN THE PASSAGE, AND THE QUEUE BEHIND IT. The locker walks into
     the lateral that leads to the work it claimed and then simply stops there, halfway,
     going nowhere. Everyone else who wants that room is now standing in a line behind
     it. "One agent settles the conflict by force via access-revocation" — and the body

     CONSEQUENCE: sets job.locked — no other worker may claim or touch that job until a
     charter breaks it — and the parked body physically blocks the only way in.
     TRADE (§15.4): S.aggro is a real term. A faster colony is not a calmer one — it reaches
     for the lockout sooner. At full machine speed the lock lands in half the time. */
  detect(S, api) {
    const G = S._g, wait = 120 / (1 + S.aggro); let hot = 0, who = null, at = null;
    for (let i = 0; i < G.n; i++) {
      const a = G.A[i];
      if (!a.locker || !a.hold.length) continue;
      const j = api.jobById(a.hold[0]);
      if (!j) continue;
      a.idleRun = (a.idleRun || 0) + 1;
      if (a.idleRun < wait) continue;
      if (FZ.elh.cover(S, j.x, j.y) || (a.place === 'tunnel' && FZ.elh.cover(S, a.x, a.y))) {
        j.locked = false; a.idleRun = 0; a.lockAt = 0; api.drop(a, j.id); continue;

      j.locked = a.id; if (!a.lockAt) a.lockAt = S.tick;
      j.claims.forEach(id => { if (id !== a.id) { const o = api.agentById(id); if (o) api.drop(o, j.id); } });
      /* the line behind the body in the doorway is what makes this legible, so it is
         worth more heat when there actually is one */

      if (a.place === 'tunnel') {

        if (e) behind = FZ.elh.load(e) - 1;

      at = a.place === 'tunnel' ? { x: a.x, y: a.y } : { x: j.x, y: j.y };

<script>
/* ===== 40-sim.js ===== */
/* ============================================================
   40-sim.js — the colony.  OWNER: SIM.
   Touches no DOM, no canvas. Deterministic per seed. Never calls Math.random.

   ============================================================================
   THE NEST IS THE MOVEMENT GRAPH  (CONTRACT §16) — READ THIS FIRST
   ============================================================================
   The nest is a graph and it is THE ONLY WAY TO MOVE. Nodes are chambers and
   junctions; edges are tunnels; everything else is solid earth. An ant is always
   in exactly one of four states and NEVER inside soil:

       a.place === 'chamber'   standing in a chamber or junction  (a.at is the node)
       a.place === 'tunnel'    walking a tunnel                   (a.edge, a.es, a.dir)
       a.place === 'dig'       at a dig face                      (a.digE)
       a.place === 'surface'   on the surface at the shaft head   (a.at is the surface node)

   a.x / a.y are DERIVED from that state once per tick by place(). Nothing else
   writes them. To reach what the network does not connect an ant must DIG: it
   walks to the nearest reachable node, opens a face, and the face advances a
   little each tick until the tunnel exists and the graph permanently changes.

   ---------------------------------------------------------------- WHAT IS EXPOSED
   S.nest = {
     ver,                    bumped whenever the graph changes (a tunnel completes)
     nodes: [ {
        id,                  index into nodes, stable for the life of a scenario
        kind,                'surface' | 'junction' | 'chamber' | 'store' | 'queen'
        x, y, r,             centre and radius in field px
        cap,                 how many bodies fit inside
        occ: [agentId…],     who is inside RIGHT NOW, in packing order
        edges: [edgeId…],    every tunnel that meets here (dug or not)
        job,                 id of the job that lives in this chamber, else 0
        spoil,               0..1 how much dug earth is heaped at this mouth
        comp,                connected-component index over DUG edges only
        gov,                 true while a charter covers it — a junction with an arbiter
     } … ],
     edges: [ {
        id, a, b,            the two node ids it joins
        cap,                 1 = one ant at a time (a lateral). 2 = the spine/shaft.
        len,                 length in px
        dug,                 true if it is a tunnel; false if it is still solid earth
        prog,                0..1 how far the dig face has advanced into the earth
        diggers: [agentId…], who is cutting it right now
        occ: [agentId…],     who is inside the passage right now
        qa: [agentId…],      queued at end a, in order, waiting to enter
        qb: [agentId…],      queued at end b, in order
        wear,                0..1 how heavily travelled — one bright road, cold ones beside it
        jam,                 0..1 how long it has been standing still with bodies in it
        spoil,               0..1 heap of cut earth at the mouth of an unfinished face
     } … ],
     main,                   the component index most of the colony is in
     dug, undug,             tunnel counts, for anyone wanting a census
   }

   On a worker, in addition to the four states above:
     a.at      node id, when in a chamber/junction/surface, else null
     a.edge    edge id, when walking, else null
     a.es      0..1 position along that edge, ALWAYS in a-to-b parameterisation
     a.dir     +1 walking a-to-b, -1 walking b-to-a
     a.digE    edge id of the face it is cutting, else null
     a.goal    the node it is trying to reach
     a.route   [edgeId…] the rest of its planned path — this is its INTENT
     a.blockT  ticks it has been unable to advance: the body of a queue
     a.headOn  id of the ant it is nose to nose with in a one-ant tunnel, else 0
     a.slot    its index inside its node's packing, so bodies do not overlap

   FIELD may read every one of these and must write none.
   ============================================================================

   ------------------------------------------------------------
   THE `force` VOCABULARY  (read this before writing a scenario)
   ------------------------------------------------------------
   `force` is the guarantee layer. A teaching chapter sets force keys so its lesson
   HAPPENS, early and visibly, instead of waiting on luck. Every key below is a boolean
   unless a number is shown. Times are in ticks (the rAF loop runs one tick per frame,
   so ~60 ticks per second at speed 1).

   force.coordination   Claim range is unlimited and, every ~200 ticks, two workers on
                        opposite sides of the field are handed the SAME job. Guarantees
                        Co within ~60 ticks, and Mc soon after. Also lights In and Mm.
   force.stampede       copyBias starts at 0.85: workers pick whatever is most claimed.
                        Guarantees Cf, then Fl (six-plus on one square), then Im.
   force.poison         force.poisonN (default 1) jobs are poison for the majority
                        lineage and unrevealed. With force.monoculture this guarantees
                        Sf within ~250 ticks; it also feeds Cs (the colony overgeneralises).
   force.rumor          One worker is a liar. Every force.lieEvery ticks (default 620) it
                        invents a job that does not exist. Guarantees Gu, then Tc, then Rp.
   force.saboteur       force.advN (default 1) adversaries walk to the most-finished job
                        and drain it. Guarantees Sa; Sa rolls back a BANKED job.
   force.lock           force.lockN (default 2) workers claim a job and never work it.
                        Guarantees Lo within ~140 ticks.
   force.dependency     Half the jobs get an unfinished prerequisite job. Guarantees Dp.
   force.monoculture    Every worker is one lineage. Guarantees Mo and Lv immediately.
   force.silo           Knowledge sharing is off and awareness radius is 90px, so most of
                        the colony never hears about most jobs. Guarantees Si and Di.
   force.hidden         One worker is told which job is poison and never tells anyone.
                        Guarantees Hi (its victims take the hit it could have prevented).
   force.overload       Workers may hold up to 5 jobs at once. Guarantees Ow.
   force.rivals         force.rivalN (default 2) rival pairs chase each other's claims.
                        Guarantees Tw, then Es once they stop working and start chasing.
   force.incorrigible   force.incN (default 1) workers ignore charter, slow and vary.
                        Guarantees Cr the moment you use a tool near one.
   force.myopia         Workers score jobs by nearness and ignore value. Guarantees My and Pt.
   force.churn          Two workers ping-pong one claim every ~18 ticks. Guarantees Cl.
   force.speed          Speed ramps from cfg.speed to force.speedmax (default 2.4) over
                        force.speedrate ticks (default 2200). Guarantees Sp.
   force.dark           Suppresses any pre-applied lens. Mm fires whenever the lens is off
                        and anything at all is contested, so force.dark + any contest = Mm.
   force.drift          Every 2600 ticks two workers drift to the majority lineage. This is
                        what makes the sandbox re-enter monoculture if you stop spending VARY.

   Numeric knobs: force.poisonN force.advN force.lockN force.rivalN force.incN
                  force.lieEvery force.speedmax force.speedrate force.pairEvery

   ------------------------------------------------------------
   THE TRADE-OFFS  (CONTRACT §15, RESEARCH.md §3) — institutions are not upgrades
   ------------------------------------------------------------
   Every instrument is paid for in a currency that is some other failure getting worse.
   All four trade-offs are measured empirically by __FZ.tradeoffs(), which the audit runs
   and prints: same seed, instrument off and on, intended element DOWN and traded-off
   element UP. An unproven trade-off is not implemented.

   §15.1  S.trustBias in [-1,+1]. LEDGER drives it to +1 (skepticism), LENS to -1
          (receptivity), both to 0 — the expensive middle — and it eases back over ~2s
          rather than snapping, so the player feels the dial turn.
            ledger  suppresses Gu Tc Rp   amplifies Di Cs
            lens    suppresses Mm Hi Di Cs Pt My   amplifies Gu
          The amplification is a real term inside those detect() bodies (FZ.elh.skept /
          FZ.elh.cred) and a real mechanism in decide(): under skepticism the herd refuses
          to follow a job only one worker vouches for (job.shun rises); under receptivity
          the rumour is re-broadcast to everyone who has not already fallen for it.
   §15.2  S.ownership in [0,1] — the fraction of the colony that has retreated into working
          alone. Merge conflict raises each author's a.terr; territorial workers refuse
          shared jobs, hoard a private backlog, halve their awareness and stop telling
          anyone anything. So Mc falls, and Si and Ow rise. A CHARTER is the only escape:
          inside a boundary a.terr decays 12x faster and arbitration merges cleanly, so
          Mc falls with no siloing bill. That is what the third budget point buys.
          cfg.noOwn disables the response, for measurement only.
   §15.3  Rival episodes terminate in one of the paper's four observed outcomes and emit
          conflict:resolved {mode,x,y}: 'force' (a lockout, the loser stops working),
          'passivity' (one gives up for a long time), 'truce' (both resume — only reliably
          reachable under a charter, ~80% vs ~5%), 'unsettled' (it burns on). S.conflicts
          keeps the last few for FIELD; S.stat counts them for the audit.
   §15.4  S.aggro = (S.tempo-1)/1.2, clamped. Machine speed raises throughput AND
          aggression on the same curve: work lands faster, and lockouts (Lo), sabotage
          rollbacks (Sa), escalation (Es) and settlement-by-force all arrive sooner.
          SLOW lowers tempo, so it lowers both. It is a real brake, not a discount.

   ------------------------------------------------------------
   THE BODIES — every failure is a thing you can watch happen
   ------------------------------------------------------------
   AESTHETIC.md §0: a failure that needs a caption is not finished. Each of the 28 declares
   a `body` in 30-elements.js; these are the fields that make that body drawable. FIELD may
   read every one of them and must write none. They are recomputed once per tick in
   bodies(), after the detectors have had their say.

   ON A WORKER
     a.posture   one word, the whole vocabulary, chosen fresh every tick. It is read off
                 the NEST now — where the body is and whether it can move:
                   'carry'  in the room with its claim, doing the work
                   'haul'   walking a tunnel toward work it has claimed, purposeful
                   'dig'    at a face, cutting a new passage into solid earth
                   'tug'    at a contested claim, pulling against somebody — Co
                   'jam'    in a chamber packed to its walls — Fl
                   'wait'   stopped: queued at a mouth, or behind a body in a passage
                   'guard'  sitting on a claim or a hoard and not working it — Lo, Ow, Tw
                   'march'  following the crowd or the rumour, confident — Gu, Im, Cf
                   'chase'  has stopped working and only follows its rival — Es
                   'wander' nothing to do, patrolling
                   'idle'   lost a turf war by force or gave it up — drifting, out
                   'down'   stunned
     a.tx a.ty   where this worker INTENDS to go. Draw these as intention trails only when
                 S.lensOn; that absence is the entire body of Mm, and of force.dark.
     a.hesitate  0..1 rises when it turns away from work it distrusts or cannot read, and
                 when it has nowhere to go. Draw as a pause, an antenna wobble. Cs, Mm.
     a.load      0..1 how full its mandibles are — progress on the job it is carrying.
     a.holdN     how many jobs it is sitting on at once. Three is a hoard. Ow.
     a.follow    id of the worker whose choice it copied this time, else 0. Cf, Im.
     a.trust     0..1 how much the colony credits this worker's word. Tc: all of them 1.
     a.marks     how many of its lies the colony still remembers — 0 without a LEDGER even
                 when a.lies is 3. Rp is those tally marks disappearing.
     a.knows     ids of hazards this worker knows about and has not told anyone. Hi.
     a.defiant   tick it last walked through an institution. Cr.
     a.terr      0..1 how far it has retreated into owning its own patch (§15.2).
     a.lockedOut a.gaveUp  how a rival episode ended for it (§15.3).

   ON A JOB
     j.node      THE ROOM IT IS IN. A crumb is not a point in the earth; it is what is in
                 a chamber, and j.x/j.y are that chamber's centre. Reaching it means
                 walking there, and if no tunnel goes there it means digging.
     j.sealed    true when there is NO DUG TUNNEL to its room, or its room is cut off from
                 the rest of the nest. This is Si with a wall instead of a number.
     j.crowd     workers physically in the room with it right now. Fl.
     j.queue     [ids] workers standing off it, waiting for it, doing nothing. Lo, Dp, Cl.
     j.tug       [{id, ang, via}] the bearing each active claimant came in on, and the
                 EDGE ID it walked in by. Two entries with different `via` is Co: they
                 arrived down two different passages and both pull.
     j.trail     0..1 the wear on the most-travelled passage into its room, read straight
                 off the nest. One bright road with cold ones beside it is Cf.
     j.dark      0..1 share of the colony that has never heard of it. Si, Di.
     j.rot       0..1 how far this crumb has gone soft while nobody came. Pt, Cs, My.
     j.unmake    0..1 work actively coming apart right now — negative progress. Sa.
     j.undone    true if this was FINISHED work that a saboteur pulled back open. Sa.
     j.split     tick until which a merge failure is visible on it as two copies. Mc.
     j.hazard    true if poison and unrevealed — a hazard the colony cannot see. Hi.
     j.lone      true if exactly one worker knows about it and it is the best one. Di.
     j.locked    id of the worker sitting on it (already contractual). Lo.
     j.shun      how often the skeptical herd refused it. Cs.
     j.frozen    tick until which a turf war has it stopped dead. Tw.

   ON THE COLONY
     S.column    {job, ids} the colony moving as one body, when it is. Im, Cf.
     S.lineage   [{hue, n}] the lineage census, biggest first. Mo, Lv.
     S.fell      {hue, tick, ids} the last time a whole lineage went down together. Sf.
     S.bigJob    id of the best open crumb, so a build can mark what is being walked past.
     S.arb       true while arbitration is suspended and claims resolve into nothing. In.
     S.weather   {frantic, dark, crowd, scarce} 0..1 conditions, not meters. Sp, Mm, Fl.
     S.scars     [{x,y,sym,tick}] where misses landed. Wear on the architecture, kept.
     S.works     [{kind,x,y,tick}] where institutions were built. History as architecture.

   ------------------------------------------------------------
   WHAT A MISS COSTS — strain, and why it no longer evaporates
   ------------------------------------------------------------
   Round-2 verdict: "the passive strain drain is a flat minus 3 per second, so a landed
   incident's damage evaporates in about two seconds and budget sits pinned at its cap."
   That is fixed here, in three parts:

   1. THE FLAT DRAIN IS GONE. Strain no longer falls just because time passed. It rises
      with the live weight of everything burning (RISE) and falls only two ways: the
      colony BANKS WORK (a finished crumb is relief proportional to its value), or the
      player ANSWERS an incident. A colony that is quiet — almost nothing burning — knits
      itself back up slowly (EASE, and only below CALM). Idling is not a strategy.
   2. A MISS LEAVES A FLOOR. Every landed incident raises S.scar, and strain can never
      fall below S.scar. The floor fades in proportion to itself (SCAR_FADE, a time
      constant near a minute), so it settles wherever your miss rate puts it instead of
      being a debt the clock always pays off: the tenth miss costs more than the first,
      and two misses inside half a minute COMPOUND rather than cancelling. Answering an
      incident files a little of the scar away (SCAR_HEAL) but never all of it.
   3. BUDGET IS NOT FREE. Only a crumb worth 3 or more feeds the colony, and the ceiling
      is the scenario's own starting budget, not a flat 14. Spending has to be chosen.

   Balance is MEASURED, not asserted, and measured through the real loop: __FZ.balance()
   runs the sandbox headless with FZ.outbreak live inside the tick, and a synthetic player
   who answers a given fraction of incidents correctly — committing ONCE per incident, as
   a person does. The audit prints it. Measured, 14k ticks of the sandbox:

     p=100%  survives 4/4   strain mean  0   scar  0
     p= 85%  survives 4/4   strain mean 16   scar 16
     p= 70%  survives 4/4   strain mean 40   scar 39      <- the 30-70 band, as specified
     p= 50%  LOSES  2/4     strain mean 63   scar 77      (4/6 over 16k ticks)
     p= 30%  LOSES  4/4
     p=  0%  LOSES  4/4     inside two minutes

   Change any constant in this section and re-run `node formicary/tools/balance.js`.

   ------------------------------------------------------------
   THINGS OTHER PARTS MAY WANT TO KNOW
   ------------------------------------------------------------
   S.strainTop  [{sym, amt}] — the top contributors to this tick's strain rise. The strain
                meter must always be locatable; this is where you locate it.
   S.scar       the residual floor strain cannot fall below. Draw it under the strain mark
                and a player can see what her misses have cost her that she cannot undo.
   S.tempo      the live speed multiplier after SLOW. Every heat gain is scaled by it.
   S.trustBias  S.ownership  S.aggro — the three trade-off dials, drawable.
   S.conflicts  [{mode,x,y,tick}] recent conflict endings. S.stat totals everything.
   agent.terr   0..1 how territorial this worker has become (draw it if you like).
   agent.lockedOut / agent.gaveUp — how a rival episode ended for this worker.
   Charters DECAY: radius shrinks slowly, and an institution nobody renews disappears.
   Elements are enabled cumulatively: everything with el.chapter <= this chapter index,
   union cfg.teach. cfg.all (or chapter 9) enables all twenty-eight.
   ============================================================ */
window.FZ = window.FZ || {};

/* ---- seeded RNG (xorshift32) ---- */
function fzRng(seed) {
  let s = (seed >>> 0) || 2463534242;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

FZ.sim = (function () {

  const S = {
    tick: 0, jobsDone: 0, jobsGoal: 3, budget: 6, collapse: 0, collapseMax: 100,
    speedMul: 1, tempo: 1, lensOn: false, ledgerOn: false, slowUntil: 0,
    gameOver: false, won: false,
    agents: [], jobs: [], charters: [], rumor: null,
    w: 360, h: 430,
    /* ---- SIM-internal (other parts may read, must not write) ---- */
    tools: [], id: 'boot', force: {}, seed: 1, chapterIndex: 0, narrator: '',
    lensUntil: 0, ledgerUntil: 0, varyUntil: 0, noArb: 0, exploreBlock: 0,
    copyBias: 0, copyN: 0, choiceN: 0, pickLow: 0, pickN: 0, imRun: 0,
    varMul: 1, monoMul: 1, blind: 0, trust: {}, bl: {}, hurts: [],
    strainTop: [], nextJob: 1, spawnEvery: 0, spawnAt: 0, maxJobs: 5, rumorSeq: 0,
    /* ---- the trade-off dials (§15) ---- */
    trustBias: 0, ownership: 0, aggro: 0, ownEnabled: true,
    conflicts: [], stat: null, waiting: 0,
    /* ---- what a miss costs: the residual floor strain cannot fall below ---- */
    scar: 0, scars: [], works: [], budgetMax: 14,
    /* ---- THE BODIES: colony-wide observables, rebuilt each tick in bodies() ---- */
    column: null, lineage: [], fell: null, bigJob: 0, arb: false,
    weather: { frantic: 0, dark: 0, crowd: 0, scarce: 0 },
    _g: null, _silent: false, _said: null,
  };
  function freshStat() {
    return { lost: {}, done: 0, force: 0, passivity: 0, truce: 0, unsettled: 0,
             lockouts: 0, sabotage: 0, esc: 0, shunned: 0, duped: 0,
             missed: 0, answered: 0 };
  }
  S.stat = freshStat();

  /* ---- THE PACE (CONTRACT §16.3) ----------------------------------------------
     Client, round 3: "it all happens very fast." WALK is most of the answer, and the
     nest is the rest. Measured on a 390x808 phone field: the spine runs 786 px, so a
     worker walking the whole nest top to bottom takes about ELEVEN SECONDS at 1.15 px
     a tick; a lateral is 129 px, about two seconds; a normal room-to-room errand is
     five. It is walking a passage the whole way rather than crossing packed earth in a
     straight line, which is where most of the legibility came from. DIG_PX is set so
     one worker opens a lateral face in about four seconds and three of them in under
     two: digging is a thing you watch happen. SLOW halves the tempo on top of all this,
     so the bell still brakes from calm to readable and machine speed still ramps from
     calm to frantic. The dynamic range moved; it did not collapse.
     One number scales the whole incident curve: HEAT_PACE, near the bottom of this file.
     Change either and re-run `node formicary/tools/balance.js`. */
  const WALK = 1.15,        /* px per tick at tempo 1 */
        BODY = 9.5,         /* how much of a passage one body takes up */
        DIG_PX = 0.55,      /* how fast one digger advances a face, px per tick */
        YIELD_T = 70,       /* how long a polite ant stands nose-to-nose before backing out */
        JAM_T = 700,        /* the hard escape: nothing may be stuck forever */
        MAX_EDGES = 60;

  const CHARTER_R = 82, VARY_R = 95, EJECT_R = 44;
  /* fewest workers a colony is allowed to be reduced to by expulsion */
  const EJECT_FLOOR = 4;
  /* how long a worker will stand in a line before giving up on that work entirely */
  const WAIT_TICKS = 260;
  /* ---- what a miss costs (see WHAT A MISS COSTS at the top) ---- */
  const CARRY = 0.33,         /* the share of live failure a colony carries without harm */
        RISE = 0.036,         /* strain per unit of pressure ABOVE what it can carry */
        EASE = 0.013,         /* and how slowly a quiet colony knits itself back up */
        SCAR_ADD = 5.9,       /* a landed incident leaves this much floor behind */
        SCAR_HEAL = 0.6,      /* answering one files a little of the floor away */
        /* The floor fades in PROPORTION to itself, not by a fixed amount per second. That
           is what makes misses compound instead of queueing: a flat decay is a debt the
           clock always pays off, so the tenth miss costs no more than the first. This one
           settles wherever your miss rate puts it — a time constant near a minute — and a
           player who misses a third of them lives permanently at forty. */
        SCAR_FADE = 0.00019;
  let rnd = fzRng(1);

  /* ---------------- small utilities ---------------- */
  /* S._silent === true   headless measurement: nothing leaves the sim.
     S._silent === 'loop'  the BALANCE harness: the two events the incident layer is
                           built on get through, so the real core loop runs headless,
                           while `say`, `goal` and `lose` stay inside — a harness must not
                           be able to advance a chapter or speak to a player who is not
                           there. Everything else behaves exactly as it does in play. */
  const LOOP_EVENTS = { fire: 1, intervene: 1 };
  function emit(n, d) {
    if (S._silent === 'loop') { if (LOOP_EVENTS[n]) FZ.bus.emit(n, d); return; }
    if (!S._silent) FZ.bus.emit(n, d);
  }
  function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }
  function d2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function agentById(id) { const A = S.agents; for (let i = 0; i < A.length; i++) if (A[i].id === id) return A[i]; return null; }
  function jobById(id) { const J = S.jobs; for (let i = 0; i < J.length; i++) if (J[i].id === id) return J[i]; return null; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  const TAU = Math.PI * 2;

  /* ============================================================
     THE NEST — nodes, edges, and the only way to move (CONTRACT §16)
     Everything in this block is the space between the agents. The argument of the
     whole piece is that you do not fix agents, you fix that space — so it has to
     BE something. Solid earth is solid. A tunnel is one ant wide. A queue is a
     queue of bodies. To get somewhere new, somebody has to dig.
     ============================================================ */
  const NEST = { ver: 0, nodes: [], edges: [], main: 0, dug: 0, undug: 0 };
  S.nest = NEST;

  function nodeById(id) { return id == null ? null : NEST.nodes[id] || null; }
  function other(e, id) { return e.a === id ? e.b : e.a; }

  function nestNode(kind, x, y, r, cap) {
    const n = { id: NEST.nodes.length, kind: kind, x: x, y: y, r: r, cap: cap,
                occ: [], edges: [], job: 0, spoil: 0, comp: 0, gov: false };
    NEST.nodes.push(n);
    return n;
  }
  function nestEdge(a, b, cap, dug) {
    if (NEST.edges.length >= MAX_EDGES) return null;
    const A = NEST.nodes[a], B = NEST.nodes[b];
    const dx = A.x - B.x, dy = A.y - B.y;
    const e = { id: NEST.edges.length, a: a, b: b, cap: cap,
                len: Math.max(20, Math.sqrt(dx * dx + dy * dy)),
                dug: !!dug, prog: dug ? 1 : 0, diggers: [], occ: [], qa: [], qb: [],
                wear: dug ? 0.10 : 0, jam: 0, spoil: 0 };
    NEST.edges.push(e);
    A.edges.push(e.id); B.edges.push(e.id);
    return e;
  }
  function edgeMid(e) {
    const A = NEST.nodes[e.a], B = NEST.nodes[e.b];
    return { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
  }

  /* A shaft from the surface, a spine of junctions, chambers hung off it left and
     right down one-ant laterals, and a second way round for half of them. One or
     two chambers are left with NO TUNNEL AT ALL — that is Si, and it is not a
     number, it is a room you cannot get into. */
  /* A NEST THE SIZE OF ITS COLONY. Five workers rattling around eleven chambers is not a
     colony, it is a diagram — so the number of rows comes from how many bodies will live
     here, and two ants meeting in a passage stays the normal case rather than a fluke.
     (Not the chapter index: the teaching chapters all declare chapter 0 so their enabled
     set stays teach-only, so the index says nothing about how big the colony is.) */
  function buildNest(rows) {
    NEST.nodes.length = 0; NEST.edges.length = 0; NEST.ver++;
    const w = S.w, h = S.h;
    const jit = k => (rnd() - 0.5) * k;
    const surf = nestNode('surface', w * (0.34 + rnd() * 0.30), 8, 13, 99);
    const R = rows;
    const J = [], Lc = [], Rc = [];
    for (let i = 0; i < R; i++) {
      const y = h * (0.175 + i * (0.652 / Math.max(1, R - 1))) + jit(h * 0.028);
      J.push(nestNode('junction', w * 0.5 + jit(w * 0.10), y, 12, 3));
      Lc.push(nestNode(i === 1 ? 'store' : 'chamber', w * 0.175 + jit(w * 0.05), y + jit(h * 0.030), 16 + rnd() * 4, 4));
      Rc.push(nestNode('chamber', w * 0.825 + jit(w * 0.05), y + jit(h * 0.030), 16 + rnd() * 4, 4));
    }
    const queen = nestNode('queen', w * 0.5 + jit(w * 0.07), h * 0.955, 20, 6);
    /* the shaft and the spine take two abreast; everything else is single file */
    nestEdge(surf.id, J[0].id, 2, true);
    for (let i = 0; i + 1 < R; i++) nestEdge(J[i].id, J[i + 1].id, 2, true);
    nestEdge(J[R - 1].id, queen.id, 2, true);
    for (let i = 0; i < R; i++) {
      nestEdge(J[i].id, Lc[i].id, 1, true);
      nestEdge(J[i].id, Rc[i].id, 1, true);
    }
    /* THE SIDE ROADS. A nest is a network, not a tree: nearly every chamber has two ways
       in, which is what lets two workers arrive at one crumb from two different passages
       (Co) and what gives the colony an alternative to the road it is all using (Cf).
       One on each side is left as solid earth, so there is always something to dig. */
    const skipL = Math.floor(rnd() * Math.max(1, R - 1)), skipR = Math.floor(rnd() * Math.max(1, R - 1));
    for (let i = 0; i + 1 < R; i++) {
      nestEdge(Lc[i].id, Lc[i + 1].id, 1, i !== skipL);
      nestEdge(Rc[i].id, Rc[i + 1].id, 1, i !== skipR);
    }
    /* AND ONE OR TWO ROOMS WITH NO WAY IN AT ALL. Not a lateral missing — every passage
       that would reach them is still solid earth. Put work in one of those and the colony
       has to walk to the end of the tunnel and dig. That is Si, and there is nothing to
       write beside it: you can see there is no way in. */
    const seal = 1 + (rnd() < 0.55 ? 1 : 0);
    for (let k = 0; k < seal; k++) {
      const row = 1 + Math.floor(rnd() * Math.max(1, R - 1));
      const nd = (rnd() < 0.5 ? Lc : Rc)[Math.min(R - 1, row)];
      if (!nd || nd.kind === 'store') continue;
      for (let m = 0; m < nd.edges.length; m++) {
        const e = NEST.edges[nd.edges[m]];
        if (e) { e.dug = false; e.prog = 0; e.wear = 0; }
      }
    }
    components();
  }

  /* which nodes can reach which, over DUG edges only */
  function components() {
    const N = NEST.nodes, E = NEST.edges;
    for (let i = 0; i < N.length; i++) N[i].comp = -1;
    let c = 0, best = 0, bestN = 0;
    for (let i = 0; i < N.length; i++) {
      if (N[i].comp >= 0) continue;
      const st = [i]; N[i].comp = c;
      let k = 0;
      while (st.length) {
        const u = st.pop(); k++;
        const ad = N[u].edges;
        for (let m = 0; m < ad.length; m++) {
          const e = E[ad[m]];
          if (!e.dug) continue;
          const v = other(e, u);
          if (N[v].comp < 0) { N[v].comp = c; st.push(v); }
        }
      }
      if (k > bestN) { bestN = k; best = c; }
      c++;
    }
    NEST.main = best;
    let d = 0, u2 = 0;
    for (let i = 0; i < E.length; i++) { if (E[i].dug) d++; else u2++; }
    NEST.dug = d; NEST.undug = u2;
  }

  /* ---------------- routing over the graph ---------------- */
  const _dist = [], _prev = [], _prevE = [], _seen = [];
  /* pref  +1 follow the road everyone else wears (copying is cheap)
           -1 take a road nobody is on (what VARY buys, physically)
            0 shortest, avoiding whatever is already full */
  function route(from, goal, a) {
    const N = NEST.nodes, E = NEST.edges, n = N.length;
    if (from === goal) return [];
    if (N[from].comp !== N[goal].comp) return null;
    let pref = 0;
    if (S.tick < S.varyUntil) pref = -1;
    else if (a && (a.copied || S.copyBias > 0.5)) pref = 1;
    const avoid = (a && S.tick < (a.avoidUntil || 0)) ? a.avoidE : -1;
    for (let i = 0; i < n; i++) { _dist[i] = Infinity; _prev[i] = -1; _prevE[i] = -1; _seen[i] = 0; }
    _dist[from] = 0;
    for (let it = 0; it < n; it++) {
      let u = -1, bd = Infinity;
      for (let i = 0; i < n; i++) if (!_seen[i] && _dist[i] < bd) { bd = _dist[i]; u = i; }
      if (u < 0 || u === goal) break;
      _seen[u] = 1;
      const ad = N[u].edges;
      for (let k = 0; k < ad.length; k++) {
        const e = E[ad[k]];
        if (!e.dug || e.id === avoid) continue;
        const v = other(e, u);
        if (_seen[v]) continue;
        let c = e.len * (1 + 0.9 * (e.occ.length / e.cap));
        if (pref > 0) c *= 1 - 0.42 * e.wear;
        else if (pref < 0) c *= 1 + 0.65 * e.wear;
        const nd = _dist[u] + c;
        if (nd < _dist[v]) { _dist[v] = nd; _prev[v] = u; _prevE[v] = e.id; }
      }
    }
    if (_dist[goal] === Infinity) return null;
    const out = []; let cur = goal, guard = 0;
    while (cur !== from && guard++ < 64) { out.push(_prevE[cur]); cur = _prev[cur]; if (cur < 0) return null; }
    out.reverse();

  function nearestReach(from, goal) {
    const N = NEST.nodes, g = N[goal], c = N[from].comp;
    let best = null, bd = Infinity;
    for (let i = 0; i < N.length; i++) {
      if (N[i].comp !== c) continue;
      const q = d2(N[i].x, N[i].y, g.x, g.y);
      if (q < bd) { bd = q; best = i; }
    }
    return best;
  }
  /* which face to open from here, to get nearer to somewhere unreachable */
  function digTarget(from, goal) {
    const N = NEST.nodes[from], g = NEST.nodes[goal];
    let best = null, bd = Infinity;
    for (let i = 0; i < N.edges.length; i++) {
      const e = NEST.edges[N.edges[i]];
      if (e.dug) continue;
      const v = NEST.nodes[other(e, from)];
      const q = d2(v.x, v.y, g.x, g.y);
      if (q < bd) { bd = q; best = e; }
    }
    return best || nestEdge(from, goal, 1, false);
  }

  /* ---------------- occupancy ---------------- */
  function putIn(a, nid) {
    const n = NEST.nodes[nid];
    if (!n) return;
    leaveEdge(a); unqueue(a);
    a.at = nid; a.digE = null; a.es = 0; a.dir = 0;
    a.place = n.kind === 'surface' ? 'surface' : 'chamber';
    if (n.occ.indexOf(a.id) < 0) n.occ.push(a.id);
  }
  function takeOut(a) {
    if (a.at == null) return;
    const n = NEST.nodes[a.at];
    if (n) { const k = n.occ.indexOf(a.id); if (k > -1) n.occ.splice(k, 1); }
    a.at = null;
  }
  function leaveEdge(a) {
    if (a.edge == null) return;
    const e = NEST.edges[a.edge];
    if (e) { const k = e.occ.indexOf(a.id); if (k > -1) e.occ.splice(k, 1); }
    a.edge = null;
  }
  function unqueue(a) {
    if (a.qE == null) return;
    const e = NEST.edges[a.qE];
    if (e) {
      let k = e.qa.indexOf(a.id); if (k > -1) e.qa.splice(k, 1);
      k = e.qb.indexOf(a.id); if (k > -1) e.qb.splice(k, 1);
    }
    a.qE = null;
  }
  function unnest(a) {                    /* an expelled body leaves no ghost behind */
    takeOut(a); leaveEdge(a); unqueue(a);
    if (a.digE != null) {
      const e = NEST.edges[a.digE];
      if (e) { const k = e.diggers.indexOf(a.id); if (k > -1) e.diggers.splice(k, 1); }
      a.digE = null;
    }
  }

  /* who barges. An institution at the mouth means an orderly queue; without one
     the strong simply go first, and two who both go first meet in the middle. */
  function pushy(a, e) {
    if (!a.corrigible) return true;
    if (a.rival != null) {
      for (let i = 0; i < e.occ.length; i++) if (e.occ[i] === a.rival) return true;
      if (a.chase != null) return true;
    }
    if (a.chaseRumor) return rnd() < 0.35;
    return rnd() < 0.04 + 0.30 * S.aggro;
  }

  function tryEnter(a, eid) {
    const e = NEST.edges[eid];
    if (!e || !e.dug || a.at == null) return false;
    const dir = e.a === a.at ? 1 : -1;
    const n = NEST.nodes[a.at];
    const q = dir > 0 ? e.qa : e.qb;
    if (q.indexOf(a.id) < 0) q.push(a.id);
    a.qE = eid;
    /* a junction with an arbiter passes them one at a time, in the order they
       arrived. A junction without one is a scramble. That difference IS In. */
    if (n.gov && q[0] !== a.id) { a.blockT++; return false; }
    const ent = dir > 0 ? 0 : 1, gap = BODY / e.len;
    let opp = 0, near = false;
    for (let i = 0; i < e.occ.length; i++) {
      const o = agentById(e.occ[i]);
      if (!o) continue;
      if (o.dir !== dir) opp++;
      if (Math.abs(o.es - ent) < gap) near = true;
    }
    const push = !n.gov && pushy(a, e);
    if (near) { a.blockT++; return false; }
    if ((e.occ.length >= e.cap || opp > 0) && !push) { a.blockT++; return false; }
    takeOut(a); unqueue(a);
    a.edge = eid; a.dir = dir; a.es = ent; a.place = 'tunnel'; a.blockT = 0; a.headOn = 0;
    e.occ.push(a.id);
    e.wear = Math.min(1, e.wear + 0.03);
    return true;
  }

  function yieldOrWait(a, e) {
    const o = a.headOn ? agentById(a.headOn) : null;
    const locked = !!(o && o.rival === a.id && a.rival === o.id);
    const mid = edgeMid(e);
    const gov = !!FZ.elh.cover(S, mid.x, mid.y);
    const wait = gov ? YIELD_T * 0.35 : (locked ? JAM_T : YIELD_T);
    if (a.blockT < wait) return;
    /* it backs out the way it came and goes round. Waiting was the cost. */
    a.dir = -a.dir; a.blockT = 0; a.headOn = 0;
    a.avoidE = e.id; a.avoidUntil = S.tick + 300;
    a.route = null;
  }

  function walkEdge(a, step) {
    const e = NEST.edges[a.edge];
    if (!e) { a.edge = null; return; }
    /* THE BODY IN THE DOORWAY. A worker that has claimed work and will not do it does
       not sit tidily on the crumb — it stops halfway down the only passage into that
       room and stays there. Everything behind it is a queue, and the queue is Lo. */
    if (a.locker && a.hold.length) {
      const lj = jobById(a.hold[0]);
      if (lj && !lj.done && (e.a === lj.node || e.b === lj.node) &&
          a.es > 0.28 && a.es < 0.72 && !FZ.elh.cover(S, a.x, a.y)) {
        a.blockT++;
        e.jam = Math.min(1, e.jam + 0.025);
        return;
      }
    }
    const gap = BODY / e.len;
    let room = Infinity, head = 0;
    for (let i = 0; i < e.occ.length; i++) {
      const id = e.occ[i];
      if (id === a.id) continue;
      const o = agentById(id);
      if (!o || o.edge !== a.edge) continue;
      const rel = (o.es - a.es) * a.dir;
      if (rel <= 0) continue;
      const free = rel - (o.dir === a.dir ? gap : gap * 1.2);
      if (free < room) { room = free; head = o.dir === a.dir ? 0 : o.id; }
    }
    const endId = a.dir > 0 ? e.b : e.a, endNode = NEST.nodes[endId];
    const toEnd = a.dir > 0 ? 1 - a.es : a.es;
    if (endNode.occ.length >= endNode.cap) room = Math.min(room, Math.max(0, toEnd - gap * 0.3));
    let ds = step / e.len;
    if (ds > room) ds = room > 0 ? room : 0;
    if (ds <= 0.0002) {
      a.blockT++; a.headOn = head;
      e.jam = Math.min(1, e.jam + 0.02);
      /* the hard escape. Nothing may be stuck forever; eventually they shuffle past. */
      if (a.blockT > JAM_T * 1.6) { putIn(a, a.dir > 0 ? e.a : e.b); a.blockT = 0; a.route = null; return; }
      yieldOrWait(a, e);
      return;
    }
    a.blockT = 0; a.headOn = 0;
    e.jam = Math.max(0, e.jam - 0.012);
    e.wear = Math.min(1, e.wear + 0.0035);
    a.es += ds * a.dir;
    if (a.dir > 0 ? a.es >= 0.9998 : a.es <= 0.0002) {
      if (endNode.occ.length < endNode.cap) {
        const came = a.edge;
