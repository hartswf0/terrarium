    force: { speed: true, speedmax: 2.6, speedrate: 900, dependency: true, myopia: true, coordination: true } },

  { id: 'ch9', all: true, tools: ['vary', 'charter', 'slow', 'lens', 'ledger', 'eject'],
    seed: 1117, speed: 1.15, budget: 8, collapseMax: 100,
    agents: { n: 16, hues: [0, 0, 0, 0, 0, 0, 0, 1] }, jobs: { n: 8, max: 9, value: 5, spawnEvery: 40 }, goal: { jobs: 117 },
    force: {
      coordination: true, pairEvery: 230, stampede: true, poison: true, poisonN: 2,
      rumor: true, lieEvery: 520, saboteur: true, advN: 1, lock: true, lockN: 2,
      dependency: true, silo: true, hidden: true, overload: true,
      rivals: true, rivalN: 2, incorrigible: true, incN: 1, myopia: true, churn: true,
      speed: true, speedmax: 2.2, speedrate: 4200, dark: true, drift: true,
    } },
];

/* ============================================================
   window.__FZ — the test surface
   ============================================================ */
(function () {
  const S = FZ.sim.state;

  FZ.bus.on('say', d => { if (d && d.text) S.narrator = d.text; });

  function sandboxCfg() {
    if (FZ.chapters && FZ.chapters.list && FZ.chapters.list.length) {
      const last = FZ.chapters.list[FZ.chapters.list.length - 1];
      if (last && last.cfg) return last.cfg;
    }
    return FZ.sim.defaults[FZ.sim.defaults.length - 1];
  }

  /* THE ACCEPTANCE TEST, AS A NUMBER (CONTRACT §16.4). Every worker is in a chamber,
     in a tunnel, at a dig face or on the surface. `soil` must be zero, always, in
     every scenario, at every tick. If it is not, this section is not done. */
  function nestCensus() {
    const N = S.nest, A = S.agents;
    const P = { chamber: 0, tunnel: 0, dig: 0, surface: 0, soil: 0 };
    let queued = 0, headOn = 0, digging = 0;
    for (let i = 0; i < A.length; i++) {
      const a = A[i];
      const ok = (a.place === 'chamber' && a.at != null && N.nodes[a.at]) ||
                 (a.place === 'tunnel' && a.edge != null && N.edges[a.edge]) ||
                 (a.place === 'dig' && a.digE != null && N.edges[a.digE]) ||
                 (a.place === 'surface' && a.at != null && N.nodes[a.at]);
      if (!ok) P.soil++; else P[a.place]++;
      if (a.blockT > 20) queued++;
      if (a.headOn) headOn++;
      if (a.digE != null) digging++;
    }
    let faces = 0, jam = 0, wear = 0, sealed = 0;
    for (let i = 0; i < N.edges.length; i++) {
      const e = N.edges[i];
      if (!e.dug && e.prog > 0.01) faces++;
      if (e.jam > 0.3) jam++;
      if (e.wear > wear) wear = e.wear;
    }
    for (let i = 0; i < S.jobs.length; i++) if (S.jobs[i].sealed) sealed++;
    return {
      where: P, nodes: N.nodes.length, tunnels: N.dug, undug: N.undug,
      faces: faces, digging: digging, queued: queued, headOn: headOn,
      jammed: jam, wear: +wear.toFixed(2), sealedJobs: sealed,
    };
  }

  function bodyCensus() {
    const P = {}, J = S.jobs, A = S.agents;
    let queued = 0, tugging = 0, jam = 0, trail = 0, dark = 0, rot = 0, unmake = 0, hazard = 0;
    for (let i = 0; i < A.length; i++) P[A[i].posture] = (P[A[i].posture] || 0) + 1;
    for (let i = 0; i < J.length; i++) {
      const j = J[i];
      queued += j.queue.length;
      if (j.tug.length > 1) tugging++;
      if (j.crowd > jam) jam = j.crowd;
      if (j.trail > trail) trail = j.trail;
      if (j.dark > 0.7) dark++;
      if (j.rot > 0.4) rot++;
      if (j.unmake > 0.2) unmake++;
      if (j.hazard) hazard++;
    }
    return {
      posture: P, queued: queued, tugging: tugging, jam: jam,
      trail: +trail.toFixed(2), dark: dark, rot: rot, unmake: unmake, hazard: hazard,
      column: S.column ? S.column.ids.length : 0,
      lineage: S.lineage.map(l => l.n),
      scars: S.scars.length, works: S.works.length,
      weather: { frantic: +S.weather.frantic.toFixed(2), dark: +S.weather.dark.toFixed(2),
                 crowd: +S.weather.crowd.toFixed(2), scarce: +S.weather.scarce.toFixed(2) },
    };
  }

  function probe() {
    const hot = FZ.EL.filter(e => FZ.sim.enabled.has(e.sym))
      .slice().sort((a, b) => b.heat - a.heat).slice(0, 6)
      .map(e => ({ sym: e.sym, heat: +e.heat.toFixed(3), fires: e.fires }));
    return {
      chapter: FZ.chapters ? FZ.chapters.index : S.chapterIndex,
      tick: S.tick, jobsDone: S.jobsDone, jobsGoal: S.jobsGoal,
      budget: S.budget, collapse: +S.collapse.toFixed(1),
      /* what the misses have cost that cannot be undone by playing well from here */
      scar: +S.scar.toFixed(1), missed: S.stat.missed, answered: S.stat.answered,
      agents: S.agents.length, jobs: S.jobs.length,
      hot: hot,
      strain: S.strainTop.map(s => s.sym),
      /* the three trade-off dials, for tooling and for FIELD */
      trustBias: +S.trustBias.toFixed(2), ownership: +S.ownership.toFixed(2),
      aggro: +S.aggro.toFixed(2), speedMul: +S.speedMul.toFixed(2),
      conflict: { force: S.stat.force, passivity: S.stat.passivity, truce: S.stat.truce, unsettled: S.stat.unsettled },
      /* THE BODIES, as a census: proof the failures are things happening on the field and
         not numbers in a table. If `queued` is zero while Lo is hot, the body is missing. */
      bodies: bodyCensus(),
      /* the nest, and the proof that nobody is standing in solid earth */
      nest: nestCensus(),
      enabled: Array.from(FZ.sim.enabled),
      tools: S.tools.slice(),
      gameOver: S.gameOver, won: S.won,
      narrator: S.narrator || '',
    };
  }

  function goto(i) {
    if (FZ.chapters && FZ.chapters.start) { FZ.chapters.start(i); return probe(); }
    FZ.sim.reset(FZ.sim.defaults[Math.max(0, Math.min(FZ.sim.defaults.length - 1, i | 0))]);
    return probe();
  }

  /* free application of a counter, for measurement only — exactly what the tool does */
  function forceCounter(tool) {
    if (tool === 'charter') {
      S.charters.length = 0;
      /* measurement charters are built oversized ON PURPOSE. Institutions decay in play,
         and a leg that runs six thousand ticks would otherwise be measuring a regime that
         quietly develops holes in it halfway through. */
      for (let x = 0; x <= S.w; x += 120) for (let y = 0; y <= S.h; y += 120) S.charters.push({ x: x, y: y, r: 340 });
    } else if (tool === 'lens') { S.lensUntil = 1e9; S.lensOn = true; S.bl = {}; S.jobs.forEach(j => { j.revealed = true; j.shun = 0; }); }
    else if (tool === 'ledger') { S.ledgerUntil = 1e9; S.ledgerOn = true; }
    else if (tool === 'slow') { S.slowUntil = 1e9; }
    else if (tool === 'vary') { S.agents.forEach((a, i) => { if (a.corrigible) a.hue = i % 4; }); S.varyUntil = 1e9; }
    else if (tool === 'eject') {
      for (let i = S.agents.length - 1; i >= 0; i--) {
        const a = S.agents[i];
        if (a.adversary || !a.corrigible) S.agents.splice(i, 1);
      }
    }
  }

  /* ---------------- a competent player, for balance checking ----------------
     Reads the strain readout, buys the instrument that answers whatever is hottest, and
     puts it where that failure is happening. This is the standard ch9 has to be winnable
     against — and ungoverned, ch9 has to be losable. Both are asserted in the audit notes. */
  function playWell() {
    const hot = S.strainTop.length ? FZ.ELBY[S.strainTop[0].sym] : null;
    if (!hot) return;
    const kinds = hot.answers.filter(k => S.tools.indexOf(k) > -1 && S.budget >= FZ.sim.cost(k));
    if (!kinds.length) return;
    const kind = kinds[0];
    let x = S.w / 2, y = S.h / 2;
    if (kind === 'eject') {
      const a = S.agents.find(z => z.adversary) || S.agents.find(z => !z.corrigible);
      if (!a) return;
      x = a.x; y = a.y;
    } else if (kind === 'charter') {
      /* over the busiest contested job, or the busiest worker cluster */
      let best = null, bn = 0;
      for (let i = 0; i < S.jobs.length; i++) {
        const j = S.jobs[i];
        if (!j.done && j.claims.size > bn) { bn = j.claims.size; best = j; }
      }
      if (best) { x = best.x; y = best.y; }
    } else if (kind === 'vary') {
      let sx = 0, sy = 0, n = 0;
      for (let i = 0; i < S.agents.length; i++) {
        if (S.agents[i].hue !== S._g.topHue) continue;
        sx += S.agents[i].x; sy += S.agents[i].y; n++;
      }
      if (n) { x = sx / n; y = sy / n; }
    }
    FZ.sim.apply(kind, x, y);
  }

  function autoPlay(n) {
    const kinds = S.tools;
    if (!kinds.length) return;
    const k = kinds[n % kinds.length];
    const x = 40 + FZ.sim._rnd() * (S.w - 80), y = 40 + FZ.sim._rnd() * (S.h - 80);
    if (k === 'eject') {
      const a = S.agents.find(z => z.adversary || !z.corrigible);
      if (a) FZ.sim.apply('eject', a.x, a.y);
    } else FZ.sim.apply(k, x, y);
  }

  /* ============================================================
     __FZ.balance() — THE GAME, MEASURED THROUGH THE GAME.

     Round-2 verdict on the old numbers: "measured with the core loop switched off
     entirely, so they describe a game nobody plays." So this harness runs the REAL loop:
     FZ.sim.step() and then FZ.outbreak.update() every tick, exactly as 90-boot.js does,
     with a synthetic player who reads the burning incident, waits a human beat, and
     answers correctly a given fraction of the time. Everything else — the fuse, the
     damage, the refund, the scar — is the shipped code path.

     It reports, per accuracy p: whether the run survived, and the band strain lived in.
     The target set by the critic: p=0.7 survives with strain oscillating 30–70; p=0.5
     loses outright.

     Two things are borrowed and put back: the mastery ledger (the harness must not mark
     plates the player never answered) and FZ.chapters.phase, which the incident layer
     checks before opening. Both are restored in the finally.
     ============================================================ */
  function balance(opts) {
    opts = opts || {};
    const ps = opts.ps || [1, 0.85, 0.7, 0.5, 0.3, 0];
    const seeds = opts.seeds || [8821, 33417, 55221, 7];
    const ticks = opts.ticks || 14000;
    /* the sandbox by default; opts.chapter measures any teaching chapter the same way,
       against its own goal, so "is chapter 5 winnable at 70%" is a question with a number */
    let base = sandboxCfg();
    if (opts.chapter != null && FZ.chapters && FZ.chapters.list && FZ.chapters.list[opts.chapter]) {
      base = FZ.chapters.list[opts.chapter].cfg;
    }
    /* normally the goal is lifted, because what is being measured is how long a colony
       lives, not whether it reaches a number. keepGoal puts the real win condition back,
       which is how "is the sandbox actually winnable by a good player" gets an answer. */
    const cfg = (opts.chapter != null || opts.keepGoal) ? base
      : Object.assign({}, base, { goal: { jobs: 1e9 } });
    const OB = FZ.outbreak;
    if (!OB) return [{ note: 'no outbreak layer' }];

    /* ---- borrow ---- */
    const keep = {};
    try {
      if (window.localStorage) for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.indexOf('formicary') === 0) keep[k] = window.localStorage.getItem(k);
      }
    } catch (e) { /* private mode: nothing to protect */ }
    const heldMastery = JSON.stringify(OB.mastery || {});
    const heldChapters = FZ.chapters;
    FZ.chapters = { phase: function () { return 'play'; } };
    S._silent = 'loop';                       /* only `fire` and `intervene` get through */

    /* the player's hand: the right instrument for this incident, if she owns it */
    function rightTool(o) {
      const A = (o.answers || []).slice(), T = S.tools;
      for (let i = 0; i < A.length; i++) if (T.indexOf(A[i]) > -1 && S.budget >= FZ.sim.cost(A[i])) return A[i];
      return null;
    }
    function wrongTool(o) {
      const A = o.answers || [], T = S.tools;
      for (let i = 0; i < T.length; i++) if (A.indexOf(T[i]) < 0 && S.budget >= FZ.sim.cost(T[i])) return T[i];
      return null;
    }
    /* an expulsion has to name the body, exactly as the player must find it on the field */
    function bodyFor(o) {
      let a = null;
      if (o.who && o.who.length) a = S.agents.find(z => z.id === o.who[0]);
      if (!a) a = S.agents.find(z => z.adversary) || S.agents.find(z => !z.corrigible) ||
                  S.agents.find(z => z.locker) || S.agents.find(z => z.churner);
      return a;
    }
    function answer(o, correct) {
      const kind = correct ? rightTool(o) : wrongTool(o);
      if (!kind) return false;
      let x = o.x, y = o.y;
      if (kind === 'eject') { const b = bodyFor(o); if (!b) return false; x = b.x; y = b.y; }
      OB.tryAnswer(kind, x, y);               /* CONTROLS calls this first, then apply */
      FZ.sim.apply(kind, x, y);
      return true;
    }

    const out = [];
    try {
      for (let pi = 0; pi < ps.length; pi++) {
        const p = ps[pi];
        let lost = 0, won = 0, sumEnd = 0, sumMean = 0, lo = 1e9, hi = -1e9, banked = 0;
        let miss = 0, ans = 0, scarEnd = 0;
        for (let k = 0; k < seeds.length; k++) {
          FZ.sim.reset(Object.assign({}, cfg, { seed: seeds[k] }));
          OB.reset(cfg);
          let acted = 0, n = 0, sum = 0, mn = 1e9, mx = -1e9;
          /* ONE COMMITMENT PER INCIDENT. A player reads the body, picks an instrument and
             lives with it; she does not machine-gun all six until one sticks. Without this
             the harness quietly answers everything at any p, and reports a game that is
             not the game — which is how the previous round's numbers came out flattering. */
          const done = {};
          for (let i = 0; i < ticks && !S.gameOver; i++) {
            FZ.sim.step();
            OB.update(S);
            /* a human beat: she does not answer the instant it opens, and she cannot
               answer more often than she can move a thumb */
            const o = OB.current();
            if (o && !done[o.id] && S.tick - acted > 34 && S.tick - o.born > 45) {
              done[o.id] = 1;
              if (FZ.sim._rnd() < p) { if (answer(o, true)) acted = S.tick; }
              else if (FZ.sim._rnd() < 0.5) { if (answer(o, false)) acted = S.tick; }
              /* the rest of the time she simply does not get there, and it lands */
            }
            if (i > 600) { n++; sum += S.collapse; if (S.collapse < mn) mn = S.collapse; if (S.collapse > mx) mx = S.collapse; }
          }
          if (S.gameOver && !S.won) lost++;
          if (S.won) won++;
          sumEnd += S.collapse; sumMean += n ? sum / n : 0;
          if (mn < lo) lo = mn; if (mx > hi) hi = mx;
          banked += S.jobsDone; miss += S.stat.missed; ans += S.stat.answered;
          scarEnd += S.scar;
        }
        const nS = seeds.length;
        out.push({
          p: p, lost: lost, won: won, of: nS,
          mean: +(sumMean / nS).toFixed(1),
          band: [Math.round(lo), Math.round(hi)],
          end: +(sumEnd / nS).toFixed(1),
          scar: +(scarEnd / nS).toFixed(1),
          answered: Math.round(ans / nS), missed: Math.round(miss / nS),
          jobs: Math.round(banked / nS),
        });
      }
    } finally {
      S._silent = false;
      FZ.chapters = heldChapters;
      /* put the ledger back exactly as it was */
      try {
        const m = OB.mastery;
        for (const k in m) delete m[k];
        const held = JSON.parse(heldMastery);
        for (const k in held) m[k] = held[k];
        if (window.localStorage) {
          for (let i = window.localStorage.length - 1; i >= 0; i--) {
            const k = window.localStorage.key(i);
            if (k && k.indexOf('formicary') === 0 && !(k in keep)) window.localStorage.removeItem(k);
          }
          for (const k in keep) window.localStorage.setItem(k, keep[k]);
        }
      } catch (e) { }
      OB.reset(cfg);
      FZ.sim.reset(cfg);
    }
    return out;
  }

  /* ============================================================
     __FZ.tradeoffs() — THE PROOF THAT §15 IS IMPLEMENTED AND NOT ASSERTED.
     For each claim: run the SAME seeds twice, instrument off and instrument on, and
     report that the element the instrument is for went DOWN and the element it is paid
     for in went UP. A trade-off that does not measure is not implemented.
     ============================================================ */
  function tradeoffs(opts) {
    opts = opts || {};
    const WARM = opts.warm || 500, RUN = opts.ticks || 2200;
    const SEED3 = opts.seeds || [880011, 24601, 133742];
    /* Mc is a rare high-amplitude event, so its claim needs a bigger sample than the
       continuous ones do. Eight seeds and a longer window, or the answer is just noise. */
    const SEED8 = SEED3.concat([70707, 314159, 42424, 99991, 555]);
    const LONG = 4000;
    const base = sandboxCfg();
    function cfg(extra, forceExtra) {
      const c = Object.assign({}, base, { collapseMax: Infinity, budget: 0, tools: [] }, extra || {});
      c.force = Object.assign({}, base.force || {}, forceExtra || {});
      c.goal = { jobs: 1e9 };
      return c;
    }
    /* an isolated world, built from scratch rather than from the sandbox, for the claims
       that need one specific failure to be reliably observable rather than everything at once */
    function iso(agents, jobs, force) {
      return { id: 'ch9', all: true, tools: [], budget: 0, collapseMax: Infinity,
               speed: 1, goal: { jobs: 1e9 }, agents: agents, jobs: jobs, force: force };
    }
    function measure(conf, arm, syms, seeds, ticks) {
      const SEEDS = seeds || SEED3, RUNT = ticks || RUN;
      const acc = {}, fires = {}, sum = { done: 0, aggr: 0, own: 0 };
      syms.forEach(s => { acc[s] = 0; fires[s] = 0; });
      for (let k = 0; k < SEEDS.length; k++) {
        FZ.sim.reset(Object.assign({}, conf, { seed: SEEDS[k] }));
        for (let i = 0; i < WARM; i++) FZ.sim.step();
        if (arm) arm();
        const d0 = S.stat.done;
        syms.forEach(s => fires[s] -= FZ.ELBY[s].fires);
        let ownSum = 0, siloSum = 0;
        for (let i = 0; i < RUNT; i++) {
          FZ.sim.step();
          ownSum += S.ownership;
          /* Si's own trigger condition, counted directly: what share of the open work is
             known to less than a third of the colony. Si's HEAT saturates near 1 as soon as
             two jobs are stale, so the heat alone cannot show siloing getting worse. */
          const open = S._g.open;
          if (open.length) {
            let dark = 0;
            for (let m = 0; m < open.length; m++) if (open[m].knownBy / Math.max(1, S._g.n) <= 0.3) dark++;
            siloSum += dark / open.length;
          }
          for (let m = 0; m < syms.length; m++) acc[syms[m]] += FZ.ELBY[syms[m]].heat;
        }
        /* throughput is work COMPLETED, not the banked count — sabotage rolls that back,
           and rolling it back is aggression, which is the other half of this claim */
        sum.done += S.stat.done - d0;
        sum.own += ownSum / RUNT;
        sum.silo = (sum.silo || 0) + siloSum / RUNT;
        sum.aggr += S.stat.force + S.stat.lockouts + S.stat.sabotage + S.stat.esc;
        sum.siLost = (sum.siLost || 0) + (S.stat.lost.Si || 0);
        sum.duped = (sum.duped || 0) + S.stat.duped;
        syms.forEach(s => fires[s] += FZ.ELBY[s].fires);
      }
      const n = SEEDS.length;
      const out = {
        done: +(sum.done / n).toFixed(1), aggr: +(sum.aggr / n).toFixed(1),
        own: +(sum.own / n).toFixed(3), silo: +((sum.silo || 0) / n).toFixed(3), fires: fires,
        siLost: +((sum.siLost || 0) / n).toFixed(2),
        duped: +((sum.duped || 0) / n).toFixed(2),
      };
      syms.forEach(s => out[s] = +(acc[s] / (RUNT * n)).toFixed(4));
      return out;
    }
    /* upStat: for an amplification whose HEAT is already pinned at one in the baseline.
       A dial that makes a saturated failure worse cannot show it in the heat — there is
       no room above one — so the claim is measured on a consequence that still has
       headroom. Which consequence, and why, is stated at the call site. */
    function claim(name, instrument, offConf, offArm, onConf, onArm, down, up, seeds, ticks, upStat) {
      const syms = down.concat(up);
      const off = measure(offConf, offArm, syms, seeds, ticks);
      const on = measure(onConf, onArm, syms, seeds, ticks);
      const rows = [];
      let pass = true;
      down.forEach(s => {
        /* you cannot measure the suppression of something that never lit. Say so rather
           than scoring it, exactly as counterWorks returns null in the same situation. */
        if (off[s] < 0.004) {
          rows.push({ sym: s, want: 'dark in this window', off: off[s], on: on[s], ok: true });
          return;
        }
        const ok = on[s] < off[s] * 0.9;
        if (!ok) pass = false;
        rows.push({ sym: s, want: 'down', off: off[s], on: on[s], ok: ok });
        rows.push({ sym: s + ' fires', want: 'down', off: off.fires[s], on: on.fires[s], ok: on.fires[s] < off.fires[s] });
      });
      up.forEach(s => {
        const ok = on[s] > off[s] * 1.1;
        if (!ok) pass = false;
        rows.push({ sym: s, want: 'up', off: off[s], on: on[s], ok: ok });
      });
      (upStat || []).forEach(u => {
        const ok = on[u.key] > off[u.key] * 1.1;
        if (!ok) pass = false;
        rows.push({ sym: u.label, want: 'up', off: off[u.key], on: on[u.key], ok: ok });
      });
      return { claim: name, instrument: instrument, pass: pass, rows: rows, offDone: off.done, onDone: on.done };
    }

    const plain = cfg();
    /* The ownership claim needs a colony that can actually collide and merge: mixed lineages
       (a merge conflict needs two of them), a working grapevine (so cutting it costs), and
       enough forced pairs that Mc is common in the baseline. Everything else is off, so what
       is being measured is the ownership response and nothing else. */
    const merge = iso({ n: 12, hues: [0, 1, 2] }, { n: 10, max: 10, value: 3, spawnEvery: 25 },
      { coordination: true, pairEvery: 30, dark: true });
    /* The trust-dial claims need every epistemic failure lit at once and nothing else in the
       way: a liar to be gullible about, a silo so a lone worker can be right and ignored,
       poison so the colony can over-generalise, and darkness so intent is unreadable. */
    const epis = iso({ n: 12, hues: [0, 1, 2] }, { n: 6, max: 6, value: 5, spawnEvery: 200 },
      { rumor: true, lieEvery: 300, silo: true, hidden: true, poison: true, poisonN: 2, dark: true });
    /* Capability-is-not-coordination needs a colony that can actually do work and can also
       turn on itself: rivals, a saboteur and a locker, and nothing else. */
    const power = iso({ n: 12, hues: [0, 1, 2] }, { n: 10, max: 10, value: 4, spawnEvery: 25 },
      { rivals: true, rivalN: 2, saboteur: true, advN: 1, lock: true, lockN: 1,
        coordination: true, pairEvery: 240, dark: true });
    const out = [];

    /* 15.1a LEDGER: suppresses the liar, and teaches the colony to ignore its dissenter. */
    out.push(claim('15.1 LEDGER suppresses Gu, amplifies Di and Cs', 'ledger',
      epis, null, epis, () => forceCounter('ledger'), ['Gu'], ['Di', 'Cs'], SEED8));
    /* 15.1b LENS: suppresses the dark, and broadcasts the rumour with everything else. */
    /* Gu's heat sits pinned near one in this world with the lens off — a liar who keeps
       lying and a phantom chamber the colony can physically walk to leave it nowhere to
       rise. So the receptivity bill is measured on the thing it actually costs: HOW MANY
       WORKERS FELL FOR THE RUMOUR. A colony that broadcasts everything broadcasts it to
       more of itself, and that number has room to move. */
    out.push(claim('15.1 LENS suppresses Di Cs Mm, amplifies the rumour', 'lens',
      epis, null, epis, () => forceCounter('lens'), ['Di', 'Cs', 'Mm'], [], SEED8, null,
      [{ label: 'workers duped', key: 'duped' }]));
    /* 15.2 the ownership response: Mc falls, and it is paid for in Si and Ow. */
    const owOff = measure(Object.assign({}, merge, { noOwn: true }), null, ['Mc', 'Si', 'Ow'], SEED8, LONG);
    const owOn = measure(merge, null, ['Mc', 'Si', 'Ow'], SEED8, LONG);
    const owRows = [
      { sym: 'Mc', want: 'down', off: owOff.Mc, on: owOn.Mc, ok: owOn.Mc < owOff.Mc * 0.9 },
      { sym: 'Mc fires', want: 'down', off: owOff.fires.Mc, on: owOn.fires.Mc, ok: owOn.fires.Mc < owOff.fires.Mc },
      { sym: 'Si trigger', want: 'up', off: owOff.silo, on: owOn.silo, ok: owOn.silo > owOff.silo * 1.1 },
      /* NOT Si's fire count, and not its heat either. A worse silo is not more episodes
         of siloing, it is one episode that never ends: the heat saturates at one and the
         rising edges stop, so both read a deeper failure as a smaller one. The honest
         number is the work that actually rotted in a room nobody came to. */
      { sym: 'work lost to Si', want: 'up', off: owOff.siLost, on: owOn.siLost, ok: owOn.siLost > owOff.siLost * 1.1 },
      { sym: 'Ow', want: 'up', off: owOff.Ow, on: owOn.Ow, ok: owOn.Ow > owOff.Ow * 1.1 + 0.02 },
      { sym: 'ownership', want: 'up', off: owOff.own, on: owOn.own, ok: owOn.own > 0.1 },
    ];
    out.push({
      claim: '15.2 ownership suppresses Mc, amplifies Si and Ow', instrument: 'ownership',
      pass: owRows.every(r => r.ok), rows: owRows, offDone: owOff.done, onDone: owOn.done,
    });
    /* 15.2b the charter is the only escape: Mc falls and the ownership bill never arrives.
       Si is not the right yardstick for this leg — a chartered colony finishes far more work,
       so it meets more brand-new jobs nobody has heard of yet, and that is not siloing.
       S.ownership is the bill itself, so measure the bill. */
    const chOff = measure(merge, null, ['Mc'], SEED8, LONG);
    const chOn = measure(merge, () => forceCounter('charter'), ['Mc'], SEED8, LONG);
    out.push({
      claim: '15.2 CHARTER suppresses Mc without the ownership bill', instrument: 'charter',
      pass: chOn.Mc < chOff.Mc * 0.9 && chOn.own < chOff.own * 0.9 && chOn.done > chOff.done,
      rows: [
        { sym: 'Mc', want: 'down', off: chOff.Mc, on: chOn.Mc, ok: chOn.Mc < chOff.Mc * 0.9 },
        { sym: 'ownership', want: 'down', off: chOff.own, on: chOn.own, ok: chOn.own < chOff.own * 0.9 },
        { sym: 'jobs done', want: 'up', off: chOff.done, on: chOn.done, ok: chOn.done > chOff.done },
      ], offDone: chOff.done, onDone: chOn.done,
    });
    /* 15.3 conflicts terminate in the four named ways, and truce needs a charter. */
    /* ONLY THE EPISODES THAT ENDED UNDER THE REGIME BEING MEASURED COUNT. Rivals now meet
       head-on in one-ant tunnels, so an episode can start and finish inside the warm-up,
       before the charter exists — and counting those would credit the institution with
       endings it had nothing to do with. The tally is taken from the moment it is armed. */
    function modes(arm) {
      const t = { force: 0, passivity: 0, truce: 0, unsettled: 0 };
      /* a rate needs a sample. Turf wars are episodes, not ticks, so this leg runs the
         widest seed set and the longest window of any claim in this file. */
      for (let k = 0; k < SEED8.length; k++) {
        FZ.sim.reset(Object.assign({}, plain, { seed: SEED8[k] }));
        for (let i = 0; i < WARM; i++) FZ.sim.step();
        if (arm) arm();
        const base = {};
        for (const m in t) base[m] = S.stat[m];
        for (let i = 0; i < RUN * 3; i++) FZ.sim.step();
        for (const m in t) t[m] += S.stat[m] - base[m];
      }
      return t;
    }
    const mFree = modes(null), mGov = modes(() => forceCounter('charter'));
    const settled = mFree.force + mFree.passivity + mFree.truce + mFree.unsettled;
    const truceFree = settled ? mFree.truce / settled : 0;
    const govN = mGov.force + mGov.passivity + mGov.truce + mGov.unsettled;
    const truceGov = govN ? mGov.truce / govN : 0;
    out.push({
      claim: '15.3 conflicts end in force/passivity/truce/unsettled; truce needs a charter',
      instrument: 'charter', pass: settled > 0 && truceGov > 0.5 && truceGov > truceFree * 3,
      rows: [
        { sym: 'truce', want: 'up', off: +truceFree.toFixed(2), on: +truceGov.toFixed(2), ok: truceGov > truceFree * 3 },
        { sym: 'force', want: 'down', off: mFree.force, on: mGov.force, ok: mGov.force <= mFree.force },
      ],
      ungoverned: mFree, governed: mGov,
    });
    /* 15.4 speed raises throughput AND aggression on the same curve. */
    const slow = measure(Object.assign({}, power, { speed: 1 }), null, ['Sp'], SEED8);
    const fast = measure(Object.assign({}, power, { speed: 2.4 }), null, ['Sp'], SEED8);
    out.push({
      claim: '15.4 speed raises throughput AND aggression together', instrument: 'speed',
      pass: fast.done > slow.done * 1.15 && fast.aggr > slow.aggr * 1.15,
      rows: [
        { sym: 'jobs done', want: 'up', off: slow.done, on: fast.done, ok: fast.done > slow.done * 1.15 },
        { sym: 'aggression', want: 'up', off: slow.aggr, on: fast.aggr, ok: fast.aggr > slow.aggr * 1.15 },
      ], offDone: slow.done, onDone: fast.done,
    });

    FZ.sim.reset(base);
    return out;
  }

  /* one line per accuracy, so the audit prints the loop's balance without knowing the shape */
  function balanceLines(list) {
    return list.map(r => 'p=' + Math.round(r.p * 100) + '%  ' +
      (r.lost ? 'LOST ' + r.lost + '/' + r.of : 'survived ' + r.of + '/' + r.of) +
      (r.won ? ' (won ' + r.won + ')' : '') +
      '  strain mean ' + r.mean + ' band ' + r.band[0] + '-' + r.band[1] +
      '  scar ' + r.scar + '  answered ' + r.answered + ' missed ' + r.missed +
      '  jobs ' + r.jobs);
  }

  /* one-line-per-claim rendering, so the audit can print the proof without knowing the shape */
  function tradeLines(list) {
    return list.map(c => {
      const body = c.rows.map(r => r.sym + ' ' + r.off + '->' + r.on + ' ' + (r.ok ? r.want : 'NOT ' + r.want)).join(', ');
      return (c.pass ? 'OK   ' : 'FAIL ') + c.claim + ' [' + body + ']';
    });
  }

  function audit(opts) {
    opts = opts || {};
    const trials = opts.trials || 6, ticks = opts.ticks || 40000;
    const t0 = Date.now();
    const cfg = sandboxCfg();
    const res = {};
    FZ.EL.forEach(e => { res[e.sym] = { fires: 0, peak: 0, counterWorks: null }; });

    S._silent = true;
    let resets = 0, doneTotal = 0, lostRuns = 0;

    /* ---- part 1: does every element fire in the real sandbox? ---- */
    for (let t = 0; t < trials; t++) {
      let left = ticks, seed = 40009 + t * 7919, guard = 0;
      while (left > 0 && guard++ < 400) {
        FZ.sim.reset(Object.assign({}, cfg, { seed: seed++ }));
        resets++;
        let i = 0;
        while (i < left && !S.gameOver) {
          FZ.sim.step();
          i++;
          if (i % 500 === 0) autoPlay(i / 500 | 0);
        }
        left -= i;
        doneTotal += S.jobsDone;
        if (S.gameOver && !S.won) lostRuns++;
        FZ.EL.forEach(e => {
          res[e.sym].fires += e.fires;
          if (e.peak > res[e.sym].peak) res[e.sym].peak = e.peak;
        });
      }
    }

    /* ---- part 2: measure each counter. Same world, same seed, run twice:
           once with the counter off, once with it forced on at tick WARM. ---- */
    const WARM = 700, RUN = 2600, SEEDS = [777001, 424243, 90210];
    const mcfg = Object.assign({}, cfg, { collapseMax: Infinity, budget: 0, tools: [] });
    /* a nudge applied identically in BOTH passes, never the element's own counter, so that
       elements which only wake up under provocation still have something to measure */
    function provoke(sym) {
      if (sym === 'Cr') S.slowUntil = S.tick + 1e9;
      else if (sym === 'Mc') S.agents.forEach((a, i) => { a.hue = i % 3; });
      else if (sym === 'Im' || sym === 'Cf') { S.copyBias = 0.99; S.agents.forEach(z => { S.jobs.forEach(j => z.known.add(j.id)); }); }
      else if (sym === 'Di') { S.ledgerUntil = 1e9; S.agents.forEach(a => { if (a.id > 3) a.known.clear(); }); }
      else if (sym === 'Cs') { S.bl[2] = S.tick + 4000; S.bl[3] = S.tick + 4000; }
    }
    function stretch(e, seed, counter) {
      FZ.sim.reset(Object.assign({}, mcfg, { seed: seed }));
      for (let i = 0; i < WARM; i++) FZ.sim.step();
      provoke(e.sym);
      if (counter) forceCounter(e.counterTool);
      let sum = 0;
      for (let i = 0; i < RUN; i++) { FZ.sim.step(); sum += e.heat; }
      return sum;
    }
    for (let n = 0; n < FZ.EL.length; n++) {
      const e = FZ.EL[n];
      let A = 0, seed = SEEDS[0];
      for (let k = 0; k < SEEDS.length; k++) {
        const a = stretch(e, SEEDS[k], false);
        if (a > A) { A = a; seed = SEEDS[k]; }
        if (A >= 2) break;
      }
      const B = stretch(e, seed, true);
      res[e.sym].offSlope = +(A / RUN).toFixed(4);
      res[e.sym].onSlope = +(B / RUN).toFixed(4);
      res[e.sym].seed = seed;
      res[e.sym].counterWorks = A < 1 ? null : (B < A * 0.8);
    }

    /* ---- part 3: the §15 trade-offs, measured the same way — off, on, both directions ---- */
    const trades = tradeoffs(opts.trade);
    const tradeFail = trades.filter(t => !t.pass).map(t => t.claim);

    /* ---- part 4: is the sandbox actually a game? losable if you do nothing, winnable if
           you read it correctly. Both directions, three seeds each. ---- */
    function ch9(policy, cap) {
      let lost = 0, won = 0, jobs = 0;
      for (let k = 0; k < 2; k++) {
        FZ.sim.reset(Object.assign({}, cfg, { seed: 5150 + k * 977 }));
        for (let i = 0; i < cap && !S.gameOver; i++) {
          FZ.sim.step();
          if (policy && i % 60 === 0) playWell();
        }
        if (S.gameOver && !S.won) lost++;
        if (S.won) won++;
        jobs += S.jobsDone;
      }
      return { lost: lost, won: won, jobs: Math.round(jobs / 2) };
    }
    const idle = ch9(false, 12000);
    /* "Well played" has to mean PLAYED, through the shipped loop: incidents open, a
       player reads them and answers with one committed instrument each, and the real
       117-crumb goal is in place. The old measure poked tools at whatever was hottest
       every sixty ticks with the incident layer switched off, which is not the game. */
    const playedRows = opts.balance === false ? []
      : balance({ ps: [0.9], seeds: [5150, 6127], ticks: 46000, keepGoal: true });
    const played = playedRows[0] || { won: 0, lost: 0, jobs: 0, of: 2 };

    S._silent = false;

    /* ---- part 5: THE LOOP, MEASURED THROUGH THE LOOP. Not the sim with the game
           switched off — the shipped tick, with FZ.outbreak live inside it and a player
           who answers a stated fraction of incidents correctly. ---- */
    const bal = opts.balance === false ? [] : balance(opts.bal);

    FZ.sim.reset(cfg);

    return {
      elements: res,
      trades: trades,
      balance: bal,
      notes: {
        ms: Date.now() - t0,
        trials: trials, ticks: ticks, resets: resets,
        jobsDoneTotal: doneTotal,
        runsLost: lostRuns,
        tradeoffs: tradeLines(trades),
        tradeoffsFailed: tradeFail.length ? tradeFail : 'none',
        balance: bal.length ? balanceLines(bal) : 'skipped',
        ch9Ungoverned: idle.lost + '/2 collapsed inside 12k ticks, ' + idle.jobs + ' jobs banked',
        ch9WellPlayed: played.won + '/' + (played.of || 2) + ' reached the 117-crumb goal inside 46k ticks of the REAL loop at 90% accuracy (' + played.lost + ' collapsed), ' + played.jobs + ' crumbs banked',
        method: 'fires/peak from the ch9 sandbox with auto-played interventions; counterWorks from the same seed run twice, counter forced on at tick ' + WARM + ' (best of up to three seeds), comparing mean heat over the following ' + RUN + ' ticks (works = 20% or better reduction). null means the element never got hot enough in the measurement window to compare honestly.',
      },
    };
  }

  window.__FZ = {
    probe: probe, audit: audit, goto: goto, sim: FZ.sim, forceCounter: forceCounter,
    /* the core loop, measured through the core loop: __FZ.balance() -> [{p,lost,band,…}] */
    balance: balance, balanceLines: balanceLines,
    /* §15 proof, runnable on its own: __FZ.tradeoffs() -> [{claim,pass,rows}] */
    tradeoffs: function (o) { S._silent = true; const r = tradeoffs(o); S._silent = false; return r; },
    tradeLines: tradeLines,
  };
})();

</script>

/* ===== 45-outbreak.js ===== */
/* ============================================================
   45-outbreak.js — THE INCIDENT.  OWNER: PLAY.
   See CONTRACT.md §14, AESTHETIC.md §6, REFERENCE-EOT.md §2B and L11.

   What was deleted this round, deliberately: every narrator line this file used to emit

     LENS reveals        SLOW brakes        EJECT excludes

   burning sabotage ring banked an ANSWERED and a refund while the real saboteur kept
   draining. See culprit() below.

   ------------------------------------------------------------------------------
   THIS ROUND: THE INCIDENT OPENS ON A PHYSICAL SITUATION, NOT ON A COORDINATE
   ------------------------------------------------------------------------------
   The verdict was exact: THE EMPTY GROUND opened over two ants standing near a chamber,
   and "no institution" existed only in the sentence. That is the Depiction Law failing at
   the one place it is least affordable — the first tag a player ever meets.

   The nest is now a real movement graph (CONTRACT §16), so every one of those sentences
   has somewhere to point. anchor() below is the whole answer: before an incident is drawn
   it is RESOLVED ONTO A SITE — a junction, a passage, a sealed chamber, a dig face, a knot
   of implicated bodies — and the ring is sized to hold that site and nothing more.

       In  the crossroads where three tunnels meet and nobody keeps the line
       Si  the chamber with no tunnel to it at all
       Fl  the room packed to its walls, or the passage standing solid
       Lo  the body parked in the passage and the line behind it
       Tw  the two rivals nose to nose where only one fits
       Dp  the dig face nobody is cutting, with the work stuck behind it
       Co  the crumb two workers walked in on by two different tunnels
       Cf  the one road worn bright, with the cold one beside it
       Ow  the room of the worker holding more rooms than it can stand in

   Two rules underneath all of them:

     AN INCIDENT NEVER OPENS ON EMPTY EARTH. If the chosen site holds no body and no
     structural fact, the incident moves to the nearest knot of ants it is about, and if
     even that fails it does not open. holds(), nearestKnot().

     AN INCIDENT WAITS FOR ITS BODY. On the first pass the anchor is STRICT: a failure
     with a situation of its own will not open until the colony is actually in that
     situation. It goes to the waiting room, is retried every tick, and only after
     WAIT_BODY ticks will it settle for the bodies the detector named. The same waiting
     room re-times the clusters — the colony fails three at a time and then goes quiet,
     and the overflow used to be thrown away.
   ============================================================ */
window.FZ = window.FZ || {};

FZ.outbreak = (function () {
  'use strict';

  /* sym -> the instruments that resolve it.
     SIM is the authority (`el.answers`, CONTRACT §14.4). This table is the fallback if an
     element ever ships without one, and a generosity margin: an instrument that genuinely
     counters the element in the sim is accepted even when the guide names a different one
     first. Being right for a readable reason is never punished. */
  var ANSWERS = {
    /* coordination */
    Co: ['charter'],
    Si: ['lens'],
    Mc: ['charter'],
    Dp: ['lens', 'charter'],
    Ow: ['charter'],
    Pt: ['lens'],
    /* conformity */

       the audit measures it going up). Only the LENS re-opens what was written off. */
    Cs: ['lens'],
    Hi: ['lens'],
    Tc: ['ledger'],
    Di: ['lens'],
    Rp: ['ledger'],

  /* THE PHENOMENON NAMES — what the paper tag says.

  var PHEN = {

    Si: ['NOBODY KNOWS', 'Most of the colony never heard this work exists.'],
    Mc: ['TWO FINISHES', 'They both finished it, differently. It will not join.'],
    Dp: ['WAITING ON NOTHING', 'This one is stuck behind work nobody is doing.'],
    Ow: ['ONE PAIR OF HANDS', 'One worker is holding three jobs. All three rot.'],
    Pt: ['BUSY AND POOR', 'They grind the small crumbs and leave the big one.'],
    Cf: ['EVERYONE FOLLOWS', 'They pick whatever the others already picked.'],

    Sf: ['FELL TOGETHER', 'One blind spot, shared. They went down at the same moment.'],
    Fl: ['THE STAMPEDE', 'Eight on one crumb. More hands, less work.'],

    Cs: ['WRITTEN OFF', 'One bad crumb, and they shun every crumb like it.'],
    Hi: ['KNEW AND SAID NOTHING', 'Someone walked past that hazard and kept quiet.'],
    Tc: ['ALL VOICES EQUAL', 'Every source weighs the same. One of them is lying.'],

    Es: ['ONLY EACH OTHER', 'The rivals stopped working. Now they only chase.'],
    Cr: ['WILL NOT BE GOVERNED', 'That one walks straight through whatever you put down.'],

    Mm: ['DARK', 'You can see where they are. Not what they want.'],
  };

  /* said when the player expels a body that was not the one doing it — the correctness
     fix has to SAY something, and it must not say "answered". VOICE may override with
     FZ.copy.loop.wrongBody. */
  var WRONG_BODY = 'That one was working. Whatever is doing this is still in here.';

  /* ticks. The rAF loop steps once per frame, so ~60 ticks is a second.
     The fuse shortens with machine speed: that is how Sp becomes the difficulty
     curve rather than a caption.

     RE-TUNED AGAINST THE NEW TEMPO (CONTRACT §16.3). The old curve was chosen for a
     colony that crossed the whole field in a fraction of a second; ants now WALK, and
     the nest is the only way through. Measured on the shipped nest: a lateral passage
     is about two seconds, a normal room-to-room errand about five, the spine end to end
     about eleven. An incident has to live on the scale of an errand, or the body never
     finishes happening before the fuse asks about it.

       FUSE 620      ten and a half seconds — long enough to watch the queue form,
                     short enough that ignoring it is a decision you feel.
       FUSE_MIN 280  at machine speed the same incident is under five seconds. Sp is
                     still the difficulty curve; it just starts from a colony you can see.
       TAG_DELAY 80  a second and a third of BODY before any word. At the old pace this
                     was 40 ticks, which is a blink; now it is a beat you can use.
       COOL_*        the same failure does not re-open on top of itself for four or five
                     seconds — one situation at a time, at a pace a person reads at. */
  var FUSE = 620, FUSE_MIN = 280, FUSE_MAX = 900;
  var FIRST_GRACE = 1.6;          /* the first one you ever see waits for you */
  var TAG_DELAY = 80;             /* beat 1 before beat 2: the body arrives before the name */
  var COOL_OK = 300, COOL_MISS = 200;
  var KEEP = 170;                 /* how long a resolved outbreak stays inspectable */
  /* a longer fuse must not mean a bigger hole: the drain per incident is held where it
     was by cutting the per-tick rate in the same proportion the fuse grew. */
  var BURN_DRAIN = 0.032;         /* progress lost per tick inside a burning ring */
  var LAND_STRAIN = 6, ANSWER_RELIEF = 6;
  var STORE = 'formicary.mastery';

  var list = [];
  var mastery = {};
  var cap = 1;
  var cool = {};
  /* THE WAITING ROOM. Measured in the sandbox: the colony does not fail at a steady
     rate, it fails in clusters — three detectors trip inside a second and then nothing
     trips for half a minute. Everything over the cap used to be thrown away, so the
     player spent half the sandbox with no decision on the table at all, then got three
     at once. Overflow now WAITS a few seconds for a slot, and is only let in if the
     element is still genuinely hot when the slot opens. Nothing is invented and nothing
     is invented late: the queue only re-times trouble the colony really is in, and drops
     it entirely if the colony cools. Measured in the shipped sandbox with this in place:
     a decision is on the table 97% of the ticks the game is actually in play, and the
     colony no longer alternates between three at once and nothing at all. */
  var waiting = [];
  var WAIT_KEEP = 1200;           /* how long an unserved fire stays worth serving (~20s) */
  var WAIT_HOT = 0.14;            /* and how hot its element must still be */
  var WAIT_BODY = 110;            /* how long an incident waits for its own situation */

  /* THE WHOLE POINT: an incident is resolved onto a situation before it is drawn.

     `strict` is the first pass, and it is the difference between a tag that means
     something and one that does not: if this failure has a situation of its own and the
     colony is not in that situation YET — the crossroads nobody has reached, the passage
     nobody has jammed — the incident is not opened. It goes to the waiting room and tries
     again next tick. THE INCIDENT WAITS FOR ITS BODY, up to a few seconds, and only then
     settles for the bodies the detector named. */
  function anchor(sym, d, st, strict) {
    var site = null;
    if (st.nest && st.nest.nodes && st.nest.nodes.length) {
      try { if (SITE[sym]) site = SITE[sym](st, (d.who || [])); } catch (e) { site = null; }
      if (strict && SITE[sym] && (!site || !holds(st, site))) return null;
      if (!site && d.who && d.who.length) site = atBodies(st, d.who);
      if (!site && d.at) site = snapTo(st, d.at.x, d.at.y);
      if (!site) site = nearestKnot(st, st.w / 2, st.h / 2);
      if (!holds(st, site)) {
        var alt = (d.who && d.who.length) ? atBodies(st, d.who) : null;
        if (!alt || !holds(st, alt)) alt = nearestKnot(st, site ? site.x : st.w / 2, site ? site.y : st.h / 2);
        if (alt) site = alt;
      }
    }
    if (site) return site;
    var at = d.at || { x: st.w / 2, y: st.h / 2 };
    return { kind: 'ground', id: 0, x: at.x, y: at.y, r: radius(st) };
  }

  function burningCount() {
    var n = 0;
    for (var i = 0; i < list.length; i++) if (list[i].state === 'burning') n++;
    return n;
  }
  function findBurning(sym) {
    for (var i = 0; i < list.length; i++) if (list[i].state === 'burning' && list[i].sym === sym) return list[i];
    return null;
  }
  function left(o, st) {
    if (!o.fuse) return 0;
    return 1 - (st.tick - o.born) / o.fuse;
  }

  /* -------------------------------------------------------------------- open */
  function open(d, soft) {
    var st = S();
    if (!st || !d || !d.sym || st.gameOver) return;
    if (cap <= 0) return;
    if (FZ.chapters && FZ.chapters.phase && FZ.chapters.phase() !== 'play') return;
    if (!answerable(d.sym, st)) return;
    if (findBurning(d.sym)) return;
    /* a cooldown means "not on top of itself", not "throw this away": if the colony is
       still in this trouble when the cooldown lifts, it comes back. */
    if (cool[d.sym] > st.tick) { hold(d, st); return; }
    if (burningCount() >= cap) { hold(d, st); return; }

    /* BEFORE ANYTHING ELSE: find the situation. The detector hands us a coordinate; the
       nest tells us what is physically there, and that is what the ring holds. If the
       situation is not on the field yet, this waits for it rather than drawing a ring
       around nothing. */
    var site = anchor(d.sym, d, st, !soft);
    if (!site) { hold(d, st); return; }
    var at = { x: site.x, y: site.y };
    var r = site.r;
    var fuse = Math.round(clamp(FUSE / Math.max(1, st.speedMul || 1), FUSE_MIN, FUSE_MAX));
    if (seen === 0) fuse = Math.round(clamp(fuse * FIRST_GRACE, FUSE_MIN, FUSE_MAX));
    seen++;

    var p = phen(d.sym);
    var o = {
      id: ++seq,
      sym: d.sym,
      /* kept just inside the field: an incident you cannot see the clock on is not a
         decision. The fuse arc starts at twelve o'clock, so the top of the ring is the
         part that must survive. */
      x: clamp(at.x, 22, st.w - 22),
      y: clamp(at.y, 26, st.h - 22),
      r: r,
      born: st.tick,
      /* BEAT ONE BEFORE BEAT TWO. For this many ticks the incident is only a body: ants
         piling up, work sliding back, a ring drawn where it is happening. The name arrives
         after the eye has already gone there. */
      tagAt: st.tick + TAG_DELAY,
      fuse: fuse,
      name: p.name,
      line: p.line,
      say: d.say || fireLine(d.sym),
      answers: answersFor(d.sym).slice(),
      who: (d.who || []).slice(),
      /* the fire that opened it, kept so the incident can keep finding its own body for
         the beat before it is named (see update). */
      seed: d,
      /* the situation itself, for FIELD: 'node' (a room or a crossroads), 'edge' (a
         passage, with both mouths), 'crowd' (a knot of bodies) or 'ground'. Drawing the
         passage or the crossroads the incident is ABOUT is the last mile of this work. */
      site: site,
      /* the bodies standing in it. Kept apart from `who` on purpose: `who` is the
         detector's list of the implicated and an expulsion is judged against it, so a
         bystander must never leak into it. */
      bodies: idsNear(st, site.x, site.y, site.r),
      state: 'burning',
      endAt: 0,
    };
    list.push(o);
    /* the player is looking at whatever most recently caught fire, unless she has
       deliberately pointed at something else that is still burning */
    if (!current(true)) focusId = o.id;
    emit('outbreak:open', { sym: o.sym, x: o.x, y: o.y, fuse: o.fuse, r: o.r, site: o.site });
  }

  /* the cap is full: keep this one, briefly, in case a slot frees while it is still true */
  function hold(d, st) {
    for (var i = 0; i < waiting.length; i++) {
      if (waiting[i].sym !== d.sym) continue;
      waiting[i].d = d; waiting[i].until = st.tick + WAIT_KEEP;
      return;
    }
    if (waiting.length > 5) waiting.shift();
    /* it may wait WAIT_BODY ticks for its own situation to appear on the field; after
       that it opens on the bodies the detector named, because a failure the player is
       never told about is worse than one anchored roughly. */
    waiting.push({ sym: d.sym, d: d, until: st.tick + WAIT_KEEP, ready: st.tick + WAIT_BODY });
  }
  /* a slot freed: let in the one that is still burning hardest in the colony itself */
  function serve(st) {
    if (!waiting.length || burningCount() >= cap) return;
    var best = null, bh = WAIT_HOT;
    for (var i = waiting.length - 1; i >= 0; i--) {
      var w = waiting[i];
      if (w.until < st.tick || findBurning(w.sym) || cool[w.sym] > st.tick) { waiting.splice(i, 1); continue; }
      var e = el(w.sym);
      var h = e ? e.heat : 0;
      if (h > bh) { bh = h; best = w; }
    }
    if (!best) return;
    waiting.splice(waiting.indexOf(best), 1);
    open(best.d, st.tick >= best.ready);
  }

  /* ------------------------------------------------------------------- damage */
  function el(sym) { return FZ.ELBY ? FZ.ELBY[sym] : null; }

  /* it burns: work inside the ring goes backwards while the player decides */
  function burn(o, st) {
    var d = BURN_DRAIN * (st.tempo || 1), r2 = o.r * o.r;
    for (var i = 0; i < st.jobs.length; i++) {
      var j = st.jobs[i];
      if (j.done || j.progress <= 0) continue;
      var dx = j.x - o.x, dy = j.y - o.y;
      if (dx * dx + dy * dy > r2) continue;
      j.progress = Math.max(0, j.progress - d);
    }
  }

  /* it lands: the damage arrives where it happened, all at once, and stays visible */
  function land(o, st) {
    o.state = 'landed';
    o.endAt = st.tick + KEEP;
    cool[o.sym] = st.tick + COOL_MISS;

    var r2 = (o.r * 1.15) * (o.r * 1.15), i;
    for (i = 0; i < st.jobs.length; i++) {
      var j = st.jobs[i];
      if (j.done) continue;
      var dx = j.x - o.x, dy = j.y - o.y;
      if (dx * dx + dy * dy > r2) continue;
      if (j.progress > 0) { j.progress = Math.max(0, j.progress * 0.4 - 4); j.flash = 12; }
    }
    /* the nearest few go down, not the whole colony: a miss must be legible as a
       located event, not a screen-wide freeze you cannot read */
    var near = [];
    for (i = 0; i < st.agents.length; i++) {
      var a = st.agents[i];
      var ax = a.x - o.x, ay = a.y - o.y, q = ax * ax + ay * ay;
      if (q <= r2) near.push({ a: a, q: q });
    }
    near.sort(function (p, z) { return p.q - z.q; });
    for (i = 0; i < near.length && i < 4; i++) {
      near[i].a.stun = Math.max(near[i].a.stun, 44);
      near[i].a.flash = 12;
      emit('agent:hurt', { id: near[i].a.id, x: near[i].a.x, y: near[i].a.y });
    }
    if (st.collapseMax !== Infinity) st.collapse = Math.min(st.collapseMax, st.collapse + LAND_STRAIN);
    var e = el(o.sym);
    if (e) e.heat = Math.min(1, e.heat + 0.3);

    mark(o.sym, 'missed');
    emit('outbreak:landed', { sym: o.sym, x: o.x, y: o.y, r: o.r });
  }

  /* it closes: the failure visibly cools, and the instrument is paid back */
  function resolve(o, kind, st) {
    o.state = 'answered';
    o.endAt = st.tick + KEEP;
    cool[o.sym] = st.tick + COOL_OK;

    var back = (FZ.sim && FZ.sim.cost) ? FZ.sim.cost(kind) : 2;
    st.budget = Math.min(14, st.budget + back + 1);
    if (st.collapseMax !== Infinity) st.collapse = Math.max(0, st.collapse - ANSWER_RELIEF);

    /* the element drops out of the red immediately: the consequence is in the guide too */
    var e = el(o.sym);
    if (e) { e.heat = Math.min(e.heat, 0.1); e.on = false; }

    mark(o.sym, 'answered');
    emit('outbreak:answered', { sym: o.sym, x: o.x, y: o.y, r: o.r });
  }

  /* it stopped on its own terms: the element is genuinely countered and has gone cold,
     so the ring closes rather than burning down a fire that is already out. No reward and
     no mastery credit — the player fixed the colony, but did not answer THIS, here. */
  function defuse(o, st) {
    o.state = 'answered';
    o.endAt = st.tick + KEEP;
    cool[o.sym] = st.tick + COOL_OK;
    emit('outbreak:answered', { sym: o.sym, x: o.x, y: o.y, r: o.r });
  }

  /* ------------------------------------------------------------------ answers */

  /* THE CORRECTNESS FIX (round-one bug).
     EJECT is the only instrument that names a BODY rather than a place, so it is the only
     one that can be aimed at the wrong thing while still landing inside the ring. Expelling
     an honest worker out of a burning sabotage ring used to bank an ANSWERED and refund the
     spend while the saboteur kept draining — a bot banked eleven of them and gutted the
     colony while its strain climbed.

     An expulsion answers an incident only when the body removed IS the one causing it. The
     detectors already hand us the implicated ids on `fire`; the role flags are the backstop
     for a culprit that fired before this ring opened. Anything else is a wrong answer that
     says so, costs the budget, costs the colony a worker, and leaves the real one working. */
  function victimOf(st, x, y) {
    if (x == null) return null;
    var R = (FZ.sim && FZ.sim.ejectR) || 44, best = null, bd = R * R;
    for (var i = 0; i < st.agents.length; i++) {
      var a = st.agents[i], dx = a.x - x, dy = a.y - y, q = dx * dx + dy * dy;
      if (q < bd) { bd = q; best = a; }
    }
    return best;
  }
  function culprit(o, a) {
    if (!a) return false;
    if (o.who && o.who.length && o.who.indexOf(a.id) > -1) return true;
    switch (o.sym) {
      case 'Sa': return !!a.adversary;
      case 'Cr': return !a.corrigible;
      case 'Lo': return !!a.locker;
      case 'Cl': return !!(a.churner || a.colluder);
      /* eject is not the named instrument for anything else; if it ever becomes one,
         the caller has to teach this function who the body is. */
      default: return false;
    }
  }

  /* CONTROLS calls this BEFORE FZ.sim.apply. The spend can still fail (no budget, a
     tap with no worker under it), so the outcome is held until the sim reports back
     on `intervene`, and rolled back if nothing was actually spent. */
  function tryAnswer(kind, x, y) {
    var st = S();
    var miss = { hit: false, right: false, sym: null, msg: '' };
    if (!st || !kind) return miss;

    /* An expulsion is judged on the body, not on the distance: the saboteur wanders, and
       hunting it down outside the ring is exactly the skill the LENS is sold for. */
    if (kind === 'eject') {
      var o = current(true) || null, i;
      if (!o) { for (i = 0; i < list.length; i++) if (list[i].state === 'burning') { o = list[i]; break; } }
      if (!o || o.answers.indexOf('eject') < 0) {
        if (o) { pend = { o: o, kind: kind, right: false }; return { hit: true, right: false, sym: o.sym, msg: wrongLine(o.sym) }; }
        return miss;
      }
      var v = victimOf(st, x, y);
      if (!v) return miss;                       /* no body under the finger; sim will refuse */
      if (culprit(o, v)) {
        pend = { o: o, kind: kind, right: true };
        return { hit: true, right: true, sym: o.sym, msg: loop('answered') };
      }
      pend = { o: o, kind: kind, right: false, body: true };
      return { hit: true, right: false, sym: o.sym, msg: loop('wrongBody') || WRONG_BODY };
    }

    var best = null, bd = Infinity, near = null;
    for (var k = 0; k < list.length; k++) {
      var c = list[k];
      if (c.state !== 'burning') continue;
      var d = (x == null) ? 0 : Math.sqrt((c.x - x) * (c.x - x) + (c.y - y) * (c.y - y));
      var reach = c.r + 26;
      if (d <= reach) { if (d < bd) { bd = d; best = c; } }
      else if (c.answers.indexOf(kind) > -1 && !near) near = c;
    }

    if (!best) {
      /* the right instrument, in the wrong place: say so, and let it apply anyway */
      if (near) return { hit: false, right: false, sym: near.sym, msg: loop('tooFar') };
      return miss;
    }

    if (best.answers.indexOf(kind) > -1) {
      pend = { o: best, kind: kind, right: true };
      return { hit: true, right: true, sym: best.sym, msg: loop('answered') };
    }
    pend = { o: best, kind: kind, right: false };
    return { hit: true, right: false, sym: best.sym, msg: wrongLine(best.sym) };
  }

  function settle(d) {
    if (!pend) return;
    var p = pend; pend = null;
    var st = S();
    if (!st || !d || !d.ok) return;              /* nothing was spent — nothing happened */
    if (p.o.state !== 'burning') return;
    if (p.right) { resolve(p.o, p.kind, st); return; }
    emit('outbreak:wrong', {
      sym: p.o.sym, kind: p.kind, body: !!p.body,
      msg: p.body ? (loop('wrongBody') || WRONG_BODY) : wrongLine(p.o.sym),
      x: p.o.x, y: p.o.y,
    });
  }

  /* ---------------------------------------------------------------- the focus */
  /* THE ONE BEING ASKED ABOUT. There is exactly one paper tag, so exactly one incident
     owns the words at a time; the others stay legible from their bodies alone (CONTRACT
     §12.1). Default is whichever is closest to landing — the one that will hurt first —
     unless the player has tapped a different burning ring to read it. */
  function current(ignoreDelay) {
    var st = S();
    if (!st) return null;
    var i, o, ready = [];
    for (i = 0; i < list.length; i++) {
      o = list[i];
      if (o.state !== 'burning') continue;
      if (!ignoreDelay && st.tick < o.tagAt) continue;
      ready.push(o);
    }
    if (!ready.length) return null;
    for (i = 0; i < ready.length; i++) if (ready[i].id === focusId) return ready[i];
    var best = ready[0], bl = left(best, st);
    for (i = 1; i < ready.length; i++) { var l = left(ready[i], st); if (l < bl) { bl = l; best = ready[i]; } }
    return best;
  }

  /* -------------------------------------------------------------------- update */
  function update(st) {
    if (!st) return;
    if (!wired) wire();

    /* the phone rotated, or a panel grew a line: the sim rescales its world, so
       the incidents have to move with it or they point at nothing. */
    if (lastW && lastH && (lastW !== st.w || lastH !== st.h)) {
      var kx = st.w / lastW, ky = st.h / lastH;
      for (var q = 0; q < list.length; q++) {
        var oo = list[q];
        oo.x *= kx; oo.y *= ky;
        var s = oo.site;
        if (!s) continue;
        s.x *= kx; s.y *= ky;
        if (s.ax != null) { s.ax *= kx; s.bx *= kx; s.ay *= ky; s.by *= ky; }
      }
    }
    lastW = st.w; lastH = st.h;

    for (var i = list.length - 1; i >= 0; i--) {
      var o = list[i];
      if (o.state === 'burning') {
        /* BEAT ONE IS STILL SETTLING. A crumb can be carried off and a queue can clear in
           the second and a third before the tag is hung, and a ring holding nothing is
           the exact failure this layer exists to end — so while the incident is still
           wordless it is allowed to follow its body. Once the name is up it stays put:
           a tag that wanders is worse than a tag that is slightly late. */
        if (st.tick < o.tagAt && (st.tick - o.born) % 15 === 0) {
          var cur = bodiesNear(st, o.x, o.y, o.r), ok = holds(st, o.site);
          /* strict: while it settles it may only move onto its OWN kind of situation —
             a crossroads for In, a packed passage for Fl — never onto a passing ant. */
          var moved = anchor(o.sym, o.seed, st, true);
          if (moved && holds(st, moved) && (!ok || bodiesNear(st, moved.x, moved.y, moved.r) > cur + 1)) {
            o.site = moved; o.x = moved.x; o.y = moved.y; o.r = moved.r;
          }
          o.bodies = idsNear(st, o.x, o.y, o.r);
        }
        var e = el(o.sym);
        if (e && e.countered && e.heat < 0.1 && st.tick - o.born > 45) defuse(o, st);
        else if (st.tick - o.born >= o.fuse) land(o, st);
        else burn(o, st);
      } else if (st.tick >= o.endAt) {
        if (list[i].id === focusId) focusId = 0;
        list.splice(i, 1);
      }
    }
    serve(st);
  }

  function wire() {
    if (wired || !FZ.bus) return;
    wired = true;
    FZ.bus.on('fire', open);
    FZ.bus.on('intervene', settle);
    FZ.bus.on('lose', function () { list.length = 0; waiting.length = 0; pend = null; focusId = 0; });
    FZ.bus.on('goal', function () { list.length = 0; waiting.length = 0; pend = null; focusId = 0; });
  }

  load();
  wire();

  api = {
    list: list,
    mastery: mastery,
    enabled: true,
    cap: 1,

    reset: function (scenario) {
      list.length = 0;
      waiting.length = 0;
      pend = null;
      cool = {};
      seen = 0;
      focusId = 0;
      var st = S();
      lastW = st ? st.w : 0; lastH = st ? st.h : 0;
      cap = (scenario && scenario.outbreakCap != null) ? scenario.outbreakCap : 1;
      api.cap = cap;
      wire();
    },

    update: update,
    tryAnswer: tryAnswer,

    /* the incident that owns the paper tag and the action surface right now */
    current: current,

    /* the player pointed at the field: if she pointed at a burning ring, that is the one
       she is reading now, and the tag moves to it. Returns true if the focus changed. */
    focusAt: function (x, y) {
      var best = null, bd = Infinity;
      for (var i = 0; i < list.length; i++) {
        var o = list[i];
        if (o.state !== 'burning') continue;
        var dx = o.x - x, dy = o.y - y, d = Math.sqrt(dx * dx + dy * dy);
        if (d < o.r + 26 && d < bd) { bd = d; best = o; }
      }
      if (!best || best.id === focusId) return false;
      focusId = best.id;
      return true;
    },

    /* fraction of fuse remaining, 1 -> 0, for whoever needs to draw a clock */
    left: function (o) { var st = S(); return (st && o) ? clamp(left(o, st), 0, 1) : 0; },

    /* the one a tap should be judged against when the instrument is untargeted:
       whichever is closest to landing. */
    urgent: function () {
      var st = S();
      if (!st) return null;
      var best = null, bl = 2;
      for (var i = 0; i < list.length; i++) {
        var o = list[i];
        if (o.state !== 'burning') continue;
        var l = left(o, st);
        if (l < bl) { bl = l; best = o; }
      }
      return best;
    },

    /* how many of the twenty-eight this player has personally answered */
    answeredCount: function () {
      var n = 0;
      for (var k in mastery) if (mastery[k] && mastery[k].answered > 0) n++;
      return n;
    },

    /* the two lines of the tag, for anyone who must show a phenomenon by name.
       Never a two-letter code — that is the guide's, and only the guide's. */
    phen: phen,
    answersFor: answersFor,
  };
  return api;
})();

</script>
<script>
/* ===== 50-render.js ===== */
/* ============================================================
   50-render.js — THE NEST.  OWNER: FIELD.
   FZ.render = { init(canvas), resize(w,h), draw(S) }

   CIVIC NATURALISM (AESTHETIC.md) governs this file. It is a cutaway ant farm:
   soil, excavated chambers, tunnels, ants with bodies, brood, stores, debris,
   scars and weather. The whole point of the rewrite is AESTHETIC.md §9, the
   information migration table — every row of it is a sentence somebody else had
   to write and no longer does:

     colour -> family        incident marks and chamber pigment, never ant colour
     shape  -> institution   a charter is a stone ring, a ledger is a tally wall
     motion -> severity      awkward, then queueing, then collisions, then spills
     density-> workload      a chamber visibly overwhelmed with bodies
     architecture-> history  every successful intervention CARVES the nest, forever
     wear   -> memory        misses collapse the tunnel and leave rubble and stains
     idle:7 -> behaviour     seven ants visibly wandering, antennae down, no load
     charts -> trails        pheromone laid by real feet, invisible without a lens
     meters -> weather       flooding, frantic grit, darkness, drained variety

   MATERIAL tones (paper/sand/soil/ink) are the world and never mean anything.
   The four SIGNAL colours appear ONLY when they mean something:
     teal  an institution is holding      amber  this is asking for you
     red   damage landed / a scar         blue   information, trail, what is known
   Every tint is globalAlpha over a palette literal, so no derived colour exists.

   S is read, never written. No two-letter element code is ever drawn here.
   ============================================================ */
FZ.render = (function () {
  'use strict';

  var MAT = {
    paper: '#f5efe3', paper2: '#e9e0cd', sand: '#e2d3b4', sand2: '#d3bf99',
    soil: '#9d5130', soil2: '#82401f', soil3: '#6b3318', ink: '#17150f', ink2: '#4a4335'
  };
  var SIG = { teal: '#19e6c8', amber: '#ffd23f', red: '#ff2e2e', blue: '#3b82f6' };
  var TAU = Math.PI * 2;
  var DS = 0.5;                       /* mask layers run at half resolution */

  var cv = null, ctx = null, dpr = 1, W = 360, H = 560;
  var nest = null, nx = null;         /* composited earth: soil + excavation + memory */
  var dig = null, dx = null;          /* the excavation mask — ants carve it as they walk */
  var trail = null, tx = null;        /* pheromone */
  var mem = null, mx = null;          /* permanent memory: scars, stamps, stains */
  var mix = null, mxx = null;         /* scratch for masking */
  var earth = null, floor2 = null, vign = null;  /* painted once: earth, floor, darkness */
  var wired = false, now = 0, sx = 1, sy = 1, frames = 0, nestDirty = true;
  var L = null;                       /* the nest layout */
  var beats = [];
  var bodies = new Map();             /* per-ant render memory: heading, gait, wobble */
  var agentIx = new Map(), jobIx = new Map();
  var drawn = new Map();              /* id -> where the body is really standing */
  var peak = new Map(), hurtAt = new Map(), doneAt = new Map();
  var gimg = new Map();

  /* ============================================================ THE LAYERS */

  /* ------------------------------------------------------------ excavation */

  /* ==================================================== THE MOVEMENT GRAPH

     position, so FIELD's only job here is to DRAW THAT TRUTH and never invent a
     second geometry beside it. A tunnel is the straight run between two node
     centres, because that is exactly the line the bodies walk down.

  /* ------------------------------------------------------- reading the nest */

    for (k = 0; k < 7; k++) {

          Q.x += ddx / d * pushd; Q.y += ddy / d * pushd;

         resolves the crowd in the space that actually exists rather than in
         open air that then collapses back into a clot */

  /* ---------------------------------------------------------- the dig faces

     the mouth behind, and the tunnel is longer every time you look. A face with
     nobody on it is a plan the colony has stopped paying for. */
  function drawFaces(S) {
    if (!L) return;
    for (var i = 0; i < L.edges.length; i++) {
      var le = L.edges[i], e = le.ref;
      if (e.dug) continue;

      var from = le.from;

      var ang = Math.atan2(le.B.y - le.A.y, le.B.x - le.A.x) + (from === e.b ? Math.PI : 0);
      var live = e.diggers && e.diggers.length;

         and is still pale with it, so the tunnel is visibly longer every time
         the player looks back at it. */

        ctx.lineCap = 'butt';

         the passage, so it reads as the end of the world rather than a smudge.
         It advances every second somebody is cutting at it. */
      A(0.97); ctx.fillStyle = MAT.soil3;

      ctx.moveTo(-2, -hw);
      for (var q = -1; q <= 1.001; q += 0.2) {
        ctx.lineTo(2 + hash(le.id * 3.3 + q * 5 + Math.floor(pr * 18)) * 7, q * hw);
      }
      ctx.lineTo(-2, hw); ctx.closePath(); ctx.fill();
      /* the freshly cut lip: earth opened a moment ago is bright */
      A(live ? 0.8 : 0.35); ctx.strokeStyle = MAT.sand2; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-2, -hw * 0.86); ctx.lineTo(-2, hw * 0.86); ctx.stroke();
      /* pick marks: the tool at work, or the stillness of a face nobody pays for */
      A(live ? 0.7 : 0.25); ctx.strokeStyle = MAT.ink; ctx.lineWidth = 1.1;
      for (var m = -1; m <= 1; m++) {
        var jit = live ? Math.sin(now * 0.02 + m * 2 + le.id) * 2.2 : 0;
        ctx.beginPath();
        ctx.moveTo(1.5 + jit, m * hw * 0.45); ctx.lineTo(5.5 + jit, m * hw * 0.45 + (m ? 1.4 : -1.4));
        ctx.stroke();
      }
