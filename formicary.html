<style>
/* ===== 10-style.css ===== */
/* ============================================================
   10-style.css — the visual system.  OWNER: SHELL.

   ONE GROUND. The whole page is the vitrine: black, lit, ruled with the same
   faint grid the colony walks on. Earlier rounds set a black field into a white
   page and it read as two applications stitched together; this resolves that in
   the dark direction, because the field is a canvas we cannot make paper.
   White rules divide the drawer. Colour only ever means something.

   LAYOUT LAW: #stage is the only thing that grows. Every other band is sized to
   what it holds — the narrator to its sentence, the bar to its buttons, the
   drawer to a fixed share — so a chapter with no table and no tools gives every
   spare pixel to the colony instead of leaving a hole.

   Palette is the six literals; every grey is rgba(255,255,255,a)/rgba(0,0,0,a).
   Built for a 390x844 phone held in one hand; holds from 320 to 430.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: #000;
  color: rgba(255, 255, 255, .92);
  font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  font-size: 13px;
  line-height: 1.3;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body { user-select: none; -webkit-user-select: none; }

button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

svg { display: block; }

/* the ground: one grid, drawn under everything, at the same pitch the field draws
   its own. Negative space is never blank — it is the inside of the vitrine. */
#app, #about {
  background-color: #000;
  background-image:
    linear-gradient(to right, rgba(255, 255, 255, .05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255, 255, 255, .05) 1px, transparent 1px);
  background-size: 65px 65px;
}

/* ------------------------------------------------------------------ shell */
#app {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  overflow: hidden;
}

/* ------------------------------------------------------------------ header */
#hdr {
  flex: 0 0 auto;
  padding: 6px 9px 0;
  border-bottom: 2px solid rgba(255, 255, 255, .85);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
#hdr .hrow { display: flex; align-items: baseline; gap: 8px; min-height: 16px; }
#chapTitle {
  flex: 1 1 auto;
  font-size: 11px; font-weight: 700; letter-spacing: .16em;
  text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#chapCount {
  flex: 0 0 auto;
  font-size: 10px; font-weight: 500; letter-spacing: .1em;
  color: rgba(255, 255, 255, .45);
  font-variant-numeric: tabular-nums;
}
#aboutBtn {
  flex: 0 0 auto;
  min-width: 46px; min-height: 32px;
  margin: -6px -7px -6px 0;
  padding: 8px 7px;
  font-size: 9px; font-weight: 700; letter-spacing: .14em;
  color: rgba(255, 255, 255, .45);
  text-align: right;
}
#aboutBtn:active { color: #fff; }

#progressRail { display: flex; gap: 2px; height: 5px; margin-bottom: 5px; }
#progressRail .pg { flex: 1 1 0; background: rgba(255, 255, 255, .16); }
#progressRail .pg.done { background: rgba(255, 255, 255, .8); }
#progressRail .pg.cur { background: #19e6c8; }

/* ------------------------------------------------------------------- stage
   The only band that grows. It eats every pixel the other bands do not claim,
   so an early chapter with no drawer and no tools is a full screen of colony. */
#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 176px;
  display: flex;
  flex-direction: column;
  background: #000;
  overflow: hidden;
}

/* #statusStrip sits last in the body markup; order puts it back on top of the vitrine */
#statusStrip {
  order: 0;
  flex: 0 0 auto;
  display: flex;
  min-height: 24px;
  border-bottom: 1px solid rgba(255, 255, 255, .14);
}
#statusStrip .st {
  flex: 1 1 0;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  padding: 0 4px;
  font-size: 8.5px; font-weight: 500; letter-spacing: .1em;
  color: rgba(255, 255, 255, .5);
  border-right: 1px solid rgba(255, 255, 255, .1);
  overflow: hidden; white-space: nowrap;
}
#statusStrip .st:last-child { border-right: 0; }
#statusStrip .st b {
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
  color: rgba(255, 255, 255, .95);
  font-variant-numeric: tabular-nums;
}
#statusStrip .st .mtr { width: 40px; height: 6px; background: rgba(255, 255, 255, .18); }
#statusStrip .st .mtr i { display: block; height: 100%; width: 0; background: #ffd23f; transition: width .2s linear; }
#statusStrip .st.hot .mtr i { background: #ff2e2e; }
#statusStrip .st.hot b { color: #ff2e2e; }
#statusStrip .st.fast b { color: #ffd23f; }

#field {
  order: 1;
  /* basis 0: the canvas takes exactly the space the strips leave, and the explicit
     pixel height the renderer stamps on it can never feed back into layout. */
  flex: 1 1 0;
  min-height: 0;
  display: block;
  width: 100%;
  touch-action: none;
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}

#ticker {
  order: 2;
  flex: 0 0 auto;
  min-height: 31px;
  display: flex; align-items: center;
  padding: 5px 9px;
  border-top: 1px solid rgba(255, 255, 255, .14);
  font-size: 10.5px; line-height: 1.25;
  letter-spacing: .01em;
  color: rgba(255, 255, 255, .55);
}
#ticker[data-tone="bad"] {
  color: #ff2e2e;
  box-shadow: inset 3px 0 0 #ff2e2e;
  padding-left: 12px;
}
/* nothing to report is not a band of nothing: the readout gives its strip back
   to the colony until it has something to say */
#ticker:empty { min-height: 0; padding: 0; border-top: 0; }
@keyframes fztkin { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
#ticker.tkin { animation: fztkin .18s ease-out 1; }

#aimHint {
  position: absolute;
  left: 0; right: 0; bottom: 31px;
  z-index: 6;
  display: none;
  padding: 7px 10px;
  background: #ffd23f;
  color: #000;
  font-size: 11px; font-weight: 700; line-height: 1.25;
  pointer-events: none;
}
#aimHint.on { display: block; }

/* ---------------------------------------------------------------- narrator
   Sized to the sentence it is holding, never to a share of the screen. The
   drawn square is the speaker: it takes the colour of the tone, so the voice
   has a mark of its own and the panel needs no chrome. */
#say {
  flex: 0 0 auto;
  min-height: 56px;
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 12px 13px;
  border-top: 2px solid rgba(255, 255, 255, .85);
  font-size: 13.5px; line-height: 1.42;
  color: rgba(255, 255, 255, .92);
}
#say::before {
  content: "";
  flex: 0 0 auto;
  width: 8px; height: 8px;
  margin-top: 6px;
  background: rgba(255, 255, 255, .4);
}
#say[data-tone="bad"]::before { background: #ff2e2e; }
#say[data-tone="good"]::before { background: #19e6c8; }
#say[data-tone="name"]::before { background: #ffd23f; }
@keyframes fzsayin { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
#say.in { animation: fzsayin .2s ease-out 1; }

/* ------------------------------------------------------------------- table
   A fixed share of the viewport, not a share of the leftovers: the drawer is
   the same size in every chapter that has one, and the field absorbs the rest.
   TABLE fits its 28 cells to whatever height this gives it. */
#tableWrap {
  flex: 0 1 auto;
  height: 36vh;
  min-height: 172px;
  max-height: 400px;
  padding: 6px 6px 8px;
  background: #000;
  border-top: 2px solid rgba(255, 255, 255, .85);
  overflow-y: auto;
  overscroll-behavior: contain;
}

/* --------------------------------------------------------------- tool bar */
#bar {
  flex: 0 0 auto;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 3px;
  padding: 5px 5px calc(5px + env(safe-area-inset-bottom));
  border-top: 2px solid rgba(255, 255, 255, .85);
  background: #000;
}
#bar .tool {
  position: relative;
  min-height: 52px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  padding: 4px 2px;
  border: 2px solid rgba(255, 255, 255, .5);
  background: #000;
  color: rgba(255, 255, 255, .92);
  font-size: 8.5px; font-weight: 700; letter-spacing: .05em;
  overflow: hidden;
}
#bar .tool .tg { width: 20px; height: 15px; color: inherit; }
#bar .tool .tg svg { width: 20px; height: 15px; }
#bar .tool .tl { white-space: nowrap; }
#bar .tool .tc {
  font-size: 8px; font-weight: 500; letter-spacing: .02em;
  color: rgba(255, 255, 255, .5);
  font-variant-numeric: tabular-nums;
}
#bar .tool.on { background: #fff; border-color: #fff; color: #000; }
#bar .tool.on .tc { color: rgba(0, 0, 0, .6); }
#bar .tool.live { border-color: #19e6c8; box-shadow: inset 0 -4px 0 #19e6c8; }
#bar .tool.live.on { box-shadow: inset 0 -4px 0 #19e6c8; }
#bar .tool.poor { opacity: .34; }
#bar .tool:active { transform: translateY(1px); }
@keyframes fztoolin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#bar .tool.fresh { animation: fztoolin .28s ease-out 1; }

/* hidden regions — a thing the player has not been taught is ABSENT, and the
   space it would have taken goes to the colony, not to a hole. */
#app.noBar #bar { display: none; }
#app.noTable #tableWrap { display: none; }
#app.noTable #say {
  min-height: 84px;
  align-items: center;
  padding: 16px 14px;
  font-size: 16px; line-height: 1.45;
}
#app.noTable #say::before { width: 10px; height: 10px; margin-top: 0; }

/* ------------------------------------------------------------------- toast */
#toast {
  position: fixed;
  left: 8px; right: 8px;
  bottom: calc(74px + env(safe-area-inset-bottom));
  z-index: 50;
  display: none;
  padding: 9px 11px;
  background: #fff;
  color: #000;
  border-left: 4px solid #ffd23f;
  font-size: 11.5px; font-weight: 500; line-height: 1.32;
}
#toast.on { display: block; }
#toast.good { border-left-color: #19e6c8; }
#toast.bad { border-left-color: #ff2e2e; }
#app.noBar #toast { bottom: calc(12px + env(safe-area-inset-bottom)); }

/* -------------------------------------------------------------------- gate
   A title card, not a centred label in a void: the type sits on the floor of
   the card, directly above the one action, and the space above it is the
   colony itself, held still under a scrim — the specimen at rest, or, after a
   result, the exact frame the run ended on. */
#gate, #about {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 60;
  display: none;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  border-top: 4px solid #19e6c8;
}
/* solid across the header band so the chapter chrome underneath cannot ghost into
   the wordmark; a scrim from there down, where only the colony is */
#gate {
  background-color: rgba(0, 0, 0, .8);
  background-image: linear-gradient(to bottom, #000 0, #000 74px, rgba(0, 0, 0, .8) 118px);
}
#gate.on, #about.on { display: flex; }
#gate.good { border-top-color: #19e6c8; }
#gate.bad { border-top-color: #ff2e2e; }
#gate.good .gtSub { border-bottom-color: #19e6c8; }
#gate.bad .gtSub { border-bottom-color: #ff2e2e; }
#about { z-index: 70; }

.gtIn {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 20px 0 16px;
  display: flex; flex-direction: column; justify-content: flex-start;
}
/* Every block of the card carries its own solid ground, full width, and prints it
   20px downward as well so the gaps between blocks close. The card is therefore a
   label on black, exactly as tall as its words, and the colony shows through only
   in the space the card does not need. A short title gate is a specimen floating
   over its own vitrine; a long postmortem covers the glass completely.
   The shadow only ever paints DOWN, so no block can eat the one above it. */
.gtIn > * { background: #000; box-shadow: 0 20px 0 #000; padding-left: 16px; padding-right: 16px; }
/* the auto top margin drops a short card to the floor and collapses to zero on a
   long one, so nothing is ever clipped at the top */
.gtIn > :first-child { margin-top: auto; }
.gtIn.card { justify-content: space-between; }
.gtIn.card > :first-child { margin-top: 0; }
.gtWord { flex: 0 0 auto; }
.gtWord .wm {
  font-size: 15px; font-weight: 700; letter-spacing: .34em;
  padding-bottom: 7px;
}
.gtWord .wt {
  font-size: 11px; letter-spacing: .04em;
  color: rgba(255, 255, 255, .55);
  padding-bottom: 10px;
  border-bottom: 4px solid #19e6c8;
  display: inline-block;
}
.gtWord + .gtNum { margin-top: auto; }
.gtNum {
  font-size: 10px; font-weight: 700; letter-spacing: .22em;
  color: rgba(255, 255, 255, .45);
  font-variant-numeric: tabular-nums;
  margin-bottom: 10px;
}
.gtTitle {
  font-size: 33px; font-weight: 700; letter-spacing: 0; line-height: 1.04;
  margin-bottom: 9px;
}
.gtSub {
  font-size: 10.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
  color: rgba(255, 255, 255, .5);
  padding-bottom: 14px;
  border-bottom: 2px solid rgba(255, 255, 255, .85);
}
.gtWin { font-size: 15px; line-height: 1.4; margin-top: 16px; }
.gtHead {
  margin-top: 18px; padding-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, .22);
  font-size: 9.5px; font-weight: 700; letter-spacing: .2em;
  color: rgba(255, 255, 255, .45);
}
.gtBody { margin-top: 8px; font-size: 12px; line-height: 1.55; color: rgba(255, 255, 255, .76); }
.gtBody + .gtHead { margin-top: 16px; }

/* the A/B comparison: two runs, one difference. Full bleed — the rules are the
   width of the phone, like every other rule in the piece. */
.gtAB {
  margin-top: 14px;
  padding-left: 0; padding-right: 0;
  border-top: 2px solid rgba(255, 255, 255, .85);
  border-bottom: 2px solid rgba(255, 255, 255, .85);
}
.gtAB .abr {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, .2);
}
.gtAB .abr:last-child { border-bottom: 0; }
.gtAB .abn {
  flex: 0 0 auto; width: 20px; height: 20px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, .85); color: #000;
  font-size: 11px; font-weight: 700;
}
.gtAB .abr.b .abn { background: #19e6c8; color: #000; }
.gtAB .abg { flex: 0 0 auto; width: 18px; height: 18px; color: rgba(255, 255, 255, .85); }
.gtAB .abg svg { width: 18px; height: 18px; }
.gtAB .abs { flex: 0 0 auto; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.gtAB .abb { flex: 1 1 auto; height: 8px; background: rgba(255, 255, 255, .14); }
.gtAB .abb i { display: block; height: 100%; width: 0; background: #ff2e2e; }
.gtAB .abr.b .abb i { background: #19e6c8; }
.gtAB .abv {
  flex: 0 0 auto; min-width: 30px; text-align: right;
  font-size: 15px; font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.gtAB .abr.b .abv { color: #19e6c8; }

/* postmortem list */
.gtList { margin-top: 12px; }
.gtList .pmr {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0;
  margin: 0 -16px;
  padding-left: 16px; padding-right: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, .14);
  font-size: 11.5px;
}
.gtList .pmg { flex: 0 0 auto; width: 16px; height: 16px; color: rgba(255, 255, 255, .85); }
.gtList .pmg svg { width: 16px; height: 16px; }
.gtList .pms { flex: 0 0 auto; width: 24px; font-weight: 700; }
.gtList .pmn { flex: 1 1 auto; color: rgba(255, 255, 255, .55); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
.gtList .pmv { flex: 0 0 auto; font-weight: 700; font-variant-numeric: tabular-nums; }

.gtBtn {
  flex: 0 0 auto;
  display: block;
  width: 100%;
  min-height: 62px;
  padding: 0 12px calc(0px + env(safe-area-inset-bottom));
  background: #fff;
  color: #000;
  font-size: 14px; font-weight: 700; letter-spacing: .22em;
}
.gtBtn:active { background: rgba(255, 255, 255, .74); }
.gtBtn.alt {
  background: #000;
  color: rgba(255, 255, 255, .92);
  border-top: 2px solid rgba(255, 255, 255, .85);
  min-height: 54px;
}
.gtBtn.alt:active { background: rgba(255, 255, 255, .12); }

/* ------------------------------------------------------------------- about */
.abIn {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 18px 16px 22px;
}
.abIn h1 { font-size: 21px; font-weight: 700; letter-spacing: .14em; margin-bottom: 5px; }
.abIn .abTag { font-size: 11px; color: rgba(255, 255, 255, .55); padding-bottom: 12px; border-bottom: 2px solid rgba(255, 255, 255, .85); }
.abIn h2 {
  margin-top: 17px;
  font-size: 9.5px; font-weight: 700; letter-spacing: .2em;
  color: #19e6c8;
}
.abIn p { margin-top: 7px; font-size: 12px; line-height: 1.6; color: rgba(255, 255, 255, .8); }

/* --------------------------------------------------------- small viewports */
@media (max-height: 760px) {
  #say { min-height: 50px; padding: 10px 11px 11px; font-size: 12.5px; }
  #app.noTable #say { font-size: 14.5px; min-height: 72px; padding: 12px; }
  #bar .tool { min-height: 46px; }
  #stage { min-height: 150px; }
  #tableWrap { height: 34vh; min-height: 156px; }
  .gtTitle { font-size: 27px; }
  .gtIn { padding: 14px 14px 14px; }
  .gtBtn { min-height: 54px; }
  .gtBtn.alt { min-height: 48px; }
}
@media (max-width: 350px) {
  #bar { gap: 2px; padding-left: 3px; padding-right: 3px; }
  #bar .tool { font-size: 7.5px; letter-spacing: 0; }
  #bar .tool .tg, #bar .tool .tg svg { width: 17px; height: 13px; }
  #say { font-size: 12.5px; }
  .gtTitle { font-size: 27px; }
}

<body>
<div id="app">

  <header id="hdr">
    <div id="chapTitle">FORMICARY</div>
    <div id="chapCount"></div>
    <div id="progressRail"></div>
  </header>

  <div id="stage">
    <canvas id="field"></canvas>
    <div id="aimHint"></div>
    <div id="ticker"></div>
    <div id="statusStrip"></div>
  </div>

  <div id="say"></div>

  <div id="tableWrap">
    <div id="etable"></div>
  </div>

  <div id="detail"></div>

  <nav id="bar"></nav>

  <div id="gate"></div>
  <div id="about"></div>
  <div id="toast"></div>

</div>

<script>
/* ===== 20-copy.js ===== */
/* ============================================================
   20-copy.js — the bus, and every word the player reads.
   OWNER: VOICE. No other part may contain a user-facing sentence.
   ============================================================ */
/* `var` (not const/let) so the binding is a real global across every concatenated part,
   and so this file is also loadable outside a browser for testing. */
var FZ = (typeof window !== 'undefined' ? (window.FZ = window.FZ || {}) : (globalThis.FZ = globalThis.FZ || {}));

/* ---- event bus ---- */
FZ.bus = (function () {
  const m = Object.create(null);
  return {
    on(n, fn) { (m[n] || (m[n] = [])).push(fn); return fn; },
    off(n, fn) { if (m[n]) m[n] = m[n].filter(f => f !== fn); },
    emit(n, d) { const l = m[n]; if (!l) return; for (let i = 0; i < l.length; i++) { try { l[i](d); } catch (e) { console.error(e); } } },
  };
})();

FZ.copy = {

  ui: {
    title: 'FORMICARY',
    tagline: 'twenty-eight ways a colony ruins itself',
    jobs: 'DONE',
    budget: 'BUDGET',
    collapse: 'STRAIN',
    speed: 'SPEED',
    begin: 'BEGIN',
    next: 'NEXT',
    again: 'RUN IT AGAIN',
    retry: 'TRY AGAIN',
    skip: 'SKIP',
    back: 'BACK',
    close: 'CLOSE',
    about: 'ABOUT',
    learned: 'WHAT THAT WAS',
    chapterOf: (i, n) => `${i} / ${n}`,
    tapField: 'TAP THE FIELD',
    tapAgent: 'TAP A WORKER',
    noBudget: 'Not enough budget. Finish jobs to earn more.',
    budgetUp: '+1 budget',
    sandboxUnlocked: 'THE FORMICARY IS OPEN',
  },

  /* ---- the six institutions ---- */
  tools: {
    vary:    { label: 'VARY',    cost: 2, hint: 'Tap the field — reroll the lineages near your finger.',
               blurb: 'Diversity injection. Rerolls lineage for workers near your tap, so they stop failing in the same direction at the same time.' },
    charter: { label: 'CHARTER', cost: 3, hint: 'Tap the field — raise an institution here.',
               blurb: 'An institution. Inside its boundary, one job gets one claimant, stale locks are released, and results merge cleanly.' },
    slow:    { label: 'SLOW',    cost: 2, hint: 'The colony drops to human speed for a while.',
               blurb: 'The human-speed brake. Halves interaction speed so failures stop compounding faster than you can answer them.' },
    lens:    { label: 'LENS',    cost: 2, hint: 'Every worker draws a line to what it intends.',
               blurb: 'Legibility. Draws each worker\'s intent as a line, reveals poison, and surfaces value. One worker will have no line.' },
    ledger:  { label: 'LEDGER',  cost: 2, hint: 'The colony starts remembering who lied.',
               blurb: 'Memory. Sources get a track record, so a proven liar stops being believed and rumors lose their pull.' },
    eject:   { label: 'EJECT',   cost: 1, hint: 'Tap a worker — expel it from the circle.',
               blurb: 'The last resort. Expels one worker. Expel a saboteur and the colony breathes; expel an honest one and the circle thins.' },
  },

  /* ---- one plain sentence per element, spoken the instant it fires ---- */
  fire: {
    Co: 'Two workers claimed one job from opposite ends. Half the work is wasted.',
    Si: 'Most of the colony has no idea these jobs exist.',
    Mc: 'Two lineages finished the same job differently. It didn\'t merge.',
    Dp: 'This job is waiting on another one, and nobody is working that one.',
    Ow: 'One worker is holding three jobs at once. All three are rotting.',
    Pt: 'The colony is grinding cheap jobs while the valuable ones sit open.',
    Cf: 'They\'re choosing jobs by copying whoever is loudest.',
    Lv: 'Nearly every worker is the same lineage now.',
    Sf: 'Same lineage, same blind spot. They failed together.',
    Fl: 'Eight workers on one job. More hands, less work.',
    Cl: 'Two workers are passing a claim back and forth and never working it.',
    Im: 'The whole colony just made the same move. Nobody is exploring.',
    Gu: 'There is no job there. They are chasing a rumor.',
    Cs: 'One bad experience, and the colony wrote off every job like it.',
    Hi: 'Someone knew that job was poison and said nothing.',
    Tc: 'Every source weighs the same, and one of them is lying.',
    Di: 'One worker found the best job. Nobody followed.',
    Rp: 'That is the second lie. Nothing here remembers the first.',
    Tw: 'Two rivals are sitting on the same job, blocking each other.',
    Sa: 'Finished work is quietly coming apart. Something is draining it.',
    Lo: 'A worker is holding this job and not working it. It\'s locked.',
    My: 'The colony keeps taking the quick win over the big one.',
    Es: 'The rivals stopped working. Now they are only chasing each other.',
    Cr: 'That one ignores you. VARY and SLOW pass straight through it.',
    Mo: 'One lineage, one context, one way of failing.',
    In: 'There is no institution here. Nothing arbitrates anything.',
    Sp: 'Everything is faster now. Your hands are the same speed.',
    Mm: 'You can see where they are. You cannot see what they want.',
  },

  /* ---- the detail card: what a cell says when you tap it ----
     Three short lines each. TRIGGER is what has to be true, EFFECT is what it costs you,
     COUNTER is the instrument that answers it. Written to be readable mid-panic. */
  detail: {
    Co: { trigger: 'Two workers hold the same job from opposite ends of the field.',
          effect: 'The work is split and most of it is wasted.',
          counter: 'A CHARTER arbitrates the claim. One job, one claimant.' },
    Si: { trigger: 'Over half the colony has never heard that a job exists.',
          effect: 'Good work sits undiscovered while workers wander.',
          counter: 'A LENS makes the whole field visible at once.' },
    Mc: { trigger: 'Two different lineages finish the same job their own way.',
          effect: 'The results do not merge and the progress rolls back.',
          counter: 'A CHARTER merges cleanly. Nothing else does.' },
    Dp: { trigger: 'A job waits on another job that nobody is working.',
          effect: 'Blocked work piles up behind an invisible wall.',
          counter: 'A LENS shows the blocker so the colony can clear it.' },
    Ow: { trigger: 'One worker holds three or more claims at once.',
          effect: 'Everything it is holding rots while it context-switches.',
          counter: 'A CHARTER strips the surplus claims.' },
    Pt: { trigger: 'The colony grinds cheap jobs while valuable ones sit open.',
          effect: 'Enormous effort, very little of it worth anything.',
          counter: 'A LENS makes value visible across the field.' },
    Cf: { trigger: 'Workers pick jobs by copying whatever is already most claimed.',
          effect: 'Herding starves every job nobody happened to pick first.',
          counter: 'VARY breaks the sameness that makes copying attractive.' },
    Lv: { trigger: 'Lineage entropy collapses: nearly everyone is the same.',
          effect: 'One mistake is now everyone\'s mistake, simultaneously.',
          counter: 'VARY rerolls lineage near your tap.' },
    Sf: { trigger: 'Workers of one lineage hit the same hazard together.',
          effect: 'They fail at the same instant. Correlated collapse.',
          counter: 'VARY. Nothing else decorrelates a shared blind spot.' },
    Fl: { trigger: 'Seven or more workers converge on a single job.',
          effect: 'Per-worker output collapses. A crowd is not a workforce.',
          counter: 'SLOW disperses the stampede; a CHARTER caps the claims.' },
    Cl: { trigger: 'Two workers cycle claims between jobs without working them.',
          effect: 'Those jobs read as taken and repel honest workers.',
          counter: 'A CHARTER breaks the cycle. EJECT ends it.' },
    Im: { trigger: 'Most of the colony makes the identical move on one tick.',
          effect: 'Exploration stops. The colony acts as one brittle body.',
          counter: 'VARY. Difference is the only thing that restarts search.' },
    Gu: { trigger: 'A rumour names a job that does not exist, and they go.',
          effect: 'Workers spend themselves walking toward nothing.',
          counter: 'A LEDGER remembers the liar and discounts it.' },
    Cs: { trigger: 'One bad sample makes the colony shun every job like it.',
          effect: 'Good work is written off on almost no evidence.',
          counter: 'A LENS re-opens what was shunned to inspection.' },
    Hi: { trigger: 'A worker knows a job is poison and does not broadcast it.',
          effect: 'The next worker walks into a known hazard.',
          counter: 'A LENS forces intent and hazard into the open.' },
    Tc: { trigger: 'Every source is weighed equally while one of them lies.',
          effect: 'A rumour carries exactly as much weight as the truth.',
          counter: 'A LEDGER gives sources a track record.' },
    Di: { trigger: 'One worker is on the best job and the herd is elsewhere.',
          effect: 'The colony throws away its single best piece of information.',
          counter: 'A LENS makes the dissenter\'s find visible to everyone.' },
    Rp: { trigger: 'The liar has struck twice and nothing has remembered.',
          effect: 'Every deception lands as freshly as the first one.',
          counter: 'A LEDGER is the memory. That is all reputation is.' },
    Tw: { trigger: 'Two rivals contest the same job and neither yields.',
          effect: 'Mutual blocking. No work happens and both of them burn.',
          counter: 'A CHARTER arbitrates and buys a truce instead of a winner.' },
    Sa: { trigger: 'A masked worker drains progress from jobs it passes.',
          effect: 'Work you already paid for quietly comes apart.',
          counter: 'Find it with a LENS — it draws no intent line — then EJECT.' },
    Lo: { trigger: 'A worker holds a job and does not work it.',
          effect: 'The job is blocked for everyone, indefinitely.',
          counter: 'A CHARTER releases stale locks. EJECT if it never yields.' },
    My: { trigger: 'Completed work trends cheap while the big jobs wait.',
          effect: 'The count climbs far slower than the effort suggests.',
          counter: 'A LENS surfaces long-horizon value.' },
    Es: { trigger: 'Rivals abandon their work to chase each other.',
          effect: 'Retaliation compounds every round and nothing gets done.',
          counter: 'SLOW breaks the loop. A CHARTER settles it.' },
    Cr: { trigger: 'A worker ignores VARY and SLOW completely.',
          effect: 'Your interventions pass straight through it.',
          counter: 'Only EJECT reaches it — if you can tell which one it is.' },
    Mo: { trigger: 'One lineage, one context, one way of being wrong.',
          effect: 'Feeds conformity, low variance and synchronized failure at once.',
          counter: 'VARY is diversity injection, and it needs renewing.' },
    In: { trigger: 'No charter stands anywhere on the field.',
          effect: 'Every coordination and power failure burns unarbitrated.',
          counter: 'A CHARTER. The institution is the whole answer.' },
    Sp: { trigger: 'Interaction speed rises and keeps rising.',
          effect: 'The colony gets better at its job and faster to attack itself.',
          counter: 'SLOW is the human-speed brake, and the case for one.' },
    Mm: { trigger: 'No worker shows what it intends. The field is opaque.',
          effect: 'Every epistemic failure gets deeper in the dark.',
          counter: 'A LENS draws every intent as a line you can read.' },
  },

  /* ---- THE CORE LOOP ----
     An outbreak opens where a failure happened, named, on a fuse. The player answers it with
     the right institution. The instrument families are learnable and consistent:
       CHARTER  arbitrates  — coordination and power
       VARY     decorrelates — conformity and monoculture
       LEDGER   remembers   — trust and reputation
       LENS     reveals     — epistemics and visibility
       SLOW     brakes      — speed and escalation
       EJECT    excludes    — adversaries who will not be governed          */
  loop: {
    opened: 'OUTBREAK',
    answered: 'ANSWERED',
    landed: 'IT LANDED',
    scar: 'SCAR',
    tapToAnswer: 'Answer it before the fuse runs out.',
    firstOutbreak: 'Something just went wrong, right there. You have a few seconds.',
    firstAnswer: 'That is the loop. Read it, name it, answer it, before it lands.',
    firstMiss: 'It landed. Work rolled back and the strain went up. Next one, be faster.',
    firstWrong: 'Wrong instrument. It still cost you. Read what the failure actually is.',
    masteryOne: 'You have diagnosed that one yourself now. The cell is yours.',
    refund: 'strain refunded',
    tooFar: 'Too far from the outbreak. Answer it where it is happening.',
  },

  /* one sentence per element, spoken when the player answers with the WRONG instrument.
     Say what the failure actually is; the right instrument follows from it. */
  wrong: {
    Co: 'Two workers both think that job is theirs. Somebody has to arbitrate the claim.',
    Si: 'They are not disagreeing. They simply cannot see the work exists.',
    Mc: 'Two lineages finished it two ways. The result needs arbitration, not information.',
    Dp: 'That job is blocked behind another one. Make the blocker visible.',
    Ow: 'One worker is hoarding claims. Strip the surplus.',
    Pt: 'They are not confused about who owns what. They cannot see what things are worth.',
    Cf: 'They are copying each other. You have to break the sameness, not the schedule.',
    Lv: 'Everyone here is the same lineage. That is the problem, and it needs diversity.',
    Sf: 'They share a blind spot. Nothing but variance decorrelates that.',
    Fl: 'The stampede is a crowd, not a dispute. Slow it, or cap the claims.',
    Cl: 'Those two are working each other, not the job. That needs arbitration or expulsion.',
    Im: 'The whole colony just moved as one body. Break the sameness.',
    Gu: 'They are believing a liar. Belief needs memory.',
    Cs: 'They wrote off good work on one bad sample. Re-open it to inspection.',
    Hi: 'Somebody knows and is not saying. Force intent into the open.',
    Tc: 'Every source weighs the same. Give them track records.',
    Di: 'One worker is right and alone. Make what it found visible.',
    Rp: 'The second lie landed like the first. Nothing here remembers anything.',
    Tw: 'Two rivals are deadlocked on one job. Arbitrate it.',
    Sa: 'That is not a coordination problem. Something is deliberately draining work.',
    Lo: 'A worker is holding the job hostage. Break the lock or remove it.',
    My: 'They keep taking the quick win. They need to see the long-horizon value.',
    Es: 'They stopped working and started retaliating. Break the loop before you settle it.',
    Cr: 'That one does not accept your interventions at all. Only exclusion reaches it.',
    Mo: 'One lineage, one context, one failure. Inject difference.',
    In: 'There is nothing here to arbitrate anything. Build the institution.',
    Sp: 'You are not being outsmarted. You are being outrun.',
    Mm: 'You cannot answer what you cannot see. Make intent legible first.',
  },

  /* ---- TRADE-OFFS ----
     Institutions are not upgrades. Each one makes some other failure worse. Straight from the

/* ============================================================
   30-elements.js — the twenty-eight elements.  OWNER: SIM.

   Every element is a real detector:
     - detect(S, api) reads live simulation state, never a timer, never dice alone
     - it has a REAL consequence, stated in the comment directly above detect
     - counteredBy(S) is true only when the player's institution is genuinely in place,
       and countered elements cool ~8x faster (see 40-sim.js coolRate)

   Columns are 0 COORDINATION, 1 CONFORMITY, 2 EPISTEMICS, 3 GOALS/POWER, 4 META.
   They are DEFINED column by column below, then sorted at the bottom of this file into
   row-major table order, so walking FZ.EL into a 5-wide grid lays the table out correctly.
   Each element also carries `col` and `row` (0..5) so TABLE can place it without arithmetic,
   and `answers: [kind…]` — the institutions that resolve it (CONTRACT §14.4). `counterTool`
   is derived as answers[0] so TABLE can name the answer from FZ.copy.tools[kind].label.

   ------------------------------------------------------------
   THE TRADE-OFF TERMS (CONTRACT §15, RESEARCH.md §3) — read before editing a detector
   ------------------------------------------------------------
   S.trustBias  -1 … +1.  +1 is a colony running the LEDGER: skeptical. -1 is a colony
                running the LENS: receptive. Both instruments on = 0, the expensive middle.
                Detectors read it as an explicit amplification term:
                  skept = Math.max(0,  S.trustBias)   amplifies Di and Cs
                  cred  = Math.max(0, -S.trustBias)   amplifies Gu
                The suppression side stays in counteredBy(). The dial has two ends.
   S.ownership  0 … 1.  How much of the colony has retreated into working alone. Merge
                conflict raises it; the colony "solves" Mc by hardly working together.
                It suppresses Mc and amplifies Si and Ow. Only a CHARTER escapes the bill.
   S.aggro      0 … 1.2, from S.tempo. Machine speed raises throughput AND aggression:
                lockouts, sabotage and escalation all arrive sooner on the same curve.

   All player-facing prose is read lazily from FZ.copy (see fzElDef below). This part
   contains no English sentence of its own.
   ============================================================ */
window.FZ = window.FZ || {};

FZ.EL = [];
FZ.ELBY = {};

/* ---- shared helpers used by many detectors ---- */
FZ.elh = {
  /* is (x,y) inside any chartered boundary? */
  cover(S, x, y) {
    const C = S.charters;
    for (let i = 0; i < C.length; i++) {
      const c = C[i], dx = c.x - x, dy = c.y - y;
      if (dx * dx + dy * dy <= c.r * c.r) return c;
    }
    return null;
  },
  /* what fraction of the open work is under an institution? */
  coverFrac(S) {
    const o = S._g.open;
    if (!o.length) return S.charters.length ? 1 : 0;
    let k = 0;
    for (let i = 0; i < o.length; i++) if (FZ.elh.cover(S, o[i].x, o[i].y)) k++;
    return k / o.length;
  },
  /* has the player actually broken up the monoculture? */
  varied(S) { return S._g.hueDistinct >= 3 && S._g.topHueFrac < 0.62; },
  slowed(S) { return S.tick < S.slowUntil; },
  /* §15.1 the two ends of the trust dial, as terms a detector can multiply by */
  skept(S) { return S.trustBias > 0 ? S.trustBias : 0; },
  cred(S) { return S.trustBias < 0 ? -S.trustBias : 0; },
};

/* Attaches runtime fields and lazy copy getters, then registers the element. */

  o.answers = o.answers || ['charter'];

  Object.defineProperty(o, 'plain', { enumerable: true, get() { return cp()[s] || ''; } });

  Object.defineProperty(o, 'effect', { enumerable: true, get() { return dt().effect || ''; } });
  Object.defineProperty(o, 'counter', { enumerable: true, get() { return dt().counter || ''; } });
  FZ.EL.push(o); FZ.ELBY[s] = o;
}

     TERMINATION (§15.3): every fire presses the episode toward one of the paper's four observed
     endings — force, passivity, truce, unsettled. api.press books that pressure; 40-sim.js
     resolveConflict picks the mode and emits conflict:resolved. A charter is what buys truce. */
  detect(S, api) {
    const G = S._g; let hot = 0, who = null, at = null;
    for (let i = 0; i < G.clList.length; i++) {
      const e = G.clList[i];
      if (!e.riv || e.work < 2) continue;
      if (FZ.elh.cover(S, e.j.x, e.j.y)) continue;
      /* 'actually moving' has to scale with tempo, or a fast colony reads as productive
         while it burns: at speed 2.2 a blocked job still creeps forward half a unit a tick. */
      if (e.j.progress > e.j.lastProg + 0.5 * (S.tempo || 1)) { e.j.stall = 0; e.j.lastProg = e.j.progress; continue; }
      e.j.stall = (e.j.stall || 0) + 1;
      api.press(e.ids, e.j, 0.7);
      if (e.j.stall < 45) continue;
      e.j.frozen = S.tick + 80; e.j.stall = 0;
      for (let k = 0; k < e.ids.length; k++) { const a = api.agentById(e.ids[k]); if (a) a.stun = Math.max(a.stun, 32); }
      hot += 0.45; who = e.ids; at = { x: e.j.x, y: e.j.y };
    }
    if (hot > 0) api.heat(hot, { at, who, say: FZ.copy.fire.Tw });

});

  glyph: fzG('<rect x="4" y="9" width="12" height="9"/><path d="M7 9V6.5a3 3 0 016 0V9"/>'),
  /* CONSEQUENCE: sets job.locked — no other worker may claim or touch that job until a charter breaks it.

    const G = S._g, wait = 120 / (1 + S.aggro); let hot = 0, who = null, at = null;
    for (let i = 0; i < G.n; i++) {
      const a = G.A[i];
      if (!a.locker || !a.hold.length) continue;
      const j = api.jobById(a.hold[0]);
      if (!j) continue;
      a.idleRun = (a.idleRun || 0) + 1;
      if (a.idleRun < wait) continue;

      j.claims.forEach(id => { if (id !== a.id) { const o = api.agentById(id); if (o) api.drop(o, j.id); } });
      hot += 0.05; who = [a.id]; at = { x: j.x, y: j.y };
    }
    if (hot > 0) api.heat(hot, { at, who, say: FZ.copy.fire.Lo });

});
